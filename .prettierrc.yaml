plugins:
  - prettier-plugin-java
overrides:
  - files:
      - "*.java"
    options:
      printWidth: 120
      tabWidth: 4
      useTabs: false
      trailingComma: none
  - files:
      - "*.js"
      - "*.mjs"
    options:
      singleQuote: true
      printWidth: 120
      trailingComma: none
