header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "shop"
  name: "Shop"
  elements:
    - kind: "container"
      id: "web"
      name: "Web site"
      description: "The front of the shop."
      qualifiers:
        - "React"
      relationships:
        - destination: "shop.catalog"
          label: "browses"
        - destination: "shop.payments"
          label: "pays with"
    - kind: "container"
      id: "catalog"
      name: "Catalog"
      description: "The books that are on sale."
    - kind: "container"
      id: "payments"
      name: "Payments"
      tags:
        rendering-stereotypes: "new"
    - kind: "container"
      id: "cart"
      name: "Cart"
      description: "Keeps the basket of a customer."
      replaces:
        - "shop.orders" # the orders are split in two
    - kind: "container"
      id: "checkout"
      name: "Checkout"
      description: "Turns a basket into an order."
      replaces:
        - "shop.orders"
    - kind: "container"
      id: "billing"
      name: "Billing"
      description: "Writes the invoice and sends the receipt."
      replaces:
        - "shop.invoices" # the invoices and the receipts are merged
        - "shop.receipts"
    - kind: "container"
      id: "ratings"
      name: "Ratings"
      description: "Readers rate the books they have bought."
