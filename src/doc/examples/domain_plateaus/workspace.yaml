# the plateaus are layers: the manifests of `plateaus/10_as-is` have no `plateau:` header and are the root, `baseline`; `as-is` is
# the first state, an empty layer over it; `to-be` overrides it with its own manifests (they say `plateau: "to-be"`) and the patches of its `plateau.yaml`
settings:
  name: "Bookshop"
  manifests:
    paths: ["plateaus/**"]
