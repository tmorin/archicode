settings:
  name: "Datacentre"
views:
  - kind: "view"
    id: "datacentre-map"
    name: "The datacentre, folded"
    viewpoint: "map"
    layer: "technology"
  - kind: "view"
    id: "datacentre-map-open"
    name: "The datacentre, opened down to the racks"
    viewpoint: "map"
    layer: "technology"
    properties:
      opened:
        - "datacentre"
        - "datacentre.edge"
        - "datacentre.rack"
  - kind: "view"
    id: "datacentre-map-database"
    name: "What touches the database, without the edge"
    viewpoint: "map"
    layer: "technology"
    properties:
      pinned:
        - "datacentre.rack.db"
      hidden:
        - "datacentre.edge"
