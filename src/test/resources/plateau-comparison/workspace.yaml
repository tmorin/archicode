# An invented bookshop in three states, used to test what a plateau changes (see PlateauComparisonTest).
# The plateaus are layers: the manifests of `plateaus/10_as-is` have no `plateau:` header and are the root, `baseline`; `as-is` is
# the first state, an empty layer over it; `to-be` and `later` override `as-is`, each in its folder (the manifests that say
# `plateau:` and its `plateau.yaml`, whose patches change what it inherits).
# as-is -> to-be: a new mobile app and a new notification service, the legacy batch is removed, one container is
# reworded, one is renamed inside a system that does not change by itself (the system only contains a change), a
# label changes. `later` also overrides `as-is`, not `to-be`.
styles:
  by-tags:
    removed:
      line-color: "red"
settings:
  name: "Bookshop"
  manifests:
    paths: ["plateaus/**"]
  facets:
    customs:
      # reads what the comparison says: leaves out what only the baseline had (an element and what points at it)
      - name: "without-removed"
        actions:
          - operator: "REMOVE"
            json-path: "$.application..relationships[?(@.change == 'removed')]"
          - operator: "REMOVE"
            json-path: "$.technology..relationships[?(@.change == 'removed')]"
          - operator: "REMOVE"
            json-path: "$.application..elements[?(@.change == 'removed')]"
      # an ordinary facet, which knows nothing of the comparison
      - name: "no-orders"
        actions:
          - operator: "REMOVE"
            json-path: "$..relationships[?(@.label == 'orders on')]"
