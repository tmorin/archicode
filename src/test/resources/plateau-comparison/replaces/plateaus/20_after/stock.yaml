header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "stock"
  name: "Stock"
  elements:
    - kind: "container"
      id: "till"
      name: "Cash desk"
      description: "Takes the payment of a basket at the counter and prints the receipt."
      replaces:
        - "shop.till"
      relationships:
        - destination: "stock.place"
          label: "reserves"
    - kind: "container"
      id: "place"
      name: "Place"
      replaces:
        - "stock.shelf"
        - "stock.bin"
