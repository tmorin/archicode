header:
  kind: "archicode.morin.io/container"
  version: "1"
  plateau: "marketplace"
  parent: "fulfilment"
content:
  id: "inventory"
  name: "Inventory service"
  description: "Stock levels and reservations."
  qualifiers: ["Java", "Quarkus"]
  replaces:
    - "shop.app.inventory"
  relationships:
    - destination: "fulfilment.db"
      label: "reads and reserves stock in"
    - destination: "platform.broker"
      label: "publishes stock events to"
