header:
  kind: "archicode.morin.io/story"
  version: "1"
content:
  id: "fork_tour"
  name: "Two ways out of the monolith"
  description: "Buy the commerce platform, or build the services; then the marketplace on top of the second."
  steps:
    - view: "shop_overview"
      text: "Today one system does it all."
      at: "baseline"
    - viewpoint: "overview"
      layer: "application"
      properties:
        element: "commerce-saas"
      text: "Buy: the platform takes the catalog, the cart and the checkout."
      at: "saas"
      against: "baseline"
    - view: "commerce_overview"
      text: "Build: commerce services of our own."
      at: "inhouse"
      against: "baseline"
    - viewpoint: "overview"
      layer: "application"
      properties:
        element: "shop"
      text: "The two ways side by side: what the shop becomes in `inhouse` compared with `saas`, which does not stack on it."
      at: "inhouse"
      against: "saas"
    - view: "marketplace_overview"
      text: "On top of the second way, sellers."
      at: "marketplace"
      against: "inhouse"
    - viewpoint: "overview"
      layer: "application"
      properties:
        element: "discovery"
      text: "All the way from where we are: the search moved twice."
      at: "marketplace"
      against: "baseline"
    - viewpoint: "overview"
      layer: "application"
      properties:
        element: "customer"
      text: "The shopper, in the plateau that is drawn, compared with the bought platform (there is nothing to compare when `saas` is the one drawn)."
      against: "saas"
