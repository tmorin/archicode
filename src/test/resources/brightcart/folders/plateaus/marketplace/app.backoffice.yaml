header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "backoffice"
  name: "Back office"
  description: "Tools of the staff."
  elements:
    - kind: "container"
      id: "console"
      name: "Back-office console"
      description: "Products, orders and customers for the staff."
      qualifiers: ["Angular"]
      relationships:
        - destination: "commerce.catalog"
          label: "maintains products in"
        - destination: "commerce.pricing"
          label: "configures promotions in"
        - destination: "orders.placement"
          label: "handles orders in"
        - destination: "orders.history"
          label: "looks up past orders in"
        - destination: "accounts.profiles"
          label: "looks up customers in"
