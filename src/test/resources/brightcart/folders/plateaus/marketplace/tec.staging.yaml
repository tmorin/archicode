header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "staging"
  name: "Staging"
  uses:
    - "sandbox"
  elements:
    - kind: "node"
      id: "vm"
      name: "Staging VM"
      applications:
        - "storefront.web"
        - "fulfilment.sync"
        - "backoffice.console"
    - kind: "node"
      id: "k8s"
      name: "Staging cluster"
      applications:
        - "commerce.gateway"
        - "commerce.catalog"
        - "commerce.catalog-db"
        - "discovery.search"
        - "commerce.cart"
        - "commerce.checkout"
        - "commerce.pricing"
        - "payments.orchestrator"
        - "orders.placement"
        - "orders.history"
        - "orders.db"
        - "accounts.profiles"
        - "accounts.db"
        - "commerce.cart-store"
    - kind: "node"
      id: "platform"
      name: "Staging cluster (platform)"
      applications:
        - "marketplace.seller-portal"
        - "marketplace.listing"
        - "marketplace.settlement"
        - "marketplace.db"
        - "platform.broker"
        - "platform.notifications"
        - "discovery.recommender"
        - "discovery.features"
        - "fulfilment.inventory"
        - "fulfilment.db"
