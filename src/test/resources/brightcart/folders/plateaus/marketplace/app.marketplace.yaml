header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "marketplace"
  name: "Marketplace"
  description: "Offers of third-party sellers."
  elements:
    - kind: "container"
      id: "seller-portal"
      name: "Seller portal"
      description: "Where sellers manage offers and payouts."
      qualifiers: ["React"]
      relationships:
        - destination: "marketplace.listing"
          label: "manages offers with"
        - destination: "marketplace.settlement"
          label: "reads payouts from"
    - kind: "container"
      id: "listing"
      name: "Listing service"
      description: "Validates and publishes offers."
      qualifiers: ["Java", "Quarkus"]
      tags:
        runtime: "quarkus"
      relationships:
        - destination: "marketplace.db"
          label: "stores offers in"
        - destination: "commerce.catalog"
          label: "publishes offers to"
        - destination: "kyc"
          label: "checks sellers with"
          qualifiers: ["HTTPS"]
    - kind: "container"
      id: "settlement"
      name: "Settlement service"
      description: "Computes and pays out seller balances."
      qualifiers: ["Java", "Quarkus"]
      tags:
        runtime: "quarkus"
      relationships:
        - destination: "marketplace.db"
          label: "stores balances in"
        - destination: "payments.orchestrator"
          label: "pays out through"
    - kind: "container"
      id: "db"
      name: "Marketplace database"
      description: "Offers and balances."
      qualifiers: ["PostgreSQL"]
