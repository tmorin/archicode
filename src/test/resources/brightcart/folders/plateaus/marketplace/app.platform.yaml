header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "platform"
  name: "Platform"
  description: "Shared services."
  elements:
    - kind: "container"
      id: "broker"
      name: "Event backbone"
      description: "Domain events between services."
      qualifiers: ["Kafka"]
    - kind: "container"
      id: "notifications"
      name: "Notification service"
      description: "Mails and pushes about orders and accounts."
      qualifiers: ["Java", "Quarkus"]
      tags:
        runtime: "quarkus"
      replaces:
        - "shop.app.notifications"
      relationships:
        - destination: "mailer"
          label: "sends mails with"
          qualifiers: ["SMTP"]
        - destination: "platform.broker"
          label: "consumes events from"
