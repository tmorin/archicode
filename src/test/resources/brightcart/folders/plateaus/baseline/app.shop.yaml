header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "shop"
  name: "Shop"
  description: "The web shop of the retailer."
  elements:
    - kind: "container"
      id: "web"
      name: "Web storefront"
      description: "Pages of the shop, in the browser."
      qualifiers: ["React"]
      relationships:
        - destination: "shop.app"
          label: "calls"
          qualifiers: ["JSON/HTTPS"]
    - kind: "container"
      id: "app"
      name: "Shop application"
      description: "The monolith that runs every shop feature."
      qualifiers: ["Java", "Spring Boot"]
      elements:
        - kind: "component"
          id: "catalog"
          name: "Catalog"
          description: "Products, prices and availability."
          relationships:
            - destination: "shop.db"
              label: "reads and writes"
        - kind: "component"
          id: "search"
          name: "Search"
          description: "Full-text search over products."
          relationships:
            - destination: "shop.db"
              label: "queries"
        - kind: "component"
          id: "cart"
          name: "Cart"
          description: "Keeps the basket of a shopper."
          relationships:
            - destination: "shop.cache"
              label: "keeps baskets in"
        - kind: "component"
          id: "checkout"
          name: "Checkout"
          description: "Turns a basket into an order."
          relationships:
            - destination: "shop.app.cart"
              label: "reads baskets from"
            - destination: "shop.app.orders"
              label: "creates orders in"
            - destination: "shop.app.payments"
              label: "pays through"
            - destination: "tax"
              label: "computes taxes with"
              qualifiers: ["HTTPS"]
            - destination: "shop.app.inventory"
              label: "reserves stock in"
        - kind: "component"
          id: "orders"
          name: "Orders"
          description: "Stores orders and their history."
          relationships:
            - destination: "shop.db"
              label: "stores orders in"
            - destination: "shop.app.notifications"
              label: "asks to notify"
        - kind: "component"
          id: "customers"
          name: "Customers"
          description: "Accounts and addresses."
          relationships:
            - destination: "shop.db"
              label: "stores accounts in"
        - kind: "component"
          id: "loyalty"
          name: "Loyalty"
          description: "Points earned and spent."
          relationships:
            - destination: "shop.db"
              label: "stores points in"
            - destination: "shop.app.customers"
              label: "reads accounts from"
        - kind: "component"
          id: "promotions"
          name: "Promotions"
          description: "Discount rules and vouchers."
          relationships:
            - destination: "shop.db"
              label: "reads rules from"
        - kind: "component"
          id: "payments"
          name: "Payments"
          description: "Talks to the payment provider."
          relationships:
            - destination: "psp"
              label: "authorises payments with"
              qualifiers: ["HTTPS"]
        - kind: "component"
          id: "notifications"
          name: "Notifications"
          description: "Mails about orders and accounts."
          relationships:
            - destination: "mailer"
              label: "sends mails with"
              qualifiers: ["SMTP"]
        - kind: "component"
          id: "inventory"
          name: "Inventory"
          description: "Stock levels and reservations."
          relationships:
            - destination: "shop.db"
              label: "reads and reserves stock in"
    - kind: "container"
      id: "db"
      name: "Shop database"
      description: "Products, accounts, orders and stock."
      qualifiers: ["PostgreSQL"]
    - kind: "container"
      id: "cache"
      name: "Session cache"
      description: "Baskets and sessions."
      qualifiers: ["Redis"]
