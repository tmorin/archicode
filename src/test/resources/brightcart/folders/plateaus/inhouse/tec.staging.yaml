header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "staging"
  name: "Staging"
  uses:
    - "sandbox"
  elements:
    - kind: "node"
      id: "vm"
      name: "Staging VM"
      applications:
        - "shop.web"
        - "shop.app"
        - "shop.db"
        - "fulfilment.sync"
        - "backoffice.console"
    - kind: "node"
      id: "k8s"
      name: "Staging cluster"
      applications:
        - "commerce.gateway"
        - "commerce.catalog"
        - "commerce.catalog-db"
        - "commerce.search"
        - "commerce.cart"
        - "commerce.checkout"
        - "commerce.pricing"
        - "payments.orchestrator"
        - "orders.placement"
        - "orders.history"
        - "orders.db"
        - "accounts.profiles"
        - "accounts.db"
        - "commerce.cart-store"
