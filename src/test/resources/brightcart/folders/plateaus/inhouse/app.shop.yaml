header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "shop"
  name: "Shop"
  description: "The web shop of the retailer."
  elements:
    - kind: "container"
      id: "web"
      name: "Web storefront"
      description: "Pages of the shop, served behind the API gateway."
      qualifiers: ["React"]
      relationships:
        - destination: "shop.app"
          label: "calls"
          qualifiers: ["JSON/HTTPS"]
        - destination: "commerce.gateway"
          label: "browses and buys through"
          qualifiers: ["REST"]
    - kind: "container"
      id: "app"
      name: "Legacy core"
      description: "What is left of the monolith: stock levels and notifications."
      qualifiers: ["Java", "Spring Boot"]
      tags:
        rendering-stereotypes: "legacy"
      elements:
        - kind: "component"
          id: "notifications"
          name: "Notifications"
          description: "Mails about orders and accounts."
          relationships:
            - destination: "mailer"
              label: "sends mails with"
              qualifiers: ["SMTP"]
        - kind: "component"
          id: "inventory"
          name: "Inventory"
          description: "Stock levels and reservations."
          relationships:
            - destination: "shop.db"
              label: "reads and reserves stock in"
    - kind: "container"
      id: "db"
      name: "Shop database"
      description: "Products, accounts, orders and stock."
      qualifiers: ["PostgreSQL"]
