header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "commerce"
  name: "Commerce services"
  description: "Services of the shopping journey."
  elements:
    - kind: "container"
      id: "cart-store"
      name: "Cart store"
      description: "Baskets, one key per shopper."
      qualifiers: ["Redis"]
      replaces:
        - "shop.cache"
    - kind: "container"
      id: "gateway"
      name: "API gateway"
      description: "Single entry for the storefront."
      qualifiers: ["Kong"]
      relationships:
        - destination: "commerce.catalog"
          label: "routes to"
        - destination: "commerce.search"
          label: "routes to"
        - destination: "commerce.cart"
          label: "routes to"
        - destination: "commerce.checkout"
          label: "routes to"
        - destination: "commerce.pricing"
          label: "routes to"
    - kind: "container"
      id: "catalog"
      name: "Catalog service"
      description: "Products, prices and availability."
      qualifiers: ["Java", "Quarkus"]
      replaces:
        - "shop.app.catalog"
      relationships:
        - destination: "commerce.catalog-db"
          label: "reads and writes"
    - kind: "container"
      id: "catalog-db"
      name: "Catalog database"
      description: "Products and prices."
      qualifiers: ["PostgreSQL"]
    - kind: "container"
      id: "search"
      name: "Search service"
      description: "Full-text search over products."
      qualifiers: ["OpenSearch"]
      replaces:
        - "shop.app.search"
      relationships:
        - destination: "commerce.catalog"
          label: "indexes products from"
    - kind: "container"
      id: "cart"
      name: "Cart service"
      description: "Keeps the basket of a shopper."
      qualifiers: ["Java", "Quarkus"]
      replaces:
        - "shop.app.cart"
      relationships:
        - destination: "commerce.cart-store"
          label: "keeps baskets in"
    - kind: "container"
      id: "checkout"
      name: "Checkout service"
      description: "Turns a basket into an order."
      qualifiers: ["Java", "Quarkus"]
      replaces:
        - "shop.app.checkout"
      relationships:
        - destination: "commerce.cart"
          label: "reads baskets from"
        - destination: "orders.placement"
          label: "creates orders in"
        - destination: "payments.orchestrator"
          label: "pays through"
        - destination: "tax"
          label: "computes taxes with"
          qualifiers: ["HTTPS"]
        - destination: "shop.app.inventory"
          label: "reserves stock in"
    - kind: "container"
      id: "pricing"
      name: "Pricing service"
      description: "Discount rules and vouchers."
      qualifiers: ["Java", "Quarkus"]
      replaces:
        - "shop.app.promotions"
      relationships:
        - destination: "commerce.catalog"
          label: "reads prices from"
