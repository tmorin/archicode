header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "shop"
  name: "Shop"
  elements:
    - kind: "container"
      id: "web"
      name: "Web site"
      relationships:
        - destination: "shop.orders-intake"
          label: "places orders with"
        - destination: "shop.db"
          label: "reads"
    - kind: "container"
      id: "orders-intake"
      name: "Order intake"
      replaces:
        - "shop.orders"
      relationships:
        - destination: "shop.db"
          label: "stores in"
    - kind: "container"
      id: "orders-billing"
      name: "Order billing"
      replaces:
        - "shop.orders"
      relationships:
        - destination: "shop.mail"
          label: "asks"
        - destination: "shop.orders-intake"
          label: "follows"
    - kind: "container"
      id: "db"
      name: "Database"
    - kind: "container"
      id: "mail"
      name: "Mailer"
