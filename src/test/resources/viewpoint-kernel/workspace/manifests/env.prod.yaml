header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "prod"
  name: "Production"
  uses:
    - "psp"
  elements:
    - kind: "node"
      id: "cluster"
      name: "Kubernetes Cluster"
      qualifiers:
        - "K8s"
      elements:
        - kind: "node"
          id: "web"
          name: "web namespace"
          elements:
            - kind: "node"
              id: "pod-a"
              name: "frontend pod"
              applications:
                - "shop.web.frontend"
              relationships:
                - destination: "prod.cluster.web.pod-b"
                  label: "forwards to"
                  qualifiers:
                    - "HTTP"
            - kind: "node"
              id: "pod-b"
              name: "api pod"
              applications:
                - "shop.web.api"
              relationships:
                - destination: "prod.cluster.data.svc"
                  qualifiers:
                    - "gRPC"
                - destination: "psp.gateway"
                  label: "pays through"
                  qualifiers:
                    - "HTTPS"
        - kind: "node"
          id: "data"
          name: "data namespace"
          elements:
            - kind: "node"
              id: "svc"
              name: "catalog pod"
              applications:
                - "shop.catalog.service"
              relationships:
                - destination: "prod.cluster.data.pg"
                  qualifiers:
                    - "TCP:5432"
            - kind: "node"
              id: "pg"
              name: "database pod"
              applications:
                - "shop.catalog.db"
