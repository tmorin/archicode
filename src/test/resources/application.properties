quarkus.log.category."io.morin.archicode".level=DEBUG
quarkus.log.category."io.morin.archicode.viewpoint.MetaLinkGroomer".min-level=TRACE
quarkus.log.category."io.morin.archicode.viewpoint.MetaLinkGroomer".level=TRACE

# the coverage of the build (jacoco-maven-plugin in pom.xml): the @QuarkusTest classes write into the file the agent of the
# plain tests writes into, and the report is the plugin's, one for all the tests
quarkus.jacoco.reuse-data-file=true
quarkus.jacoco.data-file=jacoco-quarkus.exec
quarkus.jacoco.report=false
