header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "crew-visas"
  name: "Crew Visas"
  description: "Looks after the crew side of the harbour."
  elements:
    - kind: "container"
      id: "crew-exporter"
      name: "Crew Exporter"
      description: "Archives the crew schedules for the night watch and lists the lost keys before noon."
      qualifiers:
        - "REST"
      relationships:
        - destination: "crew-visas.crew-gateway"
          label: "notifies"
    - kind: "container"
      id: "crew-search"
      name: "Crew Search"
      description: "Archives the crew readings for the waste contractors and flags the spare slots on request."
      qualifiers:
        - "Python"
      relationships:
        - destination: "crew-visas.crew-statistics"
          label: "reads from"
    - kind: "container"
      id: "crew-billing"
      name: "Crew Billing"
      description: "Collects the crew notices for the yard supervisors and weighs the full berths during the winter."
      relationships:
        - destination: "bunkering.fuel-validator"
          label: "reads from"
        - destination: "passenger-terminal.terminal-dashboard"
          label: "asks"
    - kind: "container"
      id: "crew-statistics"
      name: "Crew Statistics"
      description: "Keeps the crew schedules for the fire crews and ranks the spill reports on request."
      relationships:
        - destination: "crew-visas.crew-registry"
          label: "sends to"
        - destination: "crew-visas.crew-alerts"
          label: "publishes to"
    - kind: "container"
      id: "crew-registry"
      name: "Crew Registry"
      description: "Tracks the crew readings for the harbour master and summarises the open permits on Mondays."
      qualifiers:
        - "Python"
      relationships:
        - destination: "crew-visas.crew-validator"
          label: "synchronises with"
        - destination: "crew-visas.crew-sync"
          label: "notifies"
        - destination: "truck-parking.parking-statistics"
          label: "synchronises with"
    - kind: "container"
      id: "crew-calendar"
      name: "Crew Calendar"
      description: "Schedules the crew permits for the night watch and compares the idle cranes on request."
      relationships:
        - destination: "crew-visas.crew-validator"
          label: "notifies"
        - destination: "crew-visas.crew-alerts"
          label: "notifies"
        - destination: "crew-visas.crew-notifier"
          label: "asks"
    - kind: "container"
      id: "crew-alerts"
      name: "Crew Alerts"
      description: "Keeps the crew incidents for the ferry crews and notifies the broken sensors before noon."
      relationships:
        - destination: "crew-visas.crew-validator"
          label: "notifies"
        - destination: "crew-visas.crew-gateway"
          label: "asks"
        - destination: "crew-visas.crew-billing"
          label: "reads from"
    - kind: "container"
      id: "crew-gateway"
      name: "Crew Gateway"
      description: "Forwards the crew readings for the terminal operators and reminds the wrong weights on request."
      relationships:
        - destination: "fish-market.fishing-auditor"
          label: "publishes to"
        - destination: "cargo-manifests.manifest-alerts"
          label: "reads from"
        - destination: "crew-visas.crew-alerts"
          label: "sends to"
    - kind: "container"
      id: "crew-notifier"
      name: "Crew Notifier"
      description: "Archives the crew requests for the terminal operators and ranks the old records each hour."
      qualifiers:
        - "Go"
      relationships:
        - destination: "crew-visas.crew-search"
          label: "reads from"
        - destination: "cargo-manifests.manifest-auditor"
          label: "sends to"
        - destination: "container-yard.yard-statistics"
          label: "reads from"
    - kind: "container"
      id: "crew-sync"
      name: "Crew Sync"
      description: "Forwards the crew counts for the ticket office and files the late arrivals once a week."
      qualifiers:
        - "Go"
      relationships:
        - destination: "crew-visas.crew-calendar"
          label: "notifies"
    - kind: "container"
      id: "crew-validator"
      name: "Crew Validator"
      description: "Reconciles the crew permits for the fire crews and updates the safety notes each morning."
      relationships:
        - destination: "crew-visas.crew-gateway"
          label: "asks"
        - destination: "crew-visas.crew-search"
          label: "notifies"
        - destination: "land-leases.lease-forms"
          label: "asks"
      elements:
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Prints the records as pages and files."
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
