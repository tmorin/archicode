header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "preprod"
  name: "Pre-production"
  description: "The pre-production machines of the harbour."
  elements:
    - kind: "node"
      id: "identity-server"
      name: "Identity Server"
      description: "Signs the users in and tells the applications who they are."
      applications:
        - "cold-storage.cold-statistics"
        - "container-yard.yard-forms"
        - "weather-stations.weather-dashboard"
    - kind: "node"
      id: "cache-cluster"
      name: "Cache Cluster"
      description: "Keeps the hot data in memory for the applications."
      applications:
        - "quay-maintenance.quay-notifier"
        - "tide-forecast.tide-dashboard"
    - kind: "node"
      id: "database-primary"
      name: "Database Primary"
      description: "Holds the main copy of the data and takes the writes."
      applications:
        - "berth-allocation.berth-validator"
        - "passenger-terminal.terminal-gateway"
        - "visitor-centre.visitor-exporter"
    - kind: "node"
      id: "file-share"
      name: "File Share"
      description: "Stores the documents and the files exchanged with partners."
      applications:
        - "bunkering.fuel-exporter"
        - "safety-inspections.inspection-alerts"
        - "waste-reception.waste-validator"
    - kind: "node"
      id: "reverse-proxy"
      name: "Reverse Proxy"
      description: "Sits in front of the web applications and terminates the encryption."
      applications:
        - "cargo-manifests.manifest-auditor"
        - "tariff-billing.tariff-planner"
        - "tide-forecast.tide-dashboard"
        - "weather-stations.weather-auditor"
    - kind: "node"
      id: "backup-vault"
      name: "Backup Vault"
      description: "Keeps the copies of the data far from the machines they come from."
      applications:
        - "bunkering.fuel-sync"
        - "ferry-ticketing.ferry-billing"
        - "truck-parking.parking-importer"
