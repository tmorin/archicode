header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "lock-gates"
  name: "Lock Gates"
  description: "Looks after the lock side of the harbour."
  elements:
    - kind: "container"
      id: "lock-tracker"
      name: "Lock Tracker"
      description: "Publishes the lock incidents for the lock keepers and alerts the full berths during the winter."
      relationships:
        - destination: "bunkering.fuel-calendar"
          label: "publishes to"
        - destination: "lock-gates.lock-registry"
          label: "notifies"
        - destination: "fire-brigade.fire-statistics"
          label: "synchronises with"
    - kind: "container"
      id: "lock-planner"
      name: "Lock Planner"
      description: "Archives the lock schedules for the ticket office and rates the broken sensors at dusk."
      qualifiers:
        - "Go"
      relationships:
        - destination: "fire-brigade.fire-sync"
          label: "reports to"
    - kind: "container"
      id: "lock-importer"
      name: "Lock Importer"
      description: "Collects the lock readings for the ship chandlers and copies the night shifts on Mondays."
      relationships:
        - destination: "lock-gates.lock-tracker"
          label: "notifies"
        - destination: "lock-gates.lock-alerts"
          label: "fetches from"
        - destination: "lock-gates.lock-auditor"
          label: "synchronises with"
    - kind: "container"
      id: "lock-calendar"
      name: "Lock Calendar"
      description: "Converts the lock reports for the dredging teams and notifies the rough seas after every storm."
      relationships:
        - destination: "lock-gates.lock-alerts"
          label: "synchronises with"
    - kind: "container"
      id: "lock-statistics"
      name: "Lock Statistics"
      description: "Keeps the lock counts for the port police and notifies the spill reports at low tide."
      qualifiers:
        - "Go"
      relationships:
        - destination: "lock-gates.lock-planner"
          label: "reports to"
        - destination: "lock-gates.lock-planner"
          label: "synchronises with"
    - kind: "container"
      id: "lock-alerts"
      name: "Lock Alerts"
      description: "Tracks the lock permits for the harbour master and flags the lost keys during the winter."
      qualifiers:
        - "Python"
      relationships:
        - destination: "lock-gates.lock-planner"
          label: "asks"
        - destination: "lock-gates.lock-gateway"
          label: "sends to"
    - kind: "container"
      id: "lock-scheduler"
      name: "Lock Scheduler"
      description: "Reconciles the lock counts for the lease managers and lists the changed plans twice a day."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "lock-gates.lock-registry"
          label: "fetches from"
    - kind: "container"
      id: "lock-notifier"
      name: "Lock Notifier"
      description: "Records the lock notices for the lock keepers and copies the rough seas at dusk."
      qualifiers:
        - "React"
      relationships:
        - destination: "lock-gates.lock-auditor"
          label: "synchronises with"
    - kind: "container"
      id: "lock-gateway"
      name: "Lock Gateway"
      description: "Tracks the lock queues for the fishing boats and updates the duplicate entries on request."
      relationships:
        - destination: "lock-gates.lock-notifier"
          label: "reports to"
        - destination: "tariff-billing.tariff-dashboard"
          label: "asks"
        - destination: "lock-gates.lock-statistics"
          label: "notifies"
    - kind: "container"
      id: "lock-auditor"
      name: "Lock Auditor"
      description: "Keeps the lock readings for the harbour auditors and reminds the old records at low tide."
      relationships:
        - destination: "port-police.police-importer"
          label: "sends to"
        - destination: "lock-gates.lock-statistics"
          label: "reports to"
        - destination: "lock-gates.lock-validator"
          label: "notifies"
    - kind: "container"
      id: "lock-registry"
      name: "Lock Registry"
      description: "Checks the lock bookings for the port authority board and alerts the urgent requests after each call."
      relationships:
        - destination: "lock-gates.lock-importer"
          label: "publishes to"
        - destination: "lock-gates.lock-statistics"
          label: "reads from"
    - kind: "container"
      id: "lock-sync"
      name: "Lock Sync"
      description: "Checks the lock bookings for the crane drivers and copies the night shifts each morning."
      qualifiers:
        - "Java"
      relationships:
        - destination: "land-leases.lease-registry"
          label: "notifies"
    - kind: "container"
      id: "lock-search"
      name: "Lock Search"
      description: "Keeps the lock requests for the shipping agents and sorts the open permits twice a day."
      relationships:
        - destination: "lock-gates.lock-calendar"
          label: "publishes to"
        - destination: "berth-allocation.berth-gateway"
          label: "notifies"
    - kind: "container"
      id: "lock-validator"
      name: "Lock Validator"
      description: "Reconciles the lock permits for the harbour auditors and counts the late arrivals at dusk."
      relationships:
        - destination: "lock-gates.lock-calendar"
          label: "reports to"
