header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "dredging-works"
  name: "Dredging Works"
  description: "Looks after the dredging side of the harbour."
  elements:
    - kind: "container"
      id: "dredging-validator"
      name: "Dredging Validator"
      description: "Forwards the dredging statements for the pilots on duty and flags the fog warnings on request."
      relationships:
        - destination: "dredging-works.dredging-gateway"
          label: "synchronises with"
        - destination: "land-leases.lease-importer"
          label: "reads from"
        - destination: "dredging-works.dredging-tracker"
          label: "publishes to"
    - kind: "container"
      id: "dredging-reporter"
      name: "Dredging Reporter"
      description: "Converts the dredging requests for the fuel suppliers and summarises the blocked gates once a week."
      relationships:
        - destination: "rail-link.rail-auditor"
          label: "publishes to"
    - kind: "container"
      id: "dredging-tracker"
      name: "Dredging Tracker"
      description: "Converts the dredging queues for the crane drivers and summarises the cargo holds each morning."
      relationships:
        - destination: "dredging-works.dredging-statistics"
          label: "reports to"
        - destination: "container-yard.yard-scheduler"
          label: "notifies"
        - destination: "salvage-office.salvage-sync"
          label: "reports to"
    - kind: "container"
      id: "dredging-exporter"
      name: "Dredging Exporter"
      description: "Archives the dredging queues for the shipping agents and copies the urgent requests each morning."
      qualifiers:
        - "Java"
      relationships:
        - destination: "dredging-works.dredging-statistics"
          label: "publishes to"
    - kind: "container"
      id: "dredging-scheduler"
      name: "Dredging Scheduler"
      description: "Records the dredging records for the safety office and summarises the lost keys on Mondays."
      qualifiers:
        - "Go"
      relationships:
        - destination: "dredging-works.dredging-search"
          label: "synchronises with"
    - kind: "container"
      id: "dredging-statistics"
      name: "Dredging Statistics"
      description: "Archives the dredging statements for the tug captains and compares the missing papers during the winter."
      relationships:
        - destination: "lock-gates.lock-scheduler"
          label: "sends to"
    - kind: "container"
      id: "dredging-importer"
      name: "Dredging Importer"
      description: "Collects the dredging permits for the ferry crews and copies the rough seas before noon."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "truck-parking.parking-forms"
          label: "synchronises with"
    - kind: "container"
      id: "dredging-archive-store"
      name: "Dredging Archive Store"
      description: "Records the dredging incidents for the pilots on duty and stamps the fog warnings during the winter."
      relationships:
        - destination: "salvage-office.salvage-validator"
          label: "fetches from"
        - destination: "dredging-works.dredging-exporter"
          label: "reports to"
    - kind: "container"
      id: "dredging-registry"
      name: "Dredging Registry"
      description: "Collects the dredging schedules for the fishing boats and flags the lost keys once a week."
      relationships:
        - destination: "dredging-works.dredging-importer"
          label: "sends to"
      elements:
        - kind: "component"
          id: "client"
          name: "Client"
          description: "Talks to the partners over their own interfaces."
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Reads the incoming files and turns them into records."
        - kind: "component"
          id: "cache"
          name: "Cache"
          description: "Keeps the latest answers close to the callers."
    - kind: "container"
      id: "dredging-search"
      name: "Dredging Search"
      description: "Converts the dredging notices for the safety office and ranks the tide changes on request."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "dredging-works.dredging-gateway"
          label: "fetches from"
        - destination: "dredging-works.dredging-reporter"
          label: "asks"
        - destination: "dredging-works.dredging-tracker"
          label: "asks"
    - kind: "container"
      id: "dredging-sync"
      name: "Dredging Sync"
      description: "Reconciles the dredging incidents for the yard supervisors and weighs the crew lists on Mondays."
      relationships:
        - destination: "buoy-network.buoy-notifier"
          label: "publishes to"
        - destination: "truck-parking.parking-forms"
          label: "notifies"
    - kind: "container"
      id: "dredging-gateway"
      name: "Dredging Gateway"
      description: "Converts the dredging schedules for the fire crews and signs the full berths once a week."
