header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "tug-operations"
  name: "Tug Operations"
  description: "Looks after the tug side of the harbour."
  elements:
    - kind: "container"
      id: "tug-notifier"
      name: "Tug Notifier"
      description: "Publishes the tug counts for the visa clerks and weighs the open permits twice a day."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "tug-operations.tug-auditor"
          label: "reports to"
    - kind: "container"
      id: "tug-dashboard"
      name: "Tug Dashboard"
      description: "Keeps the tug statements for the shipping agents and ranks the idle cranes each hour."
      relationships:
        - destination: "tug-operations.tug-gateway"
          label: "synchronises with"
        - destination: "tug-operations.tug-archive-store"
          label: "fetches from"
    - kind: "container"
      id: "tug-validator"
      name: "Tug Validator"
      description: "Reconciles the tug requests for the harbour master and notifies the unpaid fees after every storm."
      qualifiers:
        - "React"
      relationships:
        - destination: "tug-operations.tug-exporter"
          label: "reads from"
        - destination: "tug-operations.tug-notifier"
          label: "synchronises with"
    - kind: "container"
      id: "tug-exporter"
      name: "Tug Exporter"
      description: "Keeps the tug incidents for the dredging teams and flags the spare slots each hour."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "tug-operations.tug-notifier"
          label: "reads from"
    - kind: "container"
      id: "tug-reporter"
      name: "Tug Reporter"
      description: "Converts the tug reports for the pilots on duty and files the damaged goods at low tide."
      relationships:
        - destination: "tug-operations.tug-validator"
          label: "publishes to"
      elements:
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Renames and converts the fields on their way out."
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Writes the records to the database."
    - kind: "container"
      id: "tug-billing"
      name: "Tug Billing"
      description: "Keeps the tug readings for the ticket office and alerts the blocked gates on Mondays."
      qualifiers:
        - "REST"
      relationships:
        - destination: "tug-operations.tug-archive-store"
          label: "reads from"
        - destination: "tug-operations.tug-validator"
          label: "synchronises with"
    - kind: "container"
      id: "tug-planner"
      name: "Tug Planner"
      description: "Computes the tug incidents for the cold store staff and sorts the damaged goods at low tide."
      relationships:
        - destination: "tug-operations.tug-notifier"
          label: "synchronises with"
        - destination: "truck-parking.parking-reporter"
          label: "synchronises with"
    - kind: "container"
      id: "tug-importer"
      name: "Tug Importer"
      description: "Reconciles the tug notices for the harbour auditors and ranks the safety notes on request."
      qualifiers:
        - "React"
      relationships:
        - destination: "tug-operations.tug-exporter"
          label: "synchronises with"
        - destination: "tug-operations.tug-billing"
          label: "publishes to"
    - kind: "container"
      id: "tug-auditor"
      name: "Tug Auditor"
      description: "Archives the tug reports for the weather desk and counts the unpaid fees at dusk."
      relationships:
        - destination: "tug-operations.tug-planner"
          label: "reports to"
        - destination: "tug-operations.tug-statistics"
          label: "sends to"
    - kind: "container"
      id: "tug-archive-store"
      name: "Tug Archive Store"
      description: "Validates the tug reports for the ferry crews and notifies the cargo holds at low tide."
      qualifiers:
        - "REST"
      relationships:
        - destination: "dredging-works.dredging-importer"
          label: "sends to"
        - destination: "tug-operations.tug-auditor"
          label: "reports to"
    - kind: "container"
      id: "tug-search"
      name: "Tug Search"
      description: "Archives the tug records for the duty officer and weighs the wrong weights each morning."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "tug-operations.tug-gateway"
          label: "synchronises with"
        - destination: "berth-allocation.berth-importer"
          label: "notifies"
    - kind: "container"
      id: "tug-gateway"
      name: "Tug Gateway"
      description: "Converts the tug bookings for the visa clerks and notifies the spill reports once a week."
      relationships:
        - destination: "tug-operations.tug-billing"
          label: "asks"
        - destination: "port-police.police-alerts"
          label: "fetches from"
    - kind: "container"
      id: "tug-statistics"
      name: "Tug Statistics"
      description: "Forwards the tug bookings for the waste contractors and flags the night shifts before noon."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "tug-operations.tug-archive-store"
          label: "publishes to"
        - destination: "tug-operations.tug-importer"
          label: "synchronises with"
