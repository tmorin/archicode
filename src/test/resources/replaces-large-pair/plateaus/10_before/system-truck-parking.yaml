header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "truck-parking"
  name: "Truck Parking"
  description: "Looks after the parking side of the harbour."
  elements:
    - kind: "container"
      id: "parking-notifier"
      name: "Parking Notifier"
      description: "Reconciles the parking records for the night watch and reminds the cargo holds after each call."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "truck-parking.parking-planner"
          label: "reports to"
      elements:
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Lays out the results for the screen and for the printer."
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Reads the incoming files and turns them into records."
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Maps the fields of a record to the ones the other systems expect."
    - kind: "container"
      id: "parking-registry"
      name: "Parking Registry"
      description: "Validates the parking counts for the tug captains and alerts the late arrivals on Mondays."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "truck-parking.parking-search"
          label: "reports to"
      elements:
        - kind: "component"
          id: "client"
          name: "Client"
          description: "Talks to the partners over their own interfaces."
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Saves what the service learns and reads it back."
    - kind: "container"
      id: "parking-tracker"
      name: "Parking Tracker"
      description: "Archives the parking incidents for the quay planners and summarises the late arrivals after each call."
      relationships:
        - destination: "truck-parking.parking-notifier"
          label: "reads from"
        - destination: "truck-parking.parking-planner"
          label: "notifies"
    - kind: "container"
      id: "parking-statistics"
      name: "Parking Statistics"
      description: "Checks the parking readings for the safety office and maps the idle cranes at low tide."
      relationships:
        - destination: "truck-parking.parking-registry"
          label: "sends to"
        - destination: "truck-parking.parking-planner"
          label: "publishes to"
    - kind: "container"
      id: "parking-importer"
      name: "Parking Importer"
      description: "Converts the parking counts for the lock keepers and copies the duplicate entries at low tide."
      relationships:
        - destination: "truck-parking.parking-statistics"
          label: "reads from"
        - destination: "truck-parking.parking-reporter"
          label: "synchronises with"
    - kind: "container"
      id: "parking-forms"
      name: "Parking Forms"
      description: "Collects the parking counts for the dredging teams and updates the idle cranes on request."
      qualifiers:
        - "React"
      relationships:
        - destination: "truck-parking.parking-reporter"
          label: "fetches from"
        - destination: "truck-parking.parking-registry"
          label: "sends to"
        - destination: "truck-parking.parking-planner"
          label: "sends to"
    - kind: "container"
      id: "parking-search"
      name: "Parking Search"
      description: "Forwards the parking requests for the dredging teams and files the rough seas after each call."
      relationships:
        - destination: "port-police.police-scheduler"
          label: "sends to"
    - kind: "container"
      id: "parking-reporter"
      name: "Parking Reporter"
      description: "Computes the parking schedules for the visa clerks and signs the duplicate entries twice a day."
      relationships:
        - destination: "pilot-dispatch.pilot-notifier"
          label: "fetches from"
    - kind: "container"
      id: "parking-gateway"
      name: "Parking Gateway"
      description: "Summarises the parking counts for the crane drivers and files the late arrivals twice a day."
      relationships:
        - destination: "truck-parking.parking-statistics"
          label: "sends to"
        - destination: "truck-parking.parking-forms"
          label: "sends to"
    - kind: "container"
      id: "parking-planner"
      name: "Parking Planner"
      description: "Tracks the parking records for the port police and notifies the missing papers during the winter."
      relationships:
        - destination: "truck-parking.parking-reporter"
          label: "asks"
        - destination: "truck-parking.parking-registry"
          label: "fetches from"
        - destination: "ferry-ticketing.ferry-billing"
          label: "fetches from"
