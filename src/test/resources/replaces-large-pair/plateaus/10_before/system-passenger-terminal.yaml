header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "passenger-terminal"
  name: "Passenger Terminal"
  description: "Looks after the terminal side of the harbour."
  elements:
    - kind: "container"
      id: "terminal-reporter"
      name: "Terminal Reporter"
      description: "Publishes the terminal records for the visa clerks and counts the heavy loads at low tide."
      relationships:
        - destination: "passenger-terminal.terminal-auditor"
          label: "notifies"
        - destination: "passenger-terminal.terminal-scheduler"
          label: "publishes to"
    - kind: "container"
      id: "terminal-sync"
      name: "Terminal Sync"
      description: "Summarises the terminal reports for the cold store staff and ranks the changed plans twice a day."
      relationships:
        - destination: "passenger-terminal.terminal-statistics"
          label: "fetches from"
        - destination: "passenger-terminal.terminal-gateway"
          label: "synchronises with"
    - kind: "container"
      id: "terminal-alerts"
      name: "Terminal Alerts"
      description: "Collects the terminal records for the lease managers and summarises the damaged goods at dusk."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "cargo-manifests.manifest-calendar"
          label: "asks"
        - destination: "ferry-ticketing.ferry-exporter"
          label: "publishes to"
        - destination: "passenger-terminal.terminal-statistics"
          label: "notifies"
    - kind: "container"
      id: "terminal-tracker"
      name: "Terminal Tracker"
      description: "Summarises the terminal records for the yard supervisors and signs the safety notes once a week."
      relationships:
        - destination: "passenger-terminal.terminal-validator"
          label: "synchronises with"
        - destination: "passenger-terminal.terminal-calendar"
          label: "reads from"
    - kind: "container"
      id: "terminal-planner"
      name: "Terminal Planner"
      description: "Publishes the terminal notices for the tug captains and files the spare slots twice a day."
    - kind: "container"
      id: "terminal-notifier"
      name: "Terminal Notifier"
      description: "Keeps the terminal schedules for the weather desk and rates the empty tanks once a week."
      relationships:
        - destination: "quay-maintenance.quay-registry"
          label: "synchronises with"
        - destination: "passenger-terminal.terminal-alerts"
          label: "sends to"
        - destination: "tide-forecast.tide-dashboard"
          label: "synchronises with"
    - kind: "container"
      id: "terminal-calendar"
      name: "Terminal Calendar"
      description: "Schedules the terminal requests for the fuel suppliers and counts the extra charges at dusk."
      qualifiers:
        - "Java"
      relationships:
        - destination: "passenger-terminal.terminal-scheduler"
          label: "reads from"
        - destination: "passenger-terminal.terminal-validator"
          label: "fetches from"
        - destination: "passenger-terminal.terminal-auditor"
          label: "notifies"
      elements:
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Splits a file of the shipping lines into lines and fields."
    - kind: "container"
      id: "terminal-validator"
      name: "Terminal Validator"
      description: "Records the terminal permits for the fire crews and updates the full berths after each call."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "passenger-terminal.terminal-registry"
          label: "synchronises with"
        - destination: "pollution-control.pollution-validator"
          label: "sends to"
        - destination: "passenger-terminal.terminal-planner"
          label: "reports to"
    - kind: "container"
      id: "terminal-statistics"
      name: "Terminal Statistics"
      description: "Publishes the terminal counts for the ticket office and signs the late arrivals after each call."
      relationships:
        - destination: "passenger-terminal.terminal-tracker"
          label: "fetches from"
        - destination: "land-leases.lease-importer"
          label: "reports to"
    - kind: "container"
      id: "terminal-auditor"
      name: "Terminal Auditor"
      description: "Archives the terminal reports for the fuel suppliers and files the night shifts each hour."
      relationships:
        - destination: "rail-link.rail-auditor"
          label: "asks"
        - destination: "passenger-terminal.terminal-calendar"
          label: "publishes to"
        - destination: "passenger-terminal.terminal-gateway"
          label: "publishes to"
    - kind: "container"
      id: "terminal-scheduler"
      name: "Terminal Scheduler"
      description: "Keeps the terminal counts for the fire crews and compares the fog warnings twice a day."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "customs-clearance.customs-gateway"
          label: "reads from"
    - kind: "container"
      id: "terminal-gateway"
      name: "Terminal Gateway"
      description: "Summarises the terminal statements for the fuel suppliers and updates the old records each morning."
      relationships:
        - destination: "passenger-terminal.terminal-dashboard"
          label: "asks"
    - kind: "container"
      id: "terminal-dashboard"
      name: "Terminal Dashboard"
      description: "Validates the terminal schedules for the crane drivers and warns the open permits each morning."
      qualifiers:
        - "REST"
      relationships:
        - destination: "passenger-terminal.terminal-gateway"
          label: "notifies"
        - destination: "port-police.police-planner"
          label: "reports to"
        - destination: "passenger-terminal.terminal-tracker"
          label: "synchronises with"
    - kind: "container"
      id: "terminal-registry"
      name: "Terminal Registry"
      description: "Schedules the terminal reports for the quay planners and weighs the spill reports after each call."
      relationships:
        - destination: "passenger-terminal.terminal-tracker"
          label: "asks"
        - destination: "cold-storage.cold-reporter"
          label: "notifies"
