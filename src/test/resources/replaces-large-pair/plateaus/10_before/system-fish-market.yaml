header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "fish-market"
  name: "Fish Market"
  description: "Looks after the fishing side of the harbour."
  elements:
    - kind: "container"
      id: "fishing-tracker"
      name: "Fishing Tracker"
      description: "Checks the fishing requests for the port authority board and warns the long queues before noon."
      relationships:
        - destination: "fish-market.fishing-search"
          label: "reports to"
        - destination: "fish-market.fishing-planner"
          label: "sends to"
      elements:
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Reads the incoming files and turns them into records."
        - kind: "component"
          id: "cache"
          name: "Cache"
          description: "Remembers the last lookups so that the database rests."
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Holds the messages until they are handled."
    - kind: "container"
      id: "fishing-registry"
      name: "Fishing Registry"
      description: "Collects the fishing schedules for the waste contractors and informs the blocked gates after each call."
      qualifiers:
        - "Java"
      relationships:
        - destination: "tariff-billing.tariff-calendar"
          label: "publishes to"
      elements:
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Lays out the results for the screen and for the printer."
        - kind: "component"
          id: "cache"
          name: "Cache"
          description: "Remembers the last lookups so that the database rests."
    - kind: "container"
      id: "fishing-planner"
      name: "Fishing Planner"
      description: "Tracks the fishing schedules for the customs officers and signs the idle cranes after every storm."
      qualifiers:
        - "Python"
      relationships:
        - destination: "fish-market.fishing-sync"
          label: "fetches from"
        - destination: "fish-market.fishing-auditor"
          label: "reads from"
        - destination: "pilot-dispatch.pilot-validator"
          label: "synchronises with"
    - kind: "container"
      id: "fishing-gateway"
      name: "Fishing Gateway"
      description: "Archives the fishing statements for the fire crews and rates the rough seas on request."
      relationships:
        - destination: "fish-market.fishing-notifier"
          label: "synchronises with"
    - kind: "container"
      id: "fishing-search"
      name: "Fishing Search"
      description: "Archives the fishing notices for the terminal operators and weighs the urgent requests once a week."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "fish-market.fishing-sync"
          label: "asks"
    - kind: "container"
      id: "fishing-importer"
      name: "Fishing Importer"
      description: "Collects the fishing requests for the port authority board and updates the crew lists on Mondays."
      relationships:
        - destination: "fish-market.fishing-tracker"
          label: "reports to"
    - kind: "container"
      id: "fishing-notifier"
      name: "Fishing Notifier"
      description: "Keeps the fishing readings for the harbour auditors and summarises the unpaid fees after every storm."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "waste-reception.waste-auditor"
          label: "asks"
    - kind: "container"
      id: "fishing-auditor"
      name: "Fishing Auditor"
      description: "Reconciles the fishing bookings for the visa clerks and flags the cargo holds during the winter."
      qualifiers:
        - "Go"
      relationships:
        - destination: "fish-market.fishing-gateway"
          label: "reads from"
        - destination: "fish-market.fishing-importer"
          label: "reads from"
        - destination: "salvage-office.salvage-search"
          label: "sends to"
    - kind: "container"
      id: "fishing-archive-store"
      name: "Fishing Archive Store"
      description: "Computes the fishing schedules for the harbour auditors and sorts the changed plans during the winter."
      qualifiers:
        - "Java"
      relationships:
        - destination: "fish-market.fishing-planner"
          label: "fetches from"
        - destination: "fish-market.fishing-importer"
          label: "synchronises with"
        - destination: "passenger-terminal.terminal-planner"
          label: "asks"
      elements:
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Writes the records to the database."
        - kind: "component"
          id: "cache"
          name: "Cache"
          description: "Remembers the last lookups so that the database rests."
        - kind: "component"
          id: "scanner"
          name: "Scanner"
          description: "Watches the incoming folder for new files."
    - kind: "container"
      id: "fishing-sync"
      name: "Fishing Sync"
      description: "Archives the fishing incidents for the lock keepers and counts the crew lists during the winter."
      relationships:
        - destination: "fish-market.fishing-tracker"
          label: "notifies"
