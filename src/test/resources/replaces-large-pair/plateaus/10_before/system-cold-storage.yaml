header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "cold-storage"
  name: "Cold Storage"
  description: "Looks after the cold-store side of the harbour."
  elements:
    - kind: "container"
      id: "cold-archive-store"
      name: "Cold Archive Store"
      description: "Converts the cold-store notices for the fuel suppliers and lists the expired licences on request."
      qualifiers:
        - "React"
      relationships:
        - destination: "cold-storage.cold-notifier"
          label: "notifies"
        - destination: "lighthouse-service.lighthouse-statistics"
          label: "synchronises with"
    - kind: "container"
      id: "cold-forms"
      name: "Cold Forms"
      description: "Reconciles the cold-store schedules for the lock keepers and rates the blocked gates before noon."
      relationships:
        - destination: "cold-storage.cold-validator"
          label: "asks"
        - destination: "cold-storage.cold-archive-store"
          label: "fetches from"
        - destination: "cold-storage.cold-archive-store"
          label: "reads from"
    - kind: "container"
      id: "cold-sync"
      name: "Cold Sync"
      description: "Keeps the cold-store schedules for the insurance surveyors and weighs the fog warnings on request."
      relationships:
        - destination: "cold-storage.cold-forms"
          label: "publishes to"
        - destination: "cold-storage.cold-statistics"
          label: "synchronises with"
    - kind: "container"
      id: "cold-validator"
      name: "Cold Validator"
      description: "Publishes the cold-store queues for the tug captains and maps the new vessels at dusk."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "cold-storage.cold-alerts"
          label: "sends to"
        - destination: "cold-storage.cold-tracker"
          label: "synchronises with"
        - destination: "cold-storage.cold-search"
          label: "reads from"
    - kind: "container"
      id: "cold-statistics"
      name: "Cold Statistics"
      description: "Reconciles the cold-store queues for the crane drivers and compares the late arrivals at dusk."
      relationships:
        - destination: "cold-storage.cold-tracker"
          label: "reports to"
        - destination: "dredging-works.dredging-exporter"
          label: "synchronises with"
    - kind: "container"
      id: "cold-reporter"
      name: "Cold Reporter"
      description: "Keeps the cold-store requests for the night watch and rates the idle cranes on request."
    - kind: "container"
      id: "cold-calendar"
      name: "Cold Calendar"
      description: "Records the cold-store readings for the fuel suppliers and signs the duplicate entries each hour."
      relationships:
        - destination: "fire-brigade.fire-alerts"
          label: "reports to"
        - destination: "cold-storage.cold-sync"
          label: "publishes to"
        - destination: "cold-storage.cold-notifier"
          label: "synchronises with"
    - kind: "container"
      id: "cold-scheduler"
      name: "Cold Scheduler"
      description: "Computes the cold-store schedules for the duty officer and notifies the spill reports after every storm."
      relationships:
        - destination: "cold-storage.cold-planner"
          label: "sends to"
        - destination: "cold-storage.cold-search"
          label: "sends to"
    - kind: "container"
      id: "cold-notifier"
      name: "Cold Notifier"
      description: "Converts the cold-store requests for the quay planners and informs the duplicate entries once a week."
      relationships:
        - destination: "cold-storage.cold-tracker"
          label: "notifies"
        - destination: "cold-storage.cold-scheduler"
          label: "sends to"
        - destination: "cold-storage.cold-sync"
          label: "synchronises with"
    - kind: "container"
      id: "cold-search"
      name: "Cold Search"
      description: "Keeps the cold-store counts for the fuel suppliers and signs the long queues before noon."
      qualifiers:
        - "Python"
      relationships:
        - destination: "cold-storage.cold-alerts"
          label: "fetches from"
        - destination: "pollution-control.pollution-tracker"
          label: "reports to"
      elements:
        - kind: "component"
          id: "cache"
          name: "Cache"
          description: "Keeps the latest answers close to the callers."
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
    - kind: "container"
      id: "cold-tracker"
      name: "Cold Tracker"
      description: "Tracks the cold-store records for the rail dispatchers and reminds the cargo holds after each call."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "cold-storage.cold-forms"
          label: "notifies"
        - destination: "cold-storage.cold-validator"
          label: "synchronises with"
        - destination: "tug-operations.tug-billing"
          label: "reports to"
      elements:
        - kind: "component"
          id: "scanner"
          name: "Scanner"
          description: "Watches the incoming folder for new files."
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Lays out the results for the screen and for the printer."
    - kind: "container"
      id: "cold-planner"
      name: "Cold Planner"
      description: "Tracks the cold-store bookings for the ferry crews and maps the long queues after every storm."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "waste-reception.waste-importer"
          label: "reads from"
        - destination: "cold-storage.cold-tracker"
          label: "reads from"
        - destination: "cold-storage.cold-statistics"
          label: "reports to"
    - kind: "container"
      id: "cold-alerts"
      name: "Cold Alerts"
      description: "Archives the cold-store schedules for the pilots on duty and rates the expired licences during the winter."
      qualifiers:
        - "PostgreSQL"
