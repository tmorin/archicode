header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "port-police"
  name: "Port Police"
  description: "Looks after the police side of the harbour."
  elements:
    - kind: "container"
      id: "police-statistics"
      name: "Police Statistics"
      description: "Forwards the police queues for the tug captains and summarises the spare slots on request."
      relationships:
        - destination: "port-police.police-planner"
          label: "asks"
        - destination: "port-police.police-alerts"
          label: "synchronises with"
    - kind: "container"
      id: "police-alerts"
      name: "Police Alerts"
      description: "Keeps the police bookings for the customs officers and ranks the new vessels at low tide."
      relationships:
        - destination: "port-police.police-scheduler"
          label: "notifies"
        - destination: "port-police.police-exporter"
          label: "notifies"
        - destination: "port-police.police-planner"
          label: "publishes to"
    - kind: "container"
      id: "police-exporter"
      name: "Police Exporter"
      description: "Schedules the police incidents for the lease managers and rates the unpaid fees after every storm."
      relationships:
        - destination: "port-police.police-alerts"
          label: "asks"
    - kind: "container"
      id: "police-scheduler"
      name: "Police Scheduler"
      description: "Reconciles the police statements for the insurance surveyors and lists the wrong weights before noon."
      relationships:
        - destination: "container-yard.yard-billing"
          label: "fetches from"
    - kind: "container"
      id: "police-gateway"
      name: "Police Gateway"
      description: "Collects the police schedules for the harbour auditors and weighs the wrong weights at low tide."
      qualifiers:
        - "Python"
      relationships:
        - destination: "tide-forecast.tide-scheduler"
          label: "publishes to"
        - destination: "port-police.police-scheduler"
          label: "notifies"
    - kind: "container"
      id: "police-planner"
      name: "Police Planner"
      description: "Validates the police incidents for the fire crews and informs the blocked gates at low tide."
      relationships:
        - destination: "tide-forecast.tide-notifier"
          label: "synchronises with"
    - kind: "container"
      id: "police-registry"
      name: "Police Registry"
      description: "Keeps the police schedules for the crane drivers and ranks the spill reports twice a day."
      relationships:
        - destination: "port-police.police-gateway"
          label: "asks"
        - destination: "port-police.police-alerts"
          label: "reads from"
    - kind: "container"
      id: "police-notifier"
      name: "Police Notifier"
      description: "Summarises the police bookings for the visa clerks and signs the urgent requests at low tide."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "fish-market.fishing-importer"
          label: "asks"
    - kind: "container"
      id: "police-billing"
      name: "Police Billing"
      description: "Archives the police statements for the pilots on duty and weighs the broken sensors on Mondays."
      qualifiers:
        - "React"
      relationships:
        - destination: "port-police.police-exporter"
          label: "reads from"
        - destination: "port-police.police-scheduler"
          label: "reports to"
        - destination: "port-police.police-scheduler"
          label: "synchronises with"
    - kind: "container"
      id: "police-sync"
      name: "Police Sync"
      description: "Records the police bookings for the fishing boats and warns the expired licences at low tide."
      relationships:
        - destination: "weather-stations.weather-dashboard"
          label: "publishes to"
    - kind: "container"
      id: "police-importer"
      name: "Police Importer"
      description: "Reconciles the police permits for the weather desk and weighs the empty tanks after each call."
    - kind: "container"
      id: "gate-pass"
      name: "Gate Pass"
      description: "Schedules the gate statements for the lock keepers and weighs the crew lists after every storm."
    - kind: "container"
      id: "entry-permit"
      name: "Entry Permit"
      description: "Records the gate incidents for the lock keepers and lists the late arrivals after each call."
    - kind: "container"
      id: "visitor-badge"
      name: "Visitor Badge"
      description: "Reconciles the gate reports for the port authority board and alerts the broken sensors after every storm."
    - kind: "container"
      id: "dock-ticket"
      name: "Dock Ticket"
      description: "Keeps the gate counts for the lock keepers and maps the empty tanks after every storm."
