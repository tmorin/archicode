header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "sandbox"
  name: "Sandbox"
  description: "The sandbox machines of the harbour."
  elements:
    - kind: "node"
      id: "batch-runner"
      name: "Batch Runner"
      description: "Runs the nightly jobs and the long computations."
      applications:
        - "salvage-office.salvage-scheduler"
        - "truck-parking.parking-search"
    - kind: "node"
      id: "job-scheduler"
      name: "Job Scheduler"
      description: "Starts the periodic jobs at the right time."
      applications:
        - "berth-allocation.berth-exporter"
        - "pilot-dispatch.pilot-dashboard"
    - kind: "node"
      id: "database-replica"
      name: "Database Replica"
      description: "Holds a copy of the data for the reads and the reports."
      applications:
        - "bunkering.fuel-exporter"
        - "tide-forecast.tide-registry"
        - "weather-stations.weather-tracker"
    - kind: "node"
      id: "database-primary"
      name: "Database Primary"
      description: "Holds the main copy of the data and takes the writes."
      applications:
        - "lighthouse-service.lighthouse-sync"
        - "rail-link.rail-scheduler"
        - "tide-forecast.tide-archive-store"
        - "visitor-centre.visitor-validator"
    - kind: "node"
      id: "backup-vault"
      name: "Backup Vault"
      description: "Keeps the copies of the data far from the machines they come from."
      applications:
        - "buoy-network.buoy-scheduler"
        - "safety-inspections.inspection-search"
        - "salvage-office.salvage-registry"
