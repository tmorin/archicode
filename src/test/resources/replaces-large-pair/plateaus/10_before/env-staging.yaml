header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "staging"
  name: "Staging"
  description: "The staging machines of the harbour."
  elements:
    - kind: "node"
      id: "database-replica"
      name: "Database Replica"
      description: "Holds a copy of the data for the reads and the reports."
      applications:
        - "crew-visas.crew-billing"
        - "weather-stations.weather-search"
    - kind: "node"
      id: "edge-cluster"
      name: "Edge Cluster"
      description: "Receives the traffic from outside and hands it to the applications."
      applications:
        - "cargo-manifests.manifest-validator"
        - "crew-visas.crew-validator"
    - kind: "node"
      id: "message-broker"
      name: "Message Broker"
      description: "Carries the messages between the applications."
      applications:
        - "fire-brigade.fire-alerts"
        - "port-police.police-billing"
        - "tug-operations.tug-planner"
    - kind: "node"
      id: "cache-cluster"
      name: "Cache Cluster"
      description: "Keeps the hot data in memory for the applications."
      applications:
        - "container-yard.yard-billing"
        - "container-yard.yard-forms"
    - kind: "node"
      id: "batch-runner"
      name: "Batch Runner"
      description: "Runs the nightly jobs and the long computations."
      applications:
        - "safety-inspections.inspection-alerts"
        - "tug-operations.tug-notifier"
    - kind: "node"
      id: "identity-server"
      name: "Identity Server"
      description: "Signs the users in and tells the applications who they are."
      applications:
        - "dredging-works.dredging-registry"
        - "passenger-terminal.terminal-calendar"
        - "salvage-office.salvage-alerts"
