header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "pilot-dispatch"
  name: "Pilot Dispatch"
  description: "Looks after the pilot side of the harbour."
  elements:
    - kind: "container"
      id: "pilot-calendar"
      name: "Pilot Calendar"
      description: "Tracks the pilot requests for the harbour auditors and compares the damaged goods on Mondays."
      qualifiers:
        - "Java"
      relationships:
        - destination: "visitor-centre.visitor-scheduler"
          label: "sends to"
        - destination: "pilot-dispatch.pilot-notifier"
          label: "fetches from"
        - destination: "pilot-dispatch.pilot-reporter"
          label: "reports to"
    - kind: "container"
      id: "pilot-validator"
      name: "Pilot Validator"
      description: "Summarises the pilot schedules for the duty officer and copies the heavy loads each morning."
      relationships:
        - destination: "pilot-dispatch.pilot-tracker"
          label: "reads from"
        - destination: "cold-storage.cold-archive-store"
          label: "sends to"
    - kind: "container"
      id: "pilot-auditor"
      name: "Pilot Auditor"
      description: "Publishes the pilot queues for the ship chandlers and reminds the unpaid fees at low tide."
      relationships:
        - destination: "pilot-dispatch.pilot-validator"
          label: "publishes to"
        - destination: "pilot-dispatch.pilot-dashboard"
          label: "asks"
      elements:
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Writes the records to the database."
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Renames and converts the fields on their way out."
    - kind: "container"
      id: "pilot-statistics"
      name: "Pilot Statistics"
      description: "Converts the pilot bookings for the crane drivers and updates the old records each morning."
      relationships:
        - destination: "pilot-dispatch.pilot-auditor"
          label: "synchronises with"
    - kind: "container"
      id: "pilot-dashboard"
      name: "Pilot Dashboard"
      description: "Forwards the pilot bookings for the ferry crews and summarises the safety notes each morning."
    - kind: "container"
      id: "pilot-planner"
      name: "Pilot Planner"
      description: "Keeps the pilot records for the port authority board and reminds the unpaid fees after every storm."
      qualifiers:
        - "Go"
      relationships:
        - destination: "pilot-dispatch.pilot-tracker"
          label: "fetches from"
        - destination: "land-leases.lease-forms"
          label: "reads from"
    - kind: "container"
      id: "pilot-tracker"
      name: "Pilot Tracker"
      description: "Validates the pilot queues for the rail dispatchers and stamps the spill reports after every storm."
      relationships:
        - destination: "pilot-dispatch.pilot-planner"
          label: "sends to"
        - destination: "land-leases.lease-calendar"
          label: "sends to"
    - kind: "container"
      id: "pilot-notifier"
      name: "Pilot Notifier"
      description: "Converts the pilot reports for the quay planners and alerts the broken sensors before noon."
      qualifiers:
        - "Java"
      relationships:
        - destination: "fire-brigade.fire-archive-store"
          label: "reads from"
        - destination: "pilot-dispatch.pilot-reporter"
          label: "reports to"
        - destination: "cargo-manifests.manifest-auditor"
          label: "sends to"
    - kind: "container"
      id: "pilot-registry"
      name: "Pilot Registry"
      description: "Archives the pilot counts for the quay planners and alerts the old records once a week."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "dredging-works.dredging-importer"
          label: "notifies"
    - kind: "container"
      id: "pilot-reporter"
      name: "Pilot Reporter"
      description: "Collects the pilot bookings for the port authority board and ranks the unpaid fees on request."
      qualifiers:
        - "Python"
      relationships:
        - destination: "pilot-dispatch.pilot-planner"
          label: "fetches from"
