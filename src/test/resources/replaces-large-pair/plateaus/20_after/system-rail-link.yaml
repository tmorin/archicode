header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "rail-link"
  name: "Rail Link"
  description: "Looks after the rail side of the harbour."
  elements:
    - kind: "container"
      id: "rail-importer-core"
      name: "Rail Importer Core"
      description: "Forwards the rail records for the customs officers and informs the old records at low tide."
      qualifiers:
        - "REST"
      relationships:
        - destination: "rail-link.rail-gateway"
          label: "publishes to"
        - destination: "pollution-control.pollution-validator"
          label: "fetches from"
        - destination: "cold-storage.cold-sync-all"
          label: "sends to"
    - kind: "container"
      id: "rail-gateway"
      name: "Rail Gateway"
      description: "Tracks the rail counts for the weather desk and maps the late arrivals at low tide."
      relationships:
        - destination: "customs-clearance.customs-importer"
          label: "fetches from"
        - destination: "port-police.police-notifier"
          label: "publishes to"
        - destination: "port-police.police-gateway"
          label: "asks"
    - kind: "container"
      id: "rail-exporter"
      name: "Rail Exporter"
      description: "Schedules the rail notices for the quay planners and files the night shifts during the winter."
      relationships:
        - destination: "rail-link.rail-search"
          label: "asks"
    - kind: "container"
      id: "rail-statistics"
      name: "Rail Statistics"
      description: "Validates the rail counts for the yard supervisors and notifies the old records at low tide."
      relationships:
        - destination: "rail-link.rail-auditor"
          label: "publishes to"
    - kind: "container"
      id: "rail-calendar"
      name: "Rail Calendar"
      description: "Schedules the rail permits for the crane drivers and counts the crew lists once a week."
      relationships:
        - destination: "rail-link.rail-search"
          label: "publishes to"
    - kind: "container"
      id: "rail-auditor"
      name: "Rail Auditor"
      description: "Archives the rail notices for the insurance surveyors and flags the expired licences after every storm."
      relationships:
        - destination: "visitor-centre.visitor-reporter"
          label: "asks"
    - kind: "container"
      id: "rail-forms"
      name: "Rail Forms"
      description: "Validates the rail requests for the crane drivers and alerts the urgent requests twice a day."
      relationships:
        - destination: "rail-link.rail-exporter"
          label: "sends to"
        - destination: "rail-link.rail-scheduler"
          label: "publishes to"
    - kind: "container"
      id: "rail-search"
      name: "Rail Search"
      description: "Checks the rail statements for the night watch and ranks the heavy loads after every storm."
      relationships:
        - destination: "crane-scheduling.crane-importer"
          label: "reports to"
      elements:
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Splits a file of the shipping lines into lines and fields."
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Saves what the service learns and reads it back."
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Maps the fields of a record to the ones the other systems expect."
    - kind: "container"
      id: "rail-scheduler"
      name: "Rail Scheduler"
      description: "Converts the rail counts for the terminal operators and flags the cargo holds on request."
      relationships:
        - destination: "rail-link.rail-statistics"
          label: "sends to"
        - destination: "gate-control.gate-exporter"
          label: "fetches from"
    - kind: "container"
      id: "rail-dashboard"
      name: "Rail Dashboard"
      description: "Archives the rail records for the fire crews and informs the empty tanks at dusk."
      relationships:
        - destination: "rail-link.rail-calendar"
          label: "sends to"
        - destination: "fire-brigade.fire-registry"
          label: "sends to"
      elements:
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Splits a file of the shipping lines into lines and fields."
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Maps the fields of a record to the ones the other systems expect."
