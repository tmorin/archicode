header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "cold-storage"
  name: "Cold Storage"
  description: "Looks after the cold-store side of the harbour."
  elements:
    - kind: "container"
      id: "cold-scheduler"
      name: "Cold Scheduler"
      description: "Computes the cold-store schedules for the duty officer and notifies the spill reports after every storm."
      relationships:
        - destination: "cold-storage.cold-planner"
          label: "sends to"
        - destination: "cold-storage.cold-search"
          label: "sends to"
    - kind: "container"
      id: "cold-notifier"
      name: "Cold Notifier"
      description: "Converts the cold-store requests for the quay planners and informs the duplicate entries once a week."
      relationships:
        - destination: "cold-storage.cold-tracker"
          label: "notifies"
        - destination: "cold-storage.cold-scheduler"
          label: "sends to"
        - destination: "cold-storage.cold-sync-all"
          label: "synchronises with"
    - kind: "container"
      id: "cold-search"
      name: "Cold Search"
      description: "Keeps the cold-store counts for the fuel suppliers and signs the long queues before noon."
      qualifiers:
        - "Python"
      relationships:
        - destination: "cold-storage.cold-alerts"
          label: "fetches from"
        - destination: "pollution-control.pollution-tracker"
          label: "reports to"
        - destination: "safety-inspections.inspection-archive-store"
          label: "subscribes to"
      elements:
        - kind: "component"
          id: "cache"
          name: "Cache"
          description: "Keeps the latest answers close to the callers."
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
    - kind: "container"
      id: "cold-tracker"
      name: "Cold Tracker"
      description: "Tracks the cold-store records for the rail dispatchers and reminds the cargo holds after each call."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "cold-storage.cold-archive-store-and-forms"
          label: "notifies"
        - destination: "cold-storage.cold-sync-all"
          label: "synchronises with"
        - destination: "tug-operations.tug-billing"
          label: "reports to"
      elements:
        - kind: "component"
          id: "scanner"
          name: "Scanner"
          description: "Watches the incoming folder for new files."
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Lays out the results for the screen and for the printer."
    - kind: "container"
      id: "cold-planner"
      name: "Cold Planner"
      description: "Tracks the cold-store bookings for the ferry crews and maps the long queues after every storm."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "waste-reception.waste-importer"
          label: "reads from"
        - destination: "cold-storage.cold-tracker"
          label: "reads from"
        - destination: "cold-storage.combined-statistics"
          label: "reports to"
    - kind: "container"
      id: "cold-alerts"
      name: "Cold Alerts"
      description: "Archives the cold-store schedules for the pilots on duty and rates the expired licences during the winter."
      qualifiers:
        - "PostgreSQL"
    - kind: "container"
      id: "cold-archive-store-and-forms"
      name: "Cold Archive Store"
      description: "Publishes the cold-store notices for the terminal operators and files the spill reports at low tide."
      relationships:
        - destination: "cold-storage.cold-notifier"
          label: "notifies"
        - destination: "lighthouse-service.lighthouse-statistics"
          label: "synchronises with"
        - destination: "cold-storage.cold-sync-all"
          label: "asks"
        - destination: "cold-storage.cold-archive-store-and-forms"
          label: "fetches from"
        - destination: "cold-storage.cold-archive-store-and-forms"
          label: "reads from"
    - kind: "container"
      id: "cold-sync-all"
      name: "Cold Sync All"
      description: "Keeps the cold-store schedules for the insurance surveyors and weighs the fog warnings on request and the rest."
      relationships:
        - destination: "cold-storage.cold-archive-store-and-forms"
          label: "publishes to"
        - destination: "cold-storage.combined-statistics"
          label: "synchronises with"
        - destination: "cold-storage.cold-alerts"
          label: "sends to"
        - destination: "cold-storage.cold-tracker"
          label: "synchronises with"
        - destination: "cold-storage.cold-search"
          label: "reads from"
    - kind: "container"
      id: "combined-statistics"
      name: "Combined Statistics"
      description: "Checks the cold-store requests for the port police and weighs the night shifts once a week."
      relationships:
        - destination: "cold-storage.cold-tracker"
          label: "reports to"
        - destination: "dredging-works.dredging-exporter"
          label: "synchronises with"
    - kind: "container"
      id: "cold-calendar-joint"
      name: "Cold Calendar Joint"
      description: "Forwards the police queues for the tug captains and summarises the spare slots on request."
      relationships:
        - destination: "fire-brigade.fire-alerts-follow-up"
          label: "reports to"
        - destination: "cold-storage.cold-sync-all"
          label: "publishes to"
        - destination: "cold-storage.cold-notifier"
          label: "synchronises with"
        - destination: "port-police.police-planner"
          label: "asks"
        - destination: "port-police.police-alerts"
          label: "synchronises with"
