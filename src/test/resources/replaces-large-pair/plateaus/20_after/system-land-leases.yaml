header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "land-leases"
  name: "Land Leases"
  description: "Looks after the lease side of the harbour."
  elements:
    - kind: "container"
      id: "lease-validator"
      name: "Lease Validator"
      description: "Converts the lease bookings for the port police and signs the unpaid fees during the winter."
      relationships:
        - destination: "land-leases.lease-registry"
          label: "synchronises with"
      elements:
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Holds the messages until they are handled."
        - kind: "component"
          id: "reminder"
          name: "Reminder"
          description: "Reminds the agents of the documents they still owe."
    - kind: "container"
      id: "lease-registry"
      name: "Lease Registry"
      description: "Keeps the lease readings for the yard supervisors and warns the blocked gates on request."
      relationships:
        - destination: "land-leases.lease-gateway"
          label: "reads from"
        - destination: "land-leases.lease-importer"
          label: "reads from"
    - kind: "container"
      id: "lease-calendar"
      name: "Lease Calendar"
      description: "Archives the lease bookings for the rail dispatchers and informs the open permits on request."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "dredging-works.dredging-registry"
          label: "reads from"
    - kind: "container"
      id: "lease-importer"
      name: "Lease Importer"
      description: "Converts the lease permits for the harbour auditors and files the idle cranes once a week."
      relationships:
        - destination: "land-leases.lease-calendar"
          label: "fetches from"
    - kind: "container"
      id: "lease-auditor"
      name: "Lease Auditor"
      description: "Publishes the lease schedules for the pilots on duty and copies the unpaid fees at dusk."
      relationships:
        - destination: "land-leases.lease-registry"
          label: "fetches from"
    - kind: "container"
      id: "lease-scheduler"
      name: "Lease Scheduler"
      description: "Records the lease incidents for the ticket office and stamps the wrong weights each morning."
      relationships:
        - destination: "crane-scheduling.crane-validator-service"
          label: "synchronises with"
        - destination: "passenger-terminal.terminal-dashboard"
          label: "subscribes to"
    - kind: "container"
      id: "lease-forms"
      name: "Lease Forms"
      description: "Records the lease readings for the fire crews and warns the spill reports after each call."
      relationships:
        - destination: "land-leases.lease-registry"
          label: "publishes to"
        - destination: "visitor-centre.visitor-dashboard"
          label: "subscribes to"
    - kind: "container"
      id: "lease-gateway"
      name: "Lease Gateway"
      description: "Collects the lease incidents for the lease managers and reminds the old records each hour."
      qualifiers:
        - "PostgreSQL"
    - kind: "container"
      id: "lease-exporter"
      name: "Lease Exporter"
      description: "Records the lease statements for the weather desk and signs the full berths on Mondays."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "land-leases.lease-gateway"
          label: "reads from"
    - kind: "container"
      id: "ice-watch"
      name: "Ice Watch"
      description: "Reports the ice on the water in the winter months."
