header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "fire-brigade"
  name: "Fire Brigade"
  description: "Looks after the fire side of the harbour."
  elements:
    - kind: "container"
      id: "fire-gateway"
      name: "Fire Gateway"
      description: "Collects the fire permits for the ticket office and rates the broken sensors on Mondays."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "fire-brigade.fire-registry"
          label: "asks"
        - destination: "fire-brigade.fire-tracker"
          label: "publishes to"
        - destination: "fire-brigade.fire-archive-store"
          label: "synchronises with"
    - kind: "container"
      id: "fire-planner"
      name: "Fire Planner"
      description: "Summarises the fire permits for the safety office and counts the blocked gates at dusk."
      relationships:
        - destination: "fire-brigade.fire-forms-live"
          label: "asks"
        - destination: "fire-brigade.fire-statistics-archive"
          label: "reports to"
    - kind: "container"
      id: "fire-tracker"
      name: "Fire Tracker"
      description: "Checks the fire incidents for the night watch and ranks the duplicate entries during the winter."
      qualifiers:
        - "Java"
      relationships:
        - destination: "fire-brigade.fire-gateway"
          label: "asks"
        - destination: "fire-brigade.fire-sync"
          label: "reads from"
        - destination: "fire-brigade.fire-statistics-live"
          label: "sends to"
    - kind: "container"
      id: "fire-registry"
      name: "Fire Registry"
      description: "Schedules the fire schedules for the port police and summarises the missing papers on request."
      qualifiers:
        - "Java"
      relationships:
        - destination: "truck-parking.parking-tracker"
          label: "publishes to"
      elements:
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Reads the incoming files and turns them into records."
        - kind: "component"
          id: "scanner"
          name: "Scanner"
          description: "Watches the incoming folder for new files."
    - kind: "container"
      id: "fire-reporter"
      name: "Fire Reporter"
      description: "Records the fire reports for the customs officers and sorts the cargo holds during the winter."
      relationships:
        - destination: "fire-brigade.fire-forms-past"
          label: "reads from"
        - destination: "gate-control.gate-validator"
          label: "mirrors"
    - kind: "container"
      id: "fire-archive-store"
      name: "Fire Archive Store"
      description: "Collects the fire counts for the fire crews and stamps the full berths each hour."
      relationships:
        - destination: "fire-brigade.fire-statistics-archive"
          label: "notifies"
        - destination: "fire-brigade.fire-gateway"
          label: "publishes to"
    - kind: "container"
      id: "fire-scheduler"
      name: "Fire Scheduler"
      description: "Records the fire permits for the dredging teams and counts the extra charges before noon."
      qualifiers:
        - "Go"
      relationships:
        - destination: "fire-brigade.fire-forms-live"
          label: "publishes to"
    - kind: "container"
      id: "fire-sync"
      name: "Fire Sync"
      description: "Validates the fire schedules for the port authority board and weighs the rough seas before noon."
      qualifiers:
        - "React"
      relationships:
        - destination: "fire-brigade.fire-forms-past"
          label: "publishes to"
        - destination: "fire-brigade.fire-planner"
          label: "fetches from"
      elements:
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Saves what the service learns and reads it back."
        - kind: "component"
          id: "scanner"
          name: "Scanner"
          description: "Watches the incoming folder for new files."
        - kind: "component"
          id: "client"
          name: "Client"
          description: "Calls the other systems of the harbour."
    - kind: "container"
      id: "fire-calendar"
      name: "Fire Calendar"
      description: "Records the fire statements for the night watch and alerts the long queues once a week."
      relationships:
        - destination: "fire-brigade.fire-archive-store"
          label: "reports to"
        - destination: "fire-brigade.fire-reporter"
          label: "fetches from"
        - destination: "cold-storage.combined-statistics"
          label: "notifies"
    - kind: "container"
      id: "fire-alerts-intake"
      name: "Fire Alerts Intake"
      description: "Schedules the fire readings for the port police and reminds the urgent requests on request as they come in."
      relationships:
        - destination: "rail-link.rail-statistics"
          label: "notifies"
        - destination: "gate-control.gate-importer"
          label: "synchronises with"
    - kind: "container"
      id: "fire-alerts-follow-up"
      name: "Fire Alerts Follow-up"
      description: "Chases the missing items and closes the files."
      relationships:
        - destination: "fire-brigade.fire-archive-store"
          label: "reports to"
    - kind: "container"
      id: "fire-forms-live"
      name: "Live Fire"
      description: "Shows what is happening now for the duty officer."
      relationships:
        - destination: "fire-brigade.fire-reporter"
          label: "fetches from"
        - destination: "berth-allocation.berth-planner"
          label: "reports to"
    - kind: "container"
      id: "fire-forms-past"
      name: "Past Fire"
      description: "Keeps what happened before for the harbour master."
      relationships:
        - destination: "weather-stations-office.weather-registry"
          label: "notifies"
    - kind: "container"
      id: "fire-statistics-live"
      name: "Fire Statistics"
      description: "Takes over the part that has to stay in the harbour."
      relationships:
        - destination: "fire-brigade.fire-reporter"
          label: "fetches from"
        - destination: "fire-brigade.fire-forms-live"
          label: "asks"
    - kind: "container"
      id: "fire-statistics-archive"
      name: "Fire Statistics Archive"
      description: "Keeps the old items for the auditors."
      relationships:
        - destination: "customs-clearance.customs-tracker"
          label: "fetches from"
