header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "prod"
  name: "Production"
  description: "The production machines of the harbour."
  elements:
    - kind: "node"
      id: "cache-cluster-main"
      name: "Cache Cluster"
      description: "Keeps the hot data in memory for the applications."
      applications:
        - "ferry-ticketing.ferry-calendar"
        - "tug-operations.tug-statistics"
    - kind: "node"
      id: "database-replica"
      name: "Database Replica"
      description: "Holds a copy of the data for the reads and the reports."
      applications:
        - "pilot-dispatch.pilot-validator"
        - "pollution-control.pollution-tracker"
        - "tug-operations.tug-exporter"
        - "weather-stations-office.weather-search"
    - kind: "node"
      id: "job-scheduler"
      name: "Job Scheduler"
      description: "Starts the periodic jobs at the right time."
      applications:
        - "dredging-works.dredging-registry"
        - "port-police.police-sync"
    - kind: "node"
      id: "identity-server"
      name: "Identity Server"
      description: "Signs the users in and tells the applications who they are."
      applications:
        - "berth-allocation.berth-planner"
        - "fire-brigade.fire-reporter"
    - kind: "node"
      id: "message-broker"
      name: "Message Broker"
      description: "Carries the messages between the applications."
      applications:
        - "salvage-office.salvage-alerts"
        - "visitor-centre.visitor-calendar"
    - kind: "node"
      id: "backup-vault"
      name: "Backup Vault"
      description: "Keeps the copies of the data far from the machines they come from."
      applications:
        - "passenger-terminal.terminal-auditor"
        - "waste-reception.waste-reporter"
        - "weather-stations-office.weather-search"
