header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "mooring-lines"
  name: "Mooring Lines"
  description: "Looks after the mooring side of the harbour."
  elements:
    - kind: "container"
      id: "mooring-notifier"
      name: "Mooring Notifier"
      description: "Summarises the mooring bookings for the crane drivers and warns the night shifts on request."
      qualifiers:
        - "Go"
      relationships:
        - destination: "mooring-lines.mooring-registry-one"
          label: "asks"
        - destination: "mooring-lines.mooring-gateway"
          label: "synchronises with"
        - destination: "mooring-lines.mooring-planner-north"
          label: "reads from"
    - kind: "container"
      id: "mooring-forms"
      name: "Mooring Forms"
      description: "Forwards the mooring permits for the dredging teams and flags the open permits after every storm."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "mooring-lines.mooring-validator"
          label: "asks"
        - destination: "mooring-lines.mooring-registry-two"
          label: "publishes to"
        - destination: "mooring-lines.mooring-scheduler"
          label: "publishes to"
    - kind: "container"
      id: "mooring-scheduler"
      name: "Mooring Scheduler"
      description: "Summarises the mooring schedules for the weather desk and ranks the expired licences after every storm."
    - kind: "container"
      id: "mooring-importer"
      name: "Mooring Importer"
      description: "Converts the mooring counts for the cold store staff and warns the extra charges during the winter."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "mooring-lines.mooring-forms"
          label: "fetches from"
        - destination: "gate-control.gate-sync"
          label: "synchronises with"
    - kind: "container"
      id: "mooring-reporter"
      name: "Mooring Reporter"
      description: "Collects the mooring notices for the weather desk and lists the duplicate entries on request."
      relationships:
        - destination: "mooring-lines.mooring-planner-south"
          label: "notifies"
        - destination: "mooring-lines.mooring-planner-quay"
          label: "fetches from"
    - kind: "container"
      id: "mooring-search"
      name: "Mooring Search"
      description: "Archives the mooring notices for the weather desk and sorts the blocked gates at dusk."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "mooring-lines.mooring-notifier"
          label: "asks"
      elements:
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Writes the records to the database."
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
    - kind: "container"
      id: "mooring-dashboard"
      name: "Mooring Dashboard"
      description: "Summarises the mooring permits for the ticket office and notifies the safety notes before noon."
      qualifiers:
        - "Go"
      relationships:
        - destination: "mooring-lines.mooring-reporter"
          label: "asks"
    - kind: "container"
      id: "mooring-validator"
      name: "Mooring Validator"
      description: "Computes the mooring incidents for the crane drivers and compares the unpaid fees at low tide."
      relationships:
        - destination: "mooring-lines.mooring-planner-north"
          label: "reports to"
    - kind: "container"
      id: "mooring-gateway"
      name: "Mooring Gateway"
      description: "Checks the mooring schedules for the port police and signs the spare slots on Mondays."
      qualifiers:
        - "Java"
      relationships:
        - destination: "passenger-terminal.lock-tracker-moved"
          label: "notifies"
    - kind: "container"
      id: "mooring-exporter"
      name: "Mooring Exporter"
      description: "Forwards the mooring counts for the visa clerks and rates the tide changes twice a day."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "mooring-lines.mooring-gateway"
          label: "synchronises with"
        - destination: "mooring-lines.mooring-planner-south"
          label: "sends to"
        - destination: "bunkering.fuel-validator"
          label: "subscribes to"
    - kind: "container"
      id: "mooring-registry-one"
      name: "Mooring Registry One"
      description: "Reconciles the mooring reports for the dredging teams and lists the extra charges at dusk."
      relationships:
        - destination: "fire-brigade.fire-alerts-intake"
          label: "sends to"
        - destination: "mooring-lines.mooring-search"
          label: "synchronises with"
    - kind: "container"
      id: "mooring-registry-two"
      name: "Mooring Registry Two"
      description: "Mirrors the mooring reports for the dredging teams and lists the extra charges at dusk."
      relationships:
        - destination: "lock-gates.lock-statistics"
          label: "sends to"
    - kind: "container"
      id: "mooring-planner-north"
      name: "North Mooring Planner"
      description: "Publishes the mooring readings for the harbour master and informs the lost keys once a week."
      relationships:
        - destination: "mooring-lines.mooring-gateway"
          label: "asks"
    - kind: "container"
      id: "mooring-planner-south"
      name: "South Mooring Planner"
      description: "Tracks the mooring notices for the fishing boats and lists the unpaid fees twice a day."
      relationships:
        - destination: "tide-forecast.tide-notifier"
          label: "synchronises with"
    - kind: "container"
      id: "mooring-planner-quay"
      name: "Quay Mooring Planner"
      description: "Collects the mooring reports for the port authority board and updates the rough seas before noon."
      relationships:
        - destination: "tide-forecast.tide-gateway"
          label: "synchronises with"
