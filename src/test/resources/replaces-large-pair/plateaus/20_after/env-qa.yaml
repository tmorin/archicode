header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "qa"
  name: "Quality Assurance"
  description: "The quality assurance machines of the harbour."
  elements:
    - kind: "node"
      id: "reverse-proxy"
      name: "Reverse Proxy"
      description: "Sits in front of the web applications and terminates the encryption."
      applications:
        - "cold-storage.cold-planner"
        - "port-police.police-gateway"
        - "truck-parking.parking-forms"
        - "truck-parking.parking-importer"
    - kind: "node"
      id: "message-broker"
      name: "Message Broker"
      description: "Carries the messages between the applications."
      applications:
        - "berth-allocation.berth-auditor"
        - "mooring-lines.mooring-validator"
        - "visitor-centre.visitor-search"
    - kind: "node"
      id: "edge-cluster"
      name: "Edge Cluster"
      description: "Receives the traffic from outside and hands it to the applications."
      applications:
        - "port-police.police-notifier"
        - "salvage-office.salvage-forms"
    - kind: "node"
      id: "file-share"
      name: "File Share"
      description: "Stores the documents and the files exchanged with partners."
      applications:
        - "crane-scheduling.crane-sync"
        - "lighthouse-service.lighthouse-importer"
        - "rail-link.rail-scheduler"
    - kind: "node"
      id: "cache-cluster"
      name: "Cache Cluster"
      description: "Keeps the hot data in memory for the applications."
      applications:
        - "quay-maintenance.quay-notifier"
        - "tide-forecast.tide-dashboard"
    - kind: "node"
      id: "load-injector"
      name: "Load Injector"
      description: "Plays back the traffic of the busiest day."
