header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "safety-inspections"
  name: "Safety Inspections"
  description: "Looks after the inspection side of the harbour."
  elements:
    - kind: "container"
      id: "inspection-gateway-next"
      name: "Inspection Gateway Next"
      description: "Validates the inspection readings for the fishing boats and maps the extra charges during the winter."
      relationships:
        - destination: "safety-inspections.inspection-billing"
          label: "synchronises with"
    - kind: "container"
      id: "inspection-validator"
      name: "Inspection Validator"
      description: "Records the inspection readings for the ferry crews and compares the changed plans on request."
      relationships:
        - destination: "safety-inspections.inspection-auditor"
          label: "asks"
        - destination: "lighthouse-service.lighthouse-importer"
          label: "asks"
    - kind: "container"
      id: "inspection-archive-store"
      name: "Inspection Archive Store"
      description: "Schedules the inspection readings for the harbour master and counts the unpaid fees once a week."
      qualifiers:
        - "React"
      relationships:
        - destination: "customs-clearance.customs-forms"
          label: "synchronises with"
        - destination: "safety-inspections.inspection-exporter"
          label: "asks"
        - destination: "lighthouse-service.lighthouse-statistics"
          label: "synchronises with"
    - kind: "container"
      id: "inspection-auditor"
      name: "Inspection Auditor"
      description: "Keeps the inspection reports for the shipping agents and informs the open permits during the winter."
      relationships:
        - destination: "safety-inspections.inspection-validator"
          label: "notifies"
        - destination: "safety-inspections.inspection-planner"
          label: "reports to"
        - destination: "tide-forecast.tide-tracker"
          label: "synchronises with"
        - destination: "dredging-works.dredging-statistics"
          label: "cross-checks with"
    - kind: "container"
      id: "inspection-calendar"
      name: "Inspection Calendar"
      description: "Checks the inspection incidents for the crane drivers and notifies the old records on request."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "safety-inspections.inspection-billing"
          label: "asks"
        - destination: "fire-brigade.fire-gateway"
          label: "subscribes to"
    - kind: "container"
      id: "inspection-planner"
      name: "Inspection Planner"
      description: "Validates the inspection counts for the insurance surveyors and weighs the safety notes at dusk."
      relationships:
        - destination: "safety-inspections.inspection-exporter"
          label: "publishes to"
    - kind: "container"
      id: "inspection-billing"
      name: "Inspection Billing"
      description: "Publishes the inspection reports for the crane drivers and maps the tide changes twice a day."
      relationships:
        - destination: "safety-inspections.inspection-calendar"
          label: "synchronises with"
    - kind: "container"
      id: "inspection-forms"
      name: "Inspection Forms"
      description: "Tracks the inspection counts for the waste contractors and counts the changed plans each morning."
      relationships:
        - destination: "safety-inspections.inspection-billing"
          label: "sends to"
    - kind: "container"
      id: "inspection-sync"
      name: "Inspection Sync"
      description: "Forwards the inspection readings for the lock keepers and sorts the extra charges after each call."
      qualifiers:
        - "REST"
      relationships:
        - destination: "safety-inspections.inspection-planner"
          label: "asks"
        - destination: "safety-inspections.inspection-calendar"
          label: "reads from"
    - kind: "container"
      id: "inspection-search"
      name: "Inspection Search"
      description: "Keeps the inspection incidents for the lock keepers and alerts the spill reports during the winter."
      qualifiers:
        - "Go"
      relationships:
        - destination: "pollution-control.pollution-statistics"
          label: "asks"
        - destination: "truck-parking.parking-planner"
          label: "fetches from"
      elements:
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
        - kind: "component"
          id: "client"
          name: "Client"
          description: "Talks to the partners over their own interfaces."
    - kind: "container"
      id: "inspection-alerts"
      name: "Inspection Alerts"
      description: "Records the inspection reports for the shipping agents and notifies the tide changes before noon."
      relationships:
        - destination: "tug-operations.tug-exporter"
          label: "fetches from"
        - destination: "crane-scheduling.crane-statistics"
          label: "publishes to"
        - destination: "weather-stations-office.weather-exporter"
          label: "notifies"
    - kind: "container"
      id: "inspection-exporter"
      name: "Inspection Exporter"
      description: "Tracks the inspection statements for the port authority board and signs the lost keys each hour."
      relationships:
        - destination: "safety-inspections.inspection-sync"
          label: "asks"
        - destination: "tug-operations.tug-notifier-service"
          label: "notifies"
      elements:
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Splits a file of the shipping lines into lines and fields."
        - kind: "component"
          id: "client"
          name: "Client"
          description: "Calls the other systems of the harbour."
