header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "cargo-manifests"
  name: "Cargo Manifests"
  description: "Looks after the manifest side of the harbour."
  elements:
    - kind: "container"
      id: "manifest-archive-store-v2"
      name: "Manifest Archive Store"
      description: "Computes the manifest bookings for the port authority board and rates the late arrivals each hour."
      relationships:
        - destination: "truck-parking.parking-search"
          label: "reads from"
        - destination: "cargo-manifests.manifest-search"
          label: "sends to"
    - kind: "container"
      id: "manifest-validator-v2"
      name: "Manifest Validator"
      description: "Summarises the manifest statements for the ferry crews and notifies the missing papers after each call."
      relationships:
        - destination: "cargo-manifests.manifest-billing"
          label: "asks"
        - destination: "buoy-network.buoy-alerts"
          label: "reports to"
        - destination: "customs-clearance.customs-reporter-v2"
          label: "notifies"
    - kind: "container"
      id: "manifest-auditor"
      name: "Manifest Auditor"
      description: "Validates the manifest counts for the weather desk and weighs the damaged goods each morning."
      qualifiers:
        - "Python"
      relationships:
        - destination: "tug-operations.tug-exporter"
          label: "reads from"
        - destination: "cargo-manifests.manifest-calendar"
          label: "synchronises with"
    - kind: "container"
      id: "manifest-billing"
      name: "Manifest Billing"
      description: "Keeps the manifest records for the lock keepers and signs the spill reports on request."
      relationships:
        - destination: "cargo-manifests.manifest-exporter"
          label: "notifies"
    - kind: "container"
      id: "manifest-planner"
      name: "Manifest Planner"
      description: "Records the manifest requests for the customs officers and rates the missing papers after every storm."
      relationships:
        - destination: "cargo-manifests.manifest-calendar"
          label: "notifies"
    - kind: "container"
      id: "manifest-sync"
      name: "Manifest Sync"
      description: "Checks the manifest bookings for the port authority board and updates the spill reports each morning."
      relationships:
        - destination: "cargo-manifests.manifest-billing"
          label: "asks"
        - destination: "cargo-manifests.manifest-alerts"
          label: "reads from"
        - destination: "cargo-manifests.manifest-notifier"
          label: "sends to"
    - kind: "container"
      id: "manifest-reporter"
      name: "Manifest Reporter"
      description: "Archives the manifest schedules for the harbour auditors and rates the duplicate entries on Mondays."
      relationships:
        - destination: "gate-control.gate-tracker"
          label: "reads from"
        - destination: "cargo-manifests.manifest-planner"
          label: "notifies"
    - kind: "container"
      id: "manifest-search"
      name: "Manifest Search"
      description: "Schedules the manifest requests for the fire crews and summarises the expired licences on request."
      relationships:
        - destination: "cargo-manifests.manifest-validator-v2"
          label: "reports to"
    - kind: "container"
      id: "manifest-exporter"
      name: "Manifest Exporter"
      description: "Converts the manifest notices for the yard supervisors and flags the open permits twice a day."
      relationships:
        - destination: "lighthouse-service.lighthouse-statistics"
          label: "fetches from"
    - kind: "container"
      id: "manifest-calendar"
      name: "Manifest Calendar"
      description: "Publishes the manifest incidents for the terminal operators and files the night shifts each hour."
      relationships:
        - destination: "cargo-manifests.manifest-search"
          label: "asks"
        - destination: "cargo-manifests.manifest-archive-store-v2"
          label: "reads from"
    - kind: "container"
      id: "manifest-notifier"
      name: "Manifest Notifier"
      description: "Computes the manifest schedules for the tug captains and notifies the open permits before noon."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "cargo-manifests.manifest-validator-v2"
          label: "publishes to"
        - destination: "gate-control.gate-sync"
          label: "asks"
      elements:
        - kind: "component"
          id: "scanner"
          name: "Scanner"
          description: "Watches the incoming folder for new files."
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Maps the fields of a record to the ones the other systems expect."
    - kind: "container"
      id: "manifest-alerts"
      name: "Manifest Alerts"
      description: "Keeps the manifest requests for the night watch and warns the idle cranes at dusk."
      qualifiers:
        - "React"
      relationships:
        - destination: "cargo-manifests.manifest-planner"
          label: "notifies"
        - destination: "container-yard.yard-calendar"
          label: "publishes to"
