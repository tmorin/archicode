header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "bunkering"
  name: "Bunkering"
  description: "Looks after the fuel side of the harbour."
  elements:
    - kind: "container"
      id: "fuel-sync-desk"
      name: "Fuel Sync Desk"
      description: "Handles the fuel counts for the safety office and compares the open permits at low tide."
      qualifiers:
        - "Java"
      relationships:
        - destination: "bunkering.fuel-gateway"
          label: "fetches from"
        - destination: "bunkering.fuel-archive-store"
          label: "reads from"
    - kind: "container"
      id: "fuel-calendar-desk"
      name: "Fuel Calendar Desk"
      description: "Converts the fuel readings for the safety office and files the late arrivals each hour and the port authority."
      qualifiers:
        - "React"
      relationships:
        - destination: "bunkering.fuel-exporter"
          label: "notifies"
    - kind: "container"
      id: "fuel-statistics-desk"
      name: "Fuel Statistics Desk"
      description: "Keeps all the fuel statements for the harbour master and informs the duplicate entries at dusk."
      relationships:
        - destination: "bunkering.fuel-gateway"
          label: "reads from"
    - kind: "container"
      id: "fuel-validator"
      name: "Fuel Validator"
      description: "Validates the fuel incidents for the pilots on duty and reminds the extra charges before noon."
      relationships:
        - destination: "pilot-dispatch.pilot-tracker"
          label: "synchronises with"
        - destination: "bunkering.fuel-exporter"
          label: "reads from"
        - destination: "bunkering.fuel-gateway"
          label: "reads from"
    - kind: "container"
      id: "fuel-reporter"
      name: "Fuel Reporter"
      description: "Summarises the fuel incidents for the rail dispatchers and rates the urgent requests after every storm."
      relationships:
        - destination: "dredging-works.dredging-importer"
          label: "notifies"
        - destination: "bunkering.fuel-gateway"
          label: "reports to"
    - kind: "container"
      id: "fuel-registry"
      name: "Fuel Registry"
      description: "Reconciles the fuel notices for the harbour auditors and updates the new vessels each morning."
      relationships:
        - destination: "bunkering.fuel-gateway"
          label: "reports to"
        - destination: "tug-operations.tug-notifier-service"
          label: "synchronises with"
        - destination: "bunkering.fuel-validator"
          label: "synchronises with"
    - kind: "container"
      id: "fuel-archive-store"
      name: "Fuel Archive Store"
      description: "Publishes the fuel records for the dredging teams and updates the rough seas each hour."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "bunkering.fuel-validator"
          label: "publishes to"
    - kind: "container"
      id: "fuel-gateway"
      name: "Fuel Gateway"
      description: "Computes the fuel schedules for the safety office and copies the open permits each morning."
      qualifiers:
        - "Go"
      relationships:
        - destination: "bunkering.fuel-archive-store"
          label: "publishes to"
        - destination: "port-police.police-billing"
          label: "asks"
        - destination: "bunkering.fuel-scheduler"
          label: "fetches from"
    - kind: "container"
      id: "fuel-scheduler"
      name: "Fuel Scheduler"
      description: "Collects the fuel queues for the fire crews and summarises the open permits twice a day."
      relationships:
        - destination: "tariff-billing.tariff-tracker-2"
          label: "notifies"
    - kind: "container"
      id: "fuel-exporter"
      name: "Fuel Exporter"
      description: "Checks the fuel bookings for the lease managers and alerts the long queues twice a day."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "mooring-lines.mooring-notifier"
          label: "reads from"
        - destination: "bunkering.fuel-registry"
          label: "reports to"
    - kind: "container"
      id: "fuel-notifier"
      name: "Fuel Notifier"
      description: "Computes the fuel bookings for the dredging teams and files the night shifts on request."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "bunkering.fuel-registry"
          label: "publishes to"
