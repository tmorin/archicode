header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "lighthouse-service"
  name: "Lighthouse Service"
  description: "Looks after the lighthouse side of the harbour."
  elements:
    - kind: "container"
      id: "lighthouse-gateway"
      name: "Lighthouse Gateway"
      description: "Converts the lighthouse schedules for the night watch and reminds the new vessels once a week."
      relationships:
        - destination: "tide-forecast.tide-registry"
          label: "reports to"
        - destination: "lighthouse-service.lighthouse-reporter"
          label: "asks"
        - destination: "lighthouse-service.lighthouse-alerts"
          label: "fetches from"
    - kind: "container"
      id: "lighthouse-statistics"
      name: "Lighthouse Statistics"
      description: "Schedules the lighthouse queues for the lease managers and notifies the duplicate entries once a week."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "tariff-billing.tariff-reporter"
          label: "synchronises with"
        - destination: "lighthouse-service.lighthouse-importer"
          label: "asks"
    - kind: "container"
      id: "lighthouse-planner"
      name: "Lighthouse Planner"
      description: "Checks the lighthouse readings for the lease managers and weighs the safety notes before noon."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "lighthouse-service.lighthouse-forms"
          label: "reports to"
        - destination: "cold-storage.cold-archive-store-and-forms"
          label: "sends to"
    - kind: "container"
      id: "lighthouse-scheduler"
      name: "Lighthouse Scheduler"
      description: "Keeps the lighthouse permits for the yard supervisors and files the idle cranes at low tide."
      relationships:
        - destination: "lighthouse-service.lighthouse-sync"
          label: "sends to"
        - destination: "buoy-network.buoy-forms"
          label: "subscribes to"
    - kind: "container"
      id: "lighthouse-auditor"
      name: "Lighthouse Auditor"
      description: "Summarises the lighthouse schedules for the safety office and stamps the full berths at dusk."
      relationships:
        - destination: "lighthouse-service.lighthouse-forms"
          label: "publishes to"
    - kind: "container"
      id: "lighthouse-reporter"
      name: "Lighthouse Reporter"
      description: "Converts the lighthouse readings for the harbour auditors and updates the heavy loads each hour."
      relationships:
        - destination: "lighthouse-service.lighthouse-auditor"
          label: "sends to"
        - destination: "lighthouse-service.lighthouse-importer"
          label: "asks"
    - kind: "container"
      id: "lighthouse-forms"
      name: "Lighthouse Forms"
      description: "Collects the lighthouse records for the shipping agents and signs the crew lists on Mondays."
      relationships:
        - destination: "lighthouse-service.lighthouse-auditor"
          label: "fetches from"
        - destination: "crane-scheduling.crane-forms"
          label: "publishes to"
      elements:
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Renames and converts the fields on their way out."
        - kind: "component"
          id: "client"
          name: "Client"
          description: "Calls the other systems of the harbour."
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
    - kind: "container"
      id: "lighthouse-alerts"
      name: "Lighthouse Alerts"
      description: "Schedules the lighthouse readings for the harbour master and files the cargo holds each hour."
      relationships:
        - destination: "tariff-billing.tariff-exporter-next"
          label: "reads from"
        - destination: "lighthouse-service.lighthouse-auditor"
          label: "publishes to"
        - destination: "mooring-lines.mooring-forms"
          label: "cross-checks with"
    - kind: "container"
      id: "lighthouse-importer"
      name: "Lighthouse Importer"
      description: "Collects the lighthouse queues for the lease managers and sorts the full berths once a week."
      relationships:
        - destination: "lighthouse-service.lighthouse-reporter"
          label: "reports to"
        - destination: "lighthouse-service.lighthouse-statistics"
          label: "synchronises with"
    - kind: "container"
      id: "lighthouse-sync"
      name: "Lighthouse Sync"
      description: "Records the lighthouse requests for the safety office and reminds the crew lists before noon."
      qualifiers:
        - "React"
      relationships:
        - destination: "fire-brigade.fire-reporter"
          label: "notifies"
        - destination: "lighthouse-service.lighthouse-auditor"
          label: "reports to"
        - destination: "lighthouse-service.lighthouse-alerts"
          label: "asks"
    - kind: "container"
      id: "lighthouse-notifier"
      name: "Lighthouse Notifier"
      description: "Reconciles the lighthouse reports for the lock keepers and flags the old records during the winter."
      relationships:
        - destination: "lighthouse-service.lighthouse-importer"
          label: "fetches from"
        - destination: "lighthouse-service.lighthouse-auditor"
          label: "reads from"
        - destination: "lighthouse-service.lighthouse-reporter"
          label: "sends to"
    - kind: "container"
      id: "tide-feed"
      name: "Tide Feed"
      description: "Exposes the interface of the tide table to the other systems of the harbour."
    - kind: "container"
      id: "fuel-mailer"
      name: "Fuel Mailer"
      description: "Sends a daily summary of the fuel orders to the shipping agents."
    - kind: "container"
      id: "lock-alarm"
      name: "Lock Alarm"
      description: "Warns the duty officer when a lock gate is stuck."
    - kind: "container"
      id: "boarding-log"
      name: "Boarding Log"
      description: "Keeps the history of every pilot boarding for the harbour auditors."
    - kind: "container"
      id: "waste-check"
      name: "Waste Check"
      description: "Checks every outgoing waste declaration against the harbour regulations."
    - kind: "container"
      id: "truck-counter"
      name: "Truck Counter"
      description: "Counts the trucks that enter the terminal every hour and shows the total on the screen."
    - kind: "container"
      id: "buoy-health"
      name: "Buoy Health"
      description: "Collects the readings of the sensors on the buoys and stores them for later."
    - kind: "container"
      id: "shift-board"
      name: "Shift Board"
      description: "Shows the crews waiting at the dock and their expected time of duty."
    - kind: "container"
      id: "rail-map"
      name: "Rail Map"
      description: "Draws the railway sidings on a map of the harbour."
    - kind: "container"
      id: "rent-calculator"
      name: "Rent Calculator"
      description: "Computes the rent of a plot from its surface and the length of the lease."
    - kind: "container"
      id: "day-report"
      name: "Day Report"
      description: "Prints the list of the lorries that stay in the car park overnight."
    - kind: "container"
      id: "seat-offer"
      name: "Seat Offer"
      description: "Offers a free seat to the next passenger in the queue."
