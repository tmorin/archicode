header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "berth-allocation"
  name: "Berth Allocation"
  description: "Looks after the berth side of the harbour."
  elements:
    - kind: "container"
      id: "berth-exporter-service"
      name: "Berth Exporter"
      description: "Tracks the berth schedules for the ticket office and updates the rough seas before noon."
      relationships:
        - destination: "safety-inspections.inspection-forms"
          label: "sends to"
        - destination: "tide-forecast.tide-dashboard"
          label: "sends to"
        - destination: "berth-allocation.berth-gateway"
          label: "sends to"
    - kind: "container"
      id: "berth-planner"
      name: "Berth Planner"
      description: "Checks the berth requests for the pilots on duty and lists the late arrivals once a week."
      relationships:
        - destination: "berth-allocation.berth-scheduler"
          label: "notifies"
        - destination: "berth-allocation.berth-gateway"
          label: "synchronises with"
    - kind: "container"
      id: "berth-scheduler"
      name: "Berth Scheduler"
      description: "Checks the berth permits for the rail dispatchers and signs the fog warnings on request."
      relationships:
        - destination: "berth-allocation.berth-alerts"
          label: "notifies"
    - kind: "container"
      id: "berth-importer"
      name: "Berth Importer"
      description: "Records the berth notices for the harbour master and updates the missing papers after every storm."
      relationships:
        - destination: "berth-allocation.berth-search"
          label: "notifies"
        - destination: "berth-allocation.berth-forms"
          label: "publishes to"
    - kind: "container"
      id: "berth-gateway"
      name: "Berth Gateway"
      description: "Records the berth readings for the pilots on duty and flags the spill reports each hour."
      relationships:
        - destination: "port-police.police-importer"
          label: "reports to"
        - destination: "berth-allocation.berth-alerts"
          label: "reads from"
        - destination: "berth-allocation.berth-auditor"
          label: "synchronises with"
    - kind: "container"
      id: "berth-search"
      name: "Berth Search"
      description: "Converts the berth requests for the pilots on duty and weighs the broken sensors after every storm."
      qualifiers:
        - "Java"
      relationships:
        - destination: "berth-allocation.berth-importer"
          label: "publishes to"
      elements:
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Writes the records to the database."
        - kind: "component"
          id: "client"
          name: "Client"
          description: "Talks to the partners over their own interfaces."
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Prints the records as pages and files."
    - kind: "container"
      id: "berth-alerts"
      name: "Berth Alerts"
      description: "Schedules the berth permits for the lease managers and flags the extra charges each morning."
      qualifiers:
        - "Kafka"
    - kind: "container"
      id: "berth-auditor"
      name: "Berth Auditor"
      description: "Collects the berth records for the lease managers and alerts the empty tanks at low tide."
      relationships:
        - destination: "berth-allocation.berth-scheduler"
          label: "reads from"
        - destination: "berth-allocation.berth-planner"
          label: "asks"
        - destination: "berth-allocation.berth-scheduler"
          label: "reports to"
    - kind: "container"
      id: "berth-forms"
      name: "Berth Forms"
      description: "Validates the berth incidents for the fire crews and files the idle cranes on request."
      qualifiers:
        - "Go"
      relationships:
        - destination: "berth-allocation.berth-scheduler"
          label: "notifies"
        - destination: "salvage-office.salvage-scheduler"
          label: "asks"
    - kind: "container"
      id: "berth-billing"
      name: "Berth Billing"
      description: "Reconciles the berth queues for the harbour auditors and updates the old records each morning."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "berth-allocation.berth-exporter-service"
          label: "synchronises with"
    - kind: "container"
      id: "berth-validator"
      name: "Berth Validator"
      description: "Tracks the berth schedules for the dredging teams and summarises the wrong weights each hour."
      qualifiers:
        - "Python"
      relationships:
        - destination: "port-police.police-sync"
          label: "fetches from"
        - destination: "berth-allocation.berth-forms"
          label: "asks"
        - destination: "gate-control.gate-archive-store"
          label: "sends to"
