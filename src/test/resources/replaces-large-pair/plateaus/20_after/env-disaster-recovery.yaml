header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "disaster-recovery"
  name: "Disaster Recovery"
  description: "The disaster recovery machines of the harbour."
  elements:
    - kind: "node"
      id: "edge-cluster"
      name: "Edge Cluster"
      description: "Receives the traffic from outside and hands it to the applications."
      applications:
        - "salvage-office.salvage-forms"
        - "salvage-office.salvage-tracker"
        - "truck-parking.parking-tracker"
        - "visitor-centre.visitor-sync"
    - kind: "node"
      id: "monitoring-stack"
      name: "Monitoring Stack"
      description: "Collects the metrics and the logs and raises the alarms."
      applications:
        - "container-yard.yard-alerts"
        - "tariff-billing.tariff-tracker-2"
    - kind: "node"
      id: "database-replica"
      name: "Database Replica"
      description: "Holds a copy of the data for the reads and the reports."
      applications:
        - "buoy-network.buoy-auditor"
        - "lock-gates.lock-scheduler"
        - "visitor-centre.visitor-statistics"
        - "weather-stations-office.weather-exporter"
    - kind: "node"
      id: "cache-cluster"
      name: "Cache Cluster"
      description: "Keeps the hot data in memory for the applications."
      applications:
        - "crew-visas.crew-exporter-next"
        - "lock-gates.lock-registry"
        - "mooring-lines.mooring-scheduler"
    - kind: "node"
      id: "message-broker"
      name: "Message Broker"
      description: "A machine, not a program."
    - kind: "node"
      id: "file-share"
      name: "File Share"
      description: "A machine, not a program."
