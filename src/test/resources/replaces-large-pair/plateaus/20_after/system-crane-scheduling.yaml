header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "crane-scheduling"
  name: "Crane Scheduling"
  description: "Looks after the crane side of the harbour."
  elements:
    - kind: "container"
      id: "crane-validator-service"
      name: "Crane Validator"
      description: "Checks the crane notices for the duty officer and flags the changed plans after each call."
      relationships:
        - destination: "crane-scheduling.crane-statistics"
          label: "sends to"
        - destination: "dredging-works.dredging-statistics"
          label: "asks"
    - kind: "container"
      id: "crane-archive-store"
      name: "Crane Archive Store"
      description: "Schedules the crane schedules for the tug captains and warns the heavy loads on Mondays."
      relationships:
        - destination: "crane-scheduling.crane-tracker"
          label: "notifies"
        - destination: "crane-scheduling.crane-validator-service"
          label: "notifies"
        - destination: "crane-scheduling.crane-tracker"
          label: "sends to"
    - kind: "container"
      id: "crane-dashboard"
      name: "Crane Dashboard"
      description: "Summarises the crane incidents for the dredging teams and notifies the lost keys at low tide."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "tide-forecast.tide-forms"
          label: "reads from"
        - destination: "crane-scheduling.crane-gateway"
          label: "publishes to"
    - kind: "container"
      id: "crane-tracker"
      name: "Crane Tracker"
      description: "Records the crane readings for the visa clerks and rates the fog warnings on request."
      relationships:
        - destination: "crane-scheduling.crane-archive-store"
          label: "reads from"
        - destination: "crane-scheduling.crane-exporter"
          label: "reports to"
    - kind: "container"
      id: "crane-forms"
      name: "Crane Forms"
      description: "Keeps the crane incidents for the fuel suppliers and maps the idle cranes at low tide."
      relationships:
        - destination: "crane-scheduling.crane-sync"
          label: "synchronises with"
        - destination: "buoy-network.buoy-importer"
          label: "notifies"
        - destination: "crane-scheduling.crane-reporter"
          label: "synchronises with"
    - kind: "container"
      id: "crane-sync"
      name: "Crane Sync"
      description: "Computes the crane reports for the weather desk and updates the extra charges on request."
      relationships:
        - destination: "tide-forecast.tide-dashboard"
          label: "synchronises with"
        - destination: "crane-scheduling.crane-tracker"
          label: "fetches from"
    - kind: "container"
      id: "crane-reporter"
      name: "Crane Reporter"
      description: "Computes the crane incidents for the terminal operators and signs the duplicate entries each hour."
    - kind: "container"
      id: "crane-statistics"
      name: "Crane Statistics"
      description: "Computes the crane reports for the yard supervisors and signs the full berths each hour."
      qualifiers:
        - "Java"
      relationships:
        - destination: "crane-scheduling.crane-sync"
          label: "reports to"
        - destination: "crane-scheduling.crane-dashboard"
          label: "reports to"
        - destination: "crane-scheduling.crane-sync"
          label: "asks"
    - kind: "container"
      id: "crane-importer"
      name: "Crane Importer"
      description: "Checks the crane counts for the ship chandlers and rates the empty tanks after every storm."
      relationships:
        - destination: "crane-scheduling.crane-dashboard"
          label: "synchronises with"
    - kind: "container"
      id: "crane-exporter"
      name: "Crane Exporter"
      description: "Checks the crane permits for the ticket office and flags the wrong weights on Mondays."
      relationships:
        - destination: "crane-scheduling.crane-tracker"
          label: "asks"
        - destination: "crane-scheduling.crane-tracker"
          label: "reads from"
        - destination: "passenger-terminal.terminal-registry"
          label: "notifies"
    - kind: "container"
      id: "crane-gateway"
      name: "Crane Gateway"
      description: "Summarises the crane counts for the customs officers and notifies the full berths at dusk."
      qualifiers:
        - "Java"
      relationships:
        - destination: "crane-scheduling.crane-forms"
          label: "reports to"
