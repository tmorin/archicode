header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "tide-forecast"
  name: "Tide Forecast"
  description: "Looks after the tide side of the harbour."
  elements:
    - kind: "container"
      id: "tide-planner-service"
      name: "Tide Planner"
      description: "Archives the tide incidents for the fuel suppliers and ranks the damaged goods after every storm."
      qualifiers:
        - "React"
      relationships:
        - destination: "tide-forecast.tide-scheduler"
          label: "asks"
    - kind: "container"
      id: "tide-tracker"
      name: "Tide Tracker"
      description: "Keeps the tide requests for the harbour master and weighs the long queues twice a day."
    - kind: "container"
      id: "tide-sync"
      name: "Tide Sync"
      description: "Publishes the tide counts for the port police and informs the broken sensors twice a day."
      qualifiers:
        - "Python"
      relationships:
        - destination: "tide-forecast.tide-tracker"
          label: "reports to"
        - destination: "tariff-billing.tariff-scheduler"
          label: "synchronises with"
    - kind: "container"
      id: "tide-scheduler"
      name: "Tide Scheduler"
      description: "Summarises the tide statements for the lock keepers and sorts the empty tanks at low tide."
      relationships:
        - destination: "tide-forecast.tide-gateway"
          label: "synchronises with"
      elements:
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Lays out the results for the screen and for the printer."
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
    - kind: "container"
      id: "tide-gateway"
      name: "Tide Gateway"
      description: "Checks the tide counts for the quay planners and counts the heavy loads each hour."
      relationships:
        - destination: "tide-forecast.tide-tracker"
          label: "sends to"
    - kind: "container"
      id: "tide-archive-store"
      name: "Tide Archive Store"
      description: "Reconciles the tide counts for the shipping agents and counts the missing papers on Mondays."
    - kind: "container"
      id: "tide-reporter"
      name: "Tide Reporter"
      description: "Computes the tide bookings for the dredging teams and flags the spare slots on Mondays."
      relationships:
        - destination: "crane-scheduling.crane-statistics"
          label: "reports to"
        - destination: "cargo-manifests.manifest-reporter"
          label: "asks"
    - kind: "container"
      id: "tide-registry"
      name: "Tide Registry"
      description: "Keeps the tide bookings for the ferry crews and copies the open permits on Mondays."
      relationships:
        - destination: "tide-forecast.tide-tracker"
          label: "fetches from"
        - destination: "tide-forecast.tide-notifier"
          label: "fetches from"
    - kind: "container"
      id: "tide-notifier"
      name: "Tide Notifier"
      description: "Tracks the tide records for the customs officers and reminds the old records after each call."
      qualifiers:
        - "Python"
      relationships:
        - destination: "land-leases.lease-registry"
          label: "publishes to"
        - destination: "tide-forecast.tide-dashboard"
          label: "asks"
        - destination: "tide-forecast.tide-registry"
          label: "sends to"
    - kind: "container"
      id: "tide-dashboard"
      name: "Tide Dashboard"
      description: "Reconciles the tide incidents for the pilots on duty and weighs the late arrivals twice a day."
      qualifiers:
        - "Go"
    - kind: "container"
      id: "tide-forms"
      name: "Tide Forms"
      description: "Collects the tide readings for the quay planners and rates the duplicate entries during the winter."
      relationships:
        - destination: "buoy-network.buoy-archive-store"
          label: "fetches from"
    - kind: "container"
      id: "tide-exporter"
      name: "Tide Exporter"
      description: "Publishes the tide schedules for the insurance surveyors and weighs the lost keys after every storm."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "tide-forecast.tide-sync"
          label: "reports to"
