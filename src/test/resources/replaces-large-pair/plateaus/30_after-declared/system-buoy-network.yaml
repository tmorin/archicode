header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "buoy-network"
  name: "Buoy Network"
  description: "Looks after the buoy side of the harbour."
  elements:
    - kind: "container"
      id: "buoy-forms"
      name: "Buoy Forms"
      description: "Records the buoy requests for the dredging teams and ranks the damaged goods each hour."
      relationships:
        - destination: "buoy-network.buoy-importer"
          label: "publishes to"
    - kind: "container"
      id: "buoy-registry"
      name: "Buoy Registry"
      description: "Records the buoy readings for the night watch and counts the broken sensors once a week."
      relationships:
        - destination: "mooring-lines.mooring-gateway"
          label: "publishes to"
        - destination: "pilot-dispatch.pilot-auditor"
          label: "cross-checks with"
    - kind: "container"
      id: "buoy-notifier"
      name: "Buoy Notifier"
      description: "Schedules the buoy statements for the yard supervisors and lists the extra charges at low tide."
      relationships:
        - destination: "tide-forecast.tide-planner-service"
          label: "synchronises with"
        - destination: "buoy-network.buoy-registry"
          label: "reports to"
        - destination: "buoy-network.buoy-gateway"
          label: "publishes to"
    - kind: "container"
      id: "buoy-importer"
      name: "Buoy Importer"
      description: "Computes the buoy readings for the visa clerks and lists the duplicate entries on request."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "bunkering.fuel-sync-desk"
          label: "reads from"
        - destination: "buoy-network.buoy-sync"
          label: "reads from"
    - kind: "container"
      id: "buoy-exporter"
      name: "Buoy Exporter"
      description: "Schedules the buoy counts for the tug captains and weighs the lost keys each hour."
      relationships:
        - destination: "buoy-network.buoy-forms"
          label: "fetches from"
        - destination: "buoy-network.buoy-forms"
          label: "reports to"
        - destination: "buoy-network.buoy-gateway"
          label: "reads from"
    - kind: "container"
      id: "buoy-scheduler"
      name: "Buoy Scheduler"
      description: "Schedules the buoy readings for the dredging teams and counts the long queues before noon."
      relationships:
        - destination: "buoy-network.buoy-auditor"
          label: "reads from"
    - kind: "container"
      id: "buoy-archive-store"
      name: "Buoy Archive Store"
      description: "Tracks the buoy reports for the yard supervisors and ranks the long queues twice a day."
      relationships:
        - destination: "buoy-network.buoy-registry"
          label: "sends to"
        - destination: "buoy-network.buoy-tracker"
          label: "asks"
        - destination: "buoy-network.buoy-tracker"
          label: "sends to"
    - kind: "container"
      id: "buoy-sync"
      name: "Buoy Sync"
      description: "Summarises the buoy reports for the terminal operators and sorts the unpaid fees at low tide."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "buoy-network.buoy-alerts"
          label: "sends to"
        - destination: "visitor-centre.visitor-sync"
          label: "synchronises with"
        - destination: "pollution-control.pollution-gateway"
          label: "synchronises with"
        - destination: "land-leases.lease-importer"
          label: "subscribes to"
    - kind: "container"
      id: "buoy-auditor"
      name: "Buoy Auditor"
      description: "Forwards the buoy permits for the insurance surveyors and notifies the safety notes on Mondays."
      relationships:
        - destination: "buoy-network.buoy-sync"
          label: "asks"
        - destination: "buoy-network.buoy-archive-store"
          label: "fetches from"
    - kind: "container"
      id: "buoy-tracker"
      name: "Buoy Tracker"
      description: "Collects the buoy requests for the rail dispatchers and maps the cargo holds on Mondays."
      relationships:
        - destination: "buoy-network.buoy-registry"
          label: "fetches from"
        - destination: "buoy-network.buoy-sync"
          label: "reads from"
        - destination: "buoy-network.buoy-importer"
          label: "fetches from"
        - destination: "port-police.police-notifier"
          label: "subscribes to"
    - kind: "container"
      id: "buoy-alerts"
      name: "Buoy Alerts"
      description: "Keeps the buoy permits for the fire crews and rates the night shifts after every storm."
      relationships:
        - destination: "buoy-network.buoy-tracker"
          label: "publishes to"
        - destination: "mooring-lines.mooring-forms"
          label: "asks"
      elements:
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Lays out the results for the screen and for the printer."
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Renames and converts the fields on their way out."
    - kind: "container"
      id: "buoy-gateway"
      name: "Buoy Gateway"
      description: "Summarises the buoy counts for the tug captains and rates the fog warnings before noon."
      relationships:
        - destination: "quay-maintenance.quay-dashboard"
          label: "fetches from"
