header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "passenger-terminal"
  name: "Passenger Terminal"
  description: "Looks after the terminal side of the harbour."
  elements:
    - kind: "container"
      id: "terminal-auditor"
      name: "Terminal Auditor"
      description: "Archives the terminal reports for the fuel suppliers and files the night shifts each hour."
      relationships:
        - destination: "rail-link.rail-auditor"
          label: "asks"
        - destination: "lock-gates.terminal-calendar-x"
          label: "publishes to"
        - destination: "passenger-terminal.terminal-gateway"
          label: "publishes to"
    - kind: "container"
      id: "terminal-scheduler"
      name: "Terminal Scheduler"
      description: "Keeps the terminal counts for the fire crews and compares the fog warnings twice a day."
      qualifiers:
        - "Kafka"
    - kind: "container"
      id: "terminal-gateway"
      name: "Terminal Gateway"
      description: "Summarises the terminal statements for the fuel suppliers and updates the old records each morning."
      relationships:
        - destination: "passenger-terminal.terminal-dashboard"
          label: "asks"
        - destination: "salvage-office.salvage-search"
          label: "mirrors"
    - kind: "container"
      id: "terminal-dashboard"
      name: "Terminal Dashboard"
      description: "Validates the terminal schedules for the crane drivers and warns the open permits each morning."
      qualifiers:
        - "REST"
      relationships:
        - destination: "passenger-terminal.terminal-gateway"
          label: "notifies"
        - destination: "port-police.police-planner"
          label: "reports to"
        - destination: "lock-gates.terminal-tracker"
          label: "synchronises with"
    - kind: "container"
      id: "terminal-registry"
      name: "Terminal Registry"
      description: "Schedules the terminal reports for the quay planners and weighs the spill reports after each call."
      relationships:
        - destination: "lock-gates.terminal-tracker"
          label: "asks"
        - destination: "cold-storage.combined-statistics"
          label: "notifies"
    - kind: "container"
      id: "lock-tracker-moved"
      name: "Lock Tracker Moved"
      description: "Publishes the lock incidents for the lock keepers and alerts the full berths during the winter."
      replaces:
        - "lock-gates.lock-tracker"
      relationships:
        - destination: "bunkering.fuel-calendar-desk"
          label: "publishes to"
        - destination: "lock-gates.lock-registry"
          label: "notifies"
        - destination: "fire-brigade.fire-statistics-live"
          label: "synchronises with"
    - kind: "container"
      id: "lock-planner-moved"
      name: "Lock Planner Moved"
      description: "Archives the lock schedules for the ticket office and rates the broken sensors at dusk."
      qualifiers:
        - "Go"
      replaces:
        - "lock-gates.lock-planner"
      relationships:
        - destination: "fire-brigade.fire-sync"
          label: "reports to"
    - kind: "container"
      id: "lock-importer-moved"
      name: "Lock Importer Moved"
      description: "Collects the lock readings for the ship chandlers and copies the night shifts on Mondays."
      replaces:
        - "lock-gates.lock-importer"
      relationships:
        - destination: "passenger-terminal.lock-tracker-moved"
          label: "notifies"
        - destination: "lock-gates.lock-alerts"
          label: "fetches from"
        - destination: "lock-gates.lock-auditor"
          label: "synchronises with"
    - kind: "container"
      id: "lock-calendar-moved"
      name: "Lock Calendar Moved"
      description: "Converts the lock reports for the dredging teams and notifies the rough seas after every storm."
      replaces:
        - "lock-gates.lock-calendar"
      relationships:
        - destination: "lock-gates.lock-alerts"
          label: "synchronises with"
