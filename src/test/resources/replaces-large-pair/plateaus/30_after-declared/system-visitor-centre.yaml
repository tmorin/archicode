header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "visitor-centre"
  name: "Visitor Centre"
  description: "Looks after the visitor side of the harbour."
  elements:
    - kind: "container"
      id: "visitor-statistics"
      name: "Visitor Statistics"
      description: "Validates the visitor queues for the shipping agents and stamps the cargo holds at low tide."
      qualifiers:
        - "REST"
      relationships:
        - destination: "visitor-centre.visitor-reporter"
          label: "publishes to"
    - kind: "container"
      id: "visitor-search"
      name: "Visitor Search"
      description: "Checks the visitor counts for the dredging teams and flags the lost keys on request."
      relationships:
        - destination: "visitor-centre.visitor-scheduler"
          label: "fetches from"
        - destination: "tug-operations.tug-validator"
          label: "asks"
        - destination: "visitor-centre.visitor-calendar"
          label: "sends to"
    - kind: "container"
      id: "visitor-billing"
      name: "Visitor Billing"
      description: "Publishes the visitor reports for the yard supervisors and notifies the damaged goods on Mondays."
      relationships:
        - destination: "visitor-centre.visitor-statistics"
          label: "reads from"
        - destination: "gate-control.gate-exporter"
          label: "notifies"
    - kind: "container"
      id: "visitor-scheduler"
      name: "Visitor Scheduler"
      description: "Reconciles the visitor bookings for the duty officer and informs the urgent requests each morning."
      qualifiers:
        - "Java"
      relationships:
        - destination: "visitor-centre.visitor-billing"
          label: "notifies"
    - kind: "container"
      id: "visitor-exporter"
      name: "Visitor Exporter"
      description: "Schedules the visitor permits for the waste contractors and notifies the rough seas once a week."
      relationships:
        - destination: "visitor-centre.visitor-calendar"
          label: "asks"
        - destination: "dredging-works.dredging-exporter"
          label: "asks"
    - kind: "container"
      id: "visitor-calendar"
      name: "Visitor Calendar"
      description: "Archives the visitor bookings for the ferry crews and ranks the night shifts once a week."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "visitor-centre.visitor-scheduler"
          label: "publishes to"
        - destination: "visitor-centre.visitor-sync"
          label: "notifies"
        - destination: "visitor-centre.visitor-search"
          label: "asks"
    - kind: "container"
      id: "visitor-dashboard"
      name: "Visitor Dashboard"
      description: "Forwards the visitor bookings for the customs officers and flags the urgent requests after every storm."
      qualifiers:
        - "Go"
      relationships:
        - destination: "lighthouse-service.lighthouse-scheduler"
          label: "reports to"
    - kind: "container"
      id: "visitor-sync"
      name: "Visitor Sync"
      description: "Keeps the visitor schedules for the lock keepers and files the empty tanks before noon."
      relationships:
        - destination: "visitor-centre.visitor-scheduler"
          label: "reports to"
    - kind: "container"
      id: "visitor-reporter"
      name: "Visitor Reporter"
      description: "Keeps the visitor notices for the ferry crews and summarises the open permits before noon."
      relationships:
        - destination: "visitor-centre.visitor-search"
          label: "reports to"
        - destination: "buoy-network.buoy-forms"
          label: "reads from"
    - kind: "container"
      id: "visitor-validator"
      name: "Visitor Validator"
      description: "Forwards the visitor counts for the safety office and reminds the changed plans before noon."
      qualifiers:
        - "React"
      relationships:
        - destination: "visitor-centre.visitor-reporter"
          label: "reads from"
    - kind: "container"
      id: "archive"
      name: "Archive"
      description: "Publishes the lock schedules for the port authority board and reminds the heavy loads after each call."
    - kind: "container"
      id: "calendar"
      name: "Calendar"
      description: "Validates the lock notices for the ship chandlers and stamps the long queues each morning."
    - kind: "container"
      id: "statistics"
      name: "Statistics"
      description: "Keeps the lock records for the fire crews and maps the unpaid fees twice a day."
    - kind: "container"
      id: "search"
      name: "Search"
      description: "Keeps the lock notices for the lock keepers and signs the extra charges each morning."
    - kind: "container"
      id: "forms"
      name: "Forms"
      description: "Records the lock bookings for the crane drivers and notifies the changed plans after each call."
    - kind: "container"
      id: "alerts"
      name: "Alerts"
      description: "Forwards the lock counts for the cold store staff and notifies the extra charges during the winter."
