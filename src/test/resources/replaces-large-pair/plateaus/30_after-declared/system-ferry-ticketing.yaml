header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "ferry-ticketing"
  name: "Ferry Ticketing"
  description: "Looks after the ferry side of the harbour."
  elements:
    - kind: "container"
      id: "ferry-exporter-next"
      name: "Ferry Exporter Next"
      description: "Records the ferry requests for the harbour master and alerts the extra charges each hour."
      qualifiers:
        - "Go"
      replaces:
        - "ferry-ticketing.ferry-exporter"
    - kind: "container"
      id: "ferry-reporter-next"
      name: "Ferry Reporter Next"
      description: "Computes the ferry notices for the fishing boats and compares the unpaid fees twice a day."
      replaces:
        - "ferry-ticketing.ferry-reporter"
      relationships:
        - destination: "ferry-ticketing.ferry-gateway"
          label: "asks"
        - destination: "ferry-ticketing.ferry-search"
          label: "reads from"
    - kind: "container"
      id: "ferry-archive-store-next"
      name: "Ferry Archive Store Next"
      description: "Reconciles the ferry schedules for the weather desk and notifies the new vessels on Mondays."
      qualifiers:
        - "Go"
      replaces:
        - "ferry-ticketing.ferry-archive-store"
      relationships:
        - destination: "ferry-ticketing.ferry-exporter-next"
          label: "reports to"
        - destination: "ferry-ticketing.ferry-gateway"
          label: "asks"
    - kind: "container"
      id: "ferry-notifier"
      name: "Ferry Notifier"
      description: "Checks the ferry queues for the cold store staff and counts the empty tanks each morning."
      qualifiers:
        - "React"
      relationships:
        - destination: "ferry-ticketing.ferry-billing"
          label: "publishes to"
        - destination: "ferry-ticketing.ferry-billing"
          label: "synchronises with"
    - kind: "container"
      id: "ferry-dashboard"
      name: "Ferry Dashboard"
      description: "Checks the ferry readings for the shipping agents and updates the rough seas once a week."
      qualifiers:
        - "Go"
      relationships:
        - destination: "ferry-ticketing.ferry-exporter-next"
          label: "synchronises with"
    - kind: "container"
      id: "ferry-calendar"
      name: "Ferry Calendar"
      description: "Validates the ferry permits for the cold store staff and summarises the extra charges during the winter."
      qualifiers:
        - "REST"
      relationships:
        - destination: "ferry-ticketing.ferry-billing"
          label: "reads from"
        - destination: "ferry-ticketing.ferry-gateway"
          label: "publishes to"
        - destination: "land-leases.lease-gateway"
          label: "publishes to"
    - kind: "container"
      id: "ferry-scheduler"
      name: "Ferry Scheduler"
      description: "Archives the ferry statements for the dredging teams and maps the night shifts twice a day."
      relationships:
        - destination: "tide-forecast.tide-archive-store"
          label: "reports to"
        - destination: "ferry-ticketing.ferry-search"
          label: "reports to"
        - destination: "ferry-ticketing.ferry-search"
          label: "publishes to"
    - kind: "container"
      id: "ferry-sync"
      name: "Ferry Sync"
      description: "Records the ferry permits for the fire crews and notifies the fog warnings after each call."
      relationships:
        - destination: "ferry-ticketing.ferry-search"
          label: "reports to"
    - kind: "container"
      id: "ferry-planner"
      name: "Ferry Planner"
      description: "Forwards the ferry reports for the shipping agents and warns the heavy loads twice a day."
      relationships:
        - destination: "ferry-ticketing.ferry-archive-store-next"
          label: "publishes to"
        - destination: "crew-visas.crew-statistics"
          label: "synchronises with"
        - destination: "ferry-ticketing.ferry-scheduler"
          label: "sends to"
    - kind: "container"
      id: "ferry-gateway"
      name: "Ferry Gateway"
      description: "Summarises the ferry bookings for the ferry crews and lists the old records at dusk."
      relationships:
        - destination: "ferry-ticketing.ferry-reporter-next"
          label: "asks"
    - kind: "container"
      id: "ferry-billing"
      name: "Ferry Billing"
      description: "Converts the ferry statements for the cold store staff and informs the broken sensors after every storm."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "ferry-ticketing.ferry-search"
          label: "asks"
        - destination: "ferry-ticketing.ferry-search"
          label: "sends to"
      elements:
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Saves what the service learns and reads it back."
    - kind: "container"
      id: "ferry-search"
      name: "Ferry Search"
      description: "Forwards the ferry queues for the cold store staff and alerts the blocked gates each hour."
      relationships:
        - destination: "ferry-ticketing.ferry-sync"
          label: "notifies"
        - destination: "ferry-ticketing.ferry-calendar"
          label: "reports to"
        - destination: "tide-forecast.tide-forms"
          label: "cross-checks with"
