header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "quay-maintenance"
  name: "Quay Maintenance"
  description: "Looks after the quay side of the harbour."
  elements:
    - kind: "container"
      id: "quay-tracker"
      name: "Quay Tracker"
      description: "Checks the quay counts for the shipping agents and reminds the broken sensors on Mondays."
      qualifiers:
        - "Go"
      relationships:
        - destination: "quay-maintenance.quay-archive-store"
          label: "reads from"
        - destination: "quay-maintenance.quay-calendar"
          label: "notifies"
      elements:
        - kind: "component"
          id: "gate-pass"
          name: "Gate Pass"
          description: "Another thing, filed under the same name."
    - kind: "container"
      id: "quay-gateway"
      name: "Quay Gateway"
      description: "Computes the quay permits for the lock keepers and updates the open permits before noon."
      qualifiers:
        - "Java"
      relationships:
        - destination: "customs-clearance.customs-planner"
          label: "reads from"
        - destination: "quay-maintenance.quay-archive-store"
          label: "reports to"
        - destination: "quay-maintenance.quay-registry"
          label: "notifies"
      elements:
        - kind: "component"
          id: "entry-permit"
          name: "Entry Permit"
          description: "Another thing, filed under the same name."
    - kind: "container"
      id: "quay-statistics"
      name: "Quay Statistics"
      description: "Keeps the quay readings for the weather desk and flags the late arrivals after every storm."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "quay-maintenance.quay-archive-store"
          label: "asks"
        - destination: "quay-maintenance.quay-billing"
          label: "synchronises with"
        - destination: "quay-maintenance.quay-scheduler"
          label: "publishes to"
      elements:
        - kind: "component"
          id: "visitor-badge"
          name: "Visitor Badge"
          description: "Another thing, filed under the same name."
    - kind: "container"
      id: "quay-billing"
      name: "Quay Billing"
      description: "Checks the quay records for the pilots on duty and copies the spare slots each morning."
      qualifiers:
        - "REST"
      relationships:
        - destination: "cold-storage.cold-scheduler"
          label: "reports to"
        - destination: "quay-maintenance.quay-forms"
          label: "fetches from"
      elements:
        - kind: "component"
          id: "dock-ticket"
          name: "Dock Ticket"
          description: "Another thing, filed under the same name."
    - kind: "container"
      id: "quay-calendar"
      name: "Quay Calendar"
      description: "Keeps the quay permits for the crane drivers and lists the long queues on Mondays."
      qualifiers:
        - "REST"
      relationships:
        - destination: "quay-maintenance.quay-archive-store"
          label: "fetches from"
        - destination: "quay-maintenance.quay-dashboard"
          label: "fetches from"
    - kind: "container"
      id: "quay-archive-store"
      name: "Quay Archive Store"
      description: "Forwards the quay statements for the pilots on duty and lists the expired licences once a week."
      relationships:
        - destination: "quay-maintenance.quay-validator"
          label: "fetches from"
        - destination: "quay-maintenance.quay-gateway"
          label: "reads from"
    - kind: "container"
      id: "quay-scheduler"
      name: "Quay Scheduler"
      description: "Computes the quay queues for the fire crews and notifies the expired licences at dusk."
      relationships:
        - destination: "quay-maintenance.quay-gateway"
          label: "reports to"
        - destination: "gate-control.gate-sync"
          label: "reports to"
        - destination: "quay-maintenance.quay-tracker"
          label: "sends to"
    - kind: "container"
      id: "quay-notifier"
      name: "Quay Notifier"
      description: "Computes the quay counts for the duty officer and stamps the new vessels twice a day."
      relationships:
        - destination: "tide-forecast.tide-reporter"
          label: "fetches from"
    - kind: "container"
      id: "quay-dashboard"
      name: "Quay Dashboard"
      description: "Archives the quay counts for the ticket office and updates the blocked gates at low tide."
      qualifiers:
        - "Python"
      relationships:
        - destination: "crane-scheduling.crane-forms"
          label: "sends to"
        - destination: "quay-maintenance.quay-scheduler"
          label: "asks"
    - kind: "container"
      id: "quay-registry"
      name: "Quay Registry"
      description: "Summarises the quay queues for the ship chandlers and updates the spill reports after each call."
      qualifiers:
        - "Python"
      relationships:
        - destination: "customs-clearance.customs-search-v2"
          label: "synchronises with"
    - kind: "container"
      id: "quay-forms"
      name: "Quay Forms"
      description: "Collects the quay bookings for the night watch and maps the fog warnings once a week."
      relationships:
        - destination: "gate-control.gate-sync"
          label: "synchronises with"
    - kind: "container"
      id: "quay-validator"
      name: "Quay Validator"
      description: "Archives the quay records for the crane drivers and flags the wrong weights after each call."
      relationships:
        - destination: "quay-maintenance.quay-gateway"
          label: "reports to"
        - destination: "quay-maintenance.quay-forms"
          label: "sends to"
    - kind: "container"
      id: "ferry-passenger"
      name: "Ferry Passenger"
      description: "Receives the passengers of a ferry at the terminal."
