header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "lock-gates"
  name: "Lock Gates"
  description: "Looks after the lock side of the harbour."
  elements:
    - kind: "container"
      id: "lock-statistics"
      name: "Lock Statistics"
      description: "Keeps the lock counts for the port police and notifies the spill reports at low tide."
      qualifiers:
        - "Go"
      relationships:
        - destination: "passenger-terminal.lock-planner-moved"
          label: "reports to"
        - destination: "passenger-terminal.lock-planner-moved"
          label: "synchronises with"
    - kind: "container"
      id: "lock-alerts"
      name: "Lock Alerts"
      description: "Tracks the lock permits for the harbour master and flags the lost keys during the winter."
      qualifiers:
        - "Python"
      relationships:
        - destination: "passenger-terminal.lock-planner-moved"
          label: "asks"
        - destination: "lock-gates.lock-gateway"
          label: "sends to"
    - kind: "container"
      id: "lock-scheduler"
      name: "Lock Scheduler"
      description: "Reconciles the lock counts for the lease managers and lists the changed plans twice a day."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "lock-gates.lock-registry"
          label: "fetches from"
    - kind: "container"
      id: "lock-notifier"
      name: "Lock Notifier"
      description: "Records the lock notices for the lock keepers and copies the rough seas at dusk."
      qualifiers:
        - "React"
      relationships:
        - destination: "lock-gates.lock-auditor"
          label: "synchronises with"
    - kind: "container"
      id: "lock-gateway"
      name: "Lock Gateway"
      description: "Tracks the lock queues for the fishing boats and updates the duplicate entries on request."
      relationships:
        - destination: "lock-gates.lock-notifier"
          label: "reports to"
        - destination: "tariff-billing.tariff-dashboard"
          label: "asks"
        - destination: "lock-gates.lock-statistics"
          label: "notifies"
    - kind: "container"
      id: "lock-auditor"
      name: "Lock Auditor"
      description: "Keeps the lock readings for the harbour auditors and reminds the old records at low tide."
      relationships:
        - destination: "port-police.police-importer"
          label: "sends to"
        - destination: "lock-gates.lock-statistics"
          label: "reports to"
        - destination: "lock-gates.lock-validator"
          label: "notifies"
    - kind: "container"
      id: "lock-registry"
      name: "Lock Registry"
      description: "Checks the lock bookings for the port authority board and alerts the urgent requests after each call."
      relationships:
        - destination: "passenger-terminal.lock-importer-moved"
          label: "publishes to"
        - destination: "lock-gates.lock-statistics"
          label: "reads from"
    - kind: "container"
      id: "lock-sync"
      name: "Lock Sync"
      description: "Checks the lock bookings for the crane drivers and copies the night shifts each morning."
      qualifiers:
        - "Java"
      relationships:
        - destination: "land-leases.lease-registry"
          label: "notifies"
    - kind: "container"
      id: "lock-search"
      name: "Lock Search"
      description: "Keeps the lock requests for the shipping agents and sorts the open permits twice a day."
      relationships:
        - destination: "berth-allocation.berth-gateway"
          label: "notifies"
    - kind: "container"
      id: "lock-validator"
      name: "Lock Validator"
      description: "Reconciles the lock permits for the harbour auditors and counts the late arrivals at dusk."
      relationships:
        - destination: "passenger-terminal.lock-calendar-moved"
          label: "reports to"
        - destination: "tug-operations.tug-gateway"
          label: "cross-checks with"
    - kind: "container"
      id: "terminal-reporter"
      name: "Terminal Reporter"
      description: "Publishes the terminal records for the visa clerks and counts the heavy loads at low tide."
      replaces:
        - "passenger-terminal.terminal-reporter"
      relationships:
        - destination: "passenger-terminal.terminal-auditor"
          label: "notifies"
        - destination: "passenger-terminal.terminal-scheduler"
          label: "publishes to"
    - kind: "container"
      id: "terminal-sync"
      name: "Terminal Sync"
      description: "Summarises the terminal reports for the cold store staff and ranks the changed plans twice a day."
      replaces:
        - "passenger-terminal.terminal-sync"
      relationships:
        - destination: "lock-gates.terminal-statistics-x"
          label: "fetches from"
        - destination: "passenger-terminal.terminal-gateway"
          label: "synchronises with"
    - kind: "container"
      id: "terminal-alerts"
      name: "Terminal Alerts"
      description: "Collects the terminal records for the lease managers and summarises the damaged goods at dusk."
      qualifiers:
        - "PostgreSQL"
      replaces:
        - "passenger-terminal.terminal-alerts"
      relationships:
        - destination: "cargo-manifests.manifest-calendar"
          label: "asks"
        - destination: "ferry-ticketing.ferry-exporter-next"
          label: "publishes to"
        - destination: "lock-gates.terminal-statistics-x"
          label: "notifies"
    - kind: "container"
      id: "terminal-tracker"
      name: "Terminal Tracker"
      description: "Summarises the terminal records for the yard supervisors and signs the safety notes once a week."
      replaces:
        - "passenger-terminal.terminal-tracker"
      relationships:
        - destination: "lock-gates.terminal-validator-x"
          label: "synchronises with"
        - destination: "lock-gates.terminal-calendar-x"
          label: "reads from"
    - kind: "container"
      id: "terminal-planner"
      name: "Terminal Planner"
      description: "Publishes the terminal notices for the tug captains and files the spare slots twice a day."
      replaces:
        - "passenger-terminal.terminal-planner"
    - kind: "container"
      id: "terminal-notifier"
      name: "Terminal Notifier"
      description: "Keeps the terminal schedules for the weather desk and rates the empty tanks once a week."
      replaces:
        - "passenger-terminal.terminal-notifier"
      relationships:
        - destination: "quay-maintenance.quay-registry"
          label: "synchronises with"
        - destination: "lock-gates.terminal-alerts"
          label: "sends to"
        - destination: "tide-forecast.tide-dashboard"
          label: "synchronises with"
    - kind: "container"
      id: "terminal-calendar-x"
      name: "Terminal Calendar X"
      description: "Archives the terminal statements for the night watch and files the extra charges on request."
      qualifiers:
        - "Java"
      replaces:
        - "passenger-terminal.terminal-calendar"
      relationships:
        - destination: "passenger-terminal.terminal-scheduler"
          label: "reads from"
        - destination: "lock-gates.terminal-validator-x"
          label: "fetches from"
        - destination: "passenger-terminal.terminal-auditor"
          label: "notifies"
      elements:
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
          replaces:
            - "passenger-terminal.terminal-calendar.queue"
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Splits a file of the shipping lines into lines and fields."
          replaces:
            - "passenger-terminal.terminal-calendar.parser"
    - kind: "container"
      id: "terminal-validator-x"
      name: "Terminal Validator X"
      description: "Keeps the terminal statements for the lock keepers and lists the broken sensors on request."
      qualifiers:
        - "Kafka"
      replaces:
        - "passenger-terminal.terminal-validator"
      relationships:
        - destination: "passenger-terminal.terminal-registry"
          label: "synchronises with"
        - destination: "pollution-control.pollution-validator"
          label: "sends to"
        - destination: "lock-gates.terminal-planner"
          label: "reports to"
    - kind: "container"
      id: "terminal-statistics-x"
      name: "Terminal Statistics X"
      description: "Records the terminal statements for the shipping agents and rates the idle cranes after each call."
      replaces:
        - "passenger-terminal.terminal-statistics"
      relationships:
        - destination: "lock-gates.terminal-tracker"
          label: "fetches from"
        - destination: "land-leases.lease-importer"
          label: "reports to"
