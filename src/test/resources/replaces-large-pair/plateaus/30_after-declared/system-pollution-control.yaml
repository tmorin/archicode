header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "pollution-control"
  name: "Pollution Control"
  description: "Looks after the pollution side of the harbour."
  elements:
    - kind: "container"
      id: "pollution-validator"
      name: "Pollution Validator"
      description: "Tracks the pollution requests for the port police and alerts the night shifts on Mondays."
      relationships:
        - destination: "pollution-control.pollution-statistics"
          label: "fetches from"
        - destination: "pollution-control.pollution-planner"
          label: "reads from"
      elements:
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Holds the messages until they are handled."
        - kind: "component"
          id: "printer"
          name: "Printer"
          description: "Prints the passes at the gate."
    - kind: "container"
      id: "pollution-sync"
      name: "Pollution Sync"
      description: "Keeps the pollution queues for the lease managers and files the duplicate entries each hour."
      relationships:
        - destination: "cold-storage.cold-planner"
          label: "synchronises with"
    - kind: "container"
      id: "pollution-statistics"
      name: "Pollution Statistics"
      description: "Tracks the pollution queues for the ship chandlers and maps the long queues once a week."
      relationships:
        - destination: "pollution-control.pollution-validator"
          label: "sends to"
    - kind: "container"
      id: "pollution-planner"
      name: "Pollution Planner"
      description: "Keeps the pollution schedules for the rail dispatchers and compares the night shifts once a week."
      relationships:
        - destination: "pollution-control.pollution-statistics"
          label: "asks"
        - destination: "pollution-control.pollution-forms"
          label: "synchronises with"
    - kind: "container"
      id: "pollution-search"
      name: "Pollution Search"
      description: "Summarises the pollution schedules for the pilots on duty and rates the heavy loads during the winter."
      relationships:
        - destination: "pollution-control.pollution-tracker"
          label: "sends to"
    - kind: "container"
      id: "pollution-forms"
      name: "Pollution Forms"
      description: "Converts the pollution requests for the weather desk and lists the crew lists on request."
      relationships:
        - destination: "pollution-control.pollution-sync"
          label: "publishes to"
    - kind: "container"
      id: "pollution-gateway"
      name: "Pollution Gateway"
      description: "Computes the pollution queues for the port authority board and alerts the safety notes after each call."
      qualifiers:
        - "Java"
      relationships:
        - destination: "waste-reception.waste-gateway"
          label: "synchronises with"
      elements:
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
        - kind: "component"
          id: "rules"
          name: "Rules"
          description: "Applies the rules of the harbour to each record."
    - kind: "container"
      id: "pollution-notifier"
      name: "Pollution Notifier"
      description: "Checks the pollution queues for the dredging teams and summarises the open permits after every storm."
      qualifiers:
        - "Go"
      relationships:
        - destination: "pollution-control.pollution-gateway"
          label: "reads from"
        - destination: "pollution-control.pollution-validator"
          label: "publishes to"
    - kind: "container"
      id: "pollution-tracker"
      name: "Pollution Tracker"
      description: "Archives the pollution notices for the fuel suppliers and updates the old records at dusk."
      relationships:
        - destination: "pollution-control.pollution-statistics"
          label: "asks"
    - kind: "container"
      id: "guest-book"
      name: "Guest Book"
      description: "Lets the visitors of the port leave a message."
