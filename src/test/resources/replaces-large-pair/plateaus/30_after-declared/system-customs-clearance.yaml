header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "customs-clearance"
  name: "Customs Clearance"
  description: "Looks after the customs side of the harbour."
  elements:
    - kind: "container"
      id: "customs-search-v2"
      name: "Customs Search"
      description: "Reconciles the customs readings for the shipping agents and compares the night shifts after every storm."
      qualifiers:
        - "Kafka"
      replaces:
        - "customs-clearance.customs-search"
      relationships:
        - destination: "customs-clearance.customs-archive-store"
          label: "reads from"
    - kind: "container"
      id: "customs-alerts-v2"
      name: "Customs Alerts"
      description: "Reconciles the customs bookings for the duty officer and sorts the missing papers each hour."
      replaces:
        - "customs-clearance.customs-alerts"
      relationships:
        - destination: "gate-control.gate-importer"
          label: "synchronises with"
    - kind: "container"
      id: "customs-reporter-v2"
      name: "Customs Reporter"
      description: "Summarises the customs counts for the tug captains and alerts the idle cranes twice a day."
      replaces:
        - "customs-clearance.customs-reporter"
      relationships:
        - destination: "customs-clearance.customs-forms"
          label: "reads from"
    - kind: "container"
      id: "customs-calendar"
      name: "Customs Calendar"
      description: "Summarises the customs statements for the port authority board and notifies the rough seas after each call."
      qualifiers:
        - "Python"
      relationships:
        - destination: "customs-clearance.customs-tracker"
          label: "publishes to"
        - destination: "cold-storage.cold-scheduler"
          label: "asks"
    - kind: "container"
      id: "customs-importer"
      name: "Customs Importer"
      description: "Collects the customs readings for the ship chandlers and flags the spill reports each morning."
      relationships:
        - destination: "customs-clearance.customs-gateway"
          label: "sends to"
    - kind: "container"
      id: "customs-archive-store"
      name: "Customs Archive Store"
      description: "Keeps the customs records for the night watch and compares the long queues at low tide."
      qualifiers:
        - "Python"
      relationships:
        - destination: "customs-clearance.customs-forms"
          label: "synchronises with"
        - destination: "customs-clearance.customs-auditor"
          label: "publishes to"
    - kind: "container"
      id: "customs-gateway"
      name: "Customs Gateway"
      description: "Schedules the customs statements for the shipping agents and lists the spare slots before noon."
      qualifiers:
        - "React"
    - kind: "container"
      id: "customs-tracker"
      name: "Customs Tracker"
      description: "Keeps the customs incidents for the ship chandlers and summarises the duplicate entries each hour."
      qualifiers:
        - "Java"
      relationships:
        - destination: "customs-clearance.customs-forms"
          label: "publishes to"
    - kind: "container"
      id: "customs-dashboard"
      name: "Customs Dashboard"
      description: "Archives the customs incidents for the safety office and flags the spill reports once a week."
      qualifiers:
        - "Java"
      relationships:
        - destination: "customs-clearance.customs-forms"
          label: "asks"
        - destination: "buoy-network.buoy-auditor"
          label: "sends to"
        - destination: "customs-clearance.customs-search-v2"
          label: "reports to"
    - kind: "container"
      id: "customs-forms"
      name: "Customs Forms"
      description: "Records the customs readings for the ferry crews and warns the safety notes before noon."
      qualifiers:
        - "Python"
    - kind: "container"
      id: "customs-auditor"
      name: "Customs Auditor"
      description: "Reconciles the customs reports for the visa clerks and notifies the missing papers at low tide."
      relationships:
        - destination: "customs-clearance.customs-reporter-v2"
          label: "notifies"
    - kind: "container"
      id: "customs-planner"
      name: "Customs Planner"
      description: "Forwards the customs queues for the safety office and counts the old records after each call."
      relationships:
        - destination: "tide-forecast.tide-reporter"
          label: "notifies"
        - destination: "cold-storage.cold-notifier"
          label: "synchronises with"
