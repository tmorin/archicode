header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "salvage-office"
  name: "Salvage Office"
  description: "Looks after the salvage side of the harbour."
  elements:
    - kind: "container"
      id: "salvage-registry"
      name: "Salvage Registry"
      description: "Computes the salvage notices for the crane drivers and signs the missing papers each hour."
      relationships:
        - destination: "customs-clearance.customs-dashboard"
          label: "reads from"
      elements:
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Lays out the results for the screen and for the printer."
        - kind: "component"
          id: "cache"
          name: "Cache"
          description: "Remembers the last lookups so that the database rests."
    - kind: "container"
      id: "salvage-forms"
      name: "Salvage Forms"
      description: "Converts the salvage bookings for the duty officer and lists the heavy loads each morning."
      relationships:
        - destination: "salvage-office.salvage-tracker"
          label: "reports to"
    - kind: "container"
      id: "salvage-search"
      name: "Salvage Search"
      description: "Forwards the salvage notices for the visa clerks and lists the damaged goods at low tide."
      relationships:
        - destination: "salvage-office.salvage-scheduler"
          label: "reads from"
      elements:
        - kind: "component"
          id: "store"
          name: "Store"
          description: "Writes the records to the database."
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
    - kind: "container"
      id: "salvage-alerts"
      name: "Salvage Alerts"
      description: "Checks the salvage queues for the customs officers and notifies the rough seas on request."
      relationships:
        - destination: "salvage-office.salvage-statistics"
          label: "fetches from"
        - destination: "fish-market.fishing-archive-store"
          label: "fetches from"
        - destination: "salvage-office.salvage-tracker"
          label: "fetches from"
    - kind: "container"
      id: "salvage-validator"
      name: "Salvage Validator"
      description: "Keeps the salvage permits for the quay planners and rates the cargo holds on request."
      relationships:
        - destination: "salvage-office.salvage-alerts"
          label: "reads from"
        - destination: "salvage-office.salvage-registry"
          label: "notifies"
    - kind: "container"
      id: "salvage-importer"
      name: "Salvage Importer"
      description: "Archives the salvage permits for the customs officers and copies the spare slots each morning."
      qualifiers:
        - "React"
      relationships:
        - destination: "salvage-office.salvage-tracker"
          label: "fetches from"
    - kind: "container"
      id: "salvage-tracker"
      name: "Salvage Tracker"
      description: "Publishes the salvage schedules for the insurance surveyors and notifies the open permits before noon."
      qualifiers:
        - "Go"
      relationships:
        - destination: "salvage-office.salvage-scheduler"
          label: "asks"
        - destination: "salvage-office.salvage-forms"
          label: "sends to"
        - destination: "salvage-office.salvage-search"
          label: "reports to"
    - kind: "container"
      id: "salvage-sync"
      name: "Salvage Sync"
      description: "Collects the salvage counts for the yard supervisors and notifies the full berths on Mondays."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "salvage-office.salvage-validator"
          label: "synchronises with"
    - kind: "container"
      id: "salvage-statistics"
      name: "Salvage Statistics"
      description: "Summarises the salvage records for the ticket office and flags the urgent requests after every storm."
      relationships:
        - destination: "salvage-office.salvage-archive-store"
          label: "reads from"
        - destination: "mooring-lines.mooring-importer"
          label: "reports to"
    - kind: "container"
      id: "salvage-archive-store"
      name: "Salvage Archive Store"
      description: "Summarises the salvage incidents for the harbour auditors and warns the safety notes at low tide."
      relationships:
        - destination: "salvage-office.salvage-sync"
          label: "reads from"
    - kind: "container"
      id: "salvage-scheduler"
      name: "Salvage Scheduler"
      description: "Archives the salvage schedules for the duty officer and weighs the new vessels before noon."
      relationships:
        - destination: "salvage-office.salvage-registry"
          label: "reports to"
        - destination: "salvage-office.salvage-statistics"
          label: "asks"
        - destination: "salvage-office.salvage-forms"
          label: "publishes to"
