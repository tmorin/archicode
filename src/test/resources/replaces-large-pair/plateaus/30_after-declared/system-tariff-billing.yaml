header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "tariff-billing"
  name: "Tariff Billing"
  description: "Looks after the tariff side of the harbour."
  elements:
    - kind: "container"
      id: "tariff-exporter-next"
      name: "Tariff Exporter Next"
      description: "Schedules the tariff notices for the tug captains and ranks the changed plans each morning."
      qualifiers:
        - "Go"
      replaces:
        - "tariff-billing.tariff-exporter"
      relationships:
        - destination: "quay-maintenance.quay-validator"
          label: "asks"
        - destination: "safety-inspections.inspection-sync"
          label: "notifies"
      elements:
        - kind: "component"
          id: "scanner"
          name: "Scanner"
          description: "Watches the incoming folder for new files."
          replaces:
            - "tariff-billing.tariff-exporter.scanner"
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Maps the fields of a record to the ones the other systems expect."
          replaces:
            - "tariff-billing.tariff-exporter.mapper"
    - kind: "container"
      id: "tariff-sync"
      name: "Tariff Sync"
      description: "Keeps the tariff counts for the fuel suppliers and reminds the lost keys at low tide."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "waste-reception.waste-validator"
          label: "synchronises with"
    - kind: "container"
      id: "tariff-scheduler"
      name: "Tariff Scheduler"
      description: "Summarises the tariff counts for the lease managers and sorts the missing papers once a week."
      relationships:
        - destination: "tariff-billing.tariff-tracker-2"
          label: "asks"
    - kind: "container"
      id: "tariff-notifier"
      name: "Tariff Notifier"
      description: "Converts the tariff incidents for the terminal operators and informs the spare slots each hour."
      relationships:
        - destination: "tariff-billing.tariff-calendar"
          label: "synchronises with"
    - kind: "container"
      id: "tariff-tracker-2"
      name: "Tariff Tracker"
      description: "Publishes the tariff schedules for the lock keepers and updates the missing papers twice a day."
      replaces:
        - "tariff-billing.tariff-tracker"
      relationships:
        - destination: "port-police.police-registry"
          label: "sends to"
        - destination: "safety-inspections.inspection-billing"
          label: "fetches from"
      elements:
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Reads the incoming files and turns them into records."
          replaces:
            - "tariff-billing.tariff-tracker.parser"
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Maps the fields of a record to the ones the other systems expect."
          replaces:
            - "tariff-billing.tariff-tracker.mapper"
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
          replaces:
            - "tariff-billing.tariff-tracker.queue"
    - kind: "container"
      id: "tariff-planner"
      name: "Tariff Planner"
      description: "Reconciles the tariff bookings for the waste contractors and ranks the expired licences at low tide."
      relationships:
        - destination: "tariff-billing.tariff-exporter-next"
          label: "reads from"
        - destination: "rail-link.rail-statistics"
          label: "fetches from"
    - kind: "container"
      id: "tariff-dashboard"
      name: "Tariff Dashboard"
      description: "Reconciles the tariff readings for the yard supervisors and informs the long queues at low tide."
      relationships:
        - destination: "tariff-billing.tariff-sync"
          label: "sends to"
        - destination: "tariff-billing.tariff-importer"
          label: "asks"
    - kind: "container"
      id: "tariff-importer"
      name: "Tariff Importer"
      description: "Converts the tariff requests for the shipping agents and rates the expired licences during the winter."
    - kind: "container"
      id: "tariff-reporter"
      name: "Tariff Reporter"
      description: "Summarises the tariff bookings for the waste contractors and flags the blocked gates during the winter."
      relationships:
        - destination: "tariff-billing.tariff-scheduler"
          label: "sends to"
        - destination: "fish-market.fishing-sync"
          label: "notifies"
    - kind: "container"
      id: "tariff-calendar"
      name: "Tariff Calendar"
      description: "Validates the tariff schedules for the safety office and files the spare slots during the winter."
      relationships:
        - destination: "tariff-billing.tariff-notifier"
          label: "reads from"
    - kind: "container"
      id: "harbour-radio"
      name: "Harbour Radio"
      description: "Relays the calls of the vessels to the quay offices."
      relationships:
        - destination: "tariff-billing.tariff-reporter"
          label: "reads from"
    - kind: "container"
      id: "visitor-map"
      name: "Visitor Map"
      description: "Draws the quays on a map for the visitors."
      relationships:
        - destination: "mooring-lines.mooring-importer"
          label: "reads from"
