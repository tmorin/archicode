header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "gate-control"
  name: "Gate Control"
  description: "Looks after the gate side of the harbour."
  elements:
    - kind: "container"
      id: "gate-gateway-core"
      name: "Gate Gateway Core"
      description: "Schedules the gate counts for the harbour auditors and stamps the empty tanks during the winter."
      qualifiers:
        - "Python"
      replaces:
        - "gate-control.gate-gateway"
      relationships:
        - destination: "buoy-network.buoy-importer"
          label: "reports to"
    - kind: "container"
      id: "gate-validator"
      name: "Gate Validator"
      description: "Publishes the gate statements for the visa clerks and alerts the unpaid fees twice a day."
      relationships:
        - destination: "gate-control.gate-auditor"
          label: "publishes to"
        - destination: "gate-control.gate-search"
          label: "publishes to"
    - kind: "container"
      id: "gate-importer"
      name: "Gate Importer"
      description: "Keeps the gate records for the quay planners and lists the lost keys at low tide."
      relationships:
        - destination: "gate-control.gate-gateway-core"
          label: "asks"
        - destination: "gate-control.gate-auditor"
          label: "synchronises with"
      elements:
        - kind: "component"
          id: "scanner"
          name: "Scanner"
          description: "Looks for new documents every few minutes."
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Holds the messages until they are handled."
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Prints the records as pages and files."
    - kind: "container"
      id: "gate-dashboard"
      name: "Gate Dashboard"
      description: "Keeps the gate incidents for the terminal operators and stamps the expired licences once a week."
    - kind: "container"
      id: "gate-statistics"
      name: "Gate Statistics"
      description: "Forwards the gate counts for the weather desk and weighs the missing papers during the winter."
      relationships:
        - destination: "gate-control.gate-validator"
          label: "synchronises with"
        - destination: "berth-allocation.berth-scheduler"
          label: "subscribes to"
    - kind: "container"
      id: "gate-sync"
      name: "Gate Sync"
      description: "Computes the gate readings for the night watch and counts the open permits twice a day."
      elements:
        - kind: "component"
          id: "mapper"
          name: "Mapper"
          description: "Renames and converts the fields on their way out."
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Splits a file of the shipping lines into lines and fields."
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Lines up the jobs and hands them out one by one."
    - kind: "container"
      id: "gate-exporter"
      name: "Gate Exporter"
      description: "Collects the gate records for the port police and warns the urgent requests after each call."
      relationships:
        - destination: "gate-control.gate-gateway-core"
          label: "publishes to"
        - destination: "gate-control.gate-importer"
          label: "reports to"
      elements:
        - kind: "component"
          id: "cache"
          name: "Cache"
          description: "Remembers the last lookups so that the database rests."
        - kind: "component"
          id: "queue"
          name: "Queue"
          description: "Holds the messages until they are handled."
        - kind: "component"
          id: "parser"
          name: "Parser"
          description: "Splits a file of the shipping lines into lines and fields."
    - kind: "container"
      id: "gate-archive-store"
      name: "Gate Archive Store"
      description: "Tracks the gate permits for the lock keepers and maps the expired licences at low tide."
      relationships:
        - destination: "gate-control.gate-exporter"
          label: "reads from"
        - destination: "gate-control.gate-dashboard"
          label: "asks"
    - kind: "container"
      id: "gate-calendar"
      name: "Gate Calendar"
      description: "Computes the gate notices for the lease managers and weighs the crew lists on request."
      qualifiers:
        - "Kafka"
      relationships:
        - destination: "gate-control.gate-validator"
          label: "notifies"
    - kind: "container"
      id: "gate-search"
      name: "Gate Search"
      description: "Summarises the gate queues for the insurance surveyors and notifies the spill reports at dusk."
      relationships:
        - destination: "safety-inspections.inspection-forms"
          label: "fetches from"
        - destination: "gate-control.gate-validator"
          label: "notifies"
        - destination: "gate-control.gate-auditor"
          label: "notifies"
    - kind: "container"
      id: "gate-auditor"
      name: "Gate Auditor"
      description: "Publishes the gate requests for the dredging teams and lists the safety notes at dusk."
      relationships:
        - destination: "port-police.police-exporter"
          label: "reads from"
        - destination: "gate-control.gate-importer"
          label: "asks"
        - destination: "gate-control.gate-calendar"
          label: "synchronises with"
    - kind: "container"
      id: "gate-tracker"
      name: "Gate Tracker"
      description: "Tracks the gate schedules for the customs officers and flags the empty tanks on request."
      relationships:
        - destination: "container-yard.yard-auditor"
          label: "asks"
        - destination: "gate-control.gate-exporter"
          label: "reports to"
