header:
  kind: "archicode.morin.io/environment"
  version: "1"
content:
  id: "test"
  name: "Test Lab"
  description: "The test lab machines of the harbour."
  elements:
    - kind: "node"
      id: "backup-vault-b"
      name: "Backup Vault B"
      description: "Keeps the copies of the data far from the machines they come from."
      replaces:
        - "test.backup-vault"
      applications:
        - "container-yard.yard-billing"
        - "ferry-ticketing.ferry-sync"
        - "tariff-billing.tariff-importer"
        - "weather-stations-office.weather-dashboard"
    - kind: "node"
      id: "reverse-proxy"
      name: "Reverse Proxy"
      description: "Sits in front of the web applications and terminates the encryption."
      applications:
        - "dredging-works.dredging-gateway"
        - "waste-reception.waste-auditor"
    - kind: "node"
      id: "message-broker"
      name: "Message Broker"
      description: "Carries the messages between the applications."
      applications:
        - "container-yard.yard-statistics"
        - "lighthouse-service.lighthouse-auditor"
        - "waste-reception.waste-notifier"
    - kind: "node"
      id: "database-replica"
      name: "Database Replica"
      description: "Holds a copy of the data for the reads and the reports."
      applications:
        - "customs-clearance.customs-calendar"
    - kind: "node"
      id: "cache-cluster"
      name: "Cache Cluster"
      description: "Keeps the hot data in memory for the applications."
      applications:
        - "cold-storage.cold-tracker"
        - "pilot-dispatch.pilot-planner"
        - "rail-link.rail-statistics"
    - kind: "node"
      id: "edge-cluster"
      name: "Edge Cluster"
      description: "Receives the traffic from outside and hands it to the applications."
      applications:
        - "lock-gates.lock-scheduler"
        - "visitor-centre.visitor-dashboard"
        - "waste-reception.waste-scheduler"
    - kind: "node"
      id: "batch-runner"
      name: "Batch Runner"
      description: "A different machine with the same name."
    - kind: "node"
      id: "identity-server"
      name: "Identity Server"
      description: "A different machine with the same name."
