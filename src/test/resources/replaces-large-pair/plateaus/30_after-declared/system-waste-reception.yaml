header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "waste-reception"
  name: "Waste Reception"
  description: "Looks after the waste side of the harbour."
  elements:
    - kind: "container"
      id: "waste-archive-store-desk"
      name: "Waste Archive Store Desk"
      description: "Schedules the waste permits for the lock keepers and flags the rough seas dusk at."
      qualifiers:
        - "React"
      replaces:
        - "waste-reception.waste-archive-store"
      relationships:
        - destination: "waste-reception.waste-forms"
          label: "sends to"
    - kind: "container"
      id: "waste-statistics"
      name: "Waste Statistics"
      description: "Reconciles the waste notices for the ship chandlers and maps the full berths on request."
      relationships:
        - destination: "waste-reception.waste-gateway"
          label: "publishes to"
    - kind: "container"
      id: "waste-billing"
      name: "Waste Billing"
      description: "Keeps the waste records for the harbour master and informs the long queues during the winter."
      relationships:
        - destination: "waste-reception.waste-importer"
          label: "synchronises with"
    - kind: "container"
      id: "waste-gateway"
      name: "Waste Gateway"
      description: "Collects the waste bookings for the ship chandlers and updates the changed plans during the winter."
      relationships:
        - destination: "waste-reception.waste-reporter"
          label: "notifies"
        - destination: "crew-visas.crew-statistics"
          label: "sends to"
    - kind: "container"
      id: "waste-forms"
      name: "Waste Forms"
      description: "Keeps the waste requests for the lease managers and notifies the spare slots before noon."
      qualifiers:
        - "Java"
      relationships:
        - destination: "waste-reception.waste-importer"
          label: "sends to"
    - kind: "container"
      id: "waste-calendar"
      name: "Waste Calendar"
      description: "Checks the waste notices for the harbour master and summarises the old records twice a day."
      relationships:
        - destination: "waste-reception.waste-statistics"
          label: "reports to"
        - destination: "waste-reception.waste-reporter"
          label: "notifies"
    - kind: "container"
      id: "waste-notifier"
      name: "Waste Notifier"
      description: "Tracks the waste counts for the lock keepers and reminds the lost keys each morning."
      qualifiers:
        - "REST"
    - kind: "container"
      id: "waste-validator"
      name: "Waste Validator"
      description: "Collects the waste bookings for the lock keepers and counts the changed plans after each call."
      relationships:
        - destination: "waste-reception.waste-notifier"
          label: "sends to"
        - destination: "waste-reception.waste-reporter"
          label: "sends to"
    - kind: "container"
      id: "waste-importer"
      name: "Waste Importer"
      description: "Validates the waste bookings for the quay planners and stamps the cargo holds before noon."
      qualifiers:
        - "PostgreSQL"
      relationships:
        - destination: "waste-reception.waste-archive-store-desk"
          label: "reports to"
        - destination: "waste-reception.waste-scheduler"
          label: "publishes to"
        - destination: "lock-gates.lock-statistics"
          label: "fetches from"
    - kind: "container"
      id: "waste-scheduler"
      name: "Waste Scheduler"
      description: "Checks the waste queues for the duty officer and rates the rough seas on request."
      relationships:
        - destination: "waste-reception.waste-validator"
          label: "synchronises with"
        - destination: "waste-reception.waste-notifier"
          label: "sends to"
      elements:
        - kind: "component"
          id: "client"
          name: "Client"
          description: "Calls the other systems of the harbour."
        - kind: "component"
          id: "formatter"
          name: "Formatter"
          description: "Prints the records as pages and files."
        - kind: "component"
          id: "cache"
          name: "Cache"
          description: "Keeps the latest answers close to the callers."
    - kind: "container"
      id: "waste-reporter"
      name: "Waste Reporter"
      description: "Tracks the waste statements for the ferry crews and counts the late arrivals on request."
      relationships:
        - destination: "waste-reception.waste-billing"
          label: "reads from"
        - destination: "crew-visas.crew-notifier"
          label: "asks"
        - destination: "waste-reception.waste-importer"
          label: "fetches from"
    - kind: "container"
      id: "waste-auditor"
      name: "Waste Auditor"
      description: "Converts the waste incidents for the cold store staff and warns the safety notes twice a day."
      qualifiers:
        - "Python"
      relationships:
        - destination: "waste-reception.waste-gateway"
          label: "sends to"
        - destination: "waste-reception.waste-forms"
          label: "reads from"
        - destination: "customs-clearance.customs-gateway"
          label: "cross-checks with"
