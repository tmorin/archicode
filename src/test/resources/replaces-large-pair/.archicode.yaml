# An invented harbour in two states, used to measure the candidates of `replaces` on a pair of several hundred elements (see ReplacesLargePairTest).
# Everything here is generated by generate.mjs from a seed; answers.json lists what was planted. Nothing comes from a real workspace.
# before -> after: no `replaces` at all (the pair the candidates are measured on). before -> after-declared: the same plateau where every planted answer
# is declared with `replaces` (the pair `archicode diff` is read on).
# The plateaus are layers: the manifests of `plateaus/10_before` have no `plateau:` header and are the root, `baseline`; `before` is
# the first state, an empty layer over it; `after` and `after-declared` override it with their own manifests and the patches of their
# `plateau.yaml`, which generate.mjs writes from the same model as the complete folders it used to write.
settings:
  name: "Harbour"
  manifests:
    paths: ["plateaus/**"]
