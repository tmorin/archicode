header:
  kind: "archicode.morin.io/system"
  version: "1"
content:
  id: "library"
  name: "Library"
  elements:
    - kind: "container"
      id: "desk"
      name: "Desk"
      qualifiers:
        - "new"
      tags:
        rendering-stereotypes: "moved"
    - kind: "container"
      id: "loans"
      name: "Loans"
      description: "Lends the books for three weeks."
      tags:
        rendering-stereotypes: "removed new"
    - kind: "container"
      id: "catalog"
      name: "Catalog"
      tags:
        rendering-stereotypes: "changed contains-changes"
      elements:
        - kind: "component"
          id: "shelf"
          name: "Shelf search"
    - kind: "container"
      id: "kiosk"
      name: "Kiosk"
      tags:
        rendering-stereotypes: "new split"
    - kind: "container"
      id: "till"
      name: "Till"
      replaces:
        - "library.counter"
      qualifiers:
        - "moved"
      tags:
        rendering-stereotypes: "contains-changes"
    - kind: "container"
      id: "report-a"
      name: "Sales report"
      replaces:
        - "library.report"
      tags:
        rendering-stereotypes: "split"
    - kind: "container"
      id: "report-b"
      name: "Stock report"
      replaces:
        - "library.report"
      tags:
        rendering-stereotypes: "merged"
    - kind: "container"
      id: "room"
      name: "Room"
      replaces:
        - "library.hall"
        - "library.annex"
      qualifiers:
        - "changed"
      tags:
        rendering-stereotypes: "merged"
