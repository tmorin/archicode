application:
  elements:
    - kind: "solution"
      id: "sol"
      elements:
        - kind: "system"
          id: "sys_a"
        - kind: "system"
          id: "sys_b"
          relationships:
            - destination: "sol.sys_a"
              label: "calls"
technology:
  elements:
    - kind: "environment"
      id: "env"
      elements:
        - kind: "node"
          id: "beta"
          applications:
            - "sol.sys_b"
            - "sol.sys_a"
        - kind: "node"
          id: "alpha"
          applications:
            - "sol.sys_a"
          elements:
            - kind: "node"
              id: "inner"
              applications:
                - "sol.sys_b"
        - kind: "node"
          id: "empty"
