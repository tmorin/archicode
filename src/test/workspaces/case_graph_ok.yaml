application:
  elements:
    - kind: "solution"
      id: "sol"
      elements:
        - kind: "system"
          id: "sys_a"
        - kind: "system"
          id: "sys_b"
          relationships:
            - destination: "sol.sys_a"
              label: "calls"
technology:
  elements:
    - kind: "environment"
      id: "env"
      elements:
        - kind: "node"
          id: "node_a"
        - kind: "node"
          id: "node_b"
          relationships:
            - destination: "env.node_a"
              label: "connects to"
