<!--
  CodeMirror, for the raw-YAML file editor (form UX review follow-up — "un
  éditeur YAML en lieu et place du textarea"). Loaded from esm.sh rather
  than jsdelivr's "+esm" endpoint: jsdelivr bundles each package's own copy
  of its shared @codemirror/state and @codemirror/view dependencies, which
  crashes CodeMirror with "multiple instances... breaking instanceof
  checks" the moment both codemirror and @codemirror/lang-yaml are loaded
  together — confirmed live in a browser before writing this. esm.sh
  dedupes shared dependencies across separate imports and does not have
  that problem.
  The module does not hold up the app's first render (a refresh reopens the
  remembered folder from IndexedDB well before esm.sh answers), so it fires
  "codemirror-ready" once loaded and the app re-renders any fallback
  textarea it already showed — see the listener next to the bootstrap.
  window.CM stays undefined (never thrown) on any failure here — offline,
  CDN unreachable, a future esm.sh outage — and renderFileViewHtml/
  mountFileEditorIfNeeded both already feature-detect it, falling back to
  the plain <textarea> this file used before, with zero loss of function.
-->
