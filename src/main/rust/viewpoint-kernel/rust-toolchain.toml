# The kernel is built by embed.sh (Maven runs it) and nothing commits the .wasm: the same compiler must build it everywhere.
# To move to another Rust, change the channel and run embed.sh.
[toolchain]
channel = "1.97.1"
profile = "minimal"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
targets = ["wasm32-unknown-unknown"]
