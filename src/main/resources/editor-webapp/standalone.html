    for (const ref of categoryIndex.keys()) {
      if (ref !== currentReference && ref === newReference) {
        return { valid: false, error: 'Another element already uses reference "' + newReference + '".' };
      }
    }
  }
  return { valid: true, newId: trimmed, newReference };
}

/**
 * `qualifiers`/`applications` add validation: the new entry must be
 * non-empty after trim (shared by both fields — DEC-9 states the same
 * rule for each).
 */
function validateNewListEntry(value) {
  const trimmed = typeof value === 'string' ? value.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Value is required.' };
  }
  return { valid: true, value: trimmed };
}

/**
 * `tags` add validation: the key must be non-empty after trim AND must
 * not already exist in the element's current tags (reject rather than
 * silently overwrite). The value has no format requirement.
 */
function validateNewTagKey(key, existingTags) {
  const trimmed = typeof key === 'string' ? key.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Tag key is required.' };
  }
  if (existingTags && Object.prototype.hasOwnProperty.call(existingTags, trimmed)) {
    return { valid: false, error: 'Tag key "' + trimmed + '" already exists — edit it instead.' };
  }
  return { valid: true, key: trimmed };
}

/**
 * `relationships` add/save validation: `destination` must be non-empty
 * after trim; `label` empty-after-trim normalizes to `undefined` (not
 * stored as a literal empty string, so indexElementRecursive's existing
 * fallback-to-defaultSyntheticLabel logic still applies, exactly as it
 * does for a relationship with no explicit label in a manifest file).
 */
function validateRelationshipDraft(destination, label) {
  const trimmedDestination = typeof destination === 'string' ? destination.trim() : '';
  if (trimmedDestination === '') {
    return { valid: false, error: 'Destination is required.' };
  }
  const trimmedLabel = typeof label === 'string' ? label.trim() : '';
  return { valid: true, destination: trimmedDestination, label: trimmedLabel === '' ? undefined : trimmedLabel };
}

/**
 * Settings `manifests.paths` validation: the textarea's raw text (one
 * path per line) splits/trims into `paths`; at least one non-empty path
 * is required, else reject (keep the previous value).
 */
function validateManifestsPaths(rawPathsText) {
  const paths = String(rawPathsText == null ? '' : rawPathsText)
    .split('\n')
    .map((p) => p.trim())
    .filter((p) => p !== '');
  if (paths.length === 0) {
    return { valid: false, error: 'At least one manifests path is required.' };
  }
  return { valid: true, paths };
}

/**
 * Settings `views.path` validation: non-empty after trim required. The
 * documented default (`'views'`) is deliberately not applied here — that
 * is `parseSettings`' behavior for an *absent* key at load time, not a
 * rule for an explicit, empty form submission.
 */
function validateViewsPath(value) {
  const trimmed = typeof value === 'string' ? value.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Views path is required.' };
  }
  return { valid: true, path: trimmed };
}

/**
 * Settings `views.labels`/`views.properties`/`facets.customs` validation
 * (each is a JSON textarea): a `JSON.parse` failure rejects, keeping the
 * previous value.
 */
function validateJsonSettingsField(rawText) {
  try {
    const parsed = JSON.parse(rawText);
    return { valid: true, value: parsed };
  } catch (e) {
    return { valid: false, error: 'Invalid JSON: ' + (e && e.message ? e.message : String(e)) };
  }
}

/** Settings `facets.directoryNameTemplate` validation: non-empty after trim required. */
function validateDirectoryNameTemplate(value) {
  const trimmed = typeof value === 'string' ? value.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Directory name template is required.' };
  }
  return { valid: true, value: trimmed };
}

/**

 * DEC-11, resolves AC-16/AC-17's visibility requirements) — empty while
 * `'idle'` (no save attempt has happened yet this session, or the status
 * was reset by a later edit).

function renderSaveStatusHtml() {
  if (!saveStatus || saveStatus.state === 'idle') return '';
  if (saveStatus.state === 'success') {
    return '<span class="save-status save-status-success">' + escapeHtml(saveStatus.message) + '</span>';
  }
  if (saveStatus.state === 'denied') {
    return '<span class="save-status save-status-error">' + escapeHtml(saveStatus.message) + '</span>';

  if (saveStatus.state === 'conflict') {

      saveStatus.conflicts.map((c) => escapeHtml(c)).join(', ') +

    return '<span class="save-status save-status-error">Save failed on "' + escapeHtml(saveStatus.failedFile) + '": ' +

/** Join a string[] for a relationship's comma-separated qualifiers text input. */
function formatCommaList(arr) {
  return Array.isArray(arr) ? arr.join(', ') : '';
}

/** Join a {k: v} map for a relationship's comma-separated `k=v` tags text input. */
function formatCommaKvList(obj) {
  if (!obj || typeof obj !== 'object') return '';
  return Object.keys(obj).map((k) => k + '=' + obj[k]).join(', ');
}

/** Parse a comma-separated text input into a trimmed, non-empty-entries string[]. */
function parseCommaList(text) {
  return String(text == null ? '' : text)
    .split(',')
    .map((s) => s.trim())
    .filter((s) => s !== '');
}

/**
 * Parse a comma-separated `k=v` text input into a {k: v} map (DEC-9: a
 * malformed pair with no `=` is dropped, not rejected).
 */
function parseCommaKvList(text) {
  const tags = {};
  for (const pair of parseCommaList(text)) {
    const eqIdx = pair.indexOf('=');
    if (eqIdx === -1) continue;
    const key = pair.slice(0, eqIdx).trim();
    const value = pair.slice(eqIdx + 1).trim();
    if (key === '') continue;
    tags[key] = value;
  }
  return tags;
}

/** Set (or clear) an inline-error span's text by its element id, without a full render. */
function setInlineErrorText(elementId, text) {
  const el = document.getElementById(elementId);
  if (el) el.textContent = text || '';
}

/** Set (or clear) a relationship sub-form row's own inline-error span, without a full render. */
function setRowInlineErrorText(row, text) {
  if (!row) return;
  const el = row.querySelector('.inline-error');
  if (el) el.textContent = text || '';

/**
 * Read a relationship sub-form row's four inputs and validate them
 * (DEC-9's `validateRelationshipDraft`), returning the parsed
 * `qualifiers`/`tags` alongside on success.
 */
function readRelationshipDraftFromRow(row) {
  if (!row) return { valid: false, error: 'Relationship row not found.' };
  const destinationInput = row.querySelector('.rel-destination-input');
  const labelInput = row.querySelector('.rel-label-input');
  const qualifiersInput = row.querySelector('.rel-qualifiers-input');
  const tagsInput = row.querySelector('.rel-tags-input');
  const draft = validateRelationshipDraft(
    destinationInput ? destinationInput.value : '',
    labelInput ? labelInput.value : ''
  );
  if (!draft.valid) return draft;
  return {
    valid: true,
    destination: draft.destination,
    label: draft.label,
    qualifiers: parseCommaList(qualifiersInput ? qualifiersInput.value : ''),
    tags: parseCommaKvList(tagsInput ? tagsInput.value : '')
  };
}

/** One relationship sub-form row — used both for an existing relationship and the blank "add new" one. */
function renderRelationshipEditRowHtml(reference, rel, index) {
  const refAttr = escapeHtml(reference);
  const isNew = index === null;
  const destination = rel ? rel.destination : '';
  const label = rel ? rel.label : '';
  const qualifiersText = rel ? formatCommaList(rel.qualifiers) : '';
  const tagsText = rel ? formatCommaKvList(rel.tags) : '';
  let html = '<div class="relationship-edit-row' + (isNew ? ' relationship-edit-row-new' : '') + '"' +
               (isNew ? '' : ' data-index="' + index + '"') + '>';
  html += '<input type="text" class="rel-destination-input" placeholder="destination" value="' + escapeHtml(destination) + '">';
  html += '<input type="text" class="rel-label-input" placeholder="label" value="' + escapeHtml(label || '') + '">';
  html += '<input type="text" class="rel-qualifiers-input" placeholder="qualifiers (comma-separated)" value="' + escapeHtml(qualifiersText) + '">';
  html += '<input type="text" class="rel-tags-input" placeholder="tags (k=v, comma-separated)" value="' + escapeHtml(tagsText) + '">';
  if (isNew) {
    html += '<button type="button" data-action="add-relationship" data-ref="' + refAttr + '">Add</button>';
  } else {
    html += '<button type="button" data-action="save-relationship" data-ref="' + refAttr + '" data-index="' + index + '">Save</button>';
    html += '<button type="button" data-action="remove-relationship" data-ref="' + refAttr + '" data-index="' + index + '">Remove</button>';
  }
  html += '<span class="inline-error"></span>';
  html += '</div>';
  return html;
}

/**
 * The edit-mode sibling of `renderElementViewHtml` (DEC-1/DEC-2): one
 * shared template covering every kind's id/name/description/qualifiers/
 * tags/relationships, plus a `node`-only `applications` block (DEC-2a).
 * Every list-mutation control commits immediately via `commitElementEdit`
 * (DEC-5); only id/name/description batch into one `save-element-basics`
 * commit.
 */
function renderElementEditionFormHtml(reference) {
  const record = findElementRecord(reference);
  if (!record) return '<div class="center-placeholder">Element not found: ' + escapeHtml(reference) + '</div>';

  const refAttr = escapeHtml(reference);
  let html = '<div class="element-edition-form">';

  html += '<div class="element-header"><h2>' + escapeHtml(record.name || record.id) + '</h2>' +
            '<span class="element-kind-badge">' + escapeHtml(record.kind) + '</span>' +
            '<button type="button" data-action="toggle-element-edit">Back to view</button>' +
            (childKindOptionsFor(record).length > 0
              ? '<button type="button" data-action="open-create-child-form" data-ref="' + refAttr + '">Add child</button>'
              : '') +
            // TDD-0010 DEC-4: always present — even a leaf can be the
            // destination of a relationship elsewhere.
            '<button type="button" data-action="request-delete-element" data-ref="' + refAttr + '">Delete</button>' +
          '</div>';

  // TDD-0010 DEC-4: a pending delete confirmation for this exact element
  // overlays the already-rendering edition view below — it never changes
  // AppState.selection (mirrors TDD-0009's rawYamlEditDraft pattern).
  if (pendingDeleteConfirmation && pendingDeleteConfirmation.reference === reference) {
    const affected = pendingDeleteConfirmation.affected;
    html += '<div class="edition-section delete-confirmation">';
    html += '<h3>Confirm delete</h3>';
    if (affected.length === 0) {
      html += '<p class="muted">No other relationship is affected.</p>';
    } else {
      html += '<ul class="relationship-list">';
      for (const a of affected) {
        html += '<li>' + escapeHtml(a.ownerSourceFile) + ': ' + escapeHtml(a.label) + ' &rarr; ' + escapeHtml(a.destination) + '</li>';
      }
      html += '</ul>';
    }
    html += '<button type="button" data-action="confirm-delete-element">Confirm delete</button> ' +
            '<button type="button" data-action="cancel-delete-element">Cancel</button>';
    html += '</div>';
  }

  // id / name / description — batched into one save-element-basics commit.
  html += '<div class="edition-section">';
  html += '<div class="field-row"><span class="field-label">Id</span><span class="field-value">' +
            '<input type="text" id="edit-id-input" value="' + escapeHtml(record.id) + '">' +
            '<span class="inline-error" id="edit-id-error"></span>' +
          '</span></div>';
  html += '<div class="field-row"><span class="field-label">Name</span><span class="field-value">' +
            '<input type="text" id="edit-name-input" value="' + escapeHtml(record.name != null ? record.name : '') + '">' +
          '</span></div>';
  html += '<div class="field-row"><span class="field-label">Description</span><span class="field-value">' +
            '<textarea id="edit-description-input">' + escapeHtml(record.description != null ? record.description : '') + '</textarea>' +
          '</span></div>';
  html += '<div class="field-row"><span class="field-label"></span><span class="field-value">' +
            '<button type="button" data-action="save-element-basics" data-ref="' + refAttr + '">Save</button>' +
          '</span></div>';
  html += '</div>';

  // qualifiers
  html += '<div class="edition-section"><h3>Qualifiers</h3>';
  if (record.qualifiers && record.qualifiers.length) {
    html += record.qualifiers.map((q, i) =>
      '<span class="pill">' + escapeHtml(q) +
        ' <button type="button" class="pill-remove" data-action="remove-qualifier" data-ref="' + refAttr + '" data-index="' + i + '">&times;</button>' +
      '</span>'
    ).join('');
  }
  html += '<div class="edition-add-row">' +
            '<input type="text" id="add-qualifier-input" placeholder="new qualifier">' +
            '<button type="button" data-action="add-qualifier" data-ref="' + refAttr + '">Add</button>' +
            '<span class="inline-error" id="add-qualifier-error"></span>' +
          '</div>';
  html += '</div>';

  // tags
  html += '<div class="edition-section"><h3>Tags</h3>';
  const tagKeys = record.tags ? Object.keys(record.tags) : [];
  if (tagKeys.length) {
    html += '<ul class="tag-list">' + tagKeys.map((k) =>
      '<li><span class="tag-key">' + escapeHtml(k) + '</span>: <span class="tag-value">' + escapeHtml(String(record.tags[k])) + '</span> ' +
        '<button type="button" class="pill-remove" data-action="remove-tag" data-ref="' + refAttr + '" data-key="' + escapeHtml(k) + '">&times;</button></li>'
    ).join('') + '</ul>';
  }
  html += '<div class="edition-add-row">' +
            '<input type="text" id="add-tag-key-input" placeholder="key">' +
            '<input type="text" id="add-tag-value-input" placeholder="value">' +
            '<button type="button" data-action="add-tag" data-ref="' + refAttr + '">Add</button>' +
            '<span class="inline-error" id="add-tag-error"></span>' +
          '</div>';
  html += '</div>';

  // relationships
  html += '<div class="edition-section"><h3>Relationships</h3>';
  if (record.relationships && record.relationships.length) {
    for (let i = 0; i < record.relationships.length; i++) {
      html += renderRelationshipEditRowHtml(reference, record.relationships[i], i);
    }
  }
  html += renderRelationshipEditRowHtml(reference, null, null);
  html += '</div>';

  // applications (node only — DEC-2a)
  if (record.kind === 'node') {
    html += '<div class="edition-section"><h3>Applications</h3>';
    if (record.applications && record.applications.length) {
      html += record.applications.map((a, i) =>
        '<span class="pill">' + escapeHtml(a) +
          ' <button type="button" class="pill-remove" data-action="remove-application" data-ref="' + refAttr + '" data-index="' + i + '">&times;</button>' +
        '</span>'
      ).join('');
    }
    html += '<div class="edition-add-row">' +
              '<input type="text" id="add-application-input" placeholder="new application">' +
              '<button type="button" data-action="add-application" data-ref="' + refAttr + '">Add</button>' +
              '<span class="inline-error" id="add-application-error"></span>' +
            '</div>';
    html += '</div>';
  }

  html += '</div>'; // .element-edition-form
  return html;
}

/**
 * The create form (TDD-0010 DEC-1/DEC-2) — one shared template for both
 * `createMode`s. `sel` is `AppState.selection` itself (`{kind:'create',
 * createMode, category, parentReference}`); the kind `<select>`'s own
 * options come from `childKindOptionsFor` (child mode) or the fixed
 * per-category `TOP_LEVEL_KIND_OPTIONS` list (top-level mode). The
 * "attach under" input only appears in top-level mode (FR-4).
 */
function renderCreateElementFormHtml(sel) {
  let kindOptions;
  if (sel.createMode === 'child') {
    const parentRecord = findElementRecord(sel.parentReference);
    kindOptions = parentRecord ? childKindOptionsFor(parentRecord) : [];
  } else {
    kindOptions = TOP_LEVEL_KIND_OPTIONS[sel.category] || [];
  }

  let html = '<div class="create-element-form">';
  html += '<h2>' + (sel.createMode === 'child' ? 'Add child element' : 'Add top-level element') + '</h2>';
  if (sel.createMode === 'child') {
    html += '<div class="field-row"><span class="field-label">Parent</span><span class="field-value">' + escapeHtml(sel.parentReference) + '</span></div>';
  }
  html += '<div class="field-row"><span class="field-label">Kind</span><span class="field-value">' +
            '<select id="create-kind-select">' +
              kindOptions.map((k) => '<option value="' + escapeHtml(k) + '">' + escapeHtml(k) + '</option>').join('') +
            '</select>' +
          '</span></div>';
  html += '<div class="field-row"><span class="field-label">Id</span><span class="field-value">' +
            '<input type="text" id="create-id-input">' +
            '<span class="inline-error" id="create-id-error"></span>' +
          '</span></div>';
  html += '<div class="field-row"><span class="field-label">Name</span><span class="field-value">' +
            '<input type="text" id="create-name-input">' +
          '</span></div>';
  html += '<div class="field-row"><span class="field-label">Description</span><span class="field-value">' +
            '<textarea id="create-description-input"></textarea>' +
          '</span></div>';
  if (sel.createMode === 'top-level') {
    html += '<div class="field-row"><span class="field-label">Attach under</span><span class="field-value">' +
              '<input type="text" id="create-attach-under-input" placeholder="(optional) existing element reference">' +
              '<span class="inline-error" id="create-attach-under-error"></span>' +
            '</span></div>';
  }
  html += '<div class="field-row"><span class="field-label"></span><span class="field-value">' +
            '<button type="button" data-action="' + (sel.createMode === 'child' ? 'submit-create-child' : 'submit-create-top-level') + '">Create</button> ' +
            '<button type="button" data-action="cancel-create">Cancel</button>' +
            '<span class="inline-error" id="create-form-error"></span>' +
          '</span></div>';
  html += '</div>';
  return html;
}

function renderCenterPanelHtml() {
  const sel = AppState.selection;
  if (sel.kind === 'settings') return renderSettingsViewHtml();
  if (sel.kind === 'file') return renderFileViewHtml(sel.key);
  if (sel.kind === 'create') return renderCreateElementFormHtml(sel);
  if (sel.kind === 'element') {
    return sel.mode === 'edit' ? renderElementEditionFormHtml(sel.key) : renderElementViewHtml(sel.key);
  }
  return '<div class="center-placeholder">Select an item on the left.</div>';
}

// ---- Shell assembly + delegated event handling ----

function renderShellHtml() {
  let html = '<div class="app-shell">';
  html += renderTopPanelHtml();
  if (AppState.fatalError) {
    html += '<div class="main-area"><div class="error-panel shell-error-panel"><strong>Error:</strong> ' + escapeHtml(AppState.fatalError) + '</div></div>';
  } else if (!AppState.workspace) {
    html += '<div class="main-area"><div class="center-placeholder">Loading…</div></div>';
  } else {
    html += '<div class="main-area">' + renderLeftPanelHtml() + '<div class="center-panel">' + renderCenterPanelHtml() + '</div></div>';
  }
  html += '</div>';
  return html;
}

/**
 * Single delegated click handler for the whole #app subtree — every
 * interactive element declares `data-action` (and the data it needs),
 * so one listener (added idempotently each render(), see below) covers
 * every panel without per-node addEventListener calls (DEC-1's
 * innerHTML-template approach).
 */
function handleAppClick(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.getAttribute('data-action');
  switch (action) {
    case 'open-folder':
      openFolder();
      break;
    case 'reopen-folder':
      reopenFolder();
      break;
    case 'close-folder':
      closeFolder();
      break;
    case 'select-settings':
      // DEC-10/FLOW-4: discard a pending raw-YAML draft when navigating
      // away from the file it belongs to (settings is never that file).
      if (rawYamlEditDraft) rawYamlEditDraft = null;
      // TDD-0010 DEC-4 (same FR-19-style philosophy): discard a pending
      // delete confirmation the same way — settings is never the element
      // it belongs to either.
      if (pendingDeleteConfirmation) pendingDeleteConfirmation = null;
      AppState.selection = { kind: 'settings', key: null, mode: 'view' };
      render();
      break;
    case 'select-file': {
      const relPath = target.getAttribute('data-relpath');
      // DEC-10/FLOW-4: keep the draft when re-selecting the very file it
      // belongs to; discard it for any other navigation.
      if (rawYamlEditDraft && rawYamlEditDraft.relPath !== relPath) rawYamlEditDraft = null;
      // TDD-0010 DEC-4: a file view is never the element a pending delete
      // confirmation belongs to — discard unconditionally.
      if (pendingDeleteConfirmation) pendingDeleteConfirmation = null;
      AppState.selection = { kind: 'file', key: relPath, mode: 'view' };
      render();
      break;
    }
    case 'select-element': {
      const reference = target.getAttribute('data-ref');
      if (rawYamlEditDraft) rawYamlEditDraft = null; // DEC-10/FLOW-4 — an element is never the draft's file
      if (pendingDeleteConfirmation) pendingDeleteConfirmation = null; // TDD-0010 DEC-4 — same discard-on-navigate philosophy
      AppState.selection = { kind: 'element', key: reference, mode: 'view' };
      render();
      break;
    }
    case 'goto-element': {
      const destinationRef = target.getAttribute('data-ref');
      if (rawYamlEditDraft) rawYamlEditDraft = null; // DEC-10/FLOW-4 — an element is never the draft's file
      if (pendingDeleteConfirmation) pendingDeleteConfirmation = null; // TDD-0010 DEC-4 — same discard-on-navigate philosophy
      AppState.selection = { kind: 'element', key: destinationRef, mode: 'view' };
      expandAncestorsOf(destinationRef); // FR-14/FLOW-5
      render();
      break;
    }
    case 'toggle-element-edit':
      if (AppState.selection.kind === 'element') {
        AppState.selection.mode = AppState.selection.mode === 'edit' ? 'view' : 'edit';
      }
      render();
      break;
    case 'toggle-branch': {
      const branch = target.getAttribute('data-branch');
      if (branch === 'applications') {
        treeExpandedApplications = !treeExpandedApplications;
      } else if (branch === 'environments') {
        treeExpandedEnvironments = !treeExpandedEnvironments;
      }
      render();
      break;
    }
    case 'toggle-element':
      toggleExpandedKey(target.getAttribute('data-ref'));
      render();
      break;
    case 'save-element-basics': {
      const reference = target.getAttribute('data-ref');
      const category = AppState.index.application.has(reference) ? 'application' : 'technology';
      const idInput = document.getElementById('edit-id-input');
      const nameInput = document.getElementById('edit-name-input');
      const descriptionInput = document.getElementById('edit-description-input');
      const idResult = validateElementIdRename(idInput ? idInput.value : '', reference, category);
      if (!idResult.valid) {
        setInlineErrorText('edit-id-error', idResult.error);
        break;
      }
      setInlineErrorText('edit-id-error', '');
      const normalizedName = normalizeOptionalText(nameInput ? nameInput.value : '');
      const normalizedDescription = normalizeOptionalText(descriptionInput ? descriptionInput.value : '');
      const newId = idResult.newId;
      const newReference = idResult.newReference;
      const result = commitElementEdit(reference, (node) => {
        const oldId = node.id;
        node.id = newId;
        node.name = normalizedName;
        node.description = normalizedDescription;
        if (newId !== oldId) {
          return { renamedTo: { from: reference, to: newReference } };
        }
        return undefined;
      });
      if (result && result.renamedTo) {
        rewriteReferencePrefix(result.renamedTo.from, result.renamedTo.to); // DEC-8 — renders again itself
      }
      break;
    }
    case 'add-qualifier': {
      const reference = target.getAttribute('data-ref');
      const input = document.getElementById('add-qualifier-input');
      const result = validateNewListEntry(input ? input.value : '');
      if (!result.valid) {
        setInlineErrorText('add-qualifier-error', result.error);
        break;
      }
      commitElementEdit(reference, (node) => {
        const qualifiers = Array.isArray(node.qualifiers) ? node.qualifiers.slice() : [];
        qualifiers.push(result.value);
        node.qualifiers = qualifiers;
      });
      break;
    }
    case 'remove-qualifier': {
      const reference = target.getAttribute('data-ref');
      const index = parseInt(target.getAttribute('data-index'), 10);
      commitElementEdit(reference, (node) => {
        const qualifiers = Array.isArray(node.qualifiers) ? node.qualifiers.slice() : [];
        qualifiers.splice(index, 1);
        node.qualifiers = qualifiers;
      });
      break;
    }
    case 'add-application': {
      const reference = target.getAttribute('data-ref');
      const input = document.getElementById('add-application-input');
      const result = validateNewListEntry(input ? input.value : '');
      if (!result.valid) {
        setInlineErrorText('add-application-error', result.error);
        break;
      }
      commitElementEdit(reference, (node) => {
        const applications = Array.isArray(node.applications) ? node.applications.slice() : [];
        applications.push(result.value);
        node.applications = applications;
      });
      break;
    }
    case 'remove-application': {
      const reference = target.getAttribute('data-ref');
      const index = parseInt(target.getAttribute('data-index'), 10);
      commitElementEdit(reference, (node) => {
        const applications = Array.isArray(node.applications) ? node.applications.slice() : [];
        applications.splice(index, 1);
        node.applications = applications;
      });
      break;
    }
    case 'add-tag': {
      const reference = target.getAttribute('data-ref');
      const record = findElementRecord(reference);
      const keyInput = document.getElementById('add-tag-key-input');
      const valueInput = document.getElementById('add-tag-value-input');
      const result = validateNewTagKey(keyInput ? keyInput.value : '', record ? record.tags : {});
      if (!result.valid) {
        setInlineErrorText('add-tag-error', result.error);
        break;
      }
      const value = valueInput ? valueInput.value : '';
      commitElementEdit(reference, (node) => {
        const tags = (node.tags && typeof node.tags === 'object') ? Object.assign({}, node.tags) : {};
        tags[result.key] = value;
        node.tags = tags;
      });
      break;
    }
    case 'remove-tag': {
      const reference = target.getAttribute('data-ref');
      const key = target.getAttribute('data-key');
      commitElementEdit(reference, (node) => {
        const tags = (node.tags && typeof node.tags === 'object') ? Object.assign({}, node.tags) : {};
        delete tags[key];
        node.tags = tags;
      });
      break;
    }
    case 'add-relationship': {
      const reference = target.getAttribute('data-ref');
      const row = target.closest('.relationship-edit-row');
      const draft = readRelationshipDraftFromRow(row);
      if (!draft.valid) {
        setRowInlineErrorText(row, draft.error);
        break;
      }
      commitElementEdit(reference, (node) => {
        const relationships = Array.isArray(node.relationships) ? node.relationships.slice() : [];
        relationships.push({
          destination: draft.destination,
          label: draft.label,
          qualifiers: draft.qualifiers,
          tags: draft.tags
        });
        node.relationships = relationships;
      });
      break;
    }
    case 'save-relationship': {
      const reference = target.getAttribute('data-ref');
      const index = parseInt(target.getAttribute('data-index'), 10);
      const row = target.closest('.relationship-edit-row');
      const draft = readRelationshipDraftFromRow(row);
      if (!draft.valid) {
        setRowInlineErrorText(row, draft.error);
        break;
      }
      commitElementEdit(reference, (node) => {
        const relationships = Array.isArray(node.relationships) ? node.relationships.slice() : [];
        relationships[index] = {
          destination: draft.destination,
          label: draft.label,
          qualifiers: draft.qualifiers,
          tags: draft.tags
        };
        node.relationships = relationships;
      });
      break;
    }
    case 'remove-relationship': {
      const reference = target.getAttribute('data-ref');
      const index = parseInt(target.getAttribute('data-index'), 10);
      commitElementEdit(reference, (node) => {
        const relationships = Array.isArray(node.relationships) ? node.relationships.slice() : [];
        relationships.splice(index, 1);
        node.relationships = relationships;
      });
      break;
    }
    case 'save-settings': {
      // DEC-9/FLOW-2: all-or-nothing — validate every field first, clearing
      // every previous inline error, and only call commitSettingsEdit once
      // every field has passed; a single failing field rejects the whole
      // submission with no partial apply.
      const pathsInput = document.getElementById('settings-manifests-paths-input');
      const defaultLabelInput = document.getElementById('settings-default-label-input');
      const viewsPathInput = document.getElementById('settings-views-path-input');
      const viewsLabelsInput = document.getElementById('settings-views-labels-input');
      const viewsPropertiesInput = document.getElementById('settings-views-properties-input');
      const customsInput = document.getElementById('settings-facets-customs-input');
      const globalEnabledInput = document.getElementById('settings-facets-global-enabled-input');
      const directoryTemplateInput = document.getElementById('settings-facets-directory-template-input');

      setInlineErrorText('settings-manifests-paths-error', '');
      setInlineErrorText('settings-views-path-error', '');
      setInlineErrorText('settings-views-labels-error', '');
      setInlineErrorText('settings-views-properties-error', '');
      setInlineErrorText('settings-facets-customs-error', '');
      setInlineErrorText('settings-facets-directory-template-error', '');

      const pathsResult = validateManifestsPaths(pathsInput ? pathsInput.value : '');
      const viewsPathResult = validateViewsPath(viewsPathInput ? viewsPathInput.value : '');
      const viewsLabelsResult = validateJsonSettingsField(viewsLabelsInput ? viewsLabelsInput.value : '');
      const viewsPropertiesResult = validateJsonSettingsField(viewsPropertiesInput ? viewsPropertiesInput.value : '');
      const customsResult = validateJsonSettingsField(customsInput ? customsInput.value : '');
      const directoryTemplateResult = validateDirectoryNameTemplate(directoryTemplateInput ? directoryTemplateInput.value : '');

      let hasError = false;
      if (!pathsResult.valid) { setInlineErrorText('settings-manifests-paths-error', pathsResult.error); hasError = true; }
      if (!viewsPathResult.valid) { setInlineErrorText('settings-views-path-error', viewsPathResult.error); hasError = true; }
      if (!viewsLabelsResult.valid) { setInlineErrorText('settings-views-labels-error', viewsLabelsResult.error); hasError = true; }
      if (!viewsPropertiesResult.valid) { setInlineErrorText('settings-views-properties-error', viewsPropertiesResult.error); hasError = true; }
      if (!customsResult.valid) { setInlineErrorText('settings-facets-customs-error', customsResult.error); hasError = true; }
      if (!directoryTemplateResult.valid) { setInlineErrorText('settings-facets-directory-template-error', directoryTemplateResult.error); hasError = true; }
      if (hasError) break;

      // No stated DEC-9 rejection rule for these two — read as-is (free text / boolean).
      const defaultSyntheticLabel = defaultLabelInput ? defaultLabelInput.value : '';
      const globalEnabled = globalEnabledInput ? globalEnabledInput.checked : false;

      commitSettingsEdit((settings) => {
        settings.manifests.paths = pathsResult.paths;
        settings.relationships.defaultSyntheticLabel = defaultSyntheticLabel;
        settings.views.path = viewsPathResult.path;
        settings.views.labels = viewsLabelsResult.value;
        settings.views.properties = viewsPropertiesResult.value;
        settings.facets.globalEnabled = globalEnabled;
        settings.facets.directoryNameTemplate = directoryTemplateResult.value;
        settings.facets.customs = customsResult.value;
      });
      break;
    }
    case 'commit-file-edit': {
      const relPath = target.getAttribute('data-relpath');
      const textarea = document.getElementById('file-edit-textarea');
      const newText = textarea ? textarea.value : '';
      commitFileEdit(relPath, newText);
      break;
    }
    case 'open-create-child-form': {
      // TDD-0010 DEC-1: category is determined the same way
      // save-element-basics already does — whichever index Map holds it.
      const reference = target.getAttribute('data-ref');
      const category = AppState.index.application.has(reference) ? 'application' : 'technology';
      if (rawYamlEditDraft) rawYamlEditDraft = null;
      AppState.selection = { kind: 'create', createMode: 'child', category, parentReference: reference };
      render();
      break;
    }
    case 'open-create-top-level-form': {
      const category = target.getAttribute('data-category');
      if (rawYamlEditDraft) rawYamlEditDraft = null;
      AppState.selection = { kind: 'create', createMode: 'top-level', category, parentReference: null };
      render();
      break;
    }
    case 'cancel-create': {
      // TDD-0010 DEC-1: no AppState mutation beyond resetting selection —
      // a create form backed out of leaves nothing behind.
      const sel = AppState.selection;
      if (sel.kind === 'create' && sel.createMode === 'child') {
        AppState.selection = { kind: 'element', key: sel.parentReference, mode: 'edit' };
      } else {
        AppState.selection = { kind: 'none', key: null, mode: 'view' };
      }
      render();
      break;
    }
    case 'submit-create-child': {
      const sel = AppState.selection;
      const parentReference = sel.parentReference;
      const category = sel.category;
      const parentRecord = findElementRecord(parentReference);
      const kindSelect = document.getElementById('create-kind-select');
      const idInput = document.getElementById('create-id-input');
      const nameInput = document.getElementById('create-name-input');
      const descriptionInput = document.getElementById('create-description-input');

      setInlineErrorText('create-id-error', '');
      setInlineErrorText('create-form-error', '');

      // DEC-3's own kind-membership check, re-validated here per DEC-9's
      // "never trust the DOM alone" discipline (defensive — the <select>
      // should already only offer a valid option).
      const chosenKind = kindSelect ? kindSelect.value : '';
      const allowedKinds = parentRecord ? childKindOptionsFor(parentRecord) : [];
      if (allowedKinds.indexOf(chosenKind) === -1) {
        setInlineErrorText('create-form-error', 'Invalid kind for this parent.');
        break;
      }

      const id = idInput ? idInput.value.trim() : '';
      if (id === '') {
        setInlineErrorText('create-id-error', 'Id is required.');
        break;
      }
      // FR-7: id-collision check against the same category's live index.
      const newReference = parentReference + '.' + id;
      if (AppState.index[category] && AppState.index[category].has(newReference)) {
        setInlineErrorText('create-id-error', 'Another element already uses reference "' + newReference + '".');
        break;
      }

      const name = normalizeOptionalText(nameInput ? nameInput.value : '');
      const description = normalizeOptionalText(descriptionInput ? descriptionInput.value : '');

      const result = commitElementEdit(parentReference, (node) => {
        node.elements = Array.isArray(node.elements) ? node.elements.slice() : [];
        const child = { kind: chosenKind, id };
        if (name) child.name = name;
        if (description) child.description = description;
        node.elements.push(child);
        return { createdReference: parentReference + '.' + id };
      });

      // FR-3: one extra render after commitElementEdit's own rebuild
      // render, which still carried the stale (create-form) selection.
      AppState.selection = { kind: 'element', key: result.createdReference, mode: 'edit' };
      render();
      break;
    }
    case 'submit-create-top-level': {
      const sel = AppState.selection;
      const category = sel.category;
      const kindSelect = document.getElementById('create-kind-select');
      const idInput = document.getElementById('create-id-input');
      const nameInput = document.getElementById('create-name-input');
      const descriptionInput = document.getElementById('create-description-input');
      const attachUnderInput = document.getElementById('create-attach-under-input');

      setInlineErrorText('create-id-error', '');
      setInlineErrorText('create-attach-under-error', '');
      setInlineErrorText('create-form-error', '');

      const chosenKind = kindSelect ? kindSelect.value : '';
      const allowedTopLevelKinds = TOP_LEVEL_KIND_OPTIONS[category] || [];
      if (allowedTopLevelKinds.indexOf(chosenKind) === -1) {
        setInlineErrorText('create-form-error', 'Invalid kind for this category.');
        break;
      }

      const attachUnderRaw = attachUnderInput ? attachUnderInput.value.trim() : '';
      const attachUnder = attachUnderRaw === '' ? null : attachUnderRaw;
      const mapping = ARCHICODE_KIND_MAP[chosenKind];
      const rootKind = mapping ? mapping.rootKind : null;

      // FR-6(a): attach-under filled — must resolve, and the parent's own
      // kind must be able to contain the chosen kind.
      if (attachUnder) {
        const parentRecord = AppState.index[category] ? AppState.index[category].get(attachUnder) : null;
        if (!parentRecord) {
          setInlineErrorText('create-attach-under-error', 'No element "' + attachUnder + '" exists in this category.');
          break;
        }
        const attachOk = (rootKind === 'group')
          ? reducedLevelForKind(chosenKind) === parentRecord.level
          : childKindOptionsForLevel(parentRecord.level).indexOf(rootKind) !== -1;
        if (!attachOk) {
          setInlineErrorText('create-attach-under-error', 'Element "' + attachUnder + '" cannot contain a "' + chosenKind + '".');
          break;
        }
      } else {
        // FR-6(b): attach-under left blank — the chosen kind must be one
        // the real domain model allows as a genuinely unparented root.
        const blankAllowed = TOP_LEVEL_BLANK_ATTACH_ALLOWED[category] || [];
        if (blankAllowed.indexOf(chosenKind) === -1) {
          setInlineErrorText('create-form-error', 'A "' + chosenKind + '" must have "Attach under" filled in — it is never a top-level root.');
          break;
        }
      }

      const id = idInput ? idInput.value.trim() : '';
      if (id === '') {
        setInlineErrorText('create-id-error', 'Id is required.');
        break;
      }
      // FR-7: id-collision check against the resulting full reference.
      const newReference = attachUnder ? (attachUnder + '.' + id) : id;
      if (AppState.index[category] && AppState.index[category].has(newReference)) {
        setInlineErrorText('create-id-error', 'Another element already uses reference "' + newReference + '".');
        break;
      }

      const name = normalizeOptionalText(nameInput ? nameInput.value : '');
      const description = normalizeOptionalText(descriptionInput ? descriptionInput.value : '');

      const result = commitCreateTopLevelElement({
        category, headerKind: chosenKind, attachUnderReference: attachUnder, id, name, description
      });

      // FR-3: one extra render after commitCreateTopLevelElement's own
      // rebuild render, which still carried the stale (create-form) selection.
      AppState.selection = { kind: 'element', key: result.createdReference, mode: 'edit' };
      render();
      break;
    }
    case 'request-delete-element': {
      // TDD-0010 DEC-4: compute the impact scan and render it inline,
      // overlaid on the already-rendering edition view — no AppState
      // mutation happens here.
      const reference = target.getAttribute('data-ref');
      const category = AppState.index.application.has(reference) ? 'application' : 'technology';
      const deletedRefs = computeDeletedReferenceSet(reference, category);
      const affected = scanDanglingRelationshipsFor(deletedRefs, category);
      pendingDeleteConfirmation = { reference, category, affected };
      render();
      break;
    }
    case 'confirm-delete-element': {
      // TDD-0010 DEC-6: commitDeleteElement itself clears
      // pendingDeleteConfirmation and calls rebuildIndexAndRender.
      if (pendingDeleteConfirmation) {
        commitDeleteElement(pendingDeleteConfirmation.reference, pendingDeleteConfirmation.category, pendingDeleteConfirmation.affected);
      }
      break;
    }
    case 'cancel-delete-element':
      // TDD-0010 DEC-4, AC-11: no AppState mutation — only the transient
      // confirmation overlay is discarded.
      pendingDeleteConfirmation = null;
      render();
      break;
    case 'save-all-changes':
      // TDD-0010 DEC-7/ASM-2: saveAllChanges() is called directly and
      // synchronously from this click handler so its first await
      // (inside ensureWritePermission) is still reached within the
      // triggering user gesture.
      saveAllChanges();
      break;
    default:
      break;
  }
}

function render() {
  const app = document.getElementById('app');

  if (!isFileSystemAccessSupported()) {
    app.innerHTML = (
      '<div class="picker-screen">' +
        '<h1>ArchiCode Standalone Editor</h1>' +
        '<p class="warn">This browser does not support the File System Access API and/or IndexedDB (CON-2/NFR-3). ' +
        'Please use a recent Chromium-based browser (Chrome/Edge).</p>' +
      '</div>'
    );
    return;
  }

  if (AppState.fatalError && !AppState.folder) {
    // No folder was ever successfully opened (e.g. openFolder() itself failed) —
    // still leave a picker action reachable (DEC-10/FR-16).
    app.innerHTML = (
      '<div class="picker-screen">' +
        '<h1>ArchiCode Standalone Editor</h1>' +
        '<div class="error-panel"><strong>Error:</strong> ' + escapeHtml(AppState.fatalError) + '</div>' +
        '<button type="button" data-action="open-folder">Pick a folder</button>' +
      '</div>'
    );
    app.addEventListener('click', handleAppClick);
    return;
  }

  if (!AppState.folder) {
    app.innerHTML = (
      '<div class="picker-screen">' +
        '<h1>ArchiCode Standalone Editor</h1>' +
        '<p>Pick a workspace folder to begin.</p>' +
        '<button type="button" data-action="open-folder">Pick a folder</button>' +
      '</div>'
    );
    app.addEventListener('click', handleAppClick);
    return;
  }

  if (AppState.permissionState === 'needs-click') {
    app.innerHTML = (
      '<div class="picker-screen">' +
        '<h1>ArchiCode Standalone Editor</h1>' +
        '<button type="button" data-action="reopen-folder">Click to reopen "' + escapeHtml(AppState.folder.name) + '"</button>' +
      '</div>'
    );
    app.addEventListener('click', handleAppClick);
    return;
  }

  app.innerHTML = renderShellHtml();
  app.addEventListener('click', handleAppClick);
}

// =====================================================================
// Bootstrap
// =====================================================================

document.addEventListener('DOMContentLoaded', () => {
  if (!isFileSystemAccessSupported()) {
    render();
    return;
  }
  tryAutoReopen();
});
</script>
</body>
</html>
