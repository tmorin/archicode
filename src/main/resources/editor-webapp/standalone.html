        const file = await entryHandle.getFile();
        lastKnownDiskModified = file.lastModified;
        rawText = await file.text();
        ({ header, content, error } = parseManifestText(rawText));
      } catch (e) {
        error = e && e.message ? e.message : String(e);
      }
      manifestFiles.push({
        relPath, rawText, header, content, error,
        dirty: false, existedOnDisk: true, lastKnownDiskModified
      });
    }
  }
  manifestFiles.sort((a, b) => a.relPath.localeCompare(b.relPath));
  AppState.manifestFiles = manifestFiles;

  // DEC-5 / FR-6 / FR-7: index + resolve (per-file parse errors do not abort this).
  const { index, rootsByCategory } = buildIndex(manifestFiles, settings);
  const relationshipStats = resolveRelationships(index);
  AppState.index = index;
  AppState.relationshipStats = relationshipStats;

  AppState.workspace = {
    application: { elements: rootsByCategory.application },
    technology: { elements: rootsByCategory.technology },
    settings,
    styles: (workspaceRaw.styles && typeof workspaceRaw.styles === 'object') ? workspaceRaw.styles : {},
    formatters: (workspaceRaw.formatters && typeof workspaceRaw.formatters === 'object') ? workspaceRaw.formatters : {},
    // The whole parsed workspace.yaml: writeWorkspaceYaml re-emits it, with only styles/formatters/settings replaced,
    // so the other top-level keys (application, technology, views, ...) and the unknown settings survive a save.
    topLevel: workspaceRaw,
    settingsDirty: false, // TDD-0010 DEC-8
    settingsLastKnownDiskModified: workspaceLastKnownDiskModified
  };
  applySelectionFromHashRef(); // a bookmarked/shared "?ref=..." lands directly there; otherwise the DEC-9 default empty selection
  render();

  // eslint-disable-next-line no-console
  console.log('ArchiCode standalone editor — AppState after load:', AppState);
}

// =====================================================================
// Folder pick / persist / reopen / close flows
// (TDD DEC-3/DEC-4, CON-3/CON-4, CTR-2; PRD FR-1/FR-2/FR-3; FLOW-1..3).
// =====================================================================

function isFileSystemAccessSupported() {
  return typeof window.showDirectoryPicker === 'function' && 'indexedDB' in window;
}

// ---- Served by `archicode editor serve`: the folder comes from the server, in any browser ----
//
// The server puts a token in a <meta name="archicode-server"> of the page it serves. When it is there the editor does
// not ask for a folder: it opens the one the server serves, through the small API of the server (/api/fs/…), by way
// of objects that answer the calls of the File System Access API the rest of the editor already makes. Opened from
// a file, or from GitHub Pages, there is no such tag, and the editor asks for a folder as it always did.

function serverToken() {
  const meta = typeof document !== 'undefined' && document.querySelector ? document.querySelector('meta[name="archicode-server"]') : null;
  return meta ? meta.getAttribute('content') : null;
}

/** Is this page served by `archicode editor serve`? */
function isServedByArchiCode() {
  return !!serverToken();
}

/**
 * The server asks for `?token=` on the first request only; the page carries the token in its <meta> from then on.
 * Take it out of the address bar (the hash stays) so it is not left in the history, a screenshot or a copied link.
 */
function stripServerTokenFromUrl() {
  if (typeof location === 'undefined' || typeof history === 'undefined' || !history.replaceState) return;
  const params = new URLSearchParams(location.search || '');
  if (!params.has('token')) return;
  params.delete('token');
  const rest = params.toString();
  try { history.replaceState(null, '', (location.pathname || '/') + (rest ? '?' + rest : '') + (location.hash || '')); } catch (e) { /* no history to edit */ }
}

/** Whether the editor can get hold of a folder here: from the server that serves it, or by picking one. */
function isFolderAccessAvailable() {
  return isServedByArchiCode() || isFileSystemAccessSupported();
}

async function serverFetch(method, route, params, body) {
  const query = params ? '?' + new URLSearchParams(params).toString() : '';
  return fetch('/api/fs/' + route + query, { method, headers: { 'X-ArchiCode-Token': serverToken() }, body });
}

async function serverFailure(response, what) {
  if (response.status === 404) {
    const e = new Error('NotFoundError: ' + what);
    e.name = 'NotFoundError';
    return e;
  }
  return new Error((await response.text()) || ('the server answered ' + response.status + ' for ' + what));
}

/** A directory of the served folder, as a File System Access directory handle (what the editor uses of it). */
function serverDirectoryHandle(path, name) {
  const child = (entry) => (path ? path + '/' : '') + entry;
  const list = async () => {
    const response = await serverFetch('GET', 'list', { path });
    if (!response.ok) throw await serverFailure(response, path || '/');
    return response.json();
  };
  const find = async (entry, kind) => {
    if (!(await list()).some((e) => e.name === entry && e.kind === kind)) {
      const e = new Error('NotFoundError: ' + child(entry));
      e.name = 'NotFoundError';
      throw e;
    }
  };
  return {
    kind: 'directory',
    name,
    async queryPermission() { return 'granted'; },
    async requestPermission() { return 'granted'; },
    async *entries() {
      for (const e of await list()) {
        yield [e.name, e.kind === 'directory' ? serverDirectoryHandle(child(e.name), e.name) : serverFileHandle(child(e.name), e.name)];
      }
    },
    async getDirectoryHandle(entry, options) {
      if (!(options && options.create)) await find(entry, 'directory');
      return serverDirectoryHandle(child(entry), entry);
    },
    async getFileHandle(entry, options) {
      if (!(options && options.create)) await find(entry, 'file');
      return serverFileHandle(child(entry), entry);
    },
    async removeEntry(entry) {
      const response = await serverFetch('DELETE', 'file', { path: child(entry) });
      if (!response.ok) throw await serverFailure(response, child(entry));
    }
  };
}

/** A file of the served folder, as a File System Access file handle. */
function serverFileHandle(path, name) {
  return {
    kind: 'file',
    name,
    async queryPermission() { return 'granted'; },
    async requestPermission() { return 'granted'; },
    async getFile() {
      const response = await serverFetch('GET', 'file', { path });
      if (!response.ok) throw await serverFailure(response, path);
      // the editor tells that a file changed on disk since it read it by this time
      const modified = Number(response.headers && response.headers.get ? response.headers.get('X-ArchiCode-Modified') : NaN);
      return new File([await response.text()], name, Number.isFinite(modified) ? { type: 'text/plain', lastModified: modified } : { type: 'text/plain' });
    },
    async createWritable() {
      const parts = [];
      return {
        async write(data) { parts.push(data && typeof data === 'object' && 'data' in data && !(data instanceof Blob) ? data.data : data); },
        async close() {
          const response = await serverFetch('PUT', 'file', { path }, new Blob(parts));
          if (!response.ok) throw await serverFailure(response, path);
        }
      };
    }
  };
}

/** Open the folder the server serves: no picker, no stored handle, no permission to ask for. */
async function openServedFolder() {
  try {
    const response = await serverFetch('GET', 'info');
    if (!response.ok) throw await serverFailure(response, 'the server');
    const info = await response.json();
    const handle = serverDirectoryHandle('', info.folder);
    landingBusy = 'Opening “' + info.folder + '”…';
    AppState.folder = { handle, name: info.folder };
    AppState.permissionState = 'granted';
    render();
    await loadWorkspace(handle);
  } catch (e) {
    landingBusy = null;
    console.error('ArchiCode: opening the served folder failed', e);
    AppState.fatalError = 'The editor server could not be reached: ' + (e && e.message ? e.message : String(e)) + '. Reload the page, or restart `archicode editor serve`.';
    render();
  }
}

/** Click handler for the initial "pick a folder" button (FR-1). */
async function openFolder() {
  try {
    const handle = await window.showDirectoryPicker();
    // another folder than the one the page was holding: nothing of the old one (pins, facet, hash…) must reach it
    let sameFolder = !AppState.folder;
    if (AppState.folder && AppState.folder.handle && AppState.folder.handle.isSameEntry) {
      try { sameFolder = await AppState.folder.handle.isSameEntry(handle); } catch (e) { sameFolder = false; }
    }
    if (!sameFolder) {
      AppState = createInitialAppState();
      resetUiState();
    }
    landingBusy = 'Opening “' + handle.name + '”…';
    render();
    await putStoredHandleRecord(handle);
    AppState.folder = { handle, name: handle.name };
    AppState.permissionState = 'granted';
    await loadWorkspace(handle);
  } catch (e) {
    landingBusy = null;
    if (e && e.name === 'AbortError') { render(); return; } // user dismissed the picker
    console.error('ArchiCode: openFolder failed', e);
    AppState.fatalError = 'Failed to open folder: ' + (e && e.message ? e.message : String(e));
    render();
  }
}

/**
 * Click handler for the "click to reopen <name>" button (FR-2/DEC-4).
 * requestPermission() must only ever be called from inside a user
 * gesture handler like this one (CON-3) — never automatically on load.
 */
async function reopenFolder() {
  if (!AppState.folder || !AppState.folder.handle) return;
  try {
    const permission = await AppState.folder.handle.requestPermission({ mode: 'read' });
    if (permission === 'granted') {
      AppState.permissionState = 'granted';
      landingBusy = 'Opening “' + AppState.folder.name + '”…';
      render();
      await loadWorkspace(AppState.folder.handle);
      return;
    }
  } catch (e) {
    console.error('ArchiCode: reopenFolder requestPermission failed', e);
  }
  // Failure (denied, dismissed, or thrown) falls back to the initial picker state.
  try { await deleteStoredHandleRecord(); } catch (e) { /* best effort */ }
  AppState = createInitialAppState();
  resetUiState();
  render();
}

/**
 * Forgets everything the page remembers about the folder it showed — the pins, the facet, what is open on the map, a
 * pending draft, the status of the last save, the hash of the URL — so the next folder starts clean and the old ref=,
 * pin= and facet= are not applied to it. For a folder that is closed or replaced, never for a reload of the same one
 * (after a save the user keeps their place).
 */
function resetUiState() {
  saveStatus = { state: 'idle' };
  currentPerspective = DEFAULT_PERSPECTIVE;
  mapPinned = [];
  mapHidden = [];
  mapOpened = null;
  navActiveRef = null;
  treeExpandedApplications = true;
  treeExpandedEnvironments = true;
  treeQuietCache = null;
  elementTab = 'details';
  diagramFacet = null;
  diagramMaximized = false;
  diagramHideUnlinked = false;
  diagramScale = 'auto';
  diagramCenter = { x: 0, y: 0 };
  diagramCache = null;
  diagramScene = null;
  diagramShownView = null;
  diagramSeq++; // a layout still being computed for the old folder is dropped when it ends
  helpOpen = false;
  pendingDeleteConfirmation = null;
  rawYamlEditDraft = null;
  lastRenderedViewKey = null;
  scrollNavToSelection = false;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* no history to edit (file:// sandboxes) */ }
}

/** "Try again" on the landing error card: re-read the already-picked folder (e.g. after fixing workspace.yaml). */
async function retryFolder() {
  if (!AppState.folder || !AppState.folder.handle) return;
  landingBusy = 'Opening “' + AppState.folder.name + '”…';
  render();
  await loadWorkspace(AppState.folder.handle);
}

/** Click handler for the top panel's close action (FR-3/FLOW-3). */
async function closeFolder() {
  if (hasUnsavedChanges() && !confirm('You have unsaved changes that will be lost. Close the folder anyway?')) {
    return;
  }
  try {
    await deleteStoredHandleRecord();
  } catch (e) {
    console.error('ArchiCode: closeFolder failed to clear stored handle', e);
  }
  AppState = createInitialAppState();
  resetUiState();
  render();
}

/** On every page load: try to silently reopen a stored handle (FLOW-2). */
async function tryAutoReopen() {
  let record;
  try {
    record = await getStoredHandleRecord();
  } catch (e) {
    console.error('ArchiCode: failed to read stored handle', e);
    record = null;
  }
  if (!record || !record.handle) {
    landingBusy = null;
    AppState.permissionState = 'none';
    render();
    return;
  }
  const handle = record.handle;
  let permission;
  try {
    // No user gesture needed for queryPermission (FR-2/Q-1).
    permission = await handle.queryPermission({ mode: 'read' });
  } catch (e) {
    permission = 'denied';
  }
  AppState.folder = { handle, name: handle.name };
  if (permission === 'granted') {
    AppState.permissionState = 'granted';
    landingBusy = 'Opening “' + handle.name + '”…';
    render();
    await loadWorkspace(handle);
  } else {
    landingBusy = null;
    AppState.permissionState = 'needs-click';
    render();
  }
}

// =====================================================================
// Real three-panel read-only UI (run-0008, task-002; PRD FR-8..FR-16,
// NFR-2/NFR-4; TDD DEC-1/DEC-6/DEC-7/DEC-8/DEC-9/DEC-10/DEC-11,
// IF-1..IF-3, FLOW-5). Replaces the former temporary diagnostic view.
// =====================================================================

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Top-level Applications/Environments branch expand state (IF-2). Kept
// outside AppState (deliberately not part of CTR-1's `expanded` Set,
// which is reserved for per-element tree-node expand state) — simple
// module-level booleans, defaulting to expanded for a useful first view.
let treeExpandedApplications = true;
let treeExpandedEnvironments = true;

// =====================================================================
// Perspectives (Eclipse-style named panel arrangements) — three now, so
// this is a real per-region dispatch (see renderShellHtml), not just a
// label. Hash-routed (file:// pages don't reload on a hash change, so
// this is a free, build-step-free router): the hash is the one source of
// truth for which perspective is showing, kept in sync with
// `currentPerspective` in both directions (setPerspective writes the
// hash; the 'hashchange' listener below reads it back, which also covers
// back/forward and a hand-edited URL).
// =====================================================================
const PERSPECTIVES = {
  map: { label: 'Map' },
  elements: { label: 'Elements' },
  files: { label: 'Files' },
  settings: { label: 'Settings' }
};
const DEFAULT_PERSPECTIVE = 'elements';
let currentPerspective = DEFAULT_PERSPECTIVE;

/** Parse `location.hash` ("#/diagram?ref=...") into a known perspective id, defaulting for an empty/unrecognized hash. */
function perspectiveIdFromHash() {
  const id = location.hash.split('?')[0].replace(/^#\/?/, '');
  // the Diagram perspective is gone: its links open the Elements perspective on the matching tab (see applyDiagramParamsFromHash)
  if (id === 'diagram') return 'elements';
  return Object.prototype.hasOwnProperty.call(PERSPECTIVES, id) ? id : DEFAULT_PERSPECTIVE;
}

/** The hash's `ref=` query param (an element reference or a manifest file's relPath), or null. */
function refFromHash() {
  const queryIdx = location.hash.indexOf('?');
  if (queryIdx === -1) return null;
  return new URLSearchParams(location.hash.slice(queryIdx + 1)).get('ref');
}

/**
 * Resolve the hash's `ref=` (if any) against the now-loaded workspace into
 * `AppState.selection` — an element reference or a manifest file's relPath,
 * whichever actually matches (falls back to the default empty selection
 * otherwise, including when there is no `ref` at all). Shared by the
 * initial load (`loadWorkspace`, once there's an index/manifestFiles list
 * to resolve against) and any later 'hashchange' while already loaded
 * (`syncPerspectiveFromHash`, below).
 */
function applyDiagramParamsFromHash() {
  const id = perspectiveIdFromHash();
  if (id !== 'elements' && id !== 'map') return;
  const queryIdx = location.hash.indexOf('?');
  const params = new URLSearchParams(queryIdx === -1 ? '' : location.hash.slice(queryIdx + 1));
  if (id === 'elements') {
    // an old "#/diagram?...&vp=deep" link: the viewpoint is the tab, and a diagram link without one meant the overview
    const legacy = location.hash.split('?')[0].replace(/^#\/?/, '') === 'diagram';
    const tab = legacy ? (params.get('vp') || 'overview') : params.get('tab');
    elementTab = tab && Object.prototype.hasOwnProperty.call(ELEMENT_TABS, tab) ? tab : 'details';
  } else {
    const pin = params.get('pin');
    mapPinned = pin ? pin.split(',').filter((reference) => AppState.index.application.has(reference)) : [];
    mapPinned.forEach(expandParentsOf);
  }
  const facet = params.get('facet');
  diagramFacet = facet && AppState.workspace.settings.facets.customs.some((f) => f.name === facet) ? facet : null;
}

function applySelectionFromHashRef() {
  applyDiagramParamsFromHash();
  const ref = refFromHash();
  if (ref) {
    if (AppState.index.application.has(ref) || AppState.index.technology.has(ref)) {
      // `layer=` is only there when both layers have the reference (a link without it keeps its old meaning)
      const layerParam = new URLSearchParams(location.hash.indexOf('?') === -1 ? '' : location.hash.slice(location.hash.indexOf('?') + 1)).get('layer');
      const layer = (layerParam === 'application' || layerParam === 'technology') && AppState.index[layerParam].has(ref) ? layerParam : null;
      AppState.selection = layer ? { kind: 'element', key: ref, layer, mode: 'view' } : { kind: 'element', key: ref, mode: 'view' };
      expandAncestorsOf(ref);
      scrollNavToSelection = true;
      return;
    }
    if (AppState.manifestFiles.some((f) => f.relPath === ref)) {
      AppState.selection = { kind: 'file', key: ref, mode: 'view' };
      return;
    }
  }
  AppState.selection = { kind: 'none', key: null, mode: 'view' };
}

/** Re-sync `currentPerspective` (and, once a workspace is loaded, the selection) from the URL — bootstrap and every 'hashchange' (back/forward, a hand-edited URL). */
function syncPerspectiveFromHash() {
  currentPerspective = perspectiveIdFromHash();
  if (AppState.workspace) applySelectionFromHashRef();
}

/** The "#/perspective?ref=..." hash for the current perspective + selection — what the URL should read right now (UX review follow-up: the URL mirrors what's on screen). */
function currentRouteHash() {
  const sel = AppState.selection;
  const ref = (sel.kind === 'element' || sel.kind === 'file') ? sel.key : null;
  const params = [];
  if (ref) params.push('ref=' + encodeURIComponent(ref));
  // a reference that exists in both layers needs to say which one the selection is
  if (ref && sel.kind === 'element' && referenceIsInBothLayers(ref)) params.push('layer=' + layerOfReference(ref, sel.layer));
  // the diagram's own choices travel in the URL too, so a link (or Back) restores them
  if (currentPerspective === 'elements' && ref && sel.kind === 'element' && sel.mode !== 'edit' && elementTab !== 'details') {
    params.push('tab=' + (findElementRecord(ref) ? effectiveDiagramViewpoint(findElementRecord(ref)) : elementTab)); // what the tabs show, not what a leaf was asked
    if (diagramFacet) params.push('facet=' + encodeURIComponent(diagramFacet));
  }
  if (currentPerspective === 'map') {
    if (diagramFacet) params.push('facet=' + encodeURIComponent(diagramFacet));
    if (mapPinned.length) params.push('pin=' + mapPinned.map(encodeURIComponent).join(','));
  }
  return '/' + currentPerspective + (params.length ? '?' + params.join('&') : '');
}

/**
 * Keep the URL in sync with whatever just rendered, without spamming
 * browser history or re-triggering 'hashchange' (replaceState does
 * neither) — called at the end of every render() that shows the shell.
 * A plain `location.hash = ...` per click would instead push a new
 * history entry and fire 'hashchange' asynchronously, double-rendering.
 */
function syncHashFromState() {
  const hash = '#' + currentRouteHash();
  if (location.hash !== hash) history.replaceState(null, '', hash);
}

/**
 * Switch perspective from inside the app itself (the tab click handler) —
 * updates the hash (so the URL stays the source of truth, and a genuine
 * perspective switch — unlike an in-perspective selection change — is
 * worth its own back/forward history entry) and renders directly, rather
 * than relying solely on the async 'hashchange' event. Discards the two
 * transient, file/element-scoped drafts the same way every other
 * cross-navigation already does (DEC-10/FLOW-4 philosophy) — a
 * perspective switch is a bigger navigation jump than any of those.
 */
function setPerspective(id) {
  if (!Object.prototype.hasOwnProperty.call(PERSPECTIVES, id)) return;
  currentPerspective = id;
  if (rawYamlEditDraft) rawYamlEditDraft = null;
  if (pendingDeleteConfirmation) pendingDeleteConfirmation = null;
  location.hash = currentRouteHash();
  render();
}

// =====================================================================
// Resizable shell panels (layout adapted from archi-edtior.html) — sizes
// persist in localStorage, keyed per panel id, read back into the
// template on every render() (never set imperatively once at boot: a
// render() replaces #app's whole innerHTML on every click/edit, which
// would otherwise wipe out an imperatively-set inline style the very
// next time anything is clicked).
// =====================================================================
const PANEL_SIZE_STORAGE_PREFIX = 'archicode-standalone-editor:panel-size:';

const panelSizeStorage = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ } },
  remove(key) { try { localStorage.removeItem(key); } catch (e) { /* storage unavailable */ } }
};

/** The inline `style="..."` attribute content for a resizable panel, from its persisted size (or '' if none saved). */
function savedPanelSizeStyle(panelId, property) {
  const raw = panelSizeStorage.get(PANEL_SIZE_STORAGE_PREFIX + panelId + ':' + property);
  const size = Number(raw);
  return size > 0 ? (property + ': ' + size + 'px;') : '';
}

// Raw-YAML editor's one pending draft (run-0009, task-005; TDD-0009
// DEC-6/DEC-10, CTR-2) — holds { relPath, text, error } for the single
// file currently showing an unsaved/rejected edit, or null. Deliberately
// module-level, not part of AppState (same rationale as the two booleans
// above): transient UI state, not model state.
let rawYamlEditDraft = null;

/**
 * The live CodeMirror instance mounted on the file-edit view's host div
 * (form UX review follow-up), or null when either CodeMirror never loaded
 * (window.CM is undefined — the plain <textarea> fallback renders instead)
 * or the file-edit view isn't the one currently showing. Destroyed and
 * re-created on every render() — innerHTML replacement already discards
 * the DOM node it was mounted on, so this avoids leaking the editor's own
 * internal listeners/timers across re-renders.
 */
let activeFileEditorView = null;

/** Live CodeMirror JSON editors for the Settings view's `views.properties`, keyed by viewpoint id — destroyed/re-created on every render() like activeFileEditorView. */
let activeJsonEditorViews = {};

/** Perspective + selection of the last full render — lets render() tell "same view, refreshed" from "navigated elsewhere" when restoring scroll. */
let lastRenderedViewKey = null;

/**
 * Delete confirmation state (TDD-0010 DEC-4, CTR-2) — holds
 * { reference, category, affected } for the element currently showing an
 * inline delete-impact-scan confirmation (overlaid on its own, already-
 * rendering edition view), or null. Deliberately module-level, not part
 * of AppState — same rationale as `rawYamlEditDraft` above: transient UI
 * state, not model state. Canceling never touches AppState (AC-11);
 * confirming is the only path that mutates anything.
 */
let pendingDeleteConfirmation = null;

/**
 * Save status (TDD-0010 DEC-11, CTR-2) — the module-level result of the
 * most recent `saveAllChanges` attempt, or `{state: 'idle'}` before any
 * attempt this session. Deliberately not part of `AppState` — same
 * rationale as `pendingDeleteConfirmation`/`rawYamlEditDraft` above:
 * transient UI state, not model state. Reset to `'idle'` at every
 * mutation chokepoint that creates a *new* unsaved change, so a stale
 * conflict/error message from a prior save attempt does not linger past
 * the edit that would resolve it.
 */
let saveStatus = { state: 'idle' };

/** Add every ancestor reference of `reference` (itself included) to AppState.expanded (FR-14/FLOW-5). */
function expandAncestorsOf(reference) {
  if (!reference) return;
  const segments = String(reference).split('.');
  let acc = '';
  for (const segment of segments) {
    acc = acc ? acc + '.' + segment : segment;
    AppState.expanded.add(acc);
  }
}

function toggleExpandedKey(key) {
  if (AppState.expanded.has(key)) {
    AppState.expanded.delete(key);
  } else {
    AppState.expanded.add(key);
  }
}

/**
 * The layer ('application' | 'technology') an element lives in, or null when no layer has the reference. A reference
 * can exist in both layers (the application solution `hub` and the environment `hub`): the layer asked for wins when
 * it has the reference; else the layer of the selected element when it is that very reference (the edit form, the
 * delete and create buttons all act on the selection); else the application layer, as before.
 */
function layerOfReference(reference, layer) {
  const has = (candidate) => !!AppState.index && !!AppState.index[candidate] && AppState.index[candidate].has(reference);
  if (layer && has(layer)) return layer;
  const sel = AppState.selection;
  if (!layer && sel && sel.kind === 'element' && sel.key === reference && sel.layer && has(sel.layer)) return sel.layer;
  if (has('application')) return 'application';
  if (has('technology')) return 'technology';
  return null;
}

/** Whether both layers have an element with this reference (then a link to it needs to say which one). */
function referenceIsInBothLayers(reference) {
  return AppState.index.application.has(reference) && AppState.index.technology.has(reference);
}

/** Look up an ElementRecord by reference (DEC-6) in the layer asked for, else the layer `layerOfReference` picks. */
function findElementRecord(reference, layer) {
  const resolved = layerOfReference(reference, layer);
  return resolved ? AppState.index[resolved].get(reference) : null;
}

/**
 * Locate the live, mutable `content` node a `reference` denotes (TDD-0009
 * DEC-4) — never a disposable `ElementRecord` copy from `index`, since
 * `indexElementRecursive` builds a fresh `record` object on every
 * `buildIndex` call. Returns `{ mf, node, parentArray, indexInParent }`,
 * or `null` if `reference` does not resolve (should not happen for a
 * reference `findElementRecord` itself returned — see DEC-4's rationale).
 */
function locateContentNode(reference, layer) {
  const record = findElementRecord(reference, layer);
  if (!record) return null;
  const mf = AppState.manifestFiles.find((f) => f.relPath === record.sourceFile);
  if (!mf || !mf.header || !mf.content) return null;

  const rootRef = mf.header.parent ? (mf.header.parent + '.' + mf.content.id) : String(mf.content.id);
  if (reference === rootRef) {
    return { mf, node: mf.content, parentArray: null, indexInParent: null };
  }
  if (reference.indexOf(rootRef + '.') !== 0) return null;

  // Walk the nested elements by matching the rest of the reference against `<id>` or `<id>.…`, so an id that
  // happens to contain a '.' (nothing forbade it in a hand-written manifest) is still found.
  let currentRef = rootRef;
  let searchArray = Array.isArray(mf.content.elements) ? mf.content.elements : [];
  let matchedNode = null;
  let parentArray = null;
  let indexInParent = null;
  while (currentRef !== reference) {
    const rest = reference.slice(currentRef.length + 1);
    let foundIndex = -1;
    for (let i = 0; i < searchArray.length; i++) {
      const child = searchArray[i];
      if (!child || typeof child !== 'object' || child.id === undefined || child.id === null) continue;
      const childId = String(child.id);
      if (rest === childId || rest.indexOf(childId + '.') === 0) {
        foundIndex = i;
        break;
      }
    }
    if (foundIndex === -1) return null; // contract violation (DEC-4) — should not happen
    parentArray = searchArray;
    indexInParent = foundIndex;
    matchedNode = searchArray[foundIndex];
    currentRef = currentRef + '.' + String(matchedNode.id);
    searchArray = Array.isArray(matchedNode.elements) ? matchedNode.elements : [];
  }
  return { mf, node: matchedNode, parentArray, indexInParent };
}

// =====================================================================
// Commit-and-rebuild pipeline (TDD-0009 DEC-5) — the single reconciliation
// mechanism every editing surface (element form, settings form, raw-YAML
// editor) funnels through: mutate the one canonical source (a content
// node via commitElementEdit, or AppState.workspace.settings via
// commitSettingsEdit), then fully re-derive index/tree/relationships from
// the live AppState.manifestFiles/settings and re-render — never a
// bespoke per-field patch (TG-1/TC-3). A later task's UI click handlers
// call these; this task only adds the plumbing.
// =====================================================================

/**
 * Re-run buildIndex + resolveRelationships over the live
 * AppState.manifestFiles/AppState.workspace.settings (exactly mirroring
 * loadWorkspace's own pipeline) and re-render (DEC-5). Called at the tail
 * of every commit path below.
 */
function rebuildIndexAndRender() {
  const { index, rootsByCategory } = buildIndex(AppState.manifestFiles, AppState.workspace.settings);
  AppState.index = index;
  AppState.workspace.application.elements = rootsByCategory.application;
  AppState.workspace.technology.elements = rootsByCategory.technology;
  AppState.relationshipStats = resolveRelationships(index);
  render();
}

/**
 * Commit an element-level edit (DEC-5): locate the live content node for
 * `reference` (DEC-4), apply `mutatorFn` to it (and, when relevant, to
 * its containing array/index), regenerate that node's manifest file's
 * `rawText` from the now-mutated `content` (DEC-7), then rebuild+render.
 *
 * `mutatorFn(node, parentArray, indexInParent)` may return a value — e.g.
 * `{ renamedTo: { from, to } }` for an id-rename (DEC-8) — which is passed
 * through as this function's own return value for a later task to act on.
 * A caller must run DEC-9 validation *before* calling this function: a
 * rejected action never reaches here, so no validation happens inside.
 */
function commitElementEdit(reference, mutatorFn, layer) {
  const located = locateContentNode(reference, layer);
  if (!located) {
    throw new Error('"' + reference + '" cannot be found in the loaded manifests (it may have been removed or renamed); nothing was changed.');
  }
  const { mf, node, parentArray, indexInParent } = located;
  const elementLayer = layerOfReference(reference, layer);
  const result = mutatorFn(node, parentArray, indexInParent);
  let dirtyReference = reference;
  if (result && result.renamedTo) {
    // the id changed: everything that pointed at the old reference follows it, in the model and in the UI state
    const { from, to } = result.renamedTo;
    rewriteUiReferences(from, to, elementLayer);
    rewriteInboundReferences(from, to, elementLayer);
    dirtyReference = to;
  }
  mf.rawText = serializeManifestFile(mf.header, mf.content);
  mf.dirty = true; // TDD-0010 DEC-8 — every structural edit marks its file dirty for the next save
  AppState.dirtyReferences.add(dirtyReference); // UX review follow-up — element-level "modified" tracking
  saveStatus = { state: 'idle' }; // TDD-0010 DEC-11 — a new edit discards any prior save attempt's status
  rebuildIndexAndRender();
  return result;
}

/**
 * Commit a settings edit (DEC-5): mutate `AppState.workspace.settings` in
 * place via `mutatorFn`, then rebuild+render. Like `commitElementEdit`,
 * a caller must run DEC-9 validation before calling this function.
 */
function commitSettingsEdit(mutatorFn) {
  mutatorFn(AppState.workspace.settings);
  AppState.workspace.settingsDirty = true; // TDD-0010 DEC-8
  AppState.workspace.settingsRevision = (AppState.workspace.settingsRevision || 0) + 1; // lets a save in flight tell it wrote the older settings
  saveStatus = { state: 'idle' }; // TDD-0010 DEC-11 — a new edit discards any prior save attempt's status
  rebuildIndexAndRender();
}

// =====================================================================
// Create (TDD-0010 DEC-1/DEC-2/DEC-3/DEC-5) — new element entry points,
// shared create form, and the one new commit function the top-level
// path needs (a same-file child reuses commitElementEdit as-is, above).
// =====================================================================

/** PRD FR-4's fixed per-category top-level kind list (the full header.kind flavors, not the nested-child vocabulary childKindOptionsForLevel returns). */
// The `*-group` kinds are not offered here: ManifestKind.getSubTypeName() gives `_group` for them, so one such
// manifest makes the whole workspace unreadable for the CLI. The editor still reads and edits them when they exist.
const TOP_LEVEL_KIND_OPTIONS = {
  application: ['person', 'system', 'solution', 'container', 'component'],
  technology: ['environment', 'node']
};

/** PRD FR-6(b)'s fixed per-category list of kinds the real domain model allows as a genuinely unparented root (attach-under left blank). */
const TOP_LEVEL_BLANK_ATTACH_ALLOWED = {
  application: ['solution', 'system', 'person'],
  technology: ['environment']
};

/**
 * The id of a new element (or the new id of a renamed one): letters, digits, `_` and `-`, not starting with `-`.
 * An id is a segment of references (`a.b.c`) and part of the name of the manifest file (`app.a.b.yaml`), so a '.',
 * a '/' or a '\' would change what the reference means or where the file lands. Returns `{ valid, id | error }`.
 */
function validateElementId(rawId) {
  const id = typeof rawId === 'string' ? rawId.trim() : '';
  if (id === '') return { valid: false, error: 'Id is required.' };
  if (/\s/.test(id)) return { valid: false, error: 'An id cannot contain spaces.' };
  if (/[./\\]/.test(id)) return { valid: false, error: 'An id cannot contain "." (it separates the levels of a reference), "/" or "\\".' };
  if (/^[-.]/.test(id)) return { valid: false, error: 'An id cannot start with "-" or ".".' };
  if (!/^[A-Za-z0-9_-]+$/.test(id)) return { valid: false, error: 'An id may only contain letters, digits, "_" and "-".' };
  return { valid: true, id };
}

/**
 * A relPath for a new manifest file that nothing in the workspace uses: `<dir>/<prefix><reference>.yaml`, else
 * `…-2.yaml`, `…-3.yaml`. Taken means: a file the editor knows (compared case-insensitively, as a case-insensitive
 * disk would), or a file queued for removal under another spelling. The very path of a file queued for removal is
 * free: the new file replaces it (see `adoptRemovedFile`), the removal is dropped.
 */
function allocateManifestRelPath(dir, prefix, reference) {
  const taken = new Set(AppState.manifestFiles.map((f) => f.relPath.toLowerCase()));
  const base = (dir ? dir + '/' : '') + prefix + reference;
  for (let n = 1; ; n++) {
    const candidate = base + (n === 1 ? '' : '-' + n) + '.yaml';
    if (taken.has(candidate.toLowerCase())) continue;
    const queued = AppState.pendingFileRemovals.filter((p) => p.toLowerCase() === candidate.toLowerCase());
    if (queued.length > 0 && !queued.includes(candidate)) continue;
    return candidate;
  }
}

/**
 * A new file takes the path of a file queued for removal: the removal is dropped and the new file stands for the one
 * that was on disk (so the save rewrites it, with the stale-check of the removed file's baseline), instead of the
 * save deleting what it has just written.
 */
function adoptRemovedFile(mf) {
  if (!AppState.pendingFileRemovals.includes(mf.relPath)) return;
  AppState.pendingFileRemovals = AppState.pendingFileRemovals.filter((p) => p !== mf.relPath);
  mf.existedOnDisk = true;
  mf.lastKnownDiskModified = removedFileBaseline(mf.relPath);
  AppState.removedFileBaselines.delete(mf.relPath);
}

/**
 * Commit a brand-new top-level manifest file (TDD-0010 DEC-5 — the
 * Stage-5-corrected version, with the manifests-directory prefix). A
 * caller must run FR-6/FR-7's validation before calling this function —
 * a rejected submission never reaches it (same discipline W-3's DEC-9
 * already established for every other commit path).
 */
function commitCreateTopLevelElement({ category, headerKind, attachUnderReference, id, name, description }) {
  const idCheck = validateElementId(id);
  if (!idCheck.valid) throw new Error(idCheck.error);
  const reference = attachUnderReference ? (attachUnderReference + '.' + id) : id;
  if (AppState.index[category] && AppState.index[category].has(reference)) {
    throw new Error('Another element already uses reference "' + reference + '".');
  }
  const header = { kind: ARCHICODE_KIND_PREFIX + headerKind, version: '1' };
  if (attachUnderReference) header.parent = attachUnderReference;
  const content = { id };
  if (name) content.name = name;
  if (description) content.description = description;
  // the first manifests directory of the workspace (as loadWorkspace reads it: `./manifests` is `manifests`), else `manifests`
  const manifestsDir = AppState.workspace.settings.manifests.paths.map(normalizeRelDir).find((p) => p !== null);
  const relPath = allocateManifestRelPath(manifestsDir === undefined ? 'manifests' : manifestsDir, category === 'application' ? 'app.' : 'env.', reference);
  const mf = {
    relPath, header, content, error: null,
    rawText: serializeManifestFile(header, content), // W-3's serializer, reused as-is
    dirty: true, existedOnDisk: false, lastKnownDiskModified: null
  };
  adoptRemovedFile(mf);
  AppState.manifestFiles.push(mf);
  AppState.manifestFiles.sort((a, b) => a.relPath.localeCompare(b.relPath)); // matches loadWorkspace's own ordering
  AppState.dirtyReferences.add(reference); // UX review follow-up — element-level "modified" tracking
  saveStatus = { state: 'idle' }; // TDD-0010 DEC-11 — a new edit discards any prior save attempt's status
  rebuildIndexAndRender();
  return { createdReference: reference, relPath };
}

/**
 * Commit a new element nested in `parentReference`'s own manifest (the same-file path of TDD-0010 DEC-5, which
 * reuses `commitElementEdit`). `layer` tells the parent apart when both layers have that reference. Returns
 * `{ ok: true, createdReference }` or `{ ok: false, field: 'kind' | 'id', error }` when the submission is rejected,
 * leaving the model untouched.
 */
function commitCreateChildElement({ parentReference, layer, kind, id, name, description }) {
  const category = layerOfReference(parentReference, layer);
  const parentRecord = category ? AppState.index[category].get(parentReference) : null;
  if (!parentRecord) return { ok: false, field: 'kind', error: 'The parent "' + parentReference + '" does not exist.' };
  if (childKindOptionsFor(parentRecord).indexOf(kind) === -1) return { ok: false, field: 'kind', error: 'Invalid kind for this parent.' };
  const idCheck = validateElementId(id);
  if (!idCheck.valid) return { ok: false, field: 'id', error: idCheck.error };
  const createdReference = parentReference + '.' + idCheck.id;
  if (AppState.index[category].has(createdReference)) {
    return { ok: false, field: 'id', error: 'Another element already uses reference "' + createdReference + '".' };
  }
  try {
    commitElementEdit(parentReference, (node) => {
      node.elements = Array.isArray(node.elements) ? node.elements.slice() : [];
      const child = { kind, id: idCheck.id };
      if (name) child.name = name;
      if (description) child.description = description;
      node.elements.push(child);
    }, category);
  } catch (e) {
    return { ok: false, field: 'kind', error: e && e.message ? e.message : String(e) };
  }
  // UX review follow-up: the new child is wholly unsaved on its own, independent of the parent's own dirty state
  AppState.dirtyReferences.add(createdReference);
  return { ok: true, createdReference, layer: category };
}

// =====================================================================
// Delete (TDD-0010 DEC-4/DEC-6) — the whole-model impact scan, its
// transient confirm/cancel overlay (pendingDeleteConfirmation, declared
// above alongside rawYamlEditDraft), and the one new commit function the
// removal needs — a removal can touch more than one manifest file in one
// commit, which no existing mutator does today.
// =====================================================================

/**
 * The deleted element's own reference plus every reference in the same
 * category's current index that is a former descendant of it (including
 * a cross-file-attached one) — TDD-0010 DEC-4.
 */
function computeDeletedReferenceSet(reference, category) {
  const set = new Set([reference]);
  for (const ref of AppState.index[category].keys()) {
    if (ref === reference || ref.indexOf(reference + '.') === 0) set.add(ref);
  }
  return set;
}

/**
 * Every relationship elsewhere in `category`'s index whose `destination`
 * names a reference in `deletedRefs` (TDD-0010 DEC-4). "Elsewhere"
 * excludes the deleted subtree itself — a relationship owned by an
 * element being deleted anyway is not itself a dangling reference left
 * behind.
 */
function scanDanglingRelationshipsFor(deletedRefs, category) {
  const affected = [];
  for (const record of AppState.index[category].values()) {
    if (deletedRefs.has(record.reference)) continue; // DEC-4: "elsewhere" excludes the deleted subtree itself
    for (const rel of record.relationships) {
      if (deletedRefs.has(rel.destination)) {
        affected.push({ ownerReference: record.reference, ownerSourceFile: record.sourceFile, label: rel.label, destination: rel.destination });
      }
    }
  }
  // a technology node deploys application elements by reference: deleting one takes it off the nodes that list it
  if (category === 'application') {
    for (const record of AppState.index.technology.values()) {
      for (const application of record.applications) {
        if (deletedRefs.has(String(application))) {
          affected.push({ ownerReference: record.reference, ownerSourceFile: record.sourceFile, label: 'deploys application', destination: String(application) });
        }
      }
    }
  }
  return affected;
}

/** The layer a manifest file belongs to (from its header.kind), or null when it is unreadable or of an unknown kind. */
function manifestLayer(mf) {
  if (!mf || mf.error || !mf.header || !mf.header.kind || !mf.content) return null;
  const mapping = ARCHICODE_KIND_MAP[stripArchicodeKindPrefix(mf.header.kind)];
  return mapping ? mapping.category : null;
}

/** The reference of the root element of a manifest file (its header.parent, when it has one, then its id). */
function manifestRootReference(mf) {
  return mf.header && mf.header.parent ? (mf.header.parent + '.' + mf.content.id) : String(mf.content.id);
}

/** Call `fn(node, reference)` for the root element of a manifest file and every element nested in it, whatever the depth. */
function walkContentNodes(mf, fn) {
  if (!mf || !mf.content || typeof mf.content !== 'object') return;
  const walk = (node, reference) => {
    fn(node, reference);
    for (const child of (Array.isArray(node.elements) ? node.elements : [])) {
      if (child && typeof child === 'object' && child.id !== undefined && child.id !== null) walk(child, reference + '.' + String(child.id));
    }
  };
  walk(mf.content, manifestRootReference(mf));
}

/**
 * The manifest files a delete takes away: the element's own file when it is the root of one, and the file of every
 * manifest attached below the deleted set through `header.parent` (their root reference is `<parent>.<id>`, so it is
 * in `deletedRefs`). Leaving them would keep orphans that still declare the deleted element as their parent.
 */
function computeDeletedManifestFiles(deletedRefs, category) {
  return AppState.manifestFiles
    .filter((mf) => manifestLayer(mf) === category && deletedRefs.has(manifestRootReference(mf)))
    .map((mf) => mf.relPath);
}

/** What deleting `reference` does, for the confirmation and for the commit: the references that go, the files that go, the links elsewhere that go with them. */
function computeDeleteImpact(reference, category) {
  const deletedRefs = computeDeletedReferenceSet(reference, category);
  return {
    deletedRefs,
    deletedReferences: Array.from(deletedRefs).filter((ref) => AppState.index[category].has(ref)).sort(),
    affected: scanDanglingRelationshipsFor(deletedRefs, category),
    files: computeDeletedManifestFiles(deletedRefs, category)
  };
}

/**
 * Commit a delete (TDD-0010 DEC-6, resolves FR-10): remove the element
 * (splice from its parent's `content.elements` if nested, or remove its
 * whole manifest file's entry if it was a manifest root) and every
 * relationship `affected` named, together, in one commit. A caller (the
 * `confirm-delete-element` handler) must have already run DEC-4's scan —
 * `affected` is trusted as-is here, never re-scanned.
 *
 * Every "elsewhere" relationship is pruned by re-deriving the removal
 * condition directly against each owner's *live* raw node (via
 * `locateContentNode`) — never by index/array-position identity against
 * the disposable `ElementRecord` copies DEC-4's scan read from, since
 * those are rebuilt fresh on every `buildIndex` call (the same reasoning
 * TDD-0009's DEC-4/`locateContentNode` already established).
 */
function commitDeleteElement(reference, category, affected) {
  category = layerOfReference(reference, category);
  const located = category ? locateContentNode(reference, category) : null;
  if (!located) {
    throw new Error('"' + reference + '" cannot be found in the loaded manifests; nothing was deleted.');
  }
  const touchedRelPaths = new Set(); // relPath strings, not mf object references (see below)

  // The whole subtree goes: the element, what is nested in it, and every manifest attached below it through
  // header.parent (their files are removed too). `affected` (the scan the confirmation showed) is not trusted: the
  // links to prune are re-derived from the live nodes, against exactly the references that are deleted.
  const deletedRefs = computeDeletedReferenceSet(reference, category);
  const removedFiles = new Set(computeDeletedManifestFiles(deletedRefs, category));
  for (const mf of AppState.manifestFiles) {
    if (removedFiles.has(mf.relPath)) continue; // gone with the subtree: nothing to prune in it
    const mfLayer = manifestLayer(mf);
    if (mfLayer === null) continue;
    walkContentNodes(mf, (node, ownerRef) => {
      if (mfLayer === category && Array.isArray(node.relationships)) {
        const kept = node.relationships.filter((r) => !(r && r.destination !== undefined && r.destination !== null && deletedRefs.has(String(r.destination))));
        if (kept.length !== node.relationships.length) {
          node.relationships = kept;
          touchedRelPaths.add(mf.relPath);
          AppState.dirtyReferences.add(ownerRef); // UX review follow-up — this owner's own relationships changed
        }
      }
      // a technology node no longer deploys an application element that is deleted
      if (category === 'application' && mfLayer === 'technology' && Array.isArray(node.applications)) {
        const kept = node.applications.filter((a) => !deletedRefs.has(String(a)));
        if (kept.length !== node.applications.length) {
          node.applications = kept;
          touchedRelPaths.add(mf.relPath);
          AppState.dirtyReferences.add(ownerRef);
        }
      }
    });
  }

  // Remove the element itself: splice from its parent array (nested), then take away the manifest files of the subtree.
  if (located.parentArray !== null) {
    located.parentArray.splice(located.indexInParent, 1);
    touchedRelPaths.add(located.mf.relPath);
  }
  for (const mf of AppState.manifestFiles) {
    if (!removedFiles.has(mf.relPath)) continue;
    if (mf.existedOnDisk && !AppState.pendingFileRemovals.includes(mf.relPath)) {
      AppState.pendingFileRemovals.push(mf.relPath);
      AppState.removedFileBaselines.set(mf.relPath, mf.lastKnownDiskModified); // DEC-9's stale-check needs this baseline
    }
    touchedRelPaths.delete(mf.relPath); // that file no longer exists; nothing to regenerate for it
    if (rawYamlEditDraft && rawYamlEditDraft.relPath === mf.relPath) rawYamlEditDraft = null;
    if (AppState.selection.kind === 'file' && AppState.selection.key === mf.relPath) {
      AppState.selection = { kind: 'none', key: null, mode: 'view' };
    }
  }
  AppState.manifestFiles = AppState.manifestFiles.filter((f) => !removedFiles.has(f.relPath));

  // The deleted elements no longer exist — drop what the UI kept about them (a stale pin on the map would silently
  // come back on a later element with the same reference).
  forgetUiReferences(deletedRefs, category);

  // Regenerate raw YAML exactly once per still-existing touched file.
  // touchedRelPaths is deliberately a plain Set of relPath strings, not
  // of `mf` object references — AppState.manifestFiles is reassigned by
  // `.filter()` above, which would silently invalidate a stale `mf`
  // reference held from before that reassignment.
  for (const mf of AppState.manifestFiles) {
    if (touchedRelPaths.has(mf.relPath)) {
      mf.rawText = serializeManifestFile(mf.header, mf.content);
      mf.dirty = true;
    }
  }

  // (forgetUiReferences above already sent the selection back to the workspace-wide default view when it was the
  // deleted element, or one of its former descendants.)
  pendingDeleteConfirmation = null;
  saveStatus = { state: 'idle' }; // TDD-0010 DEC-11 — a new edit discards any prior save attempt's status
  rebuildIndexAndRender();
}

// =====================================================================
// Save (TDD-0010 DEC-7/DEC-9/DEC-10/DEC-11) — the first functions in the
// whole wave that write to or remove from the real granted directory.
// Every disk-touching call (`createWritable`/`removeEntry`/
// `getFileHandle(..., {create: true})`) lives only in the small set of
// functions below (CON-1/NFR-2/TG-2) — no create/delete/commit function
// above performs disk I/O itself. `ensureWritePermission` elevates the
// granted handle from `read` (every prior grant in this file, per
// `openFolder`/`reopenFolder`/`tryAutoReopen`) to `readwrite`; it must
// only ever be reached from `saveAllChanges`, itself only ever called
// from the save button's own click handler (a user gesture — ASM-2).
// =====================================================================

/**
 * Elevate the granted folder handle's permission from `read` to
 * `readwrite` (TDD-0010 DEC-7, resolves FR-13). `requestPermission` must
 * only be called from inside a user-gesture handler's own synchronous
 * call chain (ASM-2) — the save button's click handler calls
 * `saveAllChanges()` directly, and this is the first `await` reached by
 * it, so the gesture is still active (mirrors CON-3/DEC-4's existing
 * discipline for `reopenFolder`'s `read`-mode request).
 */
async function ensureWritePermission() {
  if (!AppState.folder || !AppState.folder.handle) return false;
  try {
    let permission = await AppState.folder.handle.queryPermission({ mode: 'readwrite' });
    if (permission !== 'granted') {
      permission = await AppState.folder.handle.requestPermission({ mode: 'readwrite' });
    }
    return permission === 'granted';
  } catch (e) {
    console.error('ArchiCode: ensureWritePermission failed', e);
    return false;
  }
}

/**
 * Stat a manifest file (relative to the granted folder) for its current
 * on-disk `lastModified`, without reading its content — the cheap
 * staleness-check primitive FR-16/DEC-9/Q-1 needs. Returns `null` if the
 * file does not exist (e.g. removed externally since this session loaded
 * or last saved it).
 */
async function statManifestFile(relPath) {
  const segments = String(relPath).split('/').filter(Boolean);
  const name = segments.pop();
  try {
    const dir = await getDirectoryHandleByRelativePath(AppState.folder.handle, segments.join('/'));
    const fileHandle = await dir.getFileHandle(name);
    const file = await fileHandle.getFile();
    return file.lastModified;
  } catch (e) {
    if (e && e.name === 'NotFoundError') return null;
    throw e;
  }
}

/**
 * Write a manifest file's current `rawText` to disk (TDD-0010 DEC-9).
 * `getFileHandle(name, {create: !mf.existedOnDisk})` creates the file
 * only for a brand-new one (DEC-5) — an existing file is never created
 * out from under a missing-parent-directory assumption. `createWritable()`
 * truncates-then-writes with no separate truncate call needed (ASM-3).
 * The directory of a brand-new file is created when it is missing (a
 * workspace without its `manifests/` yet); `text` is what is written (the
 * caller keeps it, to tell later whether an edit came in meanwhile).
 */
async function writeManifestFile(mf, text) {
  const segments = String(mf.relPath).split('/').filter(Boolean);
  const name = segments.pop();
  const dir = await getDirectoryHandleByRelativePath(AppState.folder.handle, segments.join('/'), { create: !mf.existedOnDisk });
  const fileHandle = await dir.getFileHandle(name, { create: !mf.existedOnDisk });
  const writable = await fileHandle.createWritable();
  await writable.write(text === undefined ? mf.rawText : text);
  await writable.close();
}

/** Remove a manifest file from disk (TDD-0010 DEC-9, resolves FR-14's removal half) via `removeEntry`. */
async function removeManifestFile(relPath) {
  const segments = String(relPath).split('/').filter(Boolean);
  const name = segments.pop();
  let dir;
  try {
    dir = await getDirectoryHandleByRelativePath(AppState.folder.handle, segments.join('/'));
    await dir.removeEntry(name);
  } catch (e) {
    if (!(e && e.name === 'NotFoundError')) throw e; // already gone from the disk: that is what was asked
  }
}

/** `statManifestFile`'s own counterpart for `workspace.yaml`, which lives at the folder root rather than under a manifests subpath (TDD-0010 DEC-9). */
async function statWorkspaceYaml() {
  try {
    const fileHandle = await AppState.folder.handle.getFileHandle('workspace.yaml');
    const file = await fileHandle.getFile();
    return file.lastModified;
  } catch (e) {
    if (e && e.name === 'NotFoundError') return null;
    throw e;
  }
}

/**
 * The kebab-case inverse of `parseSettings` (TDD-0010 DEC-10, resolves
 * FR-18's `TC-3` extension): every top-level settings field round-trips
 * to the same kebab-case key `.custom`'s real files already use, and
 * every `facets.customs[].actions[]` entry's `jsonPath` maps back to
 * `json-path` — the one *nested* alias `parseSettings` applies below the
 * top level. Every key is
 * always emitted (including any `parseSettings` only ever defaulted
 * because the real file never set it) — a stated, not silent, consequence
 * (TDD-0010 DEC-10). Given the settings as parsed at load time
 * (`rawSettings`), whatever the editor does not manage (other sections, other
 * keys of a section) is kept, after the managed keys of its section.
 */
const SETTINGS_MANAGED_KEYS = {
  manifests: ['paths'],
  relationships: ['default-synthetic-label', 'defaultSyntheticLabel'],
  views: ['path', 'labels', 'properties'],
  facets: ['global-enabled', 'globalEnabled', 'directory-name-template', 'directoryNameTemplate', 'customs']
};

function serializeSettingsToRaw(settings, rawSettings) {
  const managed = serializeManagedSettings(settings);
  if (!rawSettings || typeof rawSettings !== 'object' || Array.isArray(rawSettings)) return managed;
  const out = {};
  for (const key of Object.keys(rawSettings)) {
    if (!Object.prototype.hasOwnProperty.call(managed, key)) {
      setYamlKey(out, key, rawSettings[key]);
      continue;
    }
    const section = rawSettings[key];
    const merged = Object.assign({}, managed[key]);
    if (section && typeof section === 'object' && !Array.isArray(section)) {
      for (const sub of Object.keys(section)) {
        if (SETTINGS_MANAGED_KEYS[key].indexOf(sub) === -1) setYamlKey(merged, sub, section[sub]);
      }
    }
    out[key] = merged;
  }
  for (const key of Object.keys(managed)) {
    if (!Object.prototype.hasOwnProperty.call(out, key)) out[key] = managed[key];
  }
  return out;
}

function serializeManagedSettings(settings) {
  return {
    manifests: { paths: settings.manifests.paths },
    relationships: { 'default-synthetic-label': settings.relationships.defaultSyntheticLabel },
    views: { path: settings.views.path, labels: settings.views.labels, properties: settings.views.properties },
    facets: {
      'global-enabled': settings.facets.globalEnabled,
      'directory-name-template': settings.facets.directoryNameTemplate,
      customs: settings.facets.customs.map((c) => Object.assign({}, c, {
        actions: (c.actions || []).map((action) => {
          const rest = Object.assign({}, action);
          const jsonPath = rest.jsonPath;
          delete rest.jsonPath;
          rest['json-path'] = jsonPath;
          return rest;
        })
      }))
    }
  };
}

/**
 * Write `workspace.yaml` (TDD-0010 DEC-9/DEC-10): `styles`/`formatters`
 * carried through verbatim from `AppState.workspace` (no editing surface
 * in this wave ever touches them), `settings` serialized via
 * `serializeSettingsToRaw`, the whole raw object serialized via `W-3`'s
 * existing `serializeYamlValue` (reused as-is — no second serializer).
 */
async function writeWorkspaceYaml() {
  const ws = AppState.workspace;
  const top = ws.topLevel && typeof ws.topLevel === 'object' ? ws.topLevel : {};
  const managed = {
    styles: ws.styles,
    formatters: ws.formatters,
    settings: serializeSettingsToRaw(ws.settings, top.settings)
  };
  // The top-level keys of the file as they were (and in their order); only the three managed ones are replaced.
  // `styles` and `formatters` are added when the file had none only if they are no longer empty.
  const raw = {};
  for (const key of Object.keys(top)) setYamlKey(raw, key, Object.prototype.hasOwnProperty.call(managed, key) ? managed[key] : top[key]);
  for (const key of Object.keys(managed)) {
    if (Object.prototype.hasOwnProperty.call(raw, key)) continue;
    if (key === 'settings' || isYamlComplexValue(managed[key])) raw[key] = managed[key];
  }
  const text = serializeYamlValue(raw, 0);
  const fileHandle = await AppState.folder.handle.getFileHandle('workspace.yaml');
  const writable = await fileHandle.createWritable();
  await writable.write(text);
  await writable.close();
}

/**
 * `AppState.removedFileBaselines`'s own lookup helper (TDD-0010 DEC-9) —
 * a removed file's own `lastKnownDiskModified` is otherwise unreachable
 * for the stale-check once its `mf` object has left
 * `AppState.manifestFiles` (`commitDeleteElement` populates this map at
 * the moment it pushes to `pendingFileRemovals`).
 */
function removedFileBaseline(relPath) {
  return AppState.removedFileBaselines.has(relPath) ? AppState.removedFileBaselines.get(relPath) : null;
}

/** True when at least one change this session has not yet been saved (TDD-0010 DEC-11, resolves AC-14's visibility rule). */
function hasUnsavedChanges() {
  return countUnsavedChanges() > 0;
}

/** How many things "Save all changes" would write: modified files, pending file removals, and workspace.yaml if its settings changed. */
function countUnsavedChanges() {
  return AppState.manifestFiles.filter((f) => f.dirty).length +
    AppState.pendingFileRemovals.length +
    (AppState.workspace && AppState.workspace.settingsDirty ? 1 : 0);
}

/**
 * Drop every `dirtyReferences` entry whose element currently lives in
 * `relPath` (UX review follow-up) — called once a file's write actually
 * succeeds, mirroring that file's own `f.dirty = false` reset so a save
 * that fails partway through still only clears what really saved.
 */
function clearDirtyReferencesForFile(relPath) {
  for (const category of ['application', 'technology']) {
    for (const record of AppState.index[category].values()) {
      if (record.sourceFile === relPath) AppState.dirtyReferences.delete(record.reference);
    }
  }
}

/**
 * The full save pipeline (TDD-0010 DEC-9, resolves FR-13 through FR-17 and
 * `Q-1`): acquire `readwrite` permission first (DEC-7); if denied, stop
 * writing nothing. Otherwise stale-check *every* dirty file, pending
 * removal, and (if settings changed) `workspace.yaml` — all before any
 * write starts (FR-16/NFR-3) — and refuse the whole attempt, writing
 * nothing at all, if any target has changed on disk since it was loaded
 * or last saved. Only once every target is confirmed fresh does the write
 * phase begin: dirty files, then pending removals, then `workspace.yaml`
 * if its settings changed, each step able to stop-and-report its own
 * failure (FR-17) without rolling back whatever already succeeded.
 */
async function saveAllChanges() {
  if (saveInFlight) return; // a second click (or key) while a save is running: the first one finishes alone
  saveInFlight = true;
  render(); // the Save button is disabled while saving (still inside the user gesture: ensureWritePermission needs it)
  try {
    await performSave();
  } catch (e) {
    console.error('ArchiCode: saving failed', e);
    saveStatus = { state: 'error', failedFile: 'the folder', message: e && e.message ? e.message : String(e) };
  } finally {
    saveInFlight = false;
    render();
  }
}

/** True while `saveAllChanges` runs: the Save button is disabled and a second save is ignored. */
let saveInFlight = false;

async function performSave() {
  if (!(await ensureWritePermission())) {
    saveStatus = { state: 'denied', message: 'Write permission was not granted; nothing was saved.' };
    render();
    return;
  }

  const workspace = AppState.workspace;
  const dirtyFiles = AppState.manifestFiles.filter((f) => f.dirty);
  const removals = AppState.pendingFileRemovals.slice();
  const settingsDirty = workspace.settingsDirty;
  if (dirtyFiles.length === 0 && removals.length === 0 && !settingsDirty) {
    saveStatus = { state: 'success', message: 'Nothing to save.' };
    render();
    return;
  }

  // FR-16/Q-1: stale-check every target this attempt would touch, before
  // any write starts (NFR-3 — never a partial write for a refused save).
  // A failure of the check itself (a restarted server, a revoked token,
  // a vanished folder) is reported like any save error — nothing is written.
  const conflicts = [];
  const unknownOnDisk = []; // new files whose path is taken on disk by a file this editor did not know
  let checking = 'the folder';
  try {
    for (const f of dirtyFiles) {
      checking = f.relPath;
      const current = await statManifestFile(f.relPath);
      if (!f.existedOnDisk) {
        if (current !== null) unknownOnDisk.push(f.relPath); // writing would overwrite it
        continue;
      }
      if (current === null || current !== f.lastKnownDiskModified) conflicts.push(f.relPath);
    }
    for (const relPath of removals) {
      checking = relPath;
      const current = await statManifestFile(relPath);
      const baseline = removedFileBaseline(relPath);
      if (current !== null && current !== baseline) conflicts.push(relPath);
    }
    if (settingsDirty) {
      checking = 'workspace.yaml';
      const current = await statWorkspaceYaml();
      if (current !== workspace.settingsLastKnownDiskModified) conflicts.push('workspace.yaml');
    }
  } catch (e) {
    saveStatus = { state: 'error', failedFile: checking, message: 'could not check it on disk before saving (' + (e && e.message ? e.message : String(e)) + '). Nothing was saved.' };
    render();
    return;
  }
  if (unknownOnDisk.length > 0) {
    saveStatus = {
      state: 'error', failedFile: unknownOnDisk.join(', '),
      message: 'a file already exists at ' + (unknownOnDisk.length === 1 ? 'this path' : 'these paths') + ' on disk, but this editor did not know it (it was added since the folder was opened). ' +
        'Saving would overwrite it, so nothing was saved. Reopen the folder to load it, then create the element again.'
    };
    render();
    return;
  }
  if (conflicts.length > 0) {
    saveStatus = { state: 'conflict', conflicts };
    render();
    return;
  }

  // Write phase (FR-14/FR-17/FR-19): stop at the first failure, name it,
  // leave everything already written in this attempt as written.
  for (const f of dirtyFiles) {
    try {
      const writtenText = f.rawText; // what goes to the disk: an edit made during the awaits below is not in it
      await writeManifestFile(f, writtenText);
      const modified = await statManifestFile(f.relPath); // FR-19 — this file's own new baseline
      // the file the model holds now (an edit can have replaced the object, or deleted the element meanwhile)
      const live = AppState.manifestFiles.find((x) => x.relPath === f.relPath);
      if (live) {
        live.existedOnDisk = true;
        live.lastKnownDiskModified = modified;
        if (live.rawText === writtenText) { // only what was written is clean: a later edit stays to be saved
          live.dirty = false;
          clearDirtyReferencesForFile(f.relPath); // UX review follow-up
        }
      } else if (!AppState.pendingFileRemovals.includes(f.relPath)) {
        AppState.pendingFileRemovals.push(f.relPath); // deleted while it was being created: take it off the disk too
        AppState.removedFileBaselines.set(f.relPath, modified);
      }
    } catch (e) {
      saveStatus = { state: 'error', failedFile: f.relPath, message: e && e.message ? e.message : String(e) };
      render();
      return;
    }
  }
  for (const relPath of removals) {
    try {
      // a file of the model now stands at this path (a new element took it): it was just written, never remove it
      if (!AppState.manifestFiles.some((x) => x.relPath === relPath)) await removeManifestFile(relPath);
      AppState.pendingFileRemovals = AppState.pendingFileRemovals.filter((p) => p !== relPath);
      AppState.removedFileBaselines.delete(relPath);
    } catch (e) {
      saveStatus = { state: 'error', failedFile: relPath, message: e && e.message ? e.message : String(e) };
      render();
      return;
    }
  }
  if (settingsDirty) {
    try {
      const revision = workspace.settingsRevision || 0;
      await writeWorkspaceYaml();
      if ((workspace.settingsRevision || 0) === revision) workspace.settingsDirty = false; // a settings edit made meanwhile stays to be saved
      workspace.settingsLastKnownDiskModified = await statWorkspaceYaml(); // FR-19
    } catch (e) {
      saveStatus = { state: 'error', failedFile: 'workspace.yaml', message: e && e.message ? e.message : String(e) };
      render();
      return;
    }
  }

  saveStatus = { state: 'success', message: hasUnsavedChanges() ? 'Saved. Changes made while saving are not saved yet.' : 'Saved.' };
  render();
}

/**
 * The text of the file-edit view's editor as it is on screen right now —
 * the live CodeMirror doc, else the fallback textarea — or null when no
 * file is being edited.
 */
function currentFileEditorText() {
  if (activeFileEditorView) return activeFileEditorView.state.doc.toString();
  const textarea = document.getElementById('file-edit-textarea');
  return textarea ? textarea.value : null;
}

/**
 * True when reloading `relPath` from disk would throw something away: the
 * file was edited in memory (`mf.dirty`, from any surface), a rejected
 * draft is pending, or text was typed in its editor but not applied yet.
 */
function fileHasUnsavedChanges(relPath) {
  const mf = AppState.manifestFiles.find((f) => f.relPath === relPath);
  if (!mf) return false;
  if (mf.dirty) return true;
  if (rawYamlEditDraft && rawYamlEditDraft.relPath === relPath) return true;
  const editorText = currentFileEditorText();
  return editorText !== null && editorText !== mf.rawText;
}

/**
 * Reload one manifest file from disk, discarding every unsaved change to
 * it (form edits and raw-YAML edits alike): re-read and re-parse it, swap
 * its entry in, forget its elements' "modified" markers, and rebuild the
 * index. Other files are deliberately untouched — a delete or rename may
 * have changed relationships in them too, and those stay modified (the
 * confirmation in the click handler says so). A file that does not exist
 * on disk yet has nothing to reload and is left alone; a read failure
 * keeps the in-memory state and reports through `saveStatus`.
 */
async function reloadManifestFile(relPath) {
  const mf = AppState.manifestFiles.find((f) => f.relPath === relPath);
  if (!mf || !mf.existedOnDisk) return;

  let rawText;
  let lastModified;
  try {
    const segments = String(relPath).split('/').filter(Boolean);
    const name = segments.pop();
    const dir = await getDirectoryHandleByRelativePath(AppState.folder.handle, segments.join('/'));
    const file = await (await dir.getFileHandle(name)).getFile();
    lastModified = file.lastModified;
    rawText = await file.text();
  } catch (e) {
    saveStatus = { state: 'reload-error', failedFile: relPath, message: e && e.message ? e.message : String(e) };
    render();
    return;
  }

  const { header, content, error } = parseManifestText(rawText);
  clearDirtyReferencesForFile(relPath); // before the index is rebuilt: it still knows this file's current elements
  AppState.manifestFiles = AppState.manifestFiles.map((f) =>
    f.relPath === relPath
      ? { relPath, rawText, header, content, error, dirty: false, existedOnDisk: true, lastKnownDiskModified: lastModified }
      : f
  );
  if (rawYamlEditDraft && rawYamlEditDraft.relPath === relPath) rawYamlEditDraft = null;
  saveStatus = { state: 'idle' };
  rebuildIndexAndRender();

  // The reloaded file may no longer contain the selected element.
  const sel = AppState.selection;
  if (sel.kind === 'element' && !findElementRecord(sel.key)) {
    AppState.selection = { kind: 'none', key: null, mode: 'view' };
    render();
  }
}

/**
 * Commit a raw-YAML edit (TDD-0009 DEC-6): scratch-validate, never
 * mutate-then-rollback. Parses `newText` the same way `loadWorkspace`
 * parses a manifest file at load time; if that succeeds, re-derives the
 * index against a *scratch* copy of `AppState.manifestFiles` (reusing
 * `buildIndex` as-is, including its own header.kind/content.id and
 * ARCHICODE_KIND_MAP checks) before ever touching live state. Only a
 * fully-valid edit is swapped into `AppState.manifestFiles`; an invalid
 * edit leaves `AppState` completely untouched and records the rejected
 * draft (with its error) in `rawYamlEditDraft` for `renderFileViewHtml`
 * to show (NFR-3 — "never corrupt the model").
 */
function commitFileEdit(relPath, newText) {
  // Step 1: parse — loadWorkspace's own per-file inline logic, copied
  // verbatim (DEC-6 step 1).
  const { header, content, error: parseError } = parseManifestText(newText);
  let error = parseError;

  // Step 3 (only reached if step 1 didn't already set `error`): scratch
  // copy + buildIndex, reusing its own header.kind/content.id and
  // ARCHICODE_KIND_MAP checks to complete the validation for free.
  let scratchFiles = null;
  if (!error) {
    scratchFiles = AppState.manifestFiles.map((f) =>
      f.relPath === relPath ? { ...f, rawText: newText, header, content, error: null, dirty: true } : f // TDD-0010 DEC-8
    );
    buildIndex(scratchFiles, AppState.workspace.settings);
    const scratchMf = scratchFiles.find((f) => f.relPath === relPath);
    error = scratchMf ? scratchMf.error : null;
  }

  // Step 4: invalid — do not touch AppState.manifestFiles/AppState.index
  // at all; record the draft (with its error) and re-render.
  if (error) {
    rawYamlEditDraft = { relPath, text: newText, error };
    render();
    return;
  }

  // Step 5: valid — swap the scratch array in (the one file's entry
  // replaced, every other entry the same object reference), clear the
  // draft, and rebuild+render via the single shared pipeline.
  AppState.manifestFiles = scratchFiles;
  rawYamlEditDraft = null;
  saveStatus = { state: 'idle' }; // TDD-0010 DEC-11 — a new edit discards any prior save attempt's status
  rebuildIndexAndRender();
}

/**
 * DEC-8 — after an `id` rename's `commitElementEdit` call returns
 * `{ renamedTo: { from, to } }`, rewrite every reference under the old
 * prefix (`AppState.selection.key` and every `AppState.expanded` entry)
 * to the new prefix, so a rename of the currently-selected/expanded
 * element (or one of its ancestors) does not leave the tree pointing at
 * a reference that no longer exists after the rebuild `commitElementEdit`
 * already ran. Re-renders once more at the end (the rebuild inside
 * `commitElementEdit` already rendered once, with the *stale* key).
 */
function rewriteReferencePrefix(oldPrefix, newPrefix, layer) {
  rewriteUiReferences(oldPrefix, newPrefix, layer);
  render();
}

/** `value` with the reference prefix `oldRef` (the reference itself, or a descendant of it, on a '.' boundary) replaced by `newRef`; `value` itself when it does not point there. */
function rewriteReferenceValue(value, oldRef, newRef) {
  if (typeof value !== 'string') return value;
  if (value === oldRef) return newRef;
  if (value.indexOf(oldRef + '.') === 0) return newRef + value.slice(oldRef.length);
  return value;
}

/**
 * The UI state that holds element references, rewritten for a rename (no render): the selection, the expanded sets,
 * the "modified" markers, the row of the tree that has the focus, and the state of the Map (pinned, hidden, opened) —
 * left alone, a stale pin on the map would silently disappear, or re-attach to a later element with the same
 * reference. `layer` limits what is layer-bound (the selection; the Map, which only draws the application layer).
 */
function rewriteUiReferences(oldPrefix, newPrefix, layer) {
  const rewrite = (value) => rewriteReferenceValue(value, oldPrefix, newPrefix);
  const rewriteSet = (set) => new Set(Array.from(set).map(rewrite));
  const sel = AppState.selection;
  if (sel.kind === 'element' && sel.key && (!layer || layerOfReference(sel.key, sel.layer) === layer)) {
    sel.key = rewrite(sel.key);
  } else if (sel.kind === 'create' && sel.parentReference && (!layer || layer === sel.category)) {
    sel.parentReference = rewrite(sel.parentReference);
  }
  AppState.expanded = rewriteSet(AppState.expanded);
  // UX review follow-up: dirtyReferences holds the *old* reference (added by commitElementEdit before a
  // rename-aware rewrite runs) — carry it over to the new one.
  AppState.dirtyReferences = rewriteSet(AppState.dirtyReferences);
  if (navActiveRef) navActiveRef = rewrite(navActiveRef);
  if (!layer || layer === 'application') {
    mapPinned = mapPinned.map(rewrite);
    mapHidden = mapHidden.map(rewrite);
    if (mapOpened) mapOpened = rewriteSet(mapOpened);
  }
  // a delete confirmation lists what the old reference would take with it: it is stale now
  pendingDeleteConfirmation = null;
}

/** The UI state that held `deletedRefs` (a set of references of `layer`) forgets them: selection, expanded, modified markers, focus row, Map. */
function forgetUiReferences(deletedRefs, layer) {
  const gone = (value) => typeof value === 'string' && deletedRefs.has(value);
  const sel = AppState.selection;
  if (sel.kind === 'element' && gone(sel.key) && layerOfReference(sel.key, sel.layer) === layer) {
    AppState.selection = { kind: 'none', key: null, mode: 'view' };
  } else if (sel.kind === 'create' && gone(sel.parentReference) && sel.category === layer) {
    AppState.selection = { kind: 'none', key: null, mode: 'view' };
  }
  for (const ref of deletedRefs) {
    AppState.expanded.delete(ref);
    AppState.dirtyReferences.delete(ref);
  }
  if (gone(navActiveRef)) navActiveRef = null;
  if (layer === 'application') {
    mapPinned = mapPinned.filter((ref) => !gone(ref));
    mapHidden = mapHidden.filter((ref) => !gone(ref));
    if (mapOpened) for (const ref of Array.from(mapOpened)) if (gone(ref)) mapOpened.delete(ref);
  }
}

/**
 * Rewrite every reference TO a renamed element in the manifests (the model; the element's own id was changed by the
 * caller): relationship `destination`s anywhere, in the layer of the element; the `applications` entries of
 * technology nodes when an application element was renamed; and the `header.parent` of the manifests attached to
 * the old reference or below it. A reference below `oldRef` follows (`a.b` → `c.b`), on the '.' boundary only
 * (`a2` is not below `a`). Every file that changed is regenerated and marked dirty, and so are its owners'
 * "modified" markers. Returns the relPaths of the files changed.
 */
function rewriteInboundReferences(oldRef, newRef, layer) {
  const changedFiles = [];
  for (const mf of AppState.manifestFiles) {
    const mfLayer = manifestLayer(mf);
    if (mfLayer === null) continue;
    let changed = false;
    if (mfLayer === layer && typeof mf.header.parent === 'string') {
      const parent = rewriteReferenceValue(mf.header.parent, oldRef, newRef);
      if (parent !== mf.header.parent) { mf.header.parent = parent; changed = true; AppState.dirtyReferences.add(manifestRootReference(mf)); }
    }
    walkContentNodes(mf, (node, ownerRef) => {
      if (mfLayer === layer && Array.isArray(node.relationships)) {
        for (const rel of node.relationships) {
          if (!rel || typeof rel !== 'object') continue;
          const destination = rewriteReferenceValue(rel.destination, oldRef, newRef);
          if (destination !== rel.destination) { rel.destination = destination; changed = true; AppState.dirtyReferences.add(ownerRef); }
        }
      }
      if (layer === 'application' && mfLayer === 'technology' && Array.isArray(node.applications)) {
        const applications = node.applications.map((a) => rewriteReferenceValue(a, oldRef, newRef));
        if (applications.some((a, i) => a !== node.applications[i])) { node.applications = applications; changed = true; AppState.dirtyReferences.add(ownerRef); }
      }
    });
    if (changed) {
      mf.rawText = serializeManifestFile(mf.header, mf.content);
      mf.dirty = true;
      changedFiles.push(mf.relPath);
    }
  }
  return changedFiles;
}

// =====================================================================
// Structured-form validation rules (TDD-0009 DEC-9, resolves FR-20) —
// one small, independently-callable function per rule. Every function
// here is pure (reads AppState only where a rule needs it, e.g. the id-
// collision check; never mutates AppState) and returns either
// `{ valid: true, ... }` (with whatever normalized value(s) the caller
