<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Which ArchiCode this page belongs to: "dev" here, the release in the copies that are published and served. -->
<meta name="archicode-version" content="dev">
<title>ArchiCode Standalone Editor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #d0d0d0;
    --accent: #2b6cb0;
    --danger: #b00020;
    --panel-bg: #f7f7f8;
    --modified: #b7791f;
    --on-accent: #ffffff;
    --on-modified: #1a1a1a; /* text on the --modified badge: 4.8:1 (white on it is 3.6:1) */
    --header-h: 3rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --on-accent: #10243a;
      --on-modified: #10243a;
      --bg: #1e1e1e;
      --fg: #e8e8e8;
      --muted: #999999;
      --border: #3a3a3a;
      --accent: #6cb0f0;
      --danger: #ff6b6b;
      --panel-bg: #262626;
      --modified: #f0c674;
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  /* !important: it keeps these controls the same whatever a more specific reset or a later rule says about a
     button's or an input's border, padding and background. */
  button { font: inherit; padding: 0.4rem 0.9rem !important; border: 1px solid var(--border) !important; border-radius: 4px !important; background: var(--panel-bg) !important; color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent) !important; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--border) !important; }
  input[type="text"], textarea, select { font: inherit; padding: 0.3rem 0.5rem !important; border: 1px solid var(--border) !important; border-radius: 4px !important; background: var(--bg) !important; color: var(--fg); }
  /* A stacked field's own input/select spans its field-value column, matching the
     full-width textarea below it (form UX review follow-up) — scoped to a direct
     child so it never widens the inline relationship/add-row inputs elsewhere. */
  .field-value > input[type="text"], .field-value > select { width: 100%; }
  /* Auto-grow textarea (form UX review follow-up): height is set in JS from
     scrollHeight, capped at AUTO_GROW_MAX_LINES; resize:none because a manual
     drag handle would fight that automatic height. */
  .auto-grow-textarea { width: 100%; resize: none; overflow-y: hidden; display: block; }
  /* Landing screen: every state shown before a workspace is open (first launch,
     reopen, busy, error, unsupported browser) shares this one centered card. */
  .landing { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .landing-card { width: 100%; max-width: 28rem; display: flex; flex-direction: column; gap: 0.9rem; padding: 1.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-bg); }
  .landing-brand { display: flex; align-items: center; gap: 0.5rem; color: var(--accent); font-weight: 600; letter-spacing: 0.01em; }
  .landing-card h1 { margin: 0; font-size: 1.35rem; font-weight: 600; }
  .landing-text, .landing-note, .landing-hint { margin: 0; line-height: 1.5; }
  .landing-note, .landing-hint { color: var(--muted); font-size: 0.875rem; }
  .landing-card .error-panel { margin: 0; overflow-wrap: anywhere; }
  .landing-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.25rem; }
  .landing-actions button { display: inline-flex; align-items: center; gap: 0.5rem; }
  button.btn-primary { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--on-accent); font-weight: 600; }
  button.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.btn-primary:disabled:hover { border-color: var(--accent) !important; }
  /* Danger: outlined by default, filled on hover (Delete); filled always for the final confirmation. */
  button.btn-danger { color: var(--danger); border-color: var(--danger) !important; }
  button.btn-danger:hover:not(:disabled) { background: var(--danger) !important; border-color: var(--danger) !important; color: var(--on-accent); }
  button.btn-danger-solid { background: var(--danger) !important; border-color: var(--danger) !important; color: var(--on-accent); font-weight: 600; }
  button.btn-danger-solid:hover { filter: brightness(1.08); border-color: var(--danger) !important; }
  /* Ghost: a rare, low-emphasis action (Close folder). */
  button.btn-ghost { background: transparent !important; border-color: transparent !important; color: var(--muted); }
  button.btn-ghost:hover { color: var(--fg); border-color: var(--border) !important; }
  .landing button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .landing-busy { display: flex; align-items: center; gap: 0.75rem; margin: 0; }
  .landing-spinner { flex: none; width: 1.1rem; height: 1.1rem; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: landing-spin 0.8s linear infinite; }
  @keyframes landing-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .landing-spinner { animation: none; border-top-color: var(--border); border-right-color: var(--accent); } }
  .diagnostics { padding: 1rem; }
  .diagnostics ul { line-height: 1.6; }
  .error-panel { margin: 1rem; padding: 0.75rem 1rem; border: 1px solid var(--danger); border-radius: 4px; color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .error-panel ul { margin: 0.5rem 0 0; }
  code, pre { font-family: ui-monospace, Menlo, Consolas, monospace; }

  /* ---- Resizable grid shell (layout adapted from archi-edtior.html reference) ----
     Grid structure and panel sizing/resizing live as the layout helpers above
     + inline styles directly in the markup (renderShellHtml); the rules below
     are the content-level concerns: panel backgrounds/borders and the resize
     handles' own appearance. */
  html, body { height: 100%; }
  #app { height: 100vh; }
  .app-shell { height: 100%; }

  /* The bar wraps instead of clipping: down to 360px the folder name, the tabs, the save button and "?" stay reachable. */
  .top-panel { border-bottom: 1px solid var(--border); background: var(--panel-bg); flex-wrap: wrap; gap: 0.25rem 1rem; padding-top: 0.25rem; padding-bottom: 0.25rem; min-height: var(--header-h); }
  .folder-name { font-weight: 600; cursor: default; }
  .folder-root-slash { color: var(--muted); margin-left: 0.1rem; }

  .perspective-tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  /* Both headers share one control size (2rem) so buttons line up from the top bar down to the center header. */
  .top-panel button, .element-header button { height: 2rem; padding: 0 0.8rem !important; font-size: 0.875rem; line-height: 1.25; white-space: nowrap; }
  .top-panel .perspective-tab { padding: 0 0.8rem !important; border-radius: 999px !important; font-size: 0.8rem; }
  .top-panel .perspective-tab.active { background: var(--accent) !important; color: var(--on-accent); border-color: var(--accent) !important; }
  .top-panel > button, .top-panel .perspective-tabs { flex-shrink: 0; }
  .top-panel > .folder-name { flex: 0 1 auto; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .help-wrap { position: relative; flex-shrink: 0; }
  .top-actions { display: flex; align-items: center; gap: 1rem; margin-left: auto; min-width: 0; max-width: 100%; }
  .top-actions > button { flex-shrink: 0; }
  .top-panel .help-button { width: 2rem; padding: 0 !important; border-radius: 50% !important; flex-shrink: 0; font-weight: 600; }
  .top-panel .help-button[aria-expanded="true"] { background: var(--accent) !important; color: var(--on-accent); border-color: var(--accent) !important; }
  .help-menu { position: absolute; top: calc(100% + 0.25rem); right: 0; z-index: 30; width: min(21rem, calc(100vw - 2rem)); padding: 0.4rem 0; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); }
  .help-menu ul { padding: 0.1rem 0; }
  .help-menu li a { display: block; padding: 0.35rem 1rem; color: var(--accent); }
  .help-menu li a:hover, .help-menu li a:focus-visible { background: color-mix(in srgb, var(--accent) 10%, transparent); text-decoration: underline; outline: none; }
  .help-note { margin: 0; padding: 0.4rem 1rem 0; font-size: 0.8rem; line-height: 1.4; color: var(--muted); border-top: 1px solid var(--border); }
  .help-note + .help-note { border-top: none; padding-top: 0.2rem; padding-bottom: 0.2rem; }
  .settings-help a, .landing-note a { color: var(--accent); text-decoration: underline; }
  .top-panel .save-status { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .left-panel { overflow-y: auto; border-right: 1px solid var(--border); background: var(--panel-bg); padding-bottom: 1rem; }
  .right-panel, .bottom-panel { overflow: auto; background: var(--panel-bg); padding: 1rem; }
  .right-panel h3, .bottom-panel h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 0.5rem; }
  .right-panel { border-left: 1px solid var(--border); }
  .bottom-panel { border-top: 1px solid var(--border); }

  [data-resize] { background: var(--border); flex-shrink: 0; }
  [data-resize]:hover, [data-resize][data-active] { background: var(--accent); }

  .nav-section { border-bottom: 1px solid var(--border); padding: 0.4rem 0; }
  .nav-section:last-child { border-bottom: none; }
  .nav-section-title { padding: 0.3rem 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .nav-row { padding: 0.35rem 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
  .nav-row:focus-visible, .tree-branch-title:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-row:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .nav-row.active { background: color-mix(in srgb, var(--accent) 18%, transparent); font-weight: 600; }
  .file-row { justify-content: space-between; }
  .file-relpath { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row.has-error .file-relpath { color: var(--danger); }
  .error-badge { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--on-accent); background: var(--danger); border-radius: 3px; padding: 0.05rem 0.35rem; flex-shrink: 0; }
  .modified-badge { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--on-modified); background: var(--modified); border-radius: 3px; padding: 0.05rem 0.35rem; flex-shrink: 0; }

  .tree-branch-header { padding: 0.35rem 0.5rem 0.35rem 1rem; cursor: pointer; font-weight: 600; user-select: none; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .tree-branch-header:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .tree-branch-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-branch-add-btn { padding: 0.1rem 0.5rem !important; font-size: 0.75rem; flex-shrink: 0; }
  .tree-branch-body { padding-bottom: 0.25rem; }
  .tree-empty { padding: 0.25rem 1.5rem; color: var(--muted); font-size: 0.85rem; }
  .tree-node-children { margin-left: 0; } /* indentation is the padding of each row, so that a hover or selection bar reaches the edge */
  .tree-node-row { display: flex; align-items: center; gap: 0.35rem; padding: 0.25rem 1rem 0.25rem calc(1rem + (var(--level, 1) - 1) * 1rem); cursor: pointer; }
  .tree-node-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .modified-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--modified); flex-shrink: 0; }
  .nav-facet-note { padding: 0.2rem 1rem 0.4rem; font-size: 0.8rem; color: var(--muted); }
  .nav-facet-note button { padding: 0 !important; border: none !important; background: none !important; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }
  .tree-node-row:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .tree-node-row.active { background: color-mix(in srgb, var(--accent) 18%, transparent); font-weight: 600; }
  .tree-node-row.quiet .tree-node-label, .tree-node-row.quiet .tree-node-kind { opacity: 0.45; }
  .tree-toggle { width: 1rem; flex-shrink: 0; text-align: center; color: var(--muted); user-select: none; }
  .tree-toggle-empty { visibility: hidden; }
  .tree-node-kind { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 0.3rem; flex-shrink: 0; }
  .tree-node-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* No vertical padding here on purpose — every view supplies its own top
     and bottom inset instead (see each below). A view with a sticky
     .element-header needs nothing to cancel at the top; and *any* child
     whose own height/margin tricks are meant to reach this panel's real
     bottom edge (.file-view) must do so against a parent with zero
     padding of its own, or the two fights (the child's reach-the-bottom
     math and the parent's own padding) double up into a second,
     unwanted scrollbar on .center-panel itself, on top of the child's. */
  .center-panel { overflow-y: auto; padding: 0 1.75rem; }
  .center-panel > .center-placeholder { padding: 1.25rem 0; }
  .center-placeholder { color: var(--muted); }
  .shell-error-panel { margin: 1rem; }

  .settings-view h2, .file-view h2, .element-header h2, .create-element-form h2 { margin-top: 0; }
  /* These two have no sticky header of their own (unlike element/file
     views below), so — unlike those — they still need their own top and
     bottom inset now that .center-panel itself provides neither. */
  .create-element-form { padding: 1.25rem 0; }
  .settings-view { padding-bottom: 1.25rem; }
  /* Element view/edit have a sticky header supplying their own top inset
     already; only the bottom is still needed. */
  .element-view, .element-edition-form { padding-bottom: 1.25rem; }

  /* The edit area fills whatever room the Files perspective's center panel
     actually has (now that perspective hides right/bottom and gives it
     the full width) rather than guessing a size from the viewport — a
     flex column whose textarea grows to fill it. .center-panel has no
     padding of its own (see above), so height:100% alone already reaches
     its real bottom edge, with nothing left over to reclaim. */
  .file-view { display: flex; flex-direction: column; height: 100%; }
  /* Edge-to-edge: no gap below the header (its shared margin-bottom is for
     views with content below that wants breathing room; a text editor
     doesn't), and the edit area bleeds past .center-panel's left/right
     padding the same way the header's own background already does —
     borderless on the sides that now coincide with the panel's real edge,
     since there's nothing left to visually separate there. */
  .file-view .element-header { margin-bottom: 0; }
  /* Shared by both the plain-textarea fallback and the CodeMirror host div
     (form UX review follow-up, "un éditeur YAML en lieu et place du
     textarea") — the box itself (background/border/edge-to-edge bleed/flex
     sizing) is identical either way; only the content-rendering specifics
     below differ per surface. */
  .file-view .raw-yaml {
    background: var(--panel-bg);
    border: 1px solid var(--border); border-left: none; border-right: none; border-radius: 0;
    margin: 0 -1.75rem; flex: 1 1 auto; min-height: 0;
  }
  .file-view textarea.raw-yaml {
    padding: 1rem 1.75rem; overflow: auto; white-space: pre;
    resize: none; /* the browser's own drag-to-resize grip makes no sense on a textarea whose size is already driven by the flex layout around it */
  }
  /* CodeMirror manages its own internal scrolling (.cm-scroller) — the host
     div only needs to hand it a definite height to fill (a flex item with
     flex:1 1 auto already has one, same as the textarea above). */
  .file-view div.raw-yaml .cm-editor { height: 100%; padding: 0 1.75rem; }

  /* Diagram perspective: a flex column filling the center panel exactly (like .file-view), so the header stays put
     and only the canvas scrolls — and only when the diagram is bigger than the room it has. The stage bleeds to the
     panel's edges; the tools float over its corner without scrolling with it. */
  .diagram-view { display: flex; flex-direction: column; height: 100%; }
  .diagram-view .element-header { margin-bottom: 0; flex: none; }
  .diagram-stage { position: relative; flex: 1 1 0; min-height: 0; margin: 0 -1.75rem; background: var(--panel-bg); }
  .diagram-canvas { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  .diagram-canvas.panning { cursor: grabbing; user-select: none; }
  .diagram-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .diagram-canvas svg { position: absolute; left: 0; top: 0; display: block; max-width: none; transform-origin: 0 0; }
  .diagram-canvas > .muted, .diagram-canvas > .error-panel { position: absolute; left: 0.75rem; top: 0.75rem; right: 0.75rem; }
  .diagram-empty button { margin-left: 0.25rem; }
  .map-scope-hint { color: var(--muted); font-size: 0.8rem; padding: 0 1rem 0.5rem; }
  .map-scope-row { position: relative; padding-left: calc(0.5rem + (var(--level, 1) - 1) * 0.75rem); padding-right: 0.5rem; }
  .nav-tools { display: inline-flex; gap: 0.1rem; }
  .tree-branch-actions { display: inline-flex; align-items: center; gap: 0.15rem; flex-shrink: 0; }
  .tree-branch-actions .map-scope-btn { width: 1.4rem; height: 1.4rem; }
  .nav-title-with-tools { display: flex; align-items: center; justify-content: space-between; }
  .map-scope-row.off-map .tree-node-label, .map-scope-row.off-map .tree-node-kind { opacity: 0.45; }
  .map-scope-row .tree-node-kind { font-size: 0.6rem; padding: 0 0.2rem; }
  .map-scope-row .tree-node-label { flex: 1 1 auto; min-width: 0; }
  /* Pin and Hide float over the end of the row when they are wanted: they take no room from the name the rest of the time.
     (The page-wide button rule sets padding, border and background with !important: these must say it too.) */
  .map-scope-row { --row-bg: var(--panel-bg); }
  .map-scope-row.pinned { --row-bg: color-mix(in srgb, var(--accent) 9%, var(--panel-bg)); background: var(--row-bg); }
  .map-scope-row:hover { --row-bg: color-mix(in srgb, var(--accent) 10%, var(--panel-bg)); }
  .map-scope-row .map-scope-actions { position: absolute; right: 0.25rem; top: 50%; transform: translateY(-50%); display: inline-flex; gap: 0.1rem;
    padding-left: 1.25rem; background: linear-gradient(to right, transparent, var(--row-bg) 1.25rem); opacity: 0; pointer-events: none; }
  .map-scope-row:hover .map-scope-actions, .map-scope-row:focus-within .map-scope-actions { opacity: 1; pointer-events: auto; }
  .map-scope-row { cursor: default; }
  .map-scope-row.foldable { cursor: pointer; }
  .map-scope-btn { display: inline-flex; align-items: center; justify-content: center; width: 1.6rem; height: 1.6rem; padding: 0 !important; border: 1px solid transparent !important; border-radius: 5px !important;
    background: transparent !important; color: var(--muted); cursor: pointer; }
  .map-scope-btn svg { display: block; width: 15px; height: 15px; flex: none; }
  .map-scope-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 16%, transparent) !important; color: var(--fg); border-color: transparent !important; }
  .map-scope-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .map-scope-btn[aria-pressed="true"] { color: var(--accent); }
  .map-scope-btn:disabled { cursor: not-allowed; opacity: 0.3; }
  /* a pinned element: tinted row, accent kind, bold name and the pin itself — readable at a glance, without hovering */
  .map-scope-mark { display: inline-flex; color: var(--accent); flex-shrink: 0; margin-right: 0.15rem; }
  .map-scope-mark svg { width: 13px; height: 13px; }
  .map-scope-row.pinned .tree-node-kind { color: var(--accent); border-color: var(--accent); }
  .map-scope-row.pinned .tree-node-label { font-weight: 600; }
  .map-scope-row.left-out .tree-node-label, .map-scope-row.left-out .tree-node-kind { opacity: 0.4; text-decoration: line-through; }
  /* no hover on a touch screen: the buttons stay, after the name */
  @media (hover: none) { .map-scope-row .map-scope-actions { position: static; transform: none; background: none; opacity: 1; pointer-events: auto; padding-left: 0; } }
  /* floats over the top left of the map, as the tools float over its bottom: no band, no height taken from the drawing */
  .map-chips { position: absolute; top: 0.6rem; left: 0.75rem; right: 0.75rem; z-index: 2; display: flex; flex-wrap: wrap; gap: 0.4rem; pointer-events: none; }
  .map-chips > * { pointer-events: auto; }
  .map-chips-clear { height: 1.7rem; padding: 0 0.7rem !important; border-radius: 999px !important; font-size: 0.82rem; color: var(--muted); background: color-mix(in srgb, var(--panel-bg) 92%, transparent) !important; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
  .map-chip { display: inline-flex; align-items: center; gap: 0.1rem; border: 1px solid var(--border); border-radius: 999px; padding: 0 0.15rem 0 0.7rem; height: 1.7rem; font-size: 0.82rem; background: color-mix(in srgb, var(--panel-bg) 92%, transparent); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
  .map-chip-pin { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel-bg)); }
  /* (the page-wide button rule uses !important for padding, border and background: the chip's cross has to as well) */
  .map-chip button { display: inline-flex; align-items: center; justify-content: center; width: 1.3rem; height: 1.3rem; padding: 0 !important; border: 0 !important; border-radius: 999px !important;
    background: transparent !important; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; }
  .map-chip button:hover { background: color-mix(in srgb, var(--accent) 18%, transparent) !important; color: var(--fg); }
  .diagram-canvas > .dg-list { position: absolute; inset: 0; overflow: auto; padding: 0.75rem; cursor: auto; }
  .diagram-tools { position: absolute; right: 1.5rem; bottom: 1.5rem; display: flex; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 2rem); gap: 0.25rem; padding: 0.2rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }
  .diagram-tools-sep { width: 1px; margin: 0.15rem 0.1rem; background: var(--border); }
  .diagram-tools button { height: 1.75rem; min-width: 1.75rem; padding: 0 0.5rem !important; font-size: 0.8rem; white-space: nowrap; }
  .diagram-tools button[aria-pressed="true"], .diagram-tools button[data-lit="true"] { background: var(--accent) !important; color: var(--on-accent); border-color: var(--accent) !important; }

<div id="app"></div>

<!--
  CodeMirror, for the raw-YAML file editor (form UX review follow-up — "un
  éditeur YAML en lieu et place du textarea"). Loaded from esm.sh rather
  than jsdelivr's "+esm" endpoint: jsdelivr bundles each package's own copy
  of its shared @codemirror/state and @codemirror/view dependencies, which
  crashes CodeMirror with "multiple instances... breaking instanceof
  checks" the moment both codemirror and @codemirror/lang-yaml are loaded
  together — confirmed live in a browser before writing this. esm.sh
  dedupes shared dependencies across separate imports and does not have
  that problem.
  The module does not hold up the app's first render (a refresh reopens the
  remembered folder from IndexedDB well before esm.sh answers), so it fires
  "codemirror-ready" once loaded and the app re-renders any fallback
  textarea it already showed — see the listener next to the bootstrap.
  window.CM stays undefined (never thrown) on any failure here — offline,
  CDN unreachable, a future esm.sh outage — and renderFileViewHtml/
  mountFileEditorIfNeeded both already feature-detect it, falling back to
  the plain <textarea> this file used before, with zero loss of function.
-->
<script type="module">
  try {
    const cm = await import('https://esm.sh/codemirror@6.0.1');
    const yamlMod = await import('https://esm.sh/@codemirror/lang-yaml@6.1.1');
    const jsonMod = await import('https://esm.sh/@codemirror/lang-json@6.0.1');
    window.CM = { EditorView: cm.EditorView, basicSetup: cm.basicSetup, yaml: yamlMod.yaml, json: jsonMod.json };
    // the colors of the code in the dark scheme (the default highlighting is written for a light page): a plain extra,
    // the editor works without it
    try {
      const language = await import('https://esm.sh/@codemirror/language@6');
      const lezer = await import('https://esm.sh/@lezer/highlight@1');
      const t = lezer.tags;
      window.CM.darkHighlight = language.syntaxHighlighting(language.HighlightStyle.define([
        { tag: [t.propertyName, t.definition(t.propertyName)], color: '#9cdcfe' },
        { tag: [t.string, t.special(t.string)], color: '#ce9178' },
        { tag: [t.number, t.integer, t.float], color: '#b5cea8' },
        { tag: [t.bool, t.null, t.atom, t.keyword], color: '#6cb0f0' },
        { tag: [t.comment, t.lineComment], color: '#9a9a9a', fontStyle: 'italic' },
        { tag: [t.meta, t.labelName, t.typeName, t.tagName], color: '#c586c0' },
        { tag: [t.punctuation, t.separator, t.bracket, t.squareBracket, t.brace], color: '#c8c8c8' }
      ]));
    } catch (e) {
      console.warn('The dark highlighting of the code editor could not be loaded.', e);
    }
    window.dispatchEvent(new Event('codemirror-ready'));
  } catch (e) {
    console.warn('CodeMirror failed to load — falling back to a plain textarea for YAML editing.', e);
  }
</script>

<script>
'use strict';

/*
 * ArchiCode standalone editor — data engine (run-0008, task-001).
 *
 * This file implements the "data engine" half of PRD-0008 / TDD-0008:
 * the hand-written YAML parser (DEC-2/CON-5), the folder-pick + IndexedDB
 * persistence flow (DEC-3/DEC-4/CON-3/CON-4/CTR-2), workspace+manifest
 * loading (FR-4/FR-5), and the header.kind prefix mapping + recursive
 * element indexing + relationship resolution (DEC-5/ASM-3/ASM-4/FR-6/FR-7).
 *
 * The rendering here is a TEMPORARY diagnostic view only — task-002 (a
 * later, separate dispatch) replaces it with the real three-panel
 * read-only shell (DEC-1/DEC-6/DEC-7/DEC-8). Everything below is
 * organized so that later task can reuse AppState, parseYaml, buildIndex,
 * resolveRelationships, loadWorkspace, openFolder/reopenFolder/closeFolder
 * directly.
 */

// =====================================================================
// YAML parser (TDD DEC-2, CON-5; PRD TC-2)
//
// Hand-written recursive-descent parser over the YAML the manifests use:
// indentation-based block mappings and sequences (a sequence may sit at the
// same indent as its parent key), plain, single- and double-quoted scalars
// (folded over several lines, `\n` `\t` `\r` `\uXXXX`... escapes), literal
// and folded block scalars (`|`, `>` with `-`/`+` and an indentation
// indicator), flow sequences and mappings (`[a, "b"]`, `{a: b}`, nested, on
// several lines), `#` comments and the YAML 1.1 booleans (true/false/yes/no/
// on/off), like the Java side's reader does. Anchors, aliases, tags, complex
// keys, directives and several documents in one file are NOT supported:
// like anything else the parser cannot read, they throw a `YamlParseError`
// (carrying `.line`) instead of being skipped, so a file is never read as a
// truncated model and written back from it.
// =====================================================================

/** The error thrown for anything the parser cannot read: names the (1-based) line, and carries it in `line`. */
function yamlError(message, lineIndex) {
  const e = new Error('YAML error at line ' + (lineIndex + 1) + ': ' + message);
  e.name = 'YamlParseError';
  e.line = lineIndex + 1;
  return e;
}

/** Set a key of a parsed mapping; `__proto__` is kept as an ordinary own key instead of changing the prototype. */
function setYamlKey(map, key, value) {
  if (key === '__proto__') {
    Object.defineProperty(map, key, { value, writable: true, enumerable: true, configurable: true });
  } else {
    map[key] = value;
  }
}

function isYamlWs(ch) {
  return ch === ' ' || ch === '\t';
}

function yamlLineBlank(line) {
  return /^[ \t]*$/.test(line);
}

/** True if `#` at `i` starts a comment: at the start of the line, or after whitespace (YAML's rule, and the emitter's). */
function isYamlCommentAt(line, i) {
  return line[i] === '#' && (i === 0 || isYamlWs(line[i - 1]));
}

/** True if `line` has a block-sequence item at `col` (`-` followed by a blank or the end of the line). */
function isYamlSeqItem(line, col) {
  return line[col] === '-' && (col + 1 >= line.length || isYamlWs(line[col + 1]));
}

const YAML_SIMPLE_ESCAPES = {
  '0': '\0', a: '\x07', b: '\b', t: '\t', '\t': '\t', n: '\n', v: '\v', f: '\f', r: '\r', e: '\x1b',
  ' ': ' ', '"': '"', '/': '/', '\\': '\\', N: '\u0085', _: '\u00a0', L: '\u2028', P: '\u2029'
};

/** Read the escape sequence starting at `line[i]` (a backslash): `{ text, next }`. */
function readYamlEscape(line, i, lineIndex) {
  const c = line[i + 1];
  if (Object.prototype.hasOwnProperty.call(YAML_SIMPLE_ESCAPES, c)) return { text: YAML_SIMPLE_ESCAPES[c], next: i + 2 };
  const digits = c === 'x' ? 2 : c === 'u' ? 4 : c === 'U' ? 8 : 0;
  if (digits > 0) {
    const hex = line.slice(i + 2, i + 2 + digits);
    const code = parseInt(hex, 16);
    if (hex.length !== digits || !/^[0-9a-fA-F]+$/.test(hex) || code > 0x10ffff) {
      throw yamlError('invalid escape sequence \\' + c + hex, lineIndex);
    }
    return { text: String.fromCodePoint(code), next: i + 2 + digits };
  }
  throw yamlError('unknown escape sequence \\' + (c === undefined ? '' : c), lineIndex);
}

/** Unescape the body of a single-line double-quoted scalar. */
function unescapeYamlDoubleQuoted(body, lineIndex) {
  let out = '';
  let i = 0;
  while (i < body.length) {
    if (body[i] === '\\') {
      const esc = readYamlEscape(body, i, lineIndex || 0);
      out += esc.text;
      i = esc.next;
    } else {
      out += body[i++];
    }
  }
  return out;
}

/**
 * Where a key starts at `col` of `line`: `{ key, end }` (`end` just after the colon) when the text is `key:` followed by
 * a blank or the end of the line, `null` otherwise. The key is plain, `'single'` or `"double"` quoted (on that line).
 */
function scanYamlKey(line, col, lineIndex) {
  const c = line[col];
  if (c === undefined) return null;
  if (c === '"' || c === "'") {
    let j = col + 1;
    let close = -1;
    while (j < line.length) {
      if (c === '"' && line[j] === '\\') { j += 2; continue; }
      if (line[j] === c) {
        if (c === "'" && line[j + 1] === "'") { j += 2; continue; }
        close = j;
        break;
      }
      j++;
    }
    if (close === -1) return null;
    let k = close + 1;
    while (k < line.length && isYamlWs(line[k])) k++;
    if (line[k] !== ':' || !(k + 1 >= line.length || isYamlWs(line[k + 1]))) return null;
    const body = line.slice(col + 1, close);
    return { key: c === '"' ? unescapeYamlDoubleQuoted(body, lineIndex) : body.replace(/''/g, "'"), end: k + 1 };
  }
  if ('[{&*!|>'.indexOf(c) !== -1 || (c === '?' && (col + 1 >= line.length || isYamlWs(line[col + 1])))) return null;
  for (let i = col; i < line.length; i++) {
    if (line[i] === ':' && (i + 1 >= line.length || isYamlWs(line[i + 1]))) {
      const key = line.slice(col, i).replace(/[ \t]+$/, '');
      return key === '' ? null : { key, end: i + 1 };
    }
    if (i > col && isYamlCommentAt(line, i)) return null;
  }
  return null;
}

/** Index (in `line`) where the value starting at `i` ends, the comment that follows it excluded. */
function yamlCommentIndex(line, i) {
  const n = line.length;
  const c = line[i];
  if (c === '"' || c === "'") {
    let j = i + 1;
    while (j < n) {
      if (c === '"' && line[j] === '\\') { j += 2; continue; }
      if (line[j] === c) {
        if (c === "'" && line[j + 1] === "'") { j += 2; continue; }
        j++;
        break;
      }
      j++;
    }
    for (i = j; i < n; i++) if (isYamlCommentAt(line, i)) return i;
    return n;
  }
  if (c === '[' || c === '{') {
    // a flow collection: a quote opens a quoted scalar only where a value may start
    let prev = '';
    for (let j = i; j < n; j++) {
      const ch = line[j];
      if ((ch === '"' || ch === "'") && (prev === '' || '[{,:'.indexOf(prev) !== -1)) {
        let k = j + 1;
        while (k < n) {
          if (ch === '"' && line[k] === '\\') { k += 2; continue; }
          if (line[k] === ch) {
            if (ch === "'" && line[k + 1] === "'") { k += 2; continue; }
            break;
          }
          k++;
        }
        if (k >= n) return n; // the quoted text goes on over the next lines
        j = k;
        prev = ch;
        continue;
      }
      if (isYamlCommentAt(line, j)) return j;
      if (!isYamlWs(ch)) prev = ch;
    }
    return n;
  }
  for (let j = i; j < n; j++) if (isYamlCommentAt(line, j)) return j;
  return n;
}

/**
 * Strip a trailing `#` comment from a single line. A `#` starts a comment only at the start of the line or after
 * whitespace, and never inside a quoted scalar: a quote opens one only where a value starts (after `key:`, `- `, `[`,
 * `{`, `,`), so an apostrophe inside a plain scalar (`it's # a comment`) does not hide the comment, and an escaped
 * quote inside a double-quoted scalar (`"say \"hi # there"`) does not end the quoted text.
 */
function stripYamlComment(line) {
  const n = line.length;
  let i = 0;
  for (;;) {
    while (i < n && isYamlWs(line[i])) i++;
    if (i >= n) return line;
    if (line[i] === '#') return line.slice(0, i);
    if (isYamlSeqItem(line, i)) { i++; continue; }
    break;
  }
  const key = scanYamlKey(line, i, 0);
  if (key) {
    i = key.end;
    while (i < n && isYamlWs(line[i])) i++;
    if (i >= n) return line;
    if (line[i] === '#') return line.slice(0, i);
  }
  return line.slice(0, yamlCommentIndex(line, i));
}

/**
 * Resolve a plain (unquoted) scalar into its JS value: null (`null`/`~`/empty), a boolean (true/false/yes/no/on/off,
 * as the Java side reads them), a number, else the text itself. A number is only turned into a JS number when the text
 * is exactly what `String(number)` gives back (so `01234`, `1.50`, `2.0`, `-0` and integers beyond 2^53 stay the text
 * they were and are written back unchanged).
 */
function resolveYamlPlain(text) {
  if (text === '' || text === '~' || /^(null|Null|NULL)$/.test(text)) return null;
  if (/^(true|True|TRUE|yes|Yes|YES|on|On|ON)$/.test(text)) return true;
  if (/^(false|False|FALSE|no|No|NO|off|Off|OFF)$/.test(text)) return false;
  if (/^-?\d+$/.test(text) || /^-?\d+\.\d+$/.test(text)) {
    const number = Number(text);
    return String(number) === text ? number : text;
  }
  return text;
}

// The functions below read through a cursor `p` = { lines, i, col }: the lines of the document, and the position of
// the next character to read.

/** Move to the next content: skip the blanks, comments and line ends. False at the end of the document. */
function skipYamlToContent(p) {
  for (;;) {
    if (p.i >= p.lines.length) return false;
    const line = p.lines[p.i];
    let c = p.col;
    while (c < line.length && isYamlWs(line[c])) c++;
    if (c >= line.length || isYamlCommentAt(line, c)) {
      p.i++;
      p.col = 0;
      continue;
    }
    if (p.col === 0 && line.slice(0, c).indexOf('\t') !== -1) throw yamlError('tabs cannot be used for indentation', p.i);
    p.col = c;
    return true;
  }
}

/** The rest of the line must be blank or a comment. */
function expectYamlEol(p) {
  const line = p.lines[p.i];
  let c = p.col;
  while (c < line.length && isYamlWs(line[c])) c++;
  if (c < line.length && !isYamlCommentAt(line, c)) {
    throw yamlError('unexpected text "' + line.slice(c, c + 30) + '" after the value', p.i);
  }
  p.col = line.length;
}

function leadingYamlWs(line) {
  let c = 0;
  while (c < line.length && isYamlWs(line[c])) c++;
  return c;
}

/** Read a single- or double-quoted scalar (possibly folded over several lines) starting at the cursor. */
function readYamlQuoted(p, quote) {
  const startLine = p.i;
  let line = p.lines[p.i];
  let i = p.col + 1;
  let out = '';
  let keep = 0; // the part of `out` that is content (escapes) and is not trimmed when a line is folded
  const nextLine = (blanksAsNewlines, trim) => {
    if (trim) {
      let end = out.length;
      while (end > keep && isYamlWs(out[end - 1])) end--;
      out = out.slice(0, end);
    }
    let blanks = 0;
    let j = p.i + 1;
    while (j < p.lines.length && yamlLineBlank(p.lines[j])) { blanks++; j++; }
    if (j >= p.lines.length) throw yamlError('the quoted text starting here is never closed', startLine);
    out += blanksAsNewlines ? (blanks === 0 ? ' ' : '\n'.repeat(blanks)) : '\n'.repeat(blanks);
    keep = out.length;
    p.i = j;
    line = p.lines[j];
    i = leadingYamlWs(line);
  };
  for (;;) {
    if (i >= line.length) { nextLine(true, true); continue; }
    const c = line[i];
    if (quote === '"') {
      if (c === '"') { p.col = i + 1; return out; }
      if (c === '\\') {
        if (i + 1 >= line.length) { nextLine(false, false); continue; } // an escaped line break
        const esc = readYamlEscape(line, i, p.i);
        out += esc.text;
        keep = out.length;
        i = esc.next;
        continue;
      }
    } else if (c === "'") {
      if (line[i + 1] === "'") { out += "'"; keep = out.length; i += 2; continue; }
      p.col = i + 1;
      return out;
    }
    out += c;
    i++;
  }
}

/** Read a plain scalar in block context (maybe folded over several lines more indented than `parentIndent`). */
function readYamlPlainBlock(p, parentIndent) {
  const lines = p.lines;
  const first = lines[p.i];
  if (isYamlSeqItem(first, p.col)) throw yamlError('a sequence entry is not allowed here', p.i);
  const cut = (line, from) => {
    for (let k = from + 1; k < line.length; k++) if (isYamlCommentAt(line, k)) return line.slice(from, k).replace(/[ \t]+$/, '');
    return line.slice(from).replace(/[ \t]+$/, '');
  };
  const check = (text, lineIndex) => {
    if (/:([ \t]|$)/.test(text)) throw yamlError('a mapping value is not allowed here: "' + text.slice(0, 40) + '"', lineIndex);
  };
  let out = cut(first, p.col);
  check(out, p.i);
  let blanks = 0;
  let last = p.i;
  for (let j = p.i + 1; j < lines.length; j++) {
    const l = lines[j];
    if (yamlLineBlank(l)) { blanks++; continue; }
    const ind = leadingYamlWs(l);
    if (ind <= parentIndent || l[ind] === '#') break;
    const body = cut(l, ind);
    check(body, j);
    out += (blanks === 0 ? ' ' : '\n'.repeat(blanks)) + body;
    blanks = 0;
    last = j;
  }
  p.i = last;
  p.col = lines[last].length;
  return resolveYamlPlain(out);
}

/** Read a literal (`|`) or folded (`>`) block scalar whose header is at the cursor. */
function parseYamlBlockScalar(p, parentIndent) {
  const lines = p.lines;
  const header = lines[p.i].slice(p.col);
  const m = /^([|>])(?:([1-9])([+-])?|([+-])([1-9])?)?(?:[ \t]+#.*)?[ \t]*$/.exec(header);
  if (!m) throw yamlError('invalid block scalar header "' + header.slice(0, 30) + '"', p.i);
  const folded = m[1] === '>';
  const chomp = m[3] || m[4] || '';
  const explicit = m[2] || m[5];
  let j = p.i + 1;
  const base = parentIndent < 0 ? 0 : parentIndent;
  let contentIndent = null;
  if (explicit) {
    contentIndent = base + Number(explicit);
  } else {
    let k = j;
    while (k < lines.length && yamlLineBlank(lines[k])) k++;
    if (k < lines.length) {
      const ind = leadingYamlWs(lines[k]);
      if (ind > parentIndent) contentIndent = ind;
    }
  }
  const content = [];
  if (contentIndent !== null) {
    for (; j < lines.length; j++) {
      const l = lines[j];
      if (yamlLineBlank(l) && l.length <= contentIndent) { content.push(''); continue; }
      if (leadingYamlWs(l) < contentIndent) break;
      content.push(l.slice(contentIndent));
    }
  } else {
    while (j < lines.length && yamlLineBlank(lines[j])) { content.push(''); j++; }
  }
  p.i = j;
  p.col = 0;
  let trailing = 0;
  while (content.length > 0 && content[content.length - 1] === '') { content.pop(); trailing++; }
  if (content.length === 0) return chomp === '+' ? '\n'.repeat(trailing) : '';
  let body;
  if (!folded) {
    body = content.join('\n');
  } else {
    body = '';
    let blanks = 0;
    let prev = null;
    let prevMore = false;
    for (const l of content) {
      if (l === '') { blanks++; continue; }
      const more = isYamlWs(l[0]);
      if (prev === null) body += '\n'.repeat(blanks);
      else if (!prevMore && !more) body += blanks === 0 ? ' ' : '\n'.repeat(blanks);
      else body += '\n'.repeat(blanks + 1);
      body += l;
      prev = l;
      prevMore = more;
      blanks = 0;
    }
  }
  if (chomp === '-') return body;
  return body + '\n' + (chomp === '+' ? '\n'.repeat(trailing) : '');
}

/** Skip the blanks, line ends and comments inside a flow collection (which may span lines). */
function skipYamlFlowSpace(p, startLine) {
  for (;;) {
    if (p.i >= p.lines.length) throw yamlError('the flow collection starting here is never closed', startLine);
    const line = p.lines[p.i];
    while (p.col < line.length && isYamlWs(line[p.col])) p.col++;
    if (p.col >= line.length || isYamlCommentAt(line, p.col)) {
      p.i++;
      p.col = 0;
      continue;
    }
    return;
  }
}

/** A plain scalar inside a flow collection: `{ text }`, ending at `,` `]` `}` or a `:` that separates a key. */
function readYamlFlowPlain(p, startLine) {
  let out = '';
  let pending = '';
  for (;;) {
    const line = p.lines[p.i];
    if (p.col >= line.length) {
      let blanks = 0;
      let j = p.i + 1;
      while (j < p.lines.length && yamlLineBlank(p.lines[j])) { blanks++; j++; }
      if (j >= p.lines.length) throw yamlError('the flow collection starting here is never closed', startLine);
      const next = p.lines[j];
      const ind = leadingYamlWs(next);
      if (isYamlCommentAt(next, ind)) break;
      pending = blanks === 0 ? ' ' : '\n'.repeat(blanks);
      p.i = j;
      p.col = ind;
      continue;
    }
    const c = line[p.col];
    const after = line[p.col + 1];
    if (',[]{}'.indexOf(c) !== -1) break;
    if (c === ':' && (after === undefined || isYamlWs(after) || ',[]{}'.indexOf(after) !== -1)) break;
    if (isYamlCommentAt(line, p.col)) break;
    if (isYamlWs(c)) {
      pending += c;
    } else {
      out += pending + c;
      pending = '';
    }
    p.col++;
  }
  return { text: out };
}

/** One node of a flow collection: a collection or a scalar (`{ value, text, scalar }`). */
function parseYamlFlowNode(p, startLine) {
  skipYamlFlowSpace(p, startLine);
  const line = p.lines[p.i];
  const c = line[p.col];
  if (c === '[') {
    p.col++;
    const arr = [];
    for (;;) {
      skipYamlFlowSpace(p, startLine);
      if (p.lines[p.i][p.col] === ']') { p.col++; return { value: arr, scalar: false }; }
      const item = parseYamlFlowNode(p, startLine);
      skipYamlFlowSpace(p, startLine);
      if (item.scalar && p.lines[p.i][p.col] === ':') {
        // a single pair inside a sequence: `[a: b]`
        p.col++;
        const pair = {};
        setYamlKey(pair, item.text, parseYamlFlowPairValue(p, startLine));
        arr.push(pair);
      } else {
        arr.push(item.value);
      }
      skipYamlFlowSpace(p, startLine);
      const d = p.lines[p.i][p.col];
      if (d === ',') { p.col++; continue; }
      if (d === ']') { p.col++; return { value: arr, scalar: false }; }
      throw yamlError('expected "," or "]" in the flow sequence', p.i);
    }
  }
  if (c === '{') {
    p.col++;
    const map = {};
    for (;;) {
      skipYamlFlowSpace(p, startLine);
      if (p.lines[p.i][p.col] === '}') { p.col++; return { value: map, scalar: false }; }
      const keyNode = parseYamlFlowNode(p, startLine);
      if (!keyNode.scalar) throw yamlError('a collection cannot be a key of a flow mapping', p.i);
      skipYamlFlowSpace(p, startLine);
      let value = null;
      if (p.lines[p.i][p.col] === ':') {
        p.col++;
        value = parseYamlFlowPairValue(p, startLine);
      }
      setYamlKey(map, keyNode.text, value);
      skipYamlFlowSpace(p, startLine);
      const d = p.lines[p.i][p.col];
      if (d === ',') { p.col++; continue; }
      if (d === '}') { p.col++; return { value: map, scalar: false }; }
      throw yamlError('expected "," or "}" in the flow mapping', p.i);
    }
  }
  if (c === '"' || c === "'") {
    const text = readYamlQuoted(p, c);
    return { value: text, text, scalar: true };
  }
  if (c === '&' || c === '*' || c === '!') throw yamlError('anchors, aliases and tags are not supported', p.i);
  if (',]}|>'.indexOf(c) !== -1) throw yamlError('unexpected "' + c + '" in a flow collection', p.i);
  const plain = readYamlFlowPlain(p, startLine);
  if (plain.text === '') throw yamlError('unexpected "' + (p.lines[p.i][p.col] || '') + '" in a flow collection', p.i);
  return { value: resolveYamlPlain(plain.text), text: plain.text, scalar: true };
}

/** The value after the `:` of a pair of a flow collection (null when it is missing). */
function parseYamlFlowPairValue(p, startLine) {
  skipYamlFlowSpace(p, startLine);
  const d = p.lines[p.i][p.col];
  if (d === ',' || d === '}' || d === ']') return null;
  return parseYamlFlowNode(p, startLine).value;
}

/** A scalar or a flow collection starting at the cursor, on a line of its own or after `key:` / `- `. */
function parseYamlInline(p, parentIndent) {
  const line = p.lines[p.i];
  const c = line[p.col];
  if (c === '|' || c === '>') return parseYamlBlockScalar(p, parentIndent);
  let value;
  if (c === '"' || c === "'") {
    value = readYamlQuoted(p, c);
  } else if (c === '[' || c === '{') {
    value = parseYamlFlowNode(p, p.i).value;
  } else if (c === '&' || c === '*' || c === '!') {
    throw yamlError('anchors, aliases and tags are not supported', p.i);
  } else if (c === '?' && (p.col + 1 >= line.length || isYamlWs(line[p.col + 1]))) {
    throw yamlError('complex mapping keys are not supported', p.i);
  } else {
    return readYamlPlainBlock(p, parentIndent);
  }
  expectYamlEol(p);
  return value;
}

/** The value after the colon of a `key:` entry of the mapping at `mapIndent`. */
function parseYamlValueAfterKey(p, mapIndent) {
  const line = p.lines[p.i];
  let c = p.col;
  while (c < line.length && isYamlWs(line[c])) c++;
  if (c >= line.length || isYamlCommentAt(line, c)) {
    p.col = line.length;
    if (!skipYamlToContent(p)) return null;
    if (p.col > mapIndent) return parseYamlBlockNode(p, mapIndent);
    // a sequence may sit at the indent of its key
    if (p.col === mapIndent && isYamlSeqItem(p.lines[p.i], p.col)) return parseYamlSequence(p, mapIndent);
    return null;
  }
  p.col = c;
  return parseYamlInline(p, mapIndent);
}

/** The node starting at the cursor, which is at the start of a content line (its column is the indent). */
function parseYamlBlockNode(p, parentIndent) {
  const indent = p.col;
  const line = p.lines[p.i];
  if (isYamlSeqItem(line, indent)) return parseYamlSequence(p, indent);
  if (scanYamlKey(line, indent, p.i)) return parseYamlMapping(p, indent);
  return parseYamlInline(p, parentIndent);
}

/** A block mapping whose first entry starts at the cursor (column `indent`); the next ones are at that indent. */
function parseYamlMapping(p, indent) {
  const map = {};
  for (;;) {
    const line = p.lines[p.i];
    const entry = scanYamlKey(line, p.col, p.i);
    if (!entry) throw yamlError('expected a "key: value" entry, found "' + line.slice(p.col, p.col + 40) + '"', p.i);
    p.col = entry.end;
    setYamlKey(map, entry.key, parseYamlValueAfterKey(p, indent));
    if (!skipYamlToContent(p)) break;
    if (p.col < indent) break;
    if (p.col > indent) throw yamlError('unexpected indentation', p.i);
    if (isYamlSeqItem(p.lines[p.i], p.col)) break;
  }
  return map;
}

/** A block sequence whose first `-` is at the cursor (column `indent`); the next ones are at that indent. */
function parseYamlSequence(p, indent) {
  const arr = [];
  for (;;) {
    p.col += 1; // the dash
    arr.push(parseYamlSeqItem(p, indent));
    if (!skipYamlToContent(p)) break;
    if (p.col < indent) break;
    if (p.col > indent) throw yamlError('unexpected indentation', p.i);
    if (!isYamlSeqItem(p.lines[p.i], p.col)) break;
  }
  return arr;
}

/** The item after the dash of the sequence at `indent`. */
function parseYamlSeqItem(p, indent) {
  const line = p.lines[p.i];
  let c = p.col;
  while (c < line.length && isYamlWs(line[c])) c++;
  if (c >= line.length || isYamlCommentAt(line, c)) {
    p.col = line.length;
    if (!skipYamlToContent(p)) return null;
    return p.col > indent ? parseYamlBlockNode(p, indent) : null;
  }
  p.col = c;
  if (isYamlSeqItem(line, c)) return parseYamlSequence(p, c);
  if (scanYamlKey(line, c, p.i)) return parseYamlMapping(p, c);
  return parseYamlInline(p, indent);
}

/**
 * Parse a YAML document into a plain JS value (object, array, scalar, or null for an empty document). Throws a
 * `YamlParseError` (with the `line`) for anything it cannot read.
 */
function parseYaml(text) {
  let src = String(text);
  if (src.charCodeAt(0) === 0xfeff) src = src.slice(1);
  let lines = src.split(/\r\n|\r|\n/);
  if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop(); // the line break that ends the last line
  let seenContent = false;
  for (let k = 0; k < lines.length; k++) {
    const l = lines[k];
    if (/^(---|\.\.\.)(?=[ \t]|$)/.test(l)) {
      if (stripYamlComment(l.slice(3)).trim() !== '') throw yamlError('a value after "' + l.slice(0, 3) + '" is not supported', k);
      if (l.startsWith('---') && !seenContent) {
        lines[k] = '';
        continue;
      }
      if (l.startsWith('...')) {
        for (let m = k + 1; m < lines.length; m++) {
          if (stripYamlComment(lines[m]).trim() !== '') throw yamlError('several documents in one file are not supported', m);
        }
        lines = lines.slice(0, k);
        break;
      }
      throw yamlError('several documents in one file are not supported', k);
    }
    if (!seenContent && stripYamlComment(l).trim() !== '') {
      if (l[0] === '%') throw yamlError('YAML directives are not supported', k);
      seenContent = true;
    }
  }
  const p = { lines, i: 0, col: 0 };
  if (!skipYamlToContent(p)) return null;
  const root = parseYamlBlockNode(p, -1);
  if (skipYamlToContent(p)) throw yamlError('unexpected content (check the indentation)', p.i);
  return root;
}

// =====================================================================
// YAML serializer — the parser's inverse (TDD-0009 DEC-7, CTR-3).
//
// Hand-written, mirroring the parser's own small-function style: given a
// plain JS value (built by parseYaml, then possibly edited in place by a
// form commit), regenerate YAML that `parseYaml` — and the Java side's
// reader — read back as the very same value (ASM-2: relies on JS object key
// insertion order). Every string that YAML would read as something else
// (an indicator first, `: ` or ` #` inside, null/true/yes/number/date look-
// alikes, blanks around, control characters) is double-quoted; empty
// collections are the flow forms `[]` and `{}` (an empty `key:` would be a
// null, which the Java side rejects for lists).
// =====================================================================

/** True if `value` would need its own nested block (non-empty object/array). */
function isYamlComplexValue(value) {
  if (value === null || typeof value !== 'object') return false;
  if (Array.isArray(value)) return value.length > 0;
  return Object.keys(value).length > 0;
}

/** `[]` or `{}` for an empty array / object, else null. */
function yamlEmptyCollection(value) {
  if (value === null || typeof value !== 'object') return null;
  if (Array.isArray(value)) return value.length === 0 ? '[]' : null;
  return Object.keys(value).length === 0 ? '{}' : null;
}

/** True if a string would be read as something else (or corrupt a line) if emitted unquoted. */
function yamlStringNeedsQuoting(str) {
  if (str === '') return true;
  if (/^[ \t]|[ \t]$/.test(str)) return true;
  if (/[\u0000-\u001f\u007f\u0085\u2028\u2029\ufeff]/.test(str)) return true; // newlines, tabs, control characters
  if (/^[-?:,\[\]{}#&*!|>'"%@`]/.test(str)) return true; // starts with an indicator
  if (/:([ \t]|$)/.test(str) || /[ \t]#/.test(str)) return true; // `: ` and a trailing `:` make a mapping, ` #` a comment
  if (/^\.\.\.|^---/.test(str)) return true;
  if (/^(null|true|false|yes|no|on|off)$/i.test(str) || str === '~' || str === '=' || str === '<<') return true;
  if (/^[-+]?(\d[\d_,]*(\.\d*)?|\.\d+)([eE][-+]?\d+)?$/.test(str)) return true; // numbers
  if (/^[-+]?\.(inf|nan)$/i.test(str) || /^[-+]?0[xob][0-9a-f_]+$/i.test(str)) return true;
  if (/^[-+]?\d[\d_]*(:[0-5]?\d)+(\.\d*)?$/.test(str)) return true; // base 60 numbers
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(str)) return true; // dates
  return false;
}

/** Escape a string's body for double-quoted emission (exact inverse of unescapeYamlDoubleQuoted). */
function escapeYamlDoubleQuoted(str) {
  return String(str).replace(/[\\"\u0000-\u001f\u007f\u0085\u2028\u2029\ufeff]/g, (ch) => {
    switch (ch) {
      case '\\': return '\\\\';
      case '"': return '\\"';
      case '\n': return '\\n';
      case '\t': return '\\t';
      case '\r': return '\\r';
      default: return '\\u' + ch.charCodeAt(0).toString(16).padStart(4, '0');
    }
  });
}

/** A string as a YAML token: plain when YAML reads it back as the same string, double-quoted otherwise. */
function serializeYamlString(str) {
  return yamlStringNeedsQuoting(str) ? '"' + escapeYamlDoubleQuoted(str) + '"' : str;
}

/** Serialize one scalar JS value into its inline YAML token (DEC-7's scalar rules). */
function serializeYamlScalarToken(value) {
  if (value === null || value === undefined) return 'null';
  if (typeof value === 'boolean') return value ? 'true' : 'false';
  if (typeof value === 'number') {
    if (Number.isNaN(value)) return '.nan';
    if (!Number.isFinite(value)) return value > 0 ? '.inf' : '-.inf';
    return String(value);
  }
  return serializeYamlString(String(value));
}

/** A mapping key as a YAML token (keys go through the same quoting as values). */
function serializeYamlKey(key) {
  return serializeYamlString(String(key));
}

/** The inline token of a value that has no block of its own: `[]`, `{}` or a scalar. */
function serializeYamlInline(value) {
  return yamlEmptyCollection(value) || serializeYamlScalarToken(value);
}

/**
 * Recursively serialize a plain JS value (object/array/scalar) into the
 * YAML text `parseYaml` can re-parse (DEC-7). `indent` is the
 * column at which this value's own lines (for an object/array) start;
 * for a scalar (or an empty collection, `[]` / `{}`), `indent` is unused
 * (the result is the inline token the caller places after its own `key: `
 * or `- `).
 */
function serializeYamlValue(value, indent) {
  const ind = ' '.repeat(indent);
  const empty = yamlEmptyCollection(value);
  if (empty) return empty;

  if (Array.isArray(value)) {
    const lines = [];
    for (const item of value) {
      if (item !== null && typeof item === 'object' && !Array.isArray(item) && !yamlEmptyCollection(item)) {
        const keys = Object.keys(item);
        // restCol: the column the continuation keys of a sequence-of-maps item
        // align to (exactly one space after the dash, as emitted below).
        const restCol = indent + 2;
        for (let k = 0; k < keys.length; k++) {
          const key = keys[k];
          const val = item[key];
          const prefix = (k === 0) ? (ind + '- ') : ' '.repeat(restCol);
          if (isYamlComplexValue(val)) {
            lines.push(prefix + serializeYamlKey(key) + ':');
            lines.push(serializeYamlValue(val, restCol + 2));
          } else {
            lines.push(prefix + serializeYamlKey(key) + ': ' + serializeYamlInline(val));
          }
        }
      } else if (isYamlComplexValue(item)) {
        // A nested (non-empty) sequence: a block under a bare dash.
        lines.push(ind + '-');
        lines.push(serializeYamlValue(item, indent + 2));
      } else {
        lines.push(ind + '- ' + serializeYamlInline(item));
      }
    }
    return lines.join('\n');
  }

  if (value !== null && typeof value === 'object') {
    const lines = [];
    for (const key of Object.keys(value)) {
      const val = value[key];
      if (isYamlComplexValue(val)) {
        lines.push(ind + serializeYamlKey(key) + ':');
        lines.push(serializeYamlValue(val, indent + 2));
      } else {
        lines.push(ind + serializeYamlKey(key) + ': ' + serializeYamlInline(val));
      }
    }
    return lines.join('\n');
  }

  return serializeYamlScalarToken(value);
}

/**
 * Serialize a manifest file's full text from its parsed `header`/`content`
 * nodes (DEC-7, CTR-3) — the shape every real `.custom` manifest has:
 * top-level `header:` then `content:` blocks.
 */
function serializeManifestFile(header, content) {
  return serializeYamlValue({ header: header, content: content }, 0);
}

// =====================================================================
// IndexedDB handle persistence (TDD DEC-3, CTR-2; PRD TC-3/FR-1)
//
// One database, one object store, no keyPath, a single record at key
// 'workspace' holding {handle}. Never JSON.stringify the handle — it is
// structured-clone-native and IndexedDB's `put` handles it directly.
// =====================================================================

const ARCHICODE_DB_NAME = 'archicode-standalone-editor';
const ARCHICODE_DB_VERSION = 1;
const ARCHICODE_STORE_NAME = 'handles';
const ARCHICODE_HANDLE_KEY = 'workspace';

function openArchicodeDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(ARCHICODE_DB_NAME, ARCHICODE_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(ARCHICODE_STORE_NAME)) {
        db.createObjectStore(ARCHICODE_STORE_NAME);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getStoredHandleRecord() {
  const db = await openArchicodeDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(ARCHICODE_STORE_NAME, 'readonly');
    const store = tx.objectStore(ARCHICODE_STORE_NAME);
    const req = store.get(ARCHICODE_HANDLE_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function putStoredHandleRecord(handle) {
  const db = await openArchicodeDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(ARCHICODE_STORE_NAME, 'readwrite');
    const store = tx.objectStore(ARCHICODE_STORE_NAME);
    const req = store.put({ handle }, ARCHICODE_HANDLE_KEY); // CON-4: structured-clone put, never JSON.stringify
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function deleteStoredHandleRecord() {
  const db = await openArchicodeDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(ARCHICODE_STORE_NAME, 'readwrite');
    const store = tx.objectStore(ARCHICODE_STORE_NAME);
    const req = store.delete(ARCHICODE_HANDLE_KEY);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// =====================================================================
// AppState (TDD CTR-1) — the single in-memory source of truth.
// =====================================================================

function createInitialAppState() {
  return {
    folder: null, // { handle: FileSystemDirectoryHandle, name: string } | null
    permissionState: 'none', // 'granted' | 'needs-click' | 'none'
    workspace: null, // { application: {elements}, technology: {elements}, settings, styles, formatters, settingsDirty, settingsLastKnownDiskModified } | null
    manifestFiles: [], // Array<{ relPath, rawText, header, content, error, dirty, existedOnDisk, lastKnownDiskModified }>
    index: { application: new Map(), technology: new Map() },
    relationshipStats: { total: 0, dangling: 0 },
    selection: { kind: 'none', key: null, mode: 'view' },
    expanded: new Set(),
    fatalError: null,
    // TDD-0010 DEC-6/DEC-9: relPaths pending a removeEntry at next save, and
    // (since the removed mf object itself leaves AppState.manifestFiles
    // immediately) the baseline lastKnownDiskModified a save's stale-check
    // still needs for each one.
    pendingFileRemovals: [],
    removedFileBaselines: new Map(),
    // UX review follow-up: element-level (not file-level) modified tracking
    // for the tree's "modified" badge — see dirtyReferences usage below.
    dirtyReferences: new Set()
  };
}

let AppState = createInitialAppState();

// Message shown on the landing card while a folder is being looked up or read
// ("Opening “x”…"); null otherwise. Kept outside AppState: it is transient UI.
let landingBusy = null;

// =====================================================================
// Settings parsing with documented defaults + camelCase/kebab-case
// aliasing (PRD FR-4, task spec item 4 — mirrors the real Java
// @JsonAlias-annotated settings fields).
// =====================================================================

function readAliased(obj, camelKey, kebabKey, fallback) {
  if (!obj || typeof obj !== 'object') return fallback;
  if (Object.prototype.hasOwnProperty.call(obj, camelKey)) return obj[camelKey];
  if (Object.prototype.hasOwnProperty.call(obj, kebabKey)) return obj[kebabKey];
  return fallback;
}

function parseSettings(rawSettings) {
  const raw = rawSettings && typeof rawSettings === 'object' ? rawSettings : {};
  const manifestsRaw = raw.manifests && typeof raw.manifests === 'object' ? raw.manifests : {};
  const relationshipsRaw = raw.relationships && typeof raw.relationships === 'object' ? raw.relationships : {};
  const viewsRaw = raw.views && typeof raw.views === 'object' ? raw.views : {};
  const facetsRaw = raw.facets && typeof raw.facets === 'object' ? raw.facets : {};

  const customsRaw = readAliased(facetsRaw, 'customs', 'customs', []);
  // `json-path` is an alias of `jsonPath` on each *action* of a facet (not on the facet itself).
  const customs = (Array.isArray(customsRaw) ? customsRaw : []).map((c) => {
    const custom = c && typeof c === 'object' ? c : {};
    const actions = (Array.isArray(custom.actions) ? custom.actions : []).map((a) => {
      const action = a && typeof a === 'object' ? a : {};
      const rest = Object.assign({}, action);
      delete rest['json-path'];
      return Object.assign(rest, { jsonPath: readAliased(action, 'jsonPath', 'json-path', action.jsonPath) });
    });
    return Object.assign({}, custom, { actions });
  });

  return {
    manifests: {
      paths: Array.isArray(manifestsRaw.paths) ? manifestsRaw.paths : ['manifests']
    },
    relationships: {
      defaultSyntheticLabel: readAliased(relationshipsRaw, 'defaultSyntheticLabel', 'default-synthetic-label', 'uses')
    },
    views: {
      path: readAliased(viewsRaw, 'path', 'path', 'views'),
      labels: readAliased(viewsRaw, 'labels', 'labels', {}) || {},
      properties: readAliased(viewsRaw, 'properties', 'properties', {}) || {}
    },
    facets: {
      globalEnabled: readAliased(facetsRaw, 'globalEnabled', 'global-enabled', true),
      directoryNameTemplate: readAliased(facetsRaw, 'directoryNameTemplate', 'directory-name-template', '%s-%s'),
      customs
    }
  };
}

// =====================================================================
// header.kind prefix mapping + recursive element indexing +
// relationship resolution (TDD DEC-5, ASM-3, ASM-4; PRD FR-6/FR-7).
// =====================================================================

const ARCHICODE_KIND_PREFIX = 'archicode.morin.io/';

// Mirrors ManifestKind's ten constants (ASM-3a's fully-qualified
// vocabulary). The JS mirror follows the marker-interface nesting rule
// (ASM-4), not ManifestKind.java's mispaired SYSTEM_GROUP type field —
// that distinction only matters for DEC-8's tree nesting, which this
// task does not implement; the category/rootKind mapping itself is
// exactly this static table.
const ARCHICODE_KIND_MAP = {
  'component': { category: 'application', rootKind: 'component' },
  'container': { category: 'application', rootKind: 'container' },
  'container-group': { category: 'application', rootKind: 'group' },
  'person': { category: 'application', rootKind: 'person' },
  'solution': { category: 'application', rootKind: 'solution' },
  'solution-group': { category: 'application', rootKind: 'group' },
  'system': { category: 'application', rootKind: 'system' },
  'system-group': { category: 'application', rootKind: 'group' },
  'environment': { category: 'technology', rootKind: 'environment' },
  'node': { category: 'technology', rootKind: 'node' }
};

function stripArchicodeKindPrefix(fullKind) {
  if (typeof fullKind === 'string' && fullKind.indexOf(ARCHICODE_KIND_PREFIX) === 0) {
    return fullKind.slice(ARCHICODE_KIND_PREFIX.length);
  }
  return fullKind;
}

/**
 * Recursively index one element node (manifest-root or nested) and its
 * descendants (content.elements, at any depth) into `index[category]`.
 * Returns the ElementRecord (CTR-1 shape) for this node.
 *
 * `level` (TDD-0010 DEC-3) is the nesting-rule level this node sits at —
 * one of 'solution'|'system'|'container'|'component'|'person'|
 * 'environment'|'node'. A `group`-kinded node has no level of its own and
 * always inherits its caller's `level`; every other kind's level is
 * simply its own bare `kind` string. The caller (`buildIndex`) computes
 * the manifest root's own `level` once, from its un-generalized
 * `bareKind`, before ever calling this function for that root.
 */
function indexElementRecursive(node, kind, reference, sourceFile, category, index, settings, level) {
  const rawRelationships = Array.isArray(node.relationships) ? node.relationships : [];
  const relationships = rawRelationships.map((r) => {
    const rel = r && typeof r === 'object' ? r : {};
    return {
      // Jackson reads a number or a boolean into a String field: a destination `8080` names the element "8080"
      destination: (typeof rel.destination === 'number' || typeof rel.destination === 'boolean') ? String(rel.destination) : rel.destination,
      label: (rel.label !== undefined && rel.label !== null) ? rel.label : settings.relationships.defaultSyntheticLabel,
      // The label as written in the manifest (null when absent): the viewpoint kernel needs it, because ArchiCode
      // draws a natural link without a label, whereas `label` above is the display fallback.
      rawLabel: (rel.label !== undefined && rel.label !== null) ? rel.label : null,
      qualifiers: Array.isArray(rel.qualifiers) ? rel.qualifiers : [],
      tags: rel.tags && typeof rel.tags === 'object' ? rel.tags : {},
      resolved: false // filled in by resolveRelationships (FLOW-4)
    };
  });

  const record = {
    reference,
    layer: category, // 'application' | 'technology': a reference can exist in both, and then only the layer tells them apart
    kind,
    level,
    id: node.id,
    name: node.name !== undefined ? node.name : null,
    description: node.description !== undefined ? node.description : null,
    qualifiers: Array.isArray(node.qualifiers) ? node.qualifiers : [],
    tags: node.tags && typeof node.tags === 'object' ? node.tags : {},
    applications: Array.isArray(node.applications) ? node.applications : [],
    relationships,
    children: [],
    sourceFile
  };

  index[category].set(reference, record);

  const childNodes = Array.isArray(node.elements) ? node.elements : [];
  for (const childNode of childNodes) {
    if (!childNode || typeof childNode !== 'object' || !childNode.id) continue;
    // ASM-3b: a nested element carries its own *bare* kind discriminator
    // directly (no prefix stripping, unlike header.kind).
    const childKind = childNode.kind;
    const childReference = reference + '.' + childNode.id;
    // DEC-3: a 'group' has no level of its own — it always inherits its
    // caller's level; every other kind's level is simply its own kind.
    const childLevel = (childKind === 'group') ? level : childKind;
    const childRecord = indexElementRecursive(childNode, childKind, childReference, sourceFile, category, index, settings, childLevel);
    record.children.push(childRecord);
  }

  return record;
}

/**
 * The child-kind nesting-rule table (TDD DEC-3, TG-4) — mirrors `W-1`'s
 * TDD `DEC-8` tree nesting rules as one small, shared, table-driven
 * helper. Returns the list of bare kinds a node at `level` may contain as
 * a new child (always including `'group'` where any non-leaf nesting is
 * allowed); an empty array means `level` is a leaf (`'component'`/
 * `'person'`, or any unrecognized level).
 */
function childKindOptionsForLevel(level) {
  switch (level) {
    case 'solution': return ['system', 'group'];
    case 'system': return ['container', 'group'];
    case 'container': return ['component', 'group'];
    case 'environment': return ['node'];
    case 'node': return ['node'];
    default: return [];
  }
}

/** `childKindOptionsForLevel`, keyed off an `ElementRecord`'s own `level` (DEC-3). */
function childKindOptionsFor(record) {
  return childKindOptionsForLevel(record.level);
}

/**
 * A top-level manifest kind's own "reduced level" (TDD-0010 DEC-3/step 8):
 * strip a trailing `-group` suffix to recover the base level a group
 * flavor sits at (`'system-group'` -> `'system'`), else the kind itself is
 * already a valid level name (`'person'`/`'component'`/`'environment'`/
 * `'node'`/`'system'`/`'container'`/`'solution'`). Mirrors `buildIndex`'s
 * own `groupLevelMatch` computation for a manifest root, generalized for
 * reuse by the top-level create form's attach-under validation so the
 * same regex is not re-inlined at every call site.
 */
function reducedLevelForKind(kind) {
  const m = /^(.+)-group$/.exec(kind);
  return m ? m[1] : kind;
}

/**
 * Build the application/technology element indexes from every
 * successfully-parsed manifest file (DEC-5/FR-6). Mutates manifestFiles'
 * entries in place to record a per-file error for an unrecognized
 * header.kind (DEC-10), without aborting the rest of the load.
 *
 * DEC-5b: a manifest's root element is only a *candidate* top-level root.
 * After every manifest is indexed, a second pass looks up each root's own
 * `header.parent` (if any) in the same-layer index and, when found,
 * attaches that root under the found parent's `children` instead of
 * leaving it at the top level — mirroring the real
 * `ElementIndexFactory.create()`'s cross-manifest attachment loop. In
 * `.custom`, this is how `auth`/`access`/`portal`/etc. end up nested under
 * `platform` even though `app.platform.yaml` itself declares no
 * `content.elements` — the nesting is entirely cross-file.
 */
function buildIndex(manifestFiles, settings) {
  const index = { application: new Map(), technology: new Map() };
  const candidateRoots = { application: [], technology: [] }; // { record, parentReference }

  for (const mf of manifestFiles) {
    if (mf.error) continue;
    if (!mf.header || !mf.header.kind || !mf.content || mf.content.id === undefined) {
      mf.error = mf.error || 'Missing header.kind or content.id';
      continue;
    }
    const bareKind = stripArchicodeKindPrefix(mf.header.kind);
    const mapping = ARCHICODE_KIND_MAP[bareKind];
    if (!mapping) {
      mf.error = 'Unrecognized header.kind "' + mf.header.kind + '"';
      continue;
    }
    const { category, rootKind } = mapping;
    // DEC-3: the root's own nesting-rule level, computed from the
    // un-generalized `bareKind` (e.g. 'system-group') *before*
    // ARCHICODE_KIND_MAP's own reduction to the generic 'group' rootKind
    // erases that distinction — strip a trailing '-group' suffix to get
    // the base level; else rootKind itself is already a valid level name
    // ('person'/'component'/'environment'/'node'/'system'/'container'/
    // 'solution').
    const groupLevelMatch = /^(.+)-group$/.exec(bareKind);
    const rootLevel = groupLevelMatch ? groupLevelMatch[1] : rootKind;
    const rootReference = mf.header.parent
      ? (mf.header.parent + '.' + mf.content.id)
      : String(mf.content.id);
    const rootRecord = indexElementRecursive(mf.content, rootKind, rootReference, mf.relPath, category, index, settings, rootLevel);
    candidateRoots[category].push({ record: rootRecord, parentReference: mf.header.parent || null });
  }

  // DEC-5b: attach each candidate root under its resolved parent (if any);
  // only unattached candidates remain top-level.
  const rootsByCategory = { application: [], technology: [] };
  for (const category of ['application', 'technology']) {
    for (const candidate of candidateRoots[category]) {
      const parentRecord = candidate.parentReference ? index[category].get(candidate.parentReference) : null;
      if (parentRecord) {
        parentRecord.children.push(candidate.record);
      } else {
        rootsByCategory[category].push(candidate.record);
      }
    }
  }

  return { index, rootsByCategory };
}

/**
 * Walk every indexed element's relationships and mark each `resolved`
 * per DEC-5: application relationships resolve only against the
 * application index, technology only against technology, never
 * cross-layer (FR-7, FLOW-4).
 */
function resolveRelationships(index) {
  let total = 0;
  let dangling = 0;
  for (const category of ['application', 'technology']) {
    for (const record of index[category].values()) {
      for (const rel of record.relationships) {
        total++;
        rel.resolved = index[category].has(rel.destination);
        if (!rel.resolved) dangling++;
      }
    }
  }
  return { total, dangling };
}

// =====================================================================
// Workspace + manifest loading (TDD FLOW-1; PRD FR-4/FR-5/FR-16/DEC-10).
// =====================================================================

/**
 * A relative directory path as the editor writes it: segments joined by '/', with the empty and '.' ones dropped
 * (`./manifests`, `manifests/` and `manifests` are one directory; `.` is the folder itself, ''). Null when the path
 * leaves the folder (`..`) or is not a string.
 */
function normalizeRelDir(relDir) {
  if (typeof relDir !== 'string') return null;
  const segments = relDir.split('/').filter((seg) => seg !== '' && seg !== '.');
  return segments.includes('..') ? null : segments.join('/');
}

/** Resolve a (possibly multi-segment) relative directory path from a root handle; `options.create` makes the missing directories. */
async function getDirectoryHandleByRelativePath(rootHandle, relPath, options) {
  const normalized = normalizeRelDir(String(relPath));
  if (normalized === null) throw new Error('The path "' + relPath + '" is outside the folder.');
  let current = rootHandle;
  for (const seg of normalized.split('/').filter(Boolean)) {
    current = await current.getDirectoryHandle(seg, options && options.create ? { create: true } : undefined);
  }
  return current;
}

/**
 * Parse one manifest file's text the way every load/edit path needs
 * (loadWorkspace, commitFileEdit, reloadManifestFile): `{ header, content,
 * error }`, `error` set (and header/content null) when the text is not
 * valid YAML or lacks `header.kind` / `content.id`.
 */
function parseManifestText(text) {
  try {
    const parsed = parseYaml(text) || {};
    const header = (parsed.header && typeof parsed.header === 'object') ? parsed.header : null;
    const content = (parsed.content && typeof parsed.content === 'object') ? parsed.content : null;
    if (!header || !header.kind) return { header, content, error: 'Missing header.kind' };
    if (!content || content.id === undefined) return { header, content, error: 'Missing content.id' };
    return { header, content, error: null };
  } catch (e) {
    return { header: null, content: null, error: e && e.message ? e.message : String(e) };
  }
}

async function loadWorkspace(dirHandle) {
  landingBusy = null; // the next render() is the result (workspace or error), not another "Opening…"
  AppState.fatalError = null;
  AppState.workspace = null;
  AppState.manifestFiles = [];
  AppState.index = { application: new Map(), technology: new Map() };
  AppState.relationshipStats = { total: 0, dangling: 0 };
  AppState.dirtyReferences = new Set();
  AppState.pendingFileRemovals = []; // a reload starts from the disk: a removal queued before it must not delete a file later
  AppState.removedFileBaselines = new Map();

  // FR-4 / DEC-10: workspace.yaml is fatal to the open attempt if missing/unparseable.
  let workspaceRaw;
  let workspaceLastKnownDiskModified = null; // TDD-0010 DEC-8
  try {
    const fileHandle = await dirHandle.getFileHandle('workspace.yaml');
    const file = await fileHandle.getFile();
    workspaceLastKnownDiskModified = file.lastModified;
    const text = await file.text();
    workspaceRaw = parseYaml(text) || {};
    // a workspace.yaml that is not a mapping is not one the editor can write back without losing it
    if (typeof workspaceRaw !== 'object' || Array.isArray(workspaceRaw)) throw new Error('the file is not a mapping of keys');
  } catch (e) {
    AppState.fatalError = 'Could not read/parse workspace.yaml: ' + (e && e.message ? e.message : String(e));
    AppState.selection = { kind: 'none', key: null, mode: 'view' };
    render();
    return;
  }

  const settings = parseSettings(workspaceRaw.settings);

  // FR-5: direct (non-recursive) children of each settings.manifests.paths dir.
  const manifestFiles = [];
  const seenManifestDirs = new Set(); // `manifests` and `./manifests/` are one directory: read it once
  for (const rawDirPath of settings.manifests.paths) {
    const relDirPath = normalizeRelDir(rawDirPath);
    if (relDirPath === null) {
      console.warn('ArchiCode: manifests path "' + rawDirPath + '" is not a path inside the folder; skipped.');
      continue;
    }
    if (seenManifestDirs.has(relDirPath)) continue;
    seenManifestDirs.add(relDirPath);
    let manifestsDirHandle;
    try {
      manifestsDirHandle = await getDirectoryHandleByRelativePath(dirHandle, relDirPath);
    } catch (e) {
      console.warn('ArchiCode: manifests path "' + relDirPath + '" not found/readable:', e);
      continue;
    }
    for await (const [name, entryHandle] of manifestsDirHandle.entries()) {
      if (entryHandle.kind !== 'file') continue;
      if (!/\.(ya?ml)$/.test(name)) continue; // like the CLI (String.endsWith): `.YAML` is not a manifest
      const relPath = (relDirPath ? relDirPath + '/' : '') + name;
      let rawText = '';
      let header = null;
      let content = null;
      let error = null;
      let lastKnownDiskModified = null; // TDD-0010 DEC-8
      try {
