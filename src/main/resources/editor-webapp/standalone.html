// =====================================================================
// Delete (TDD-0010 DEC-4/DEC-6) — the whole-model impact scan, its
// transient confirm/cancel overlay (pendingDeleteConfirmation, declared
// above alongside rawYamlEditDraft), and the one new commit function the
// removal needs — a removal can touch more than one manifest file in one
// commit, which no existing mutator does today.
// =====================================================================

/**
 * The deleted element's own reference plus every reference in the same
 * category's current index that is a former descendant of it (including
 * a cross-file-attached one) — TDD-0010 DEC-4.
 */
function computeDeletedReferenceSet(reference, category) {
  const set = new Set([reference]);
  for (const ref of AppState.index[category].keys()) {
    if (ref === reference || ref.indexOf(reference + '.') === 0) set.add(ref);
  }
  return set;
}

/**
 * Every relationship elsewhere in `category`'s index whose `destination`
 * names a reference in `deletedRefs` (TDD-0010 DEC-4). "Elsewhere"
 * excludes the deleted subtree itself — a relationship owned by an
 * element being deleted anyway is not itself a dangling reference left
 * behind.
 */
function scanDanglingRelationshipsFor(deletedRefs, category) {
  const affected = [];
  for (const record of AppState.index[category].values()) {
    if (deletedRefs.has(record.reference)) continue; // DEC-4: "elsewhere" excludes the deleted subtree itself
    for (const rel of record.relationships) {
      if (deletedRefs.has(rel.destination)) {
        affected.push({ ownerReference: record.reference, ownerSourceFile: record.sourceFile, label: rel.label, destination: rel.destination });
      }
    }
  }
  return affected;
}

/**
 * Commit a delete (TDD-0010 DEC-6, resolves FR-10): remove the element
 * (splice from its parent's `content.elements` if nested, or remove its
 * whole manifest file's entry if it was a manifest root) and every
 * relationship `affected` named, together, in one commit. A caller (the
 * `confirm-delete-element` handler) must have already run DEC-4's scan —
 * `affected` is trusted as-is here, never re-scanned.
 *
 * Every "elsewhere" relationship is pruned by re-deriving the removal
 * condition directly against each owner's *live* raw node (via
 * `locateContentNode`) — never by index/array-position identity against
 * the disposable `ElementRecord` copies DEC-4's scan read from, since
 * those are rebuilt fresh on every `buildIndex` call (the same reasoning
 * TDD-0009's DEC-4/`locateContentNode` already established).
 */
function commitDeleteElement(reference, category, affected) {
  const located = locateContentNode(reference);
  const touchedRelPaths = new Set(); // relPath strings, not mf object references (see below)

  // Prune every "elsewhere" relationship DEC-4's scan found, against each
  // owner's live node.
  const deletedRefs = computeDeletedReferenceSet(reference, category);
  const ownerRefs = new Set(affected.map((a) => a.ownerReference));
  for (const ownerRef of ownerRefs) {
    const ownerLocated = locateContentNode(ownerRef);
    const relationships = Array.isArray(ownerLocated.node.relationships) ? ownerLocated.node.relationships : [];
    ownerLocated.node.relationships = relationships.filter((r) => !deletedRefs.has(r && r.destination));
    touchedRelPaths.add(ownerLocated.mf.relPath);
    AppState.dirtyReferences.add(ownerRef); // UX review follow-up — this owner's own relationships changed
  }
  // The deleted element (and any former descendant) no longer exists — drop
  // any stale "modified" entry it may have held.
  for (const deletedRef of deletedRefs) {
    AppState.dirtyReferences.delete(deletedRef);
  }

  // Remove the element itself: splice from its parent array (nested), or
  // remove the whole manifest file's entry (a manifest root).
  if (located.parentArray === null) {
    if (located.mf.existedOnDisk) {
      AppState.pendingFileRemovals.push(located.mf.relPath);
      AppState.removedFileBaselines.set(located.mf.relPath, located.mf.lastKnownDiskModified); // DEC-9's stale-check needs this baseline
    }
    AppState.manifestFiles = AppState.manifestFiles.filter((f) => f !== located.mf);
    touchedRelPaths.delete(located.mf.relPath); // that file no longer exists; nothing to regenerate for it
  } else {
    located.parentArray.splice(located.indexInParent, 1);
    touchedRelPaths.add(located.mf.relPath);
  }

  // Regenerate raw YAML exactly once per still-existing touched file.
  // touchedRelPaths is deliberately a plain Set of relPath strings, not
  // of `mf` object references — AppState.manifestFiles is reassigned by
  // `.filter()` above, which would silently invalidate a stale `mf`
  // reference held from before that reassignment.
  for (const mf of AppState.manifestFiles) {
    if (touchedRelPaths.has(mf.relPath)) {
      mf.rawText = serializeManifestFile(mf.header, mf.content);
      mf.dirty = true;
    }
  }

  // If the deleted element (or one of its former descendants) was the
  // active selection, fall back to the workspace-wide default view — it
  // no longer exists.
  if (AppState.selection.kind === 'element' &&
      (AppState.selection.key === reference || (AppState.selection.key && AppState.selection.key.indexOf(reference + '.') === 0))) {
    AppState.selection = { kind: 'none', key: null, mode: 'view' };
  }

  pendingDeleteConfirmation = null;
  saveStatus = { state: 'idle' }; // TDD-0010 DEC-11 — a new edit discards any prior save attempt's status
  rebuildIndexAndRender();
}

// =====================================================================
// Save (TDD-0010 DEC-7/DEC-9/DEC-10/DEC-11) — the first functions in the
// whole wave that write to or remove from the real granted directory.
// Every disk-touching call (`createWritable`/`removeEntry`/
// `getFileHandle(..., {create: true})`) lives only in the small set of
// functions below (CON-1/NFR-2/TG-2) — no create/delete/commit function
// above performs disk I/O itself. `ensureWritePermission` elevates the
// granted handle from `read` (every prior grant in this file, per
// `openFolder`/`reopenFolder`/`tryAutoReopen`) to `readwrite`; it must
// only ever be reached from `saveAllChanges`, itself only ever called
// from the save button's own click handler (a user gesture — ASM-2).
// =====================================================================

/**
 * Elevate the granted folder handle's permission from `read` to
 * `readwrite` (TDD-0010 DEC-7, resolves FR-13). `requestPermission` must
 * only be called from inside a user-gesture handler's own synchronous
 * call chain (ASM-2) — the save button's click handler calls
 * `saveAllChanges()` directly, and this is the first `await` reached by
 * it, so the gesture is still active (mirrors CON-3/DEC-4's existing
 * discipline for `reopenFolder`'s `read`-mode request).
 */
async function ensureWritePermission() {
  if (!AppState.folder || !AppState.folder.handle) return false;
  try {
    let permission = await AppState.folder.handle.queryPermission({ mode: 'readwrite' });
    if (permission !== 'granted') {
      permission = await AppState.folder.handle.requestPermission({ mode: 'readwrite' });
    }
    return permission === 'granted';
  } catch (e) {
    console.error('ArchiCode: ensureWritePermission failed', e);
    return false;
  }
}

/**
 * Stat a manifest file (relative to the granted folder) for its current
 * on-disk `lastModified`, without reading its content — the cheap
 * staleness-check primitive FR-16/DEC-9/Q-1 needs. Returns `null` if the
 * file does not exist (e.g. removed externally since this session loaded
 * or last saved it).
 */
async function statManifestFile(relPath) {
  const segments = String(relPath).split('/').filter(Boolean);
  const name = segments.pop();
  try {
    const dir = await getDirectoryHandleByRelativePath(AppState.folder.handle, segments.join('/'));
    const fileHandle = await dir.getFileHandle(name);
    const file = await fileHandle.getFile();
    return file.lastModified;
  } catch (e) {
    if (e && e.name === 'NotFoundError') return null;
    throw e;
  }
}

/**
 * Write a manifest file's current `rawText` to disk (TDD-0010 DEC-9).
 * `getFileHandle(name, {create: !mf.existedOnDisk})` creates the file
 * only for a brand-new one (DEC-5) — an existing file is never created
 * out from under a missing-parent-directory assumption. `createWritable()`
 * truncates-then-writes with no separate truncate call needed (ASM-3).
 */
async function writeManifestFile(mf) {
  const segments = String(mf.relPath).split('/').filter(Boolean);
  const name = segments.pop();
  const dir = await getDirectoryHandleByRelativePath(AppState.folder.handle, segments.join('/'));
  const fileHandle = await dir.getFileHandle(name, { create: !mf.existedOnDisk });
  const writable = await fileHandle.createWritable();
  await writable.write(mf.rawText);
  await writable.close();
}

/** Remove a manifest file from disk (TDD-0010 DEC-9, resolves FR-14's removal half) via `removeEntry`. */
async function removeManifestFile(relPath) {
  const segments = String(relPath).split('/').filter(Boolean);
  const name = segments.pop();
  const dir = await getDirectoryHandleByRelativePath(AppState.folder.handle, segments.join('/'));
  await dir.removeEntry(name);
}

/** `statManifestFile`'s own counterpart for `workspace.yaml`, which lives at the folder root rather than under a manifests subpath (TDD-0010 DEC-9). */
async function statWorkspaceYaml() {
  try {
    const fileHandle = await AppState.folder.handle.getFileHandle('workspace.yaml');
    const file = await fileHandle.getFile();
    return file.lastModified;
  } catch (e) {
    if (e && e.name === 'NotFoundError') return null;
    throw e;
  }
}

/**
 * The kebab-case inverse of `parseSettings` (TDD-0010 DEC-10, resolves
 * FR-18's `TC-3` extension): every top-level settings field round-trips
 * to the same kebab-case key `.custom`'s real files already use, and
 * every `facets.customs[]` entry's own `jsonPath` maps back to
 * `json-path` — the one *nested* alias `parseSettings` applies below the
 * top level, found during this run's own Stage 2 review. Every key is
 * always emitted (including any `parseSettings` only ever defaulted
 * because the real file never set it) — a stated, not silent, consequence
 * (TDD-0010 DEC-10).
 */
function serializeSettingsToRaw(settings) {
  return {
    manifests: { paths: settings.manifests.paths },
    relationships: { 'default-synthetic-label': settings.relationships.defaultSyntheticLabel },
    views: { path: settings.views.path, labels: settings.views.labels, properties: settings.views.properties },
    facets: {
      'global-enabled': settings.facets.globalEnabled,
      'directory-name-template': settings.facets.directoryNameTemplate,
      customs: settings.facets.customs.map((c) => {
        const rest = Object.assign({}, c);
        if (Object.prototype.hasOwnProperty.call(rest, 'jsonPath')) {
          const jsonPath = rest.jsonPath;
          delete rest.jsonPath;
          rest['json-path'] = jsonPath;
        }
        return rest;
      })
    }
  };
}

/**
 * Write `workspace.yaml` (TDD-0010 DEC-9/DEC-10): `styles`/`formatters`
 * carried through verbatim from `AppState.workspace` (no editing surface
 * in this wave ever touches them), `settings` serialized via
 * `serializeSettingsToRaw`, the whole raw object serialized via `W-3`'s
 * existing `serializeYamlValue` (reused as-is — no second serializer).
 */
async function writeWorkspaceYaml() {
  const raw = {
    styles: AppState.workspace.styles,
    formatters: AppState.workspace.formatters,
    settings: serializeSettingsToRaw(AppState.workspace.settings)
  };
  const text = serializeYamlValue(raw, 0);
  const fileHandle = await AppState.folder.handle.getFileHandle('workspace.yaml');
  const writable = await fileHandle.createWritable();
  await writable.write(text);
  await writable.close();
}

/**
 * `AppState.removedFileBaselines`'s own lookup helper (TDD-0010 DEC-9) —
 * a removed file's own `lastKnownDiskModified` is otherwise unreachable
 * for the stale-check once its `mf` object has left
 * `AppState.manifestFiles` (`commitDeleteElement` populates this map at
 * the moment it pushes to `pendingFileRemovals`).
 */
function removedFileBaseline(relPath) {
  return AppState.removedFileBaselines.has(relPath) ? AppState.removedFileBaselines.get(relPath) : null;
}

/** True when at least one change this session has not yet been saved (TDD-0010 DEC-11, resolves AC-14's visibility rule). */
function hasUnsavedChanges() {
  return countUnsavedChanges() > 0;
}

/** How many things "Save all changes" would write: modified files, pending file removals, and workspace.yaml if its settings changed. */
function countUnsavedChanges() {
  return AppState.manifestFiles.filter((f) => f.dirty).length +
    AppState.pendingFileRemovals.length +
    (AppState.workspace && AppState.workspace.settingsDirty ? 1 : 0);
}

/**
 * Drop every `dirtyReferences` entry whose element currently lives in
 * `relPath` (UX review follow-up) — called once a file's write actually
 * succeeds, mirroring that file's own `f.dirty = false` reset so a save
 * that fails partway through still only clears what really saved.
 */
function clearDirtyReferencesForFile(relPath) {
  for (const category of ['application', 'technology']) {
    for (const record of AppState.index[category].values()) {
      if (record.sourceFile === relPath) AppState.dirtyReferences.delete(record.reference);
    }
  }
}

/**
 * The full save pipeline (TDD-0010 DEC-9, resolves FR-13 through FR-17 and
 * `Q-1`): acquire `readwrite` permission first (DEC-7); if denied, stop
 * writing nothing. Otherwise stale-check *every* dirty file, pending
 * removal, and (if settings changed) `workspace.yaml` — all before any
 * write starts (FR-16/NFR-3) — and refuse the whole attempt, writing
 * nothing at all, if any target has changed on disk since it was loaded
 * or last saved. Only once every target is confirmed fresh does the write
 * phase begin: dirty files, then pending removals, then `workspace.yaml`
 * if its settings changed, each step able to stop-and-report its own
 * failure (FR-17) without rolling back whatever already succeeded.
 */
async function saveAllChanges() {
  if (!(await ensureWritePermission())) {
    saveStatus = { state: 'denied', message: 'Write permission was not granted; nothing was saved.' };
    render();
    return;
  }

  const dirtyFiles = AppState.manifestFiles.filter((f) => f.dirty);
  const removals = AppState.pendingFileRemovals.slice();
  const settingsDirty = AppState.workspace.settingsDirty;
  if (dirtyFiles.length === 0 && removals.length === 0 && !settingsDirty) {
    saveStatus = { state: 'success', message: 'Nothing to save.' };
    render();
    return;
  }

  // FR-16/Q-1: stale-check every target this attempt would touch, before
  // any write starts (NFR-3 — never a partial write for a refused save).
  const conflicts = [];
  for (const f of dirtyFiles) {
    if (!f.existedOnDisk) continue; // brand-new file: nothing on disk to conflict with
    const current = await statManifestFile(f.relPath);
    if (current === null || current !== f.lastKnownDiskModified) conflicts.push(f.relPath);
  }
  for (const relPath of removals) {
    const current = await statManifestFile(relPath);
    const baseline = removedFileBaseline(relPath);
    if (current !== null && current !== baseline) conflicts.push(relPath);
  }
  if (settingsDirty) {
    const current = await statWorkspaceYaml();
    if (current !== AppState.workspace.settingsLastKnownDiskModified) conflicts.push('workspace.yaml');
  }
  if (conflicts.length > 0) {
    saveStatus = { state: 'conflict', conflicts };
    render();
    return;
  }

  // Write phase (FR-14/FR-17/FR-19): stop at the first failure, name it,
  // leave everything already written in this attempt as written.
  for (const f of dirtyFiles) {
    try {
      await writeManifestFile(f);
      f.dirty = false;
      f.existedOnDisk = true;
      f.lastKnownDiskModified = await statManifestFile(f.relPath); // FR-19 — this file's own new baseline
      clearDirtyReferencesForFile(f.relPath); // UX review follow-up
    } catch (e) {
      saveStatus = { state: 'error', failedFile: f.relPath, message: e && e.message ? e.message : String(e) };
      render();
      return;
    }
  }
  for (const relPath of removals) {
    try {
      await removeManifestFile(relPath);
      AppState.pendingFileRemovals = AppState.pendingFileRemovals.filter((p) => p !== relPath);
      AppState.removedFileBaselines.delete(relPath);
    } catch (e) {
      saveStatus = { state: 'error', failedFile: relPath, message: e && e.message ? e.message : String(e) };
      render();
      return;
    }
  }
  if (settingsDirty) {
    try {
      await writeWorkspaceYaml();
      AppState.workspace.settingsDirty = false;
      AppState.workspace.settingsLastKnownDiskModified = await statWorkspaceYaml(); // FR-19
    } catch (e) {
      saveStatus = { state: 'error', failedFile: 'workspace.yaml', message: e && e.message ? e.message : String(e) };
      render();
      return;
    }
  }

  saveStatus = { state: 'success', message: 'Saved.' };
  render();
}

/**
 * The text of the file-edit view's editor as it is on screen right now —
 * the live CodeMirror doc, else the fallback textarea — or null when no
 * file is being edited.
 */
function currentFileEditorText() {
  if (activeFileEditorView) return activeFileEditorView.state.doc.toString();
  const textarea = document.getElementById('file-edit-textarea');
  return textarea ? textarea.value : null;
}

/**
 * True when reloading `relPath` from disk would throw something away: the
 * file was edited in memory (`mf.dirty`, from any surface), a rejected
 * draft is pending, or text was typed in its editor but not applied yet.
 */
function fileHasUnsavedChanges(relPath) {
  const mf = AppState.manifestFiles.find((f) => f.relPath === relPath);
  if (!mf) return false;
  if (mf.dirty) return true;
  if (rawYamlEditDraft && rawYamlEditDraft.relPath === relPath) return true;
  const editorText = currentFileEditorText();
  return editorText !== null && editorText !== mf.rawText;
}

/**
 * Reload one manifest file from disk, discarding every unsaved change to
 * it (form edits and raw-YAML edits alike): re-read and re-parse it, swap
 * its entry in, forget its elements' "modified" markers, and rebuild the
 * index. Other files are deliberately untouched — a delete or rename may
 * have changed relationships in them too, and those stay modified (the
 * confirmation in the click handler says so). A file that does not exist
 * on disk yet has nothing to reload and is left alone; a read failure
 * keeps the in-memory state and reports through `saveStatus`.
 */
async function reloadManifestFile(relPath) {
  const mf = AppState.manifestFiles.find((f) => f.relPath === relPath);
  if (!mf || !mf.existedOnDisk) return;

  let rawText;
  let lastModified;
  try {
    const segments = String(relPath).split('/').filter(Boolean);
    const name = segments.pop();
    const dir = await getDirectoryHandleByRelativePath(AppState.folder.handle, segments.join('/'));
    const file = await (await dir.getFileHandle(name)).getFile();
    lastModified = file.lastModified;
    rawText = await file.text();
  } catch (e) {
    saveStatus = { state: 'reload-error', failedFile: relPath, message: e && e.message ? e.message : String(e) };
    render();
    return;
  }

  const { header, content, error } = parseManifestText(rawText);
  clearDirtyReferencesForFile(relPath); // before the index is rebuilt: it still knows this file's current elements
  AppState.manifestFiles = AppState.manifestFiles.map((f) =>
    f.relPath === relPath
      ? { relPath, rawText, header, content, error, dirty: false, existedOnDisk: true, lastKnownDiskModified: lastModified }
      : f
  );
  if (rawYamlEditDraft && rawYamlEditDraft.relPath === relPath) rawYamlEditDraft = null;
  saveStatus = { state: 'idle' };
  rebuildIndexAndRender();

  // The reloaded file may no longer contain the selected element.
  const sel = AppState.selection;
  if (sel.kind === 'element' && !findElementRecord(sel.key)) {
    AppState.selection = { kind: 'none', key: null, mode: 'view' };
    render();
  }
}

/**
 * Commit a raw-YAML edit (TDD-0009 DEC-6): scratch-validate, never
 * mutate-then-rollback. Parses `newText` the same way `loadWorkspace`
 * parses a manifest file at load time; if that succeeds, re-derives the
 * index against a *scratch* copy of `AppState.manifestFiles` (reusing
 * `buildIndex` as-is, including its own header.kind/content.id and
 * ARCHICODE_KIND_MAP checks) before ever touching live state. Only a
 * fully-valid edit is swapped into `AppState.manifestFiles`; an invalid
 * edit leaves `AppState` completely untouched and records the rejected
 * draft (with its error) in `rawYamlEditDraft` for `renderFileViewHtml`
 * to show (NFR-3 — "never corrupt the model").
 */
function commitFileEdit(relPath, newText) {
  // Step 1: parse — loadWorkspace's own per-file inline logic, copied
  // verbatim (DEC-6 step 1).
  const { header, content, error: parseError } = parseManifestText(newText);
  let error = parseError;

  // Step 3 (only reached if step 1 didn't already set `error`): scratch
  // copy + buildIndex, reusing its own header.kind/content.id and
  // ARCHICODE_KIND_MAP checks to complete the validation for free.
  let scratchFiles = null;
  if (!error) {
    scratchFiles = AppState.manifestFiles.map((f) =>
      f.relPath === relPath ? { ...f, rawText: newText, header, content, error: null, dirty: true } : f // TDD-0010 DEC-8
    );
    buildIndex(scratchFiles, AppState.workspace.settings);
    const scratchMf = scratchFiles.find((f) => f.relPath === relPath);
    error = scratchMf ? scratchMf.error : null;
  }

  // Step 4: invalid — do not touch AppState.manifestFiles/AppState.index
  // at all; record the draft (with its error) and re-render.
  if (error) {
    rawYamlEditDraft = { relPath, text: newText, error };
    render();
    return;
  }

  // Step 5: valid — swap the scratch array in (the one file's entry
  // replaced, every other entry the same object reference), clear the
  // draft, and rebuild+render via the single shared pipeline.
  AppState.manifestFiles = scratchFiles;
  rawYamlEditDraft = null;
  saveStatus = { state: 'idle' }; // TDD-0010 DEC-11 — a new edit discards any prior save attempt's status
  rebuildIndexAndRender();
}

/**
 * DEC-8 — after an `id` rename's `commitElementEdit` call returns
 * `{ renamedTo: { from, to } }`, rewrite every reference under the old
 * prefix (`AppState.selection.key` and every `AppState.expanded` entry)
 * to the new prefix, so a rename of the currently-selected/expanded
 * element (or one of its ancestors) does not leave the tree pointing at
 * a reference that no longer exists after the rebuild `commitElementEdit`
 * already ran. Re-renders once more at the end (the rebuild inside
 * `commitElementEdit` already rendered once, with the *stale* key).
 */
function rewriteReferencePrefix(oldPrefix, newPrefix) {
  if (AppState.selection.kind === 'element') {
    if (AppState.selection.key === oldPrefix) {
      AppState.selection.key = newPrefix;
    } else if (AppState.selection.key && AppState.selection.key.indexOf(oldPrefix + '.') === 0) {
      AppState.selection.key = newPrefix + AppState.selection.key.slice(oldPrefix.length);
    }
  }
  const rewritten = new Set();
  for (const key of AppState.expanded) {
    if (key === oldPrefix) {
      rewritten.add(newPrefix);
    } else if (key.indexOf(oldPrefix + '.') === 0) {
      rewritten.add(newPrefix + key.slice(oldPrefix.length));
    } else {
      rewritten.add(key);
    }
  }
  AppState.expanded = rewritten;

  // UX review follow-up: dirtyReferences holds the *old* reference (added
  // by commitElementEdit before this rename-aware rewrite runs) — carry it
  // over to the new one, same prefix-rewrite as AppState.expanded above.
  const rewrittenDirty = new Set();
  for (const key of AppState.dirtyReferences) {
    if (key === oldPrefix) {
      rewrittenDirty.add(newPrefix);
    } else if (key.indexOf(oldPrefix + '.') === 0) {
      rewrittenDirty.add(newPrefix + key.slice(oldPrefix.length));
    } else {
      rewrittenDirty.add(key);
    }
  }
  AppState.dirtyReferences = rewrittenDirty;

  render();
}

// =====================================================================
// Structured-form validation rules (TDD-0009 DEC-9, resolves FR-20) —
// one small, independently-callable function per rule. Every function
// here is pure (reads AppState only where a rule needs it, e.g. the id-
// collision check; never mutates AppState) and returns either
// `{ valid: true, ... }` (with whatever normalized value(s) the caller
// needs to proceed) or `{ valid: false, error: string }`. A later task's
// click handlers call these *before* commitElementEdit/commitSettingsEdit
// — a rejection must never call either commit function, so AppState is
// never touched on a rejected action.
// =====================================================================

/**
 * `name`/`description` normalization (not a rejection): empty-after-trim
 * normalizes to `null`, matching indexElementRecursive's own
 * null-means-absent convention and the read-only view's "none" display.
 */
function normalizeOptionalText(value) {
  const trimmed = typeof value === 'string' ? value.trim() : '';
  return trimmed === '' ? null : trimmed;
}

/** DEC-8's own reference-prefix-rewrite formula, reused here so the id-rename collision check validates against the *actual* new reference. */
function computeRenamedReference(currentReference, newId) {
  const dotIdx = currentReference.lastIndexOf('.');
  return dotIdx === -1 ? newId : currentReference.slice(0, dotIdx + 1) + newId;
}

/**
 * `id` rename validation: non-empty after trim; the resulting new
 * reference must not collide with any other existing element's current
 * reference in the same category index (DEC-9's first rule) — this is
 * checked against the live `AppState.index[category]`, i.e. before any
 * rebuild the eventual commit would trigger.
 */
function validateElementIdRename(newId, currentReference, category) {
  const trimmed = typeof newId === 'string' ? newId.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Id is required.' };
  }
  const newReference = computeRenamedReference(currentReference, trimmed);
  const categoryIndex = AppState.index && AppState.index[category];
  if (categoryIndex) {
    for (const ref of categoryIndex.keys()) {
      if (ref !== currentReference && ref === newReference) {
        return { valid: false, error: 'Another element already uses reference "' + newReference + '".' };
      }
    }
  }
  return { valid: true, newId: trimmed, newReference };
}

/**
 * `qualifiers`/`applications` add validation: the new entry must be
 * non-empty after trim (shared by both fields — DEC-9 states the same
 * rule for each).
 */
function validateNewListEntry(value) {
  const trimmed = typeof value === 'string' ? value.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Value is required.' };
  }
  return { valid: true, value: trimmed };
}

/**
 * `tags` add validation: the key must be non-empty after trim AND must
 * not already exist in the element's current tags (reject rather than
 * silently overwrite). The value has no format requirement.
 */
function validateNewTagKey(key, existingTags) {
  const trimmed = typeof key === 'string' ? key.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Tag key is required.' };
  }
  if (existingTags && Object.prototype.hasOwnProperty.call(existingTags, trimmed)) {
    return { valid: false, error: 'Tag key "' + trimmed + '" already exists — edit it instead.' };
  }
  return { valid: true, key: trimmed };
}

/**
 * `relationships` add/save validation: `destination` must be non-empty
 * after trim; `label` empty-after-trim normalizes to `undefined` (not
 * stored as a literal empty string, so indexElementRecursive's existing
 * fallback-to-defaultSyntheticLabel logic still applies, exactly as it
 * does for a relationship with no explicit label in a manifest file).
 */
function validateRelationshipDraft(destination, label) {
  const trimmedDestination = typeof destination === 'string' ? destination.trim() : '';
  if (trimmedDestination === '') {
    return { valid: false, error: 'Destination is required.' };
  }
  const trimmedLabel = typeof label === 'string' ? label.trim() : '';
  return { valid: true, destination: trimmedDestination, label: trimmedLabel === '' ? undefined : trimmedLabel };
}

/**
 * Settings `manifests.paths` validation: the textarea's raw text (one
 * path per line) splits/trims into `paths`; at least one non-empty path
 * is required, else reject (keep the previous value).
 */
function validateManifestsPaths(rawPathsText) {
  const paths = String(rawPathsText == null ? '' : rawPathsText)
    .split('\n')
    .map((p) => p.trim())
    .filter((p) => p !== '');
  if (paths.length === 0) {
    return { valid: false, error: 'At least one manifests path is required.' };
  }
  return { valid: true, paths };
}

/**
 * Settings `views.path` validation: non-empty after trim required. The
 * documented default (`'views'`) is deliberately not applied here — that
 * is `parseSettings`' behavior for an *absent* key at load time, not a
 * rule for an explicit, empty form submission.
 */
function validateViewsPath(value) {
  const trimmed = typeof value === 'string' ? value.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Views path is required.' };
  }
  return { valid: true, path: trimmed };
}

/**
 * Parse a `facets.directoryNameTemplate`, which the Java side feeds to
 * `String.format(template, viewsPath, facetName)` (WorkspaceFactory) — so
 * only `%s`, the positional `%1$s`/`%2$s` and a literal `%%` are meaningful
 * with those two string arguments; anything else (`%d`, a dangling `%`, a
 * third `%s`) throws when views are generated. Returns `{ valid: true,
 * format(viewsPath, facetName) }`, or `{ valid: false, error }`. The facet
 * name must be referenced, else every facet would write to one folder.
 */
function parseDirectoryNameTemplate(template) {
  const parts = [];
  const used = new Set();
  let sequential = 0;
  let last = 0;
  const token = /%%|%s|%[12]\$s|%/g;
  let m;
  while ((m = token.exec(template)) !== null) {
    if (m.index > last) parts.push({ literal: template.slice(last, m.index) });
    last = token.lastIndex;
    if (m[0] === '%%') {
      parts.push({ literal: '%' });
    } else if (m[0] === '%s') {
      if (sequential > 1) return { valid: false, error: 'Template can use at most two %s (views path, facet name).' };
      used.add(sequential);
      parts.push({ arg: sequential++ });
    } else if (m[0] === '%') {
      return { valid: false, error: 'Template may only use %s, %1$s, %2$s or %% — a lone % fails at generation time.' };
    } else {
      const arg = parseInt(m[0].charAt(1), 10) - 1;
      used.add(arg);
      parts.push({ arg: arg });
    }
  }
  if (last < template.length) parts.push({ literal: template.slice(last) });
  if (!used.has(1)) {
    return { valid: false, error: 'Template must include the facet name (the second %s), or all facets share one folder.' };
  }
  return {
    valid: true,
    format(viewsPath, facetName) {
      const args = [viewsPath, facetName];
      return parts.map((part) => ('literal' in part ? part.literal : args[part.arg])).join('');
    }
  };
}

/** Settings `facets.directoryNameTemplate` validation: non-empty after trim, and a template Java's String.format accepts (see parseDirectoryNameTemplate). */
function validateDirectoryNameTemplate(value) {
  const trimmed = typeof value === 'string' ? value.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Directory name template is required.' };
  }
  const parsed = parseDirectoryNameTemplate(trimmed);
  if (!parsed.valid) return { valid: false, error: parsed.error };
  return { valid: true, value: trimmed };
}

/** The fixed viewpoint id vocabulary (matches the Java `View.viewpoint` field) — `views.labels`/`views.properties` are keyed by these. */
const VIEWPOINT_IDS = ['overview', 'detailed', 'deep'];

/** The one operator the Java `Facets.Facet.Action` enum defines today — a `<select>` kept open to more without a UI change later. */
const FACET_ACTION_OPERATORS = ['REMOVE'];

/** `views.properties[viewpoint]` save validation: the text must parse as a JSON object (not an array/scalar/null). */
function validateViewPropertiesJson(rawText) {
  let parsed;
  try {
    parsed = JSON.parse(rawText);
  } catch (e) {
    return { valid: false, error: 'Invalid JSON: ' + (e && e.message ? e.message : String(e)) };
  }
  if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
    return { valid: false, error: 'Properties must be a JSON object.' };
  }
  return { valid: true, value: parsed };
}

/** The current text of a viewpoint's JSON editor — the live CodeMirror doc, else the fallback textarea. */
function readViewPropertiesEditorText(viewpoint) {
  const view = activeJsonEditorViews[viewpoint];
  if (view) return view.state.doc.toString();
  const textarea = document.querySelector('.json-editor-fallback[data-viewpoint="' + viewpoint + '"]');
  return textarea ? textarea.value : '';
}

/**
 * Read and validate the whole Settings form (FLOW-2, all-or-nothing): clears
 * every previous inline error, shows each failing field's own error, and
 * returns `{ valid: false }` if any failed — else `{ valid: true, apply }`,
 * where `apply(settings)` writes every field. Shared by the header Save and
 * by the structural add/remove-facet(-action) buttons, which apply it first
 * so a re-render never discards what the user typed elsewhere.
 */
function readSettingsDraft() {
  const byId = (id) => document.getElementById(id);
  const errorIds = ['settings-manifests-paths-error', 'settings-views-path-error', 'settings-facets-directory-template-error'];
  for (const vp of VIEWPOINT_IDS) errorIds.push('view-properties-error-' + vp);
  errorIds.forEach((id) => setInlineErrorText(id, ''));
  document.querySelectorAll('.facets-editor .inline-error').forEach((el) => { el.textContent = ''; });

  let hasError = false;
  const fail = (id, message) => { setInlineErrorText(id, message); hasError = true; };

  const pathsInput = byId('settings-manifests-paths-input');
  const viewsPathInput = byId('settings-views-path-input');
  const templateInput = byId('settings-facets-directory-template-input');
  const defaultLabelInput = byId('settings-default-label-input');
  const globalEnabledInput = byId('settings-facets-global-enabled-input');

  const pathsResult = validateManifestsPaths(pathsInput ? pathsInput.value : '');
  const viewsPathResult = validateViewsPath(viewsPathInput ? viewsPathInput.value : '');
  const templateResult = validateDirectoryNameTemplate(templateInput ? templateInput.value : '');
  if (!pathsResult.valid) fail('settings-manifests-paths-error', pathsResult.error);
  if (!viewsPathResult.valid) fail('settings-views-path-error', viewsPathResult.error);
  if (!templateResult.valid) fail('settings-facets-directory-template-error', templateResult.error);

  // views.labels: an empty-after-trim label omits that viewpoint's key rather than storing ''.
  const labels = {};
  for (const vp of VIEWPOINT_IDS) {
    const input = byId('settings-label-' + vp + '-input');
    const trimmed = input ? input.value.trim() : '';
    if (trimmed !== '') labels[vp] = trimmed;
  }

  const properties = Object.assign({}, AppState.workspace.settings.views.properties);
  for (const vp of VIEWPOINT_IDS) {
    const result = validateViewPropertiesJson(readViewPropertiesEditorText(vp));
    if (!result.valid) fail('view-properties-error-' + vp, result.error);
    else properties[vp] = result.value;
  }

  const customs = AppState.workspace.settings.facets.customs.map((facet, facetIndex) => {
    const actions = (Array.isArray(facet.actions) ? facet.actions : []).map((action, actionIndex) => {
      const row = document.querySelector('.relationship-edit-row[data-facet-index="' + facetIndex + '"][data-action-index="' + actionIndex + '"]');
      if (!row) return action;
      const result = validateFacetActionDraft(row.querySelector('.facet-action-jsonpath-input').value);
      if (!result.valid) { setRowInlineErrorText(row, result.error); hasError = true; return action; }
      return { operator: row.querySelector('.facet-action-operator-input').value, jsonPath: result.jsonPath };
    });
    return Object.assign({}, facet, { actions: actions });
  });

  if (hasError) return { valid: false };
  return {
    valid: true,
    apply(settings) {
      settings.manifests.paths = pathsResult.paths;
      settings.relationships.defaultSyntheticLabel = defaultLabelInput ? defaultLabelInput.value : '';
      settings.views.path = viewsPathResult.path;
      settings.views.labels = labels;
      settings.views.properties = properties;
      settings.facets.globalEnabled = globalEnabledInput ? globalEnabledInput.checked : false;
      settings.facets.directoryNameTemplate = templateResult.value;
      settings.facets.customs = customs;
    }
  };
}

/**
 * `facets.customs` add validation: the name must be non-empty after trim
 * AND must not already name another facet (same reject-rather-than-
 * overwrite rule as `validateNewTagKey`) — the UI never supports an
 * in-place rename, so a name collision would otherwise silently shadow
 * the earlier facet's actions.
 */
function validateFacetName(name, existingCustoms) {
  const trimmed = typeof name === 'string' ? name.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'Facet name is required.' };
  }
  if (Array.isArray(existingCustoms) && existingCustoms.some((f) => f.name === trimmed)) {
    return { valid: false, error: 'A facet named "' + trimmed + '" already exists.' };
  }
  return { valid: true, name: trimmed };
}

/** `facets.customs[].actions` add/save validation: `jsonPath` must be non-empty after trim; `operator` always comes from a closed `<select>`. */
function validateFacetActionDraft(jsonPath) {
  const trimmed = typeof jsonPath === 'string' ? jsonPath.trim() : '';
  if (trimmed === '') {
    return { valid: false, error: 'JSON path is required.' };
  }
  return { valid: true, jsonPath: trimmed };
}

// ---- Top panel (DEC-11, FR-1..3, AC-1/AC-11/AC-12) ----

/**
 * Render `saveStatus`'s current state as a short status line (TDD-0010
 * DEC-11, resolves AC-16/AC-17's visibility requirements) — empty while
 * `'idle'` (no save attempt has happened yet this session, or the status
 * was reset by a later edit).
 */
function renderSaveStatusHtml() {
  if (!saveStatus || saveStatus.state === 'idle') return '';
  let text;
  let isError = true;
  if (saveStatus.state === 'success') {
    text = saveStatus.message;
    isError = false;
  } else if (saveStatus.state === 'denied') {
    text = saveStatus.message;
  } else if (saveStatus.state === 'conflict') {
    text = 'Save refused — changed on disk since loaded: ' + saveStatus.conflicts.join(', ') + '. Reopen the folder before retrying.';
  } else if (saveStatus.state === 'reload-error') {
    text = 'Reload failed on "' + saveStatus.failedFile + '": ' + saveStatus.message + '. The in-memory copy was kept.';
  } else if (saveStatus.state === 'error') {
    text = 'Save failed on "' + saveStatus.failedFile + '": ' + saveStatus.message;
  } else {
    return '';
  }
  // title carries the full text: the top bar truncates long messages with an ellipsis.
  return '<span class="save-status ' + (isError ? 'save-status-error' : 'save-status-success') + '" role="status" title="' + escapeHtml(text) + '">' + escapeHtml(text) + '</span>';
}

/** The three perspective tabs (header, left of the folder actions) — active one marked, UX review follow-up. */
function renderPerspectiveTabsHtml() {
  let html = '<span class="perspective-tabs">';
  for (const id of Object.keys(PERSPECTIVES)) {
    const active = id === currentPerspective ? ' active' : '';
    html += '<button type="button" class="perspective-tab' + active + '" data-action="set-perspective" data-perspective="' + id + '">' +
              escapeHtml(PERSPECTIVES[id].label) +
            '</button>';
  }
  html += '</span>';
  return html;
}

function renderTopPanelHtml() {
  if (!AppState.folder) return '';
  const dirty = hasUnsavedChanges();
  const count = countUnsavedChanges();
  // Always rendered (disabled when there is nothing to write) so the bar never
  // shifts as edits come and go, and the action stays discoverable.
  const saveAll = dirty
    ? '<button type="button" class="btn-primary" data-action="save-all-changes" title="Writes ' + count + ' modified item' + (count === 1 ? '' : 's') +
      ' to disk (files, pending file removals, workspace.yaml settings). Until then, edits live in memory only.">Save all changes (' + count + ')</button>'
    : '<button type="button" class="btn-primary" data-action="save-all-changes" disabled title="No changes to save.">Save all changes</button>';
  return '<header class="top-panel col-span-3 flex items-center gap-4 px-4 min-h-10 h-12 overflow-hidden">' +
      '<span class="folder-name" title="Browsers do not expose an absolute filesystem path for a picked folder (ASM-1/DEC-11) — this shows the folder\'s own name and its position as the browsing root instead.">' +
        escapeHtml(AppState.folder.name) + '<span class="folder-root-slash">/</span>' +
      '</span>' +
      '<button type="button" class="btn-ghost" data-action="close-folder" title="Close this workspace folder and return to the folder picker.">Close folder</button>' +
      renderPerspectiveTabsHtml() +
      '<span class="flex-1"></span>' +
      renderSaveStatusHtml() +
      saveAll +
    '</header>';
}

// ---- Left panel — pure navigation (FR-8/FR-9/FR-10, AC-2/AC-3/AC-4) ----

function renderTreeNodeHtml(record) {
  const hasChildren = Array.isArray(record.children) && record.children.length > 0;
  const isExpanded = AppState.expanded.has(record.reference);
  const isActive = AppState.selection.kind === 'element' && AppState.selection.key === record.reference;
  const label = (record.name !== undefined && record.name !== null && record.name !== '') ? record.name : record.id;

  let html = '<div class="tree-node">';
  html += '<div class="tree-node-row' + (isActive ? ' active' : '') + '" data-action="select-element" data-ref="' + escapeHtml(record.reference) + '">';
  if (hasChildren) {
    html += '<span class="tree-toggle" data-action="toggle-element" data-ref="' + escapeHtml(record.reference) + '">' + (isExpanded ? '▾' : '▸') + '</span>';
  } else {
    html += '<span class="tree-toggle tree-toggle-empty">▸</span>';
  }
  html += '<span class="tree-node-kind">' + escapeHtml(record.kind) + '</span>';
  html += '<span class="tree-node-label">' + escapeHtml(label) + '</span>';
  if (AppState.dirtyReferences.has(record.reference)) {
    html += '<span class="modified-badge" title="This element has unsaved changes">modified</span>';
  }
  html += '</div>';
  if (hasChildren && isExpanded) {
    html += '<div class="tree-node-children">';
    for (const child of record.children) {
      html += renderTreeNodeHtml(child);
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderTreeBranchHtml(branchKey, title, category, elements, isExpanded, showAddButton) {
  let html = '<div class="nav-section">';
  html += '<div class="tree-branch-header" data-action="toggle-branch" data-branch="' + escapeHtml(branchKey) + '">' +
            '<span class="tree-branch-title">' + (isExpanded ? '▾' : '▸') + ' ' + escapeHtml(title) + '</span>' +
            (showAddButton ? ('<button type="button" class="tree-branch-add-btn" data-action="open-create-top-level-form" data-category="' + escapeHtml(category) + '">+ Add</button>') : '') +
          '</div>';
  if (isExpanded) {
    html += '<div class="tree-branch-body">';
    if (!elements || elements.length === 0) {
      html += '<div class="tree-empty">' + (showAddButton ? 'No elements yet — use "+ Add" above to create one.' : 'No elements.') + '</div>';
    } else {
      for (const el of elements) {
        html += renderTreeNodeHtml(el);
      }
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/**
 * The Applications/Environments element tree, no wrapper — shared by the
 * Elements and Diagram perspectives' left panel. `showAddButton` is false
 * for Diagram: its left panel is pure navigation (DEC — Diagram has no
 * center surface to land a newly-created element on, only Elements does).
 */
function renderElementsNavHtml(showAddButton) {
  const appElements = (AppState.workspace && AppState.workspace.application && AppState.workspace.application.elements) || [];
  const techElements = (AppState.workspace && AppState.workspace.technology && AppState.workspace.technology.elements) || [];
  return renderTreeBranchHtml('applications', 'Applications', 'application', appElements, treeExpandedApplications, showAddButton) +
         renderTreeBranchHtml('environments', 'Environments', 'technology', techElements, treeExpandedEnvironments, showAddButton);
}

/** The manifest files list, no wrapper — the Files perspective's left panel. */
function renderFilesNavHtml() {
  let html = '<div class="nav-section">';
  html += '<div class="nav-section-title">Files</div>';
  for (const mf of AppState.manifestFiles) {
    const active = (AppState.selection.kind === 'file' && AppState.selection.key === mf.relPath) ? ' active' : '';
    const errorClass = mf.error ? ' has-error' : '';
    html += '<div class="nav-row file-row' + active + errorClass + '" data-action="select-file" data-relpath="' + escapeHtml(mf.relPath) + '">' +
              '<span class="file-relpath">' + escapeHtml(mf.relPath) + '</span>' +
              (mf.dirty ? '<span class="modified-badge" title="Unsaved changes">modified</span>' : '') +
              (mf.error ? '<span class="error-badge" title="' + escapeHtml(mf.error) + '">error</span>' : '') +
            '</div>';
  }
  html += '</div>';
  return html;
}

/** The left panel's `<nav>` shell — one resizable panel id shared by every perspective that uses it. */
function renderLeftPanelWrapperHtml(innerHtml) {
  return '<nav id="panel-left" class="left-panel min-w-48 w-64 max-w-[40vw]" style="' + savedPanelSizeStyle('panel-left', 'width') + '">' + innerHtml + '</nav>';
}

// ---- Center panel (FR-11..16, AC-5..10, DEC-6/DEC-7/DEC-10) ----

/**
 * The Settings view's guidance texts — one place, so they are easy to
 * review against the Java behavior they describe (`Settings.java`,
 * `WorkspaceFactory`, `GenerateViewsCommand`). `backticks` render as <code>.
 */
const SETTINGS_HELP = {
  manifestsPaths: 'Folders scanned for manifest files, relative to the folder containing `workspace.yaml`. One per line. Default: `manifests`.',
  defaultLabel: 'Label for a relationship that declares none, and for a link merged from several relationships. Default: `uses`.',
  viewsPath: 'Folder where generated views are written, relative to `workspace.yaml`. Facets write to sibling folders (see Facets). Default: `views`.',
  viewsLabels: 'Title of the generated view for each viewpoint. Leave empty to use the default shown in the field.',
  viewsProperties: 'Extra properties merged into every view of that viewpoint, as a JSON object. Free-form: keys are passed through as-is and not validated here.',
  facetsIntro: 'A facet is a filtered copy of the workspace: its actions remove matching elements or relationships, and its views are generated in their own folder. Useful for focused views, e.g. only the OIDC flows.',
  facetsGlobalEnabled: 'Also generate the unfiltered views into the Views path. Turn off to generate only facet views. Default: on.',
  facetsTemplate: 'Folder name for each facet\'s views, as a Java format string: the first `%s` is the Views path, the second is the facet name. Default `%s-%s` gives `views-main` for a facet named `main`.',
  facetsCustoms: 'Each facet needs a unique name. Its actions run in order on the workspace model.',
  facetsAction: '`REMOVE` deletes every node matched by the JSONPath, e.g. `$.application..relationships[?(@.qualifiers anyof [\'oidc\'])]`.'
};

/** The default view title per viewpoint (Overview/Detailed/DeepViewpointService), shown as the empty-label placeholder. */
const VIEWPOINT_DEFAULT_LABELS = { overview: 'Overview', detailed: 'Detailed View', deep: 'Deep View' };

/** One help paragraph; `describedBy(key)` is the matching aria-describedby attribute for the field it explains. */
function renderHelpHtml(key, extraClass) {
  const html = escapeHtml(SETTINGS_HELP[key]).replace(/`([^`]+)`/g, '<code>$1</code>');
  return '<div class="settings-help' + (extraClass ? ' ' + extraClass : '') + '" id="settings-help-' + key + '">' + html + '</div>';
}
function describedBy(key) {
  return ' aria-describedby="settings-help-' + key + '"';
}

/** The folder a facet's views are written to, from the template/views-path currently in use — "invalid template" instead of a throw while the user is mid-edit. */
function facetDirectoryPreviewHtml(facetName, template, viewsPath) {
  const parsed = parseDirectoryNameTemplate(String(template == null ? '' : template).trim());
  return '\u2192 ' + (parsed.valid ? '<code>' + escapeHtml(parsed.format(String(viewsPath).trim(), facetName)) + '</code>' : 'invalid template');
}

/** Re-render every facet card's folder preview from the live Views path / template inputs — runs on each keystroke in either. */
function refreshFacetDirectoryPreviews() {
  const template = document.getElementById('settings-facets-directory-template-input');
  const viewsPath = document.getElementById('settings-views-path-input');
  if (!template || !viewsPath) return;
  document.querySelectorAll('.facet-dir-preview').forEach((el) => {
    el.innerHTML = facetDirectoryPreviewHtml(el.getAttribute('data-facet-name'), template.value, viewsPath.value);
  });
}

/** One `views.labels` fixed row per VIEWPOINT_IDS (form UX review follow-up) — batched into the main Save, unlike properties/customs below. */
function renderViewsLabelsEditorHtml(labels) {
  let html = '<div class="settings-subgroup">';
  for (const viewpoint of VIEWPOINT_IDS) {
    const value = (labels && labels[viewpoint]) || '';
    html += '<div class="settings-subrow"><label for="settings-label-' + viewpoint + '-input">' + escapeHtml(viewpoint) + '</label>' +
              '<input type="text" id="settings-label-' + viewpoint + '-input" value="' + escapeHtml(value) + '" placeholder="' + escapeHtml(VIEWPOINT_DEFAULT_LABELS[viewpoint]) + '"' + describedBy('viewsLabels') + '>' +
            '</div>';
  }
  html += '</div>' + renderHelpHtml('viewsLabels');
  return html;
}

/**
 * One `views.properties[viewpoint]` JSON editor (form UX review follow-up):
 * the viewpoint's whole property object, edited as JSON — nested values
 * need no special case. CodeMirror (JSON mode) when loaded, else the same
 * auto-grow textarea fallback every other plain-text field uses. Committed
 * by the Settings view's single header Save, with everything else.
 */
function renderPropertyRowsHtml(viewpoint, props) {
  const text = JSON.stringify(props || {}, null, 2);
  const vp = escapeHtml(viewpoint);
  let html = '<div class="property-group"><h4>' + vp + '</h4>';
  if (window.CM) {
    html += '<div class="json-editor-host" data-viewpoint="' + vp + '" aria-label="' + vp + ' properties (JSON)"' + describedBy('viewsProperties') + '></div>';
  } else {
    html += '<textarea class="json-editor-fallback auto-grow-textarea" data-viewpoint="' + vp + '" aria-label="' + vp + ' properties (JSON)"' + describedBy('viewsProperties') + '>' + escapeHtml(text) + '</textarea>';
  }
  html += '<span class="inline-error" id="view-properties-error-' + vp + '"></span>';
  html += '</div>';
  return html;
}

function renderViewsPropertiesEditorHtml(properties) {
  let html = renderHelpHtml('viewsProperties');
  for (const viewpoint of VIEWPOINT_IDS) {
    html += renderPropertyRowsHtml(viewpoint, properties ? properties[viewpoint] : null);
  }
  return html;
}

/** One `facets.customs[].actions` row — same visual grammar as renderRelationshipEditRowHtml (reuses its CSS classes), one level deeper. */
function renderFacetActionRowHtml(facetIndex, action, actionIndex) {
  const isNew = actionIndex === null;
  const operator = action ? action.operator : FACET_ACTION_OPERATORS[0];
  const jsonPath = action ? action.jsonPath : '';
  let html = '<div class="relationship-edit-row' + (isNew ? ' relationship-edit-row-new' : '') + '" data-facet-index="' + facetIndex + '"' +
               (isNew ? '' : ' data-action-index="' + actionIndex + '"') + '>';
  html += '<select class="facet-action-operator-input">' +
            FACET_ACTION_OPERATORS.map((op) => '<option value="' + op + '"' + (op === operator ? ' selected' : '') + '>' + op + '</option>').join('') +
          '</select>';
  html += '<input type="text" class="facet-action-jsonpath-input" placeholder="json path" aria-label="Facet action JSON path"' + describedBy('facetsAction') + ' value="' + escapeHtml(jsonPath) + '">';
  if (isNew) {
    html += '<button type="button" data-action="add-facet-action" data-facet-index="' + facetIndex + '">Add action</button>';
  } else {
    html += '<button type="button" data-action="remove-facet-action" data-facet-index="' + facetIndex + '" data-action-index="' + actionIndex + '">Remove</button>';
  }
  html += '<span class="inline-error"></span>';
  html += '</div>';
  return html;
}

/** One `facets.customs[]` card — the name is set only at creation (consistent with Tags/Qualifiers keys: remove + re-add, never renamed in place). */
function renderFacetCardHtml(facet, facetIndex) {
  const settings = AppState.workspace.settings;
  let html = '<div class="facet-edit-card">';
  html += '<div class="facet-edit-card-header">' +
            '<span class="facet-name">' + escapeHtml(facet.name) + '</span>' +
            '<span class="facet-dir-preview" data-facet-name="' + escapeHtml(facet.name) + '">' +
              facetDirectoryPreviewHtml(facet.name, settings.facets.directoryNameTemplate, settings.views.path) +
            '</span>' +
            '<button type="button" data-action="remove-facet" data-facet-index="' + facetIndex + '">Remove facet</button>' +
          '</div>';
  html += '<div class="facet-actions-list">';
  const actions = Array.isArray(facet.actions) ? facet.actions : [];
  for (let i = 0; i < actions.length; i++) {
    html += renderFacetActionRowHtml(facetIndex, actions[i], i);
  }
  html += renderFacetActionRowHtml(facetIndex, null, null);
  html += '</div></div>';
  return html;
}

function renderFacetsEditorHtml(customs) {
  const list = Array.isArray(customs) ? customs : [];
  let html = renderHelpHtml('facetsCustoms') + renderHelpHtml('facetsAction') + '<div class="facets-editor">';
  for (let i = 0; i < list.length; i++) {
    html += renderFacetCardHtml(list[i], i);
  }
  html += '</div>';
  html += '<div class="edition-add-row">' +
            '<input type="text" id="add-facet-name-input" placeholder="new facet name" aria-label="New facet name"' + describedBy('facetsCustoms') + '>' +
            '<button type="button" data-action="add-facet">Add facet</button>' +
            '<span class="inline-error" id="add-facet-error"></span>' +
          '</div>';
  return html;
}

/**
 * A `.element-header`: a label group (name/kind, left) and an actions
 * group (buttons, right) — shared by the element view/edit headers, the
 * file-edition header, and the Diagram perspective's map header (UX
 * review follow-up: label and tag on the left, actions on the right,
 * rather than everything packed left-to-right in one row).
 */
function renderElementHeaderHtml(labelHtml, actionsHtml) {
  return '<div class="element-header">' +
           '<div class="element-header-label">' + labelHtml + '</div>' +
           '<div class="element-header-actions">' + (actionsHtml || '') + '</div>' +
         '</div>';
}

/**
 * Raw-YAML editing surface (run-0009, task-005; TDD-0009 DEC-6/DEC-10).
 * Seeded from `rawYamlEditDraft` when it holds a pending/rejected draft
 * for this exact file, else from the file's own live `mf.rawText`. A
 * draft's `error` (set only on a rejected commit) is shown in the same
 * `.error-panel` style the file's own load-time parse error already
 * uses, so an invalid edit's feedback looks consistent with that
 * existing display.
 *
 * When CodeMirror loaded (`window.CM` set — see the module script above),
 * this renders an empty host div instead of the content itself: the actual
 * editor is mounted into it by `mountFileEditorIfNeeded()`, right after
 * render() sets innerHTML (form UX review follow-up). Without CodeMirror
 * (offline, CDN unreachable), it falls back to the plain textarea this
 * view always used before — same id/content/behavior as always.
 */
function renderFileViewHtml(relPath) {
  const mf = AppState.manifestFiles.find((f) => f.relPath === relPath);
  if (!mf) return '<div class="center-placeholder">File not found: ' + escapeHtml(relPath) + '</div>';
  const hasDraft = rawYamlEditDraft && rawYamlEditDraft.relPath === relPath;
  const textareaValue = hasDraft ? rawYamlEditDraft.text : mf.rawText;
  const draftError = hasDraft ? rawYamlEditDraft.error : null;
  let html = '<div class="file-view">';
  // Header: file name (left), Save/Reload (right) — same .element-header
  // split every other center-view header uses (UX review follow-up).
  html += renderElementHeaderHtml(
    '<h2>' + escapeHtml(mf.relPath) + '</h2>' +
      (mf.dirty ? '<span class="modified-badge" title="Edited in memory. Nothing is written to disk until \'Save all changes\'.">modified \u2014 not written to disk</span>' : ''),
    '<button type="button" data-action="reload-file-edit" data-relpath="' + escapeHtml(relPath) + '"' +
      (mf.existedOnDisk
        ? ' title="Re-read this file from disk and discard unsaved changes to it."'
        : ' disabled title="This file has not been written to disk yet, so there is nothing to reload."') +
      '>Reload</button>' +
    '<button type="button" class="btn-primary" data-action="commit-file-edit" data-relpath="' + escapeHtml(relPath) + '">Save</button>'
  );
  if (draftError) {
    html += '<div class="error-panel"><strong>Parse error:</strong> ' + escapeHtml(draftError) + '</div>';
  } else if (mf.error) {
    html += '<div class="error-panel"><strong>Parse error:</strong> ' + escapeHtml(mf.error) + '</div>';
  }
  if (window.CM) {
    html += '<div id="file-edit-codemirror-host" class="raw-yaml" data-relpath="' + escapeHtml(relPath) + '" aria-label="Raw YAML content of ' + escapeHtml(relPath) + '"></div>';
  } else {
    html += '<textarea id="file-edit-textarea" class="raw-yaml" data-relpath="' + escapeHtml(relPath) + '" aria-label="Raw YAML content of ' + escapeHtml(relPath) + '">' + escapeHtml(textareaValue) + '</textarea>';
  }
  html += '</div>';
  return html;
}

/**
 * Mount a fresh CodeMirror instance on the file-edit host div render() just
 * produced, if any. render() itself already destroyed whatever instance
 * was live before calling this, so there is nothing stale to clean up here.
 */
function mountJsonEditorsIfNeeded() {
  if (!window.CM) return;
  document.querySelectorAll('.json-editor-host').forEach((host) => {
    const viewpoint = host.getAttribute('data-viewpoint');
    const props = AppState.workspace.settings.views.properties[viewpoint];
    activeJsonEditorViews[viewpoint] = new window.CM.EditorView({
      doc: JSON.stringify(props || {}, null, 2),
      extensions: [window.CM.basicSetup, window.CM.json()],
      parent: host
    });
  });
}

function mountFileEditorIfNeeded() {
  if (!window.CM) return;
  const host = document.getElementById('file-edit-codemirror-host');
  if (!host) return;
  const relPath = host.getAttribute('data-relpath');
  const mf = AppState.manifestFiles.find((f) => f.relPath === relPath);
  if (!mf) return;
  const hasDraft = rawYamlEditDraft && rawYamlEditDraft.relPath === relPath;
  const text = hasDraft ? rawYamlEditDraft.text : mf.rawText;
  activeFileEditorView = new window.CM.EditorView({
    doc: text,
    extensions: [window.CM.basicSetup, window.CM.yaml()],
    parent: host
  });
}

/**
 * Id/Reference/Name/Description/Qualifiers/Tags field-rows for `record` —
 * factored out (UX review follow-up) so both the read-only element view
 * below and the Diagram perspective's "Properties" panel render the exact
 * same fields from the exact same code.
 */
function renderElementPropertiesHtml(record) {
  let html = '';
  html += '<div class="field-row"><span class="field-label">Id</span><span class="field-value">' + escapeHtml(record.id) + '</span></div>';
  html += '<div class="field-row"><span class="field-label">Reference</span><span class="field-value">' + escapeHtml(record.reference) + '</span></div>';
  html += '<div class="field-row"><span class="field-label">Name</span><span class="field-value">' + (record.name != null ? escapeHtml(record.name) : '<span class="muted">none</span>') + '</span></div>';
  html += '<div class="field-row"><span class="field-label">Description</span><span class="field-value">' + (record.description != null ? escapeHtml(record.description) : '<span class="muted">none</span>') + '</span></div>';

  html += '<div class="field-row"><span class="field-label">Qualifiers</span><span class="field-value">';
  if (record.qualifiers && record.qualifiers.length) {
    html += record.qualifiers.map((q) => '<span class="pill">' + escapeHtml(q) + '</span>').join('');
  } else {
    html += '<span class="muted">none</span>';
  }
  html += '</span></div>';

  html += '<div class="field-row"><span class="field-label">Tags</span><span class="field-value">';
  const tagKeys = record.tags ? Object.keys(record.tags) : [];
  if (tagKeys.length) {
    html += '<ul class="tag-list">' + tagKeys.map((k) =>
      '<li><span class="tag-key">' + escapeHtml(k) + '</span>: <span class="tag-value">' + escapeHtml(String(record.tags[k])) + '</span></li>'
    ).join('') + '</ul>';
  } else {
    html += '<span class="muted">none</span>';
  }
  html += '</span></div>';
  return html;
}

/**
 * The element's egress relationships as a clickable list (resolved ones
 * jump to their destination's own element view; dangling ones are
 * flagged, not clickable) — factored out (UX review follow-up) so both
 * the read-only element view below and the Diagram perspective's
 * "Relations" panel render the exact same list from the exact same code.
 */
function renderElementRelationshipsHtml(record) {
  if (!(record.relationships && record.relationships.length)) return '<span class="muted">none</span>';
  let html = '<ul class="relationship-list">';
  for (const rel of record.relationships) {
    const qualifiersText = (rel.qualifiers && rel.qualifiers.length) ? ' (' + rel.qualifiers.map((q) => escapeHtml(q)).join(', ') + ')' : '';
    if (rel.resolved) {
      html += '<li><button type="button" class="relationship-link" data-action="goto-element" data-ref="' + escapeHtml(rel.destination) + '">' +
                escapeHtml(rel.label) + qualifiersText + ' &rarr; ' + escapeHtml(rel.destination) +
              '</button></li>';
    } else {
      html += '<li><span class="relationship-dangling">' +
                escapeHtml(rel.label) + qualifiersText + ' &rarr; ' + escapeHtml(rel.destination) +
                '<span class="dangling-badge">dangling</span>' +
              '</span></li>';
    }
  }
  html += '</ul>';
  return html;
}

function renderElementViewHtml(reference) {
  const record = findElementRecord(reference);
  if (!record) return '<div class="center-placeholder">Element not found: ' + escapeHtml(reference) + '</div>';

  let html = '<div class="element-view">';

  // Header first — it's sticky (stays pinned to the top of .center-panel's
  // own scroll), so it needs to be the first thing in the scroll order too.
  html += renderElementHeaderHtml(
    '<h2>' + escapeHtml(record.name || record.id) + '</h2><span class="element-kind-badge">' + escapeHtml(record.kind) + '</span>',
    '<button type="button" data-action="toggle-element-edit">Edit</button>'
  );

  // (a) placeholder diagram area — never populated with real content (whole-wave non-goal).
  html += '<div class="diagram-placeholder">Diagram view is not available in this phase.</div>';

  // (b) qualitative info.
  html += '<div class="element-qualitative">';
  html += renderElementPropertiesHtml(record);
  html += '<div class="field-row"><span class="field-label">Relationships</span><span class="field-value">' + renderElementRelationshipsHtml(record) + '</span></div>';
  html += '</div>'; // .element-qualitative

  // (c) quantitative info — always shown; children.length naturally covers the
  // "only for a parent kind" distinction since every record has a children array.
  html += '<div class="element-quantitative">';
  html += '<div class="stat"><span class="stat-value">' + record.relationships.length + '</span><span class="stat-label">relationships</span></div>';
  html += '<div class="stat"><span class="stat-value">' + record.children.length + '</span><span class="stat-label">children</span></div>';
  html += '</div>';

  html += '</div>'; // .element-view
  return html;
}
