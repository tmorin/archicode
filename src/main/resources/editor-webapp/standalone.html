/** Join a string[] for a relationship's comma-separated qualifiers text input. */
function formatCommaList(arr) {
  return Array.isArray(arr) ? arr.join(', ') : '';
}

/** Join a {k: v} map for a relationship's comma-separated `k=v` tags text input. */
function formatCommaKvList(obj) {
  if (!obj || typeof obj !== 'object') return '';
  return Object.keys(obj).map((k) => k + '=' + obj[k]).join(', ');
}

/** Parse a comma-separated text input into a trimmed, non-empty-entries string[]. */
function parseCommaList(text) {
  return String(text == null ? '' : text)
    .split(',')
    .map((s) => s.trim())
    .filter((s) => s !== '');
}

/**
 * Parse a comma-separated `k=v` text input into a {k: v} map (DEC-9: a
 * malformed pair with no `=` is dropped, not rejected).
 */
function parseCommaKvList(text) {
  const tags = {};
  for (const pair of parseCommaList(text)) {
    const eqIdx = pair.indexOf('=');
    if (eqIdx === -1) continue;
    const key = pair.slice(0, eqIdx).trim();
    const value = pair.slice(eqIdx + 1).trim();
    if (key === '') continue;
    tags[key] = value;
  }
  return tags;
}

/** Set (or clear) an inline-error span's text by its element id, without a full render. */
function setInlineErrorText(elementId, text) {
  const el = document.getElementById(elementId);
  if (el) el.textContent = text || '';
}

/** Set (or clear) a relationship sub-form row's own inline-error span, without a full render. */
function setRowInlineErrorText(row, text) {
  if (!row) return;
  const el = row.querySelector('.inline-error');
  if (el) el.textContent = text || '';
}

/**
 * Auto-grow textarea (form UX review follow-up): height tracks content up to
 * AUTO_GROW_MAX_LINES, then an internal scrollbar takes over — resolves the
 * "largeur 100%, hauteur auto, max ~10 lignes" request without a fixed-size
 * textarea that either wastes space or clips long text.
 */
const AUTO_GROW_MAX_LINES = 10;

function autosizeTextarea(el) {
  const style = window.getComputedStyle(el);
  const lineHeight = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.2;
  const verticalExtra = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0) +
                         (parseFloat(style.borderTopWidth) || 0) + (parseFloat(style.borderBottomWidth) || 0);
  const maxHeight = lineHeight * AUTO_GROW_MAX_LINES + verticalExtra;
  el.style.height = 'auto';
  const contentHeight = el.scrollHeight;
  el.style.height = Math.min(contentHeight, maxHeight) + 'px';
  el.style.overflowY = contentHeight > maxHeight ? 'auto' : 'hidden';
}

let autoGrowObserver = null;

/**
 * Re-run autosizeTextarea on every `.auto-grow-textarea` currently in the DOM
 * — called after each render(). A textarea is also re-measured whenever its
 * width changes: the first render after a page load runs before Tailwind's
 * CDN script has applied the grid classes, so the textarea is measured while
 * far narrower than it ends up, its text wrapped over many lines, and would
 * otherwise keep that inflated height forever.
 */
function autosizeAllTextareas() {
  const textareas = document.querySelectorAll('.auto-grow-textarea');
  textareas.forEach(autosizeTextarea);
  if (typeof ResizeObserver === 'undefined') return;
  if (autoGrowObserver) {
    autoGrowObserver.disconnect();
  } else {
    autoGrowObserver = new ResizeObserver((entries) => {
      for (const entry of entries) {
        const width = Math.round(entry.contentRect.width);
        if (entry.target._autoGrowWidth !== width) {
          entry.target._autoGrowWidth = width;
          autosizeTextarea(entry.target);
        }
      }
    });
  }
  textareas.forEach((el) => {
    el._autoGrowWidth = Math.round(el.getBoundingClientRect().width);
    autoGrowObserver.observe(el);
  });
}

/** Delegated `input` listener (DEC — mirrors the existing click/pointerdown/dblclick delegation on #app): resizes as the user types. */
function handleAppInput(e) {
  if (e.target.matches && e.target.matches('.auto-grow-textarea')) {
    autosizeTextarea(e.target);
  }
  if (e.target.id === 'settings-facets-directory-template-input' || e.target.id === 'settings-views-path-input') {
    refreshFacetDirectoryPreviews();
  }
}

/**
 * Read a relationship sub-form row's four inputs and validate them
 * (DEC-9's `validateRelationshipDraft`), returning the parsed
 * `qualifiers`/`tags` alongside on success.
 */
function readRelationshipDraftFromRow(row) {
  if (!row) return { valid: false, error: 'Relationship row not found.' };
  const destinationInput = row.querySelector('.rel-destination-input');
  const labelInput = row.querySelector('.rel-label-input');
  const qualifiersInput = row.querySelector('.rel-qualifiers-input');
  const tagsInput = row.querySelector('.rel-tags-input');
  const draft = validateRelationshipDraft(
    destinationInput ? destinationInput.value : '',
    labelInput ? labelInput.value : ''
  );
  if (!draft.valid) return draft;
  return {
    valid: true,
    destination: draft.destination,
    label: draft.label,
    qualifiers: parseCommaList(qualifiersInput ? qualifiersInput.value : ''),
    tags: parseCommaKvList(tagsInput ? tagsInput.value : '')
  };
}

/**
 * Read and validate the whole element edit form (all-or-nothing, same idea
 * as readSettingsDraft): id, name, description and every existing
 * relationship row. Shows each failing field's own error and returns
 * `{ valid: false }`, else `{ valid: true, apply(node) }` — `apply` writes
 * every field and returns `{ renamedTo }` when the id changed (DEC-8).
 */
function readElementDraft(reference) {
  const category = AppState.index.application.has(reference) ? 'application' : 'technology';
  const idInput = document.getElementById('edit-id-input');
  const nameInput = document.getElementById('edit-name-input');
  const descriptionInput = document.getElementById('edit-description-input');
  setInlineErrorText('edit-id-error', '');
  const rows = Array.from(document.querySelectorAll('.element-edition-form .relationship-edit-row[data-index]'));
  rows.forEach((row) => setRowInlineErrorText(row, ''));

  let hasError = false;
  const idResult = validateElementIdRename(idInput ? idInput.value : '', reference, category);
  if (!idResult.valid) { setInlineErrorText('edit-id-error', idResult.error); hasError = true; }

  const relationshipDrafts = new Map();
  for (const row of rows) {
    const draft = readRelationshipDraftFromRow(row);
    if (!draft.valid) { setRowInlineErrorText(row, draft.error); hasError = true; continue; }
    relationshipDrafts.set(parseInt(row.getAttribute('data-index'), 10), draft);
  }
  if (hasError) return { valid: false };

  const name = normalizeOptionalText(nameInput ? nameInput.value : '');
  const description = normalizeOptionalText(descriptionInput ? descriptionInput.value : '');
  return {
    valid: true,
    apply(node) {
      const oldId = node.id;
      node.id = idResult.newId;
      node.name = name;
      node.description = description;
      if (relationshipDrafts.size > 0 && Array.isArray(node.relationships)) {
        node.relationships = node.relationships.map((rel, i) => {
          const d = relationshipDrafts.get(i);
          return d ? { destination: d.destination, label: d.label, qualifiers: d.qualifiers, tags: d.tags } : rel;
        });
      }
      return idResult.newId !== oldId ? { renamedTo: { from: reference, to: idResult.newReference } } : undefined;
    }
  };
}

/**
 * Commit the whole form's pending edits plus (optionally) one structural
 * change — an add/remove of a qualifier, tag, application or relationship —
 * as a single edit, so the re-render that follows never throws away what the
 * user typed elsewhere in the form. Returns false when the form is invalid.
 */
function commitElementWithDraft(reference, structuralFn) {
  const draft = readElementDraft(reference);
  if (!draft.valid) return false;
  const result = commitElementEdit(reference, (node) => {
    const renamed = draft.apply(node);
    if (structuralFn) structuralFn(node);
    return renamed;
  });
  if (result && result.renamedTo) rewriteReferencePrefix(result.renamedTo.from, result.renamedTo.to); // DEC-8 — renders again itself
  return true;
}

/** One relationship sub-form row — used both for an existing relationship and the blank "add new" one. */
function renderRelationshipEditRowHtml(reference, rel, index) {
  const refAttr = escapeHtml(reference);
  const isNew = index === null;
  const destination = rel ? rel.destination : '';
  const label = rel ? rel.label : '';
  const qualifiersText = rel ? formatCommaList(rel.qualifiers) : '';
  const tagsText = rel ? formatCommaKvList(rel.tags) : '';
  let html = '<div class="relationship-edit-row' + (isNew ? ' relationship-edit-row-new' : '') + '"' +
               (isNew ? '' : ' data-index="' + index + '"') + '>';
  html += '<input type="text" class="rel-destination-input" placeholder="destination" aria-label="Relationship destination" list="archicode-all-references" value="' + escapeHtml(destination) + '">';
  html += '<input type="text" class="rel-label-input" placeholder="label" aria-label="Relationship label" value="' + escapeHtml(label || '') + '">';
  html += '<input type="text" class="rel-qualifiers-input" placeholder="qualifiers (comma-separated)" aria-label="Relationship qualifiers, comma-separated" value="' + escapeHtml(qualifiersText) + '">';
  html += '<input type="text" class="rel-tags-input" placeholder="tags (k=v, comma-separated)" aria-label="Relationship tags, comma-separated key=value pairs" value="' + escapeHtml(tagsText) + '">';
  if (isNew) {
    html += '<button type="button" data-action="add-relationship" data-ref="' + refAttr + '">Add</button>';
  } else {
    html += '<button type="button" data-action="remove-relationship" data-ref="' + refAttr + '" data-index="' + index + '">Remove</button>';
  }
  html += '<span class="inline-error"></span>';
  html += '</div>';
  return html;
}

/**
 * The edit-mode sibling of `renderElementViewHtml` (DEC-1/DEC-2): one
 * shared template covering every kind's id/name/description/qualifiers/
 * tags/relationships, plus a `node`-only `applications` block (DEC-2a).
 * One header Save commits the whole form (id/name/description and every
 * relationship row — readElementDraft). Each add/remove control commits
 * immediately (DEC-5) but applies that draft first, so nothing typed
 * elsewhere in the form is lost to the re-render.
 */
function renderElementEditionFormHtml(reference) {
  const record = findElementRecord(reference);
  if (!record) return '<div class="center-placeholder">Element not found: ' + escapeHtml(reference) + '</div>';

  const refAttr = escapeHtml(reference);
  let html = '<div class="element-edition-form">';

  html += renderElementHeaderHtml(
    '<h2>' + escapeHtml(record.name || record.id) + '</h2><span class="element-kind-badge">' + escapeHtml(record.kind) + '</span>',
    // Same order as every header: destructive first, primary last.
    // TDD-0010 DEC-4: Delete is always present — even a leaf can be the
    // destination of a relationship elsewhere.
    '<button type="button" class="btn-danger" data-action="request-delete-element" data-ref="' + refAttr + '">Delete</button>' +
    (childKindOptionsFor(record).length > 0
      ? '<button type="button" data-action="open-create-child-form" data-ref="' + refAttr + '">Add child</button>'
      : '') +
    '<button type="button" data-action="toggle-element-edit">Back to view</button>' +
    '<button type="button" class="btn-primary" data-action="save-element" data-ref="' + refAttr + '">Save</button>'
  );

  // TDD-0010 DEC-4: a pending delete confirmation for this exact element
  // overlays the already-rendering edition view below — it never changes
  // AppState.selection (mirrors TDD-0009's rawYamlEditDraft pattern).
  if (pendingDeleteConfirmation && pendingDeleteConfirmation.reference === reference) {
    const affected = pendingDeleteConfirmation.affected;
    html += '<div class="edition-section delete-confirmation">';
    html += '<h3>Confirm delete</h3>';
    if (affected.length === 0) {
      html += '<p class="muted">No other relationship is affected.</p>';
    } else {
      html += '<ul class="relationship-list">';
      for (const a of affected) {
        html += '<li>' + escapeHtml(a.ownerSourceFile) + ': ' + escapeHtml(a.label) + ' &rarr; ' + escapeHtml(a.destination) + '</li>';
      }
      html += '</ul>';
    }
    html += '<button type="button" data-action="cancel-delete-element">Cancel</button> ' +
            '<button type="button" class="btn-danger-solid" data-action="confirm-delete-element">Confirm delete</button>';
    html += '</div>';
  }

  // id / name / description — committed together with the rest of the form by the header Save (see readElementDraft).
  html += '<div class="edition-section">';
  html += '<div class="field-row"><label class="field-label" for="edit-id-input">Id</label><span class="field-value">' +
            '<input type="text" id="edit-id-input" value="' + escapeHtml(record.id) + '">' +
            '<span class="inline-error" id="edit-id-error"></span>' +
          '</span></div>';
  html += '<div class="field-row"><label class="field-label" for="edit-name-input">Name</label><span class="field-value">' +
            '<input type="text" id="edit-name-input" value="' + escapeHtml(record.name != null ? record.name : '') + '">' +
          '</span></div>';
  html += '<div class="field-row"><label class="field-label" for="edit-description-input">Description</label><span class="field-value">' +
            '<textarea id="edit-description-input" class="auto-grow-textarea">' + escapeHtml(record.description != null ? record.description : '') + '</textarea>' +
          '</span></div>';
  html += '</div>';

  // qualifiers
  html += '<div class="edition-section"><h3>Qualifiers</h3>';
  if (record.qualifiers && record.qualifiers.length) {
    html += record.qualifiers.map((q, i) =>
      '<span class="pill">' + escapeHtml(q) +
        ' <button type="button" class="pill-remove" data-action="remove-qualifier" data-ref="' + refAttr + '" data-index="' + i + '">&times;</button>' +
      '</span>'
    ).join('');
  }
  html += '<div class="edition-add-row">' +
            '<input type="text" id="add-qualifier-input" placeholder="new qualifier" aria-label="New qualifier">' +
            '<button type="button" data-action="add-qualifier" data-ref="' + refAttr + '">Add</button>' +
            '<span class="inline-error" id="add-qualifier-error"></span>' +
          '</div>';
  html += '</div>';

  // tags
  html += '<div class="edition-section"><h3>Tags</h3>';
  const tagKeys = record.tags ? Object.keys(record.tags) : [];
  if (tagKeys.length) {
    html += '<ul class="tag-list">' + tagKeys.map((k) =>
      '<li><span class="tag-key">' + escapeHtml(k) + '</span>: <span class="tag-value">' + escapeHtml(String(record.tags[k])) + '</span> ' +
        '<button type="button" class="pill-remove" data-action="remove-tag" data-ref="' + refAttr + '" data-key="' + escapeHtml(k) + '">&times;</button></li>'
    ).join('') + '</ul>';
  }
  html += '<div class="edition-add-row">' +
            '<input type="text" id="add-tag-key-input" placeholder="key" aria-label="New tag key">' +
            '<input type="text" id="add-tag-value-input" placeholder="value" aria-label="New tag value">' +
            '<button type="button" data-action="add-tag" data-ref="' + refAttr + '">Add</button>' +
            '<span class="inline-error" id="add-tag-error"></span>' +
          '</div>';
  html += '</div>';

  // relationships
  html += '<div class="edition-section"><h3>Relationships</h3>';
  if (record.relationships && record.relationships.length) {
    for (let i = 0; i < record.relationships.length; i++) {
      html += renderRelationshipEditRowHtml(reference, record.relationships[i], i);
    }
  }
  html += renderRelationshipEditRowHtml(reference, null, null);
  html += '</div>';

  // applications (node only — DEC-2a)
  if (record.kind === 'node') {
    html += '<div class="edition-section"><h3>Applications</h3>';
    if (record.applications && record.applications.length) {
      html += record.applications.map((a, i) =>
        '<span class="pill">' + escapeHtml(a) +
          ' <button type="button" class="pill-remove" data-action="remove-application" data-ref="' + refAttr + '" data-index="' + i + '">&times;</button>' +
        '</span>'
      ).join('');
    }
    html += '<div class="edition-add-row">' +
              '<input type="text" id="add-application-input" placeholder="new application" aria-label="New application reference" list="archicode-application-references">' +
              '<button type="button" data-action="add-application" data-ref="' + refAttr + '">Add</button>' +
              '<span class="inline-error" id="add-application-error"></span>' +
            '</div>';
    html += '</div>';
  }

  html += '</div>'; // .element-edition-form
  return html;
}

/**
 * The create form (TDD-0010 DEC-1/DEC-2) — one shared template for both
 * `createMode`s. `sel` is `AppState.selection` itself (`{kind:'create',
 * createMode, category, parentReference}`); the kind `<select>`'s own
 * options come from `childKindOptionsFor` (child mode) or the fixed
 * per-category `TOP_LEVEL_KIND_OPTIONS` list (top-level mode). The
 * "attach under" input only appears in top-level mode (FR-4).
 */
function renderCreateElementFormHtml(sel) {
  let kindOptions;
  if (sel.createMode === 'child') {
    const parentRecord = findElementRecord(sel.parentReference);
    kindOptions = parentRecord ? childKindOptionsFor(parentRecord) : [];
  } else {
    kindOptions = TOP_LEVEL_KIND_OPTIONS[sel.category] || [];
  }

  let html = '<div class="create-element-form">';
  html += '<h2>' + (sel.createMode === 'child' ? 'Add child element' : 'Add top-level element') + '</h2>';
  if (sel.createMode === 'child') {
    html += '<div class="field-row"><span class="field-label">Parent</span><span class="field-value">' + escapeHtml(sel.parentReference) + '</span></div>';
  }
  html += '<div class="field-row"><label class="field-label" for="create-kind-select">Kind</label><span class="field-value">' +
            '<select id="create-kind-select">' +
              kindOptions.map((k) => '<option value="' + escapeHtml(k) + '">' + escapeHtml(k) + '</option>').join('') +
            '</select>' +
          '</span></div>';
  html += '<div class="field-row"><label class="field-label" for="create-id-input">Id</label><span class="field-value">' +
            '<input type="text" id="create-id-input">' +
            '<span class="inline-error" id="create-id-error"></span>' +
          '</span></div>';
  html += '<div class="field-row"><label class="field-label" for="create-name-input">Name</label><span class="field-value">' +
            '<input type="text" id="create-name-input">' +
          '</span></div>';
  html += '<div class="field-row"><label class="field-label" for="create-description-input">Description</label><span class="field-value">' +
            '<textarea id="create-description-input" class="auto-grow-textarea"></textarea>' +
          '</span></div>';
  if (sel.createMode === 'top-level') {
    html += '<div class="field-row"><label class="field-label" for="create-attach-under-input">Attach under</label><span class="field-value">' +
              '<input type="text" id="create-attach-under-input" placeholder="(optional) existing element reference" list="archicode-all-references">' +
              '<span class="inline-error" id="create-attach-under-error"></span>' +
            '</span></div>';
  }
  html += '<div class="field-row"><span class="field-label"></span><span class="field-value">' +
            '<button type="button" data-action="' + (sel.createMode === 'child' ? 'submit-create-child' : 'submit-create-top-level') + '">Create</button> ' +
            '<button type="button" data-action="cancel-create">Cancel</button>' +
            '<span class="inline-error" id="create-form-error"></span>' +
          '</span></div>';
  html += '</div>';
  return html;
}

/**
 * `<datalist>`s backing the reference-typing inputs above (UX review
 * follow-up): one over every known reference (application + technology),
 * used by "Attach under" and a relationship's "destination"; one over
 * application references only, used by a node's "applications" field,
 * since that field only ever points at application elements.
 */
function renderReferenceDatalistsHtml() {
  const appRefs = Array.from(AppState.index.application.keys());
  const techRefs = Array.from(AppState.index.technology.keys());
  const optionsHtml = (refs) => refs.map((r) => '<option value="' + escapeHtml(r) + '">').join('');
  return (
    '<datalist id="archicode-all-references">' + optionsHtml(appRefs.concat(techRefs)) + '</datalist>' +
    '<datalist id="archicode-application-references">' + optionsHtml(appRefs) + '</datalist>'
  );
}

/** The Elements perspective's center — element view/edit or the create form; everything else (notably a 'file' selection, which belongs to the Files perspective) falls back to the same placeholder as "nothing selected". */
function renderCenterPanelHtml() {
  const sel = AppState.selection;
  if (sel.kind === 'create') return renderCreateElementFormHtml(sel);
  if (sel.kind === 'element') {
    return sel.mode === 'edit' ? renderElementEditionFormHtml(sel.key) : renderElementViewHtml(sel.key);
  }
  return '<div class="center-placeholder">Select an item on the left, or use "+ Add" above the Applications/Environments tree to create your first element.</div>';
}

// ---- Shell assembly + delegated event handling ----

/**
 * One resize handle, delegated-`pointerdown`-driven (see
 * handleAppPointerDown) — markup only mirrors the archi-edtior.html
 * reference's data-resize/data-axis/data-sign contract.
 */
function renderResizeHandleHtml(panelId, axis, sign) {
  const cursorClass = axis === 'x' ? 'w-1 cursor-col-resize' : 'h-1 cursor-row-resize';
  return '<div data-resize="' + panelId + '" data-axis="' + axis + '" data-sign="' + sign + '" class="' + cursorClass + ' touch-none"></div>';
}

/**
 * Elements perspective — navigate Elements on the left, view/edit/create
 * in the center. Right/bottom are unused by this perspective (Diagram
 * owns the properties/relations side panels) — `null`, not rendered at
 * all (see renderShellHtml): hidden, not a disabled placeholder.
 */
function renderElementsPerspectiveHtml() {
  return {
    left: renderLeftPanelWrapperHtml(renderElementsNavHtml(true)),
    center: renderCenterPanelHtml(),
    right: null,
    bottom: null
  };
}

/**
 * Files perspective — navigate manifest files on the left, raw-YAML edit
 * (its own header: file name, Save, Reload) in the center. Right/bottom
 * unused/hidden, same as Elements.
 */
function renderFilesPerspectiveHtml() {
  const sel = AppState.selection;
  return {
    left: renderLeftPanelWrapperHtml(renderFilesNavHtml()),
    center: sel.kind === 'file' ? renderFileViewHtml(sel.key) : '<div class="center-placeholder">Select a file on the left.</div>',
    right: null,
    bottom: null
  };
}

/**
 * Diagram perspective — the selected element's map (placeholder: real
 * diagram rendering is out of scope for this wave, same as the inert
 * diagram area it's relocated from — see wbc-003's Vision), its
 * properties on the right, its relationships on the bottom. Falls back to
 * a "select an element" placeholder in all three regions when nothing, or
 * something other than an element (a file), is selected —
 * `AppState.selection` is shared across every perspective, not reset on
 * switch, so this is a real state this perspective can land in. Its left
 * panel's tree has no "+ Add" (DEC — Diagram has no center surface to
 * land a newly-created element on; see renderElementsNavHtml).
 */
function renderDiagramPerspectiveHtml() {
  const sel = AppState.selection;
  const record = sel.kind === 'element' ? findElementRecord(sel.key) : null;
  const none = '<div class="center-placeholder">Select an element on the left.</div>';
  return {
    left: renderLeftPanelWrapperHtml(renderElementsNavHtml(false)),
    center: record
      ? (renderElementHeaderHtml('<h2>' + escapeHtml(record.name || record.id) + '</h2><span class="element-kind-badge">' + escapeHtml(record.kind) + '</span>', '') +
         '<div class="diagram-placeholder">Diagram view is not available in this phase.</div>')
      : none,
    right: record ? ('<h3>Properties</h3>' + renderElementPropertiesHtml(record)) : none,
    bottom: record ? ('<h3>Relations</h3>' + renderElementRelationshipsHtml(record)) : none
  };
}

/**
 * Settings perspective — the workspace settings form, standalone (there
 * is only one settings page, so unlike every other region it doesn't
 * depend on `AppState.selection` at all). Left/right/bottom are all
 * hidden — no sub-navigation exists yet (a natural later addition, not
 * invented now).
 */
function renderSettingsPerspectiveHtml() {
  return { left: null, center: renderSettingsViewHtml(), right: null, bottom: null };
}

/** Dispatch to the active perspective's region content. */
function renderActivePerspectiveHtml() {
  if (currentPerspective === 'diagram') return renderDiagramPerspectiveHtml();
  if (currentPerspective === 'files') return renderFilesPerspectiveHtml();
  if (currentPerspective === 'settings') return renderSettingsPerspectiveHtml();
  return renderElementsPerspectiveHtml();
}

/**
 * The resizable grid shell (layout adapted from archi-edtior.html):
 * header spans the top, then whichever of the active perspective's
 * left/center/right/bottom regions it actually uses — a `null` region is
 * not rendered at all (no panel, no resize handle, no reserved space),
 * per-perspective, rather than shown disabled. The content area always
 * lands in the grid's 3rd (1fr) column via `col-start-3`, whether or not
 * the left nav (columns 1-2) is present — an empty, item-less `auto`
 * column collapses to zero width on its own, so this needs no conditional
 * grid-template-columns.
 */
function renderShellHtml() {
  let html = '<div class="app-shell grid grid-cols-[auto_auto_minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)]">';
  html += renderTopPanelHtml();
  if (AppState.fatalError) {
    html += '<div class="col-span-3 min-h-0"><div class="error-panel shell-error-panel"><strong>Error:</strong> ' + escapeHtml(AppState.fatalError) + '</div></div>';
  } else if (!AppState.workspace) {
    html += '<div class="col-span-3 min-h-0"><div class="center-placeholder">Loading…</div></div>';
  } else {
    const p = renderActivePerspectiveHtml();

    if (p.left) {
      html += p.left;
      html += renderResizeHandleHtml('panel-left', 'x', '1');
    }

    if (!p.right && !p.bottom) {
      html += '<main id="panel-center" class="center-panel col-start-3 min-h-0 min-w-0">' + p.center + '</main>';
    } else {
      html += '<div class="grid min-h-0 min-w-0 col-start-3 grid-rows-[minmax(0,1fr)_auto_auto]">';
      if (p.right) {
        html += '<div class="grid min-h-0 min-w-0 grid-cols-[minmax(0,1fr)_auto_auto]">';
        html += '<main id="panel-center" class="center-panel min-h-0 min-w-0">' + p.center + '</main>';
        html += renderResizeHandleHtml('panel-right', 'x', '-1');
        html += '<aside id="panel-right" class="right-panel min-w-56 w-72 max-w-[40vw]" style="' + savedPanelSizeStyle('panel-right', 'width') + '">' + p.right + '</aside>';
        html += '</div>';
      } else {
        html += '<main id="panel-center" class="center-panel min-h-0 min-w-0">' + p.center + '</main>';
      }
      if (p.bottom) {
        html += renderResizeHandleHtml('panel-bottom', 'y', '-1');
        html += '<section id="panel-bottom" class="bottom-panel min-h-32 h-48 max-h-[60vh]" style="' + savedPanelSizeStyle('panel-bottom', 'height') + '">' + p.bottom + '</section>';
      }
      html += '</div>';
    }
    html += renderReferenceDatalistsHtml();
  }
  html += '</div>';
  return html;
}

/**
 * Single delegated click handler for the whole #app subtree — every
 * interactive element declares `data-action` (and the data it needs),
 * so one listener (added idempotently each render(), see below) covers
 * every panel without per-node addEventListener calls (DEC-1's
 * innerHTML-template approach).
 */
function handleAppClick(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.getAttribute('data-action');
  switch (action) {
    case 'open-folder':
      openFolder();
      break;
    case 'reopen-folder':
      reopenFolder();
      break;
    case 'retry-folder':
      retryFolder();
      break;
    case 'close-folder':
      closeFolder();
      break;
    case 'set-perspective':
      setPerspective(target.getAttribute('data-perspective'));
      break;
    case 'select-file': {
      const relPath = target.getAttribute('data-relpath');
      // DEC-10/FLOW-4: keep the draft when re-selecting the very file it
      // belongs to; discard it for any other navigation.
      if (rawYamlEditDraft && rawYamlEditDraft.relPath !== relPath) rawYamlEditDraft = null;
      // TDD-0010 DEC-4: a file view is never the element a pending delete
      // confirmation belongs to — discard unconditionally.
      if (pendingDeleteConfirmation) pendingDeleteConfirmation = null;
      AppState.selection = { kind: 'file', key: relPath, mode: 'view' };
      render();
      break;
    }
    case 'select-element': {
      const reference = target.getAttribute('data-ref');
      if (rawYamlEditDraft) rawYamlEditDraft = null; // DEC-10/FLOW-4 — an element is never the draft's file
      if (pendingDeleteConfirmation) pendingDeleteConfirmation = null; // TDD-0010 DEC-4 — same discard-on-navigate philosophy
      AppState.selection = { kind: 'element', key: reference, mode: 'view' };
      render();
      break;
    }
    case 'goto-element': {
      const destinationRef = target.getAttribute('data-ref');
      if (rawYamlEditDraft) rawYamlEditDraft = null; // DEC-10/FLOW-4 — an element is never the draft's file
      if (pendingDeleteConfirmation) pendingDeleteConfirmation = null; // TDD-0010 DEC-4 — same discard-on-navigate philosophy
      AppState.selection = { kind: 'element', key: destinationRef, mode: 'view' };
      expandAncestorsOf(destinationRef); // FR-14/FLOW-5
      render();
      break;
    }
    case 'toggle-element-edit':
      if (AppState.selection.kind === 'element') {
        AppState.selection.mode = AppState.selection.mode === 'edit' ? 'view' : 'edit';
      }
      render();
      break;
    case 'toggle-branch': {
      const branch = target.getAttribute('data-branch');
      if (branch === 'applications') {
        treeExpandedApplications = !treeExpandedApplications;
      } else if (branch === 'environments') {
        treeExpandedEnvironments = !treeExpandedEnvironments;
      }
      render();
      break;
    }
    case 'toggle-element':
      toggleExpandedKey(target.getAttribute('data-ref'));
      render();
      break;
    case 'save-element': {
      commitElementWithDraft(target.getAttribute('data-ref'), null);
      break;
    }
    case 'add-qualifier': {
      const reference = target.getAttribute('data-ref');
      const input = document.getElementById('add-qualifier-input');
      const result = validateNewListEntry(input ? input.value : '');
      if (!result.valid) {
        setInlineErrorText('add-qualifier-error', result.error);
        break;
      }
      commitElementWithDraft(reference, (node) => {
        const qualifiers = Array.isArray(node.qualifiers) ? node.qualifiers.slice() : [];
        qualifiers.push(result.value);
        node.qualifiers = qualifiers;
      });
      break;
    }
    case 'remove-qualifier': {
      if (!confirm('Remove this qualifier?')) break;
      const reference = target.getAttribute('data-ref');
      const index = parseInt(target.getAttribute('data-index'), 10);
      commitElementWithDraft(reference, (node) => {
        const qualifiers = Array.isArray(node.qualifiers) ? node.qualifiers.slice() : [];
        qualifiers.splice(index, 1);
        node.qualifiers = qualifiers;
      });
      break;
    }
    case 'add-application': {
      const reference = target.getAttribute('data-ref');
      const input = document.getElementById('add-application-input');
      const result = validateNewListEntry(input ? input.value : '');
      if (!result.valid) {
        setInlineErrorText('add-application-error', result.error);
        break;
      }
      commitElementWithDraft(reference, (node) => {
        const applications = Array.isArray(node.applications) ? node.applications.slice() : [];
        applications.push(result.value);
        node.applications = applications;
      });
      break;
    }
    case 'remove-application': {
      if (!confirm('Remove this application reference?')) break;
      const reference = target.getAttribute('data-ref');
      const index = parseInt(target.getAttribute('data-index'), 10);
      commitElementWithDraft(reference, (node) => {
        const applications = Array.isArray(node.applications) ? node.applications.slice() : [];
        applications.splice(index, 1);
        node.applications = applications;
      });
      break;
    }
    case 'add-tag': {
      const reference = target.getAttribute('data-ref');
      const record = findElementRecord(reference);
      const keyInput = document.getElementById('add-tag-key-input');
      const valueInput = document.getElementById('add-tag-value-input');
      const result = validateNewTagKey(keyInput ? keyInput.value : '', record ? record.tags : {});
      if (!result.valid) {
        setInlineErrorText('add-tag-error', result.error);
        break;
      }
      const value = valueInput ? valueInput.value : '';
      commitElementWithDraft(reference, (node) => {
        const tags = (node.tags && typeof node.tags === 'object') ? Object.assign({}, node.tags) : {};
        tags[result.key] = value;
        node.tags = tags;
      });
      break;
    }
    case 'remove-tag': {
      if (!confirm('Remove this tag?')) break;
      const reference = target.getAttribute('data-ref');
      const key = target.getAttribute('data-key');
      commitElementWithDraft(reference, (node) => {
        const tags = (node.tags && typeof node.tags === 'object') ? Object.assign({}, node.tags) : {};
        delete tags[key];
        node.tags = tags;
      });
      break;
    }
    case 'add-relationship': {
      const reference = target.getAttribute('data-ref');
      const row = target.closest('.relationship-edit-row');
      const draft = readRelationshipDraftFromRow(row);
      if (!draft.valid) {
        setRowInlineErrorText(row, draft.error);
        break;
      }
      commitElementWithDraft(reference, (node) => {
        const relationships = Array.isArray(node.relationships) ? node.relationships.slice() : [];
        relationships.push({
          destination: draft.destination,
          label: draft.label,
          qualifiers: draft.qualifiers,
          tags: draft.tags
        });
        node.relationships = relationships;
      });
      break;
    }
    case 'remove-relationship': {
      if (!confirm('Remove this relationship?')) break;
      const reference = target.getAttribute('data-ref');
      const index = parseInt(target.getAttribute('data-index'), 10);
      commitElementWithDraft(reference, (node) => {
        const relationships = Array.isArray(node.relationships) ? node.relationships.slice() : [];
        relationships.splice(index, 1);
        node.relationships = relationships;
      });
      break;
    }
    case 'save-settings': {
      const draft = readSettingsDraft();
      if (!draft.valid) break;
      commitSettingsEdit(draft.apply);
      break;
    }
    case 'add-facet': {
      const input = document.getElementById('add-facet-name-input');
      const result = validateFacetName(input ? input.value : '', AppState.workspace.settings.facets.customs);
      setInlineErrorText('add-facet-error', result.valid ? '' : result.error);
      if (!result.valid) break;
      const draft = readSettingsDraft();
      if (!draft.valid) break;
      commitSettingsEdit((settings) => {
        draft.apply(settings);
        settings.facets.customs = settings.facets.customs.concat([{ name: result.name, actions: [] }]);
      });
      break;
    }
    case 'remove-facet': {
      if (!confirm('Remove this facet?')) break;
      const facetIndex = parseInt(target.getAttribute('data-facet-index'), 10);
      const draft = readSettingsDraft();
      if (!draft.valid) break;
      commitSettingsEdit((settings) => {
        draft.apply(settings);
        const customs = settings.facets.customs.slice();
        customs.splice(facetIndex, 1);
        settings.facets.customs = customs;
      });
      break;
    }
    case 'add-facet-action': {
      const facetIndex = parseInt(target.getAttribute('data-facet-index'), 10);
      const row = target.closest('.relationship-edit-row');
      const result = validateFacetActionDraft(row.querySelector('.facet-action-jsonpath-input').value);
      if (!result.valid) {
        setRowInlineErrorText(row, result.error);
        break;
      }
      const operator = row.querySelector('.facet-action-operator-input').value;
      const draft = readSettingsDraft();
      if (!draft.valid) break;
      commitSettingsEdit((settings) => {
        draft.apply(settings);
        const customs = settings.facets.customs.slice();
        const facet = customs[facetIndex];
        customs[facetIndex] = Object.assign({}, facet, { actions: facet.actions.concat([{ operator: operator, jsonPath: result.jsonPath }]) });
        settings.facets.customs = customs;
      });
      break;
    }
    case 'remove-facet-action': {
      if (!confirm('Remove this action?')) break;
      const facetIndex = parseInt(target.getAttribute('data-facet-index'), 10);
      const actionIndex = parseInt(target.getAttribute('data-action-index'), 10);
      const draft = readSettingsDraft();
      if (!draft.valid) break;
      commitSettingsEdit((settings) => {
        draft.apply(settings);
        const customs = settings.facets.customs.slice();
        const facet = customs[facetIndex];
        const actions = facet.actions.slice();
        actions.splice(actionIndex, 1);
        customs[facetIndex] = Object.assign({}, facet, { actions: actions });
        settings.facets.customs = customs;
      });
      break;
    }
    case 'commit-file-edit': {
      const relPath = target.getAttribute('data-relpath');
      // CodeMirror's own doc, when mounted, is the source of truth — the
      // plain <textarea> only exists at all when it isn't (window.CM unset).
      commitFileEdit(relPath, currentFileEditorText() || '');
      break;
    }
    case 'reload-file-edit': {
      const relPath = target.getAttribute('data-relpath');
      const mf = AppState.manifestFiles.find((f) => f.relPath === relPath);
      if (!mf || !mf.existedOnDisk) break;
      if (fileHasUnsavedChanges(relPath)) {
        const others = AppState.manifestFiles.filter((f) => f.dirty && f.relPath !== relPath).map((f) => f.relPath);
        const message = 'Discard unsaved changes to ' + relPath + ' and reload it from disk?' +
          (others.length > 0 ? '\n\nOther modified files are NOT reverted:\n' + others.join('\n') : '');
        if (!confirm(message)) break;
      }
      reloadManifestFile(relPath);
      break;
    }
    case 'open-create-child-form': {
      // TDD-0010 DEC-1: category is determined the same way
      // readElementDraft does — whichever index Map holds it.
      const reference = target.getAttribute('data-ref');
      const category = AppState.index.application.has(reference) ? 'application' : 'technology';
      if (rawYamlEditDraft) rawYamlEditDraft = null;
      AppState.selection = { kind: 'create', createMode: 'child', category, parentReference: reference };
      render();
      break;
    }
    case 'open-create-top-level-form': {
      const category = target.getAttribute('data-category');
      if (rawYamlEditDraft) rawYamlEditDraft = null;
      AppState.selection = { kind: 'create', createMode: 'top-level', category, parentReference: null };
      render();
      break;
    }
    case 'cancel-create': {
      // TDD-0010 DEC-1: no AppState mutation beyond resetting selection —
      // a create form backed out of leaves nothing behind.
      const sel = AppState.selection;
      if (sel.kind === 'create' && sel.createMode === 'child') {
        AppState.selection = { kind: 'element', key: sel.parentReference, mode: 'edit' };
      } else {
        AppState.selection = { kind: 'none', key: null, mode: 'view' };
      }
      render();
      break;
    }
    case 'submit-create-child': {
      const sel = AppState.selection;
      const parentReference = sel.parentReference;
      const category = sel.category;
      const parentRecord = findElementRecord(parentReference);
      const kindSelect = document.getElementById('create-kind-select');
      const idInput = document.getElementById('create-id-input');
      const nameInput = document.getElementById('create-name-input');
      const descriptionInput = document.getElementById('create-description-input');

      setInlineErrorText('create-id-error', '');
      setInlineErrorText('create-form-error', '');

      // DEC-3's own kind-membership check, re-validated here per DEC-9's
      // "never trust the DOM alone" discipline (defensive — the <select>
      // should already only offer a valid option).
      const chosenKind = kindSelect ? kindSelect.value : '';
      const allowedKinds = parentRecord ? childKindOptionsFor(parentRecord) : [];
      if (allowedKinds.indexOf(chosenKind) === -1) {
        setInlineErrorText('create-form-error', 'Invalid kind for this parent.');
        break;
      }

      const id = idInput ? idInput.value.trim() : '';
      if (id === '') {
        setInlineErrorText('create-id-error', 'Id is required.');
        break;
      }
      // FR-7: id-collision check against the same category's live index.
      const newReference = parentReference + '.' + id;
      if (AppState.index[category] && AppState.index[category].has(newReference)) {
        setInlineErrorText('create-id-error', 'Another element already uses reference "' + newReference + '".');
        break;
      }

      const name = normalizeOptionalText(nameInput ? nameInput.value : '');
      const description = normalizeOptionalText(descriptionInput ? descriptionInput.value : '');

      const result = commitElementEdit(parentReference, (node) => {
        node.elements = Array.isArray(node.elements) ? node.elements.slice() : [];
        const child = { kind: chosenKind, id };
        if (name) child.name = name;
        if (description) child.description = description;
        node.elements.push(child);
        return { createdReference: parentReference + '.' + id };
      });
      // UX review follow-up: the new child is wholly unsaved on its own,
      // independent of the parent's own dirty state (already added inside
      // commitElementEdit above).
      AppState.dirtyReferences.add(result.createdReference);

      // FR-3: one extra render after commitElementEdit's own rebuild
      // render, which still carried the stale (create-form) selection.
      AppState.selection = { kind: 'element', key: result.createdReference, mode: 'edit' };
      render();
      break;
    }
    case 'submit-create-top-level': {
      const sel = AppState.selection;
      const category = sel.category;
      const kindSelect = document.getElementById('create-kind-select');
      const idInput = document.getElementById('create-id-input');
      const nameInput = document.getElementById('create-name-input');
      const descriptionInput = document.getElementById('create-description-input');
      const attachUnderInput = document.getElementById('create-attach-under-input');

      setInlineErrorText('create-id-error', '');
      setInlineErrorText('create-attach-under-error', '');
      setInlineErrorText('create-form-error', '');

      const chosenKind = kindSelect ? kindSelect.value : '';
      const allowedTopLevelKinds = TOP_LEVEL_KIND_OPTIONS[category] || [];
      if (allowedTopLevelKinds.indexOf(chosenKind) === -1) {
        setInlineErrorText('create-form-error', 'Invalid kind for this category.');
        break;
      }

      const attachUnderRaw = attachUnderInput ? attachUnderInput.value.trim() : '';
      const attachUnder = attachUnderRaw === '' ? null : attachUnderRaw;
      const mapping = ARCHICODE_KIND_MAP[chosenKind];
      const rootKind = mapping ? mapping.rootKind : null;

      // FR-6(a): attach-under filled — must resolve, and the parent's own
      // kind must be able to contain the chosen kind.
      if (attachUnder) {
        const parentRecord = AppState.index[category] ? AppState.index[category].get(attachUnder) : null;
        if (!parentRecord) {
          setInlineErrorText('create-attach-under-error', 'No element "' + attachUnder + '" exists in this category.');
          break;
        }
        const attachOk = (rootKind === 'group')
          ? reducedLevelForKind(chosenKind) === parentRecord.level
          : childKindOptionsForLevel(parentRecord.level).indexOf(rootKind) !== -1;
        if (!attachOk) {
          setInlineErrorText('create-attach-under-error', 'Element "' + attachUnder + '" cannot contain a "' + chosenKind + '".');
          break;
        }
      } else {
        // FR-6(b): attach-under left blank — the chosen kind must be one
        // the real domain model allows as a genuinely unparented root.
        const blankAllowed = TOP_LEVEL_BLANK_ATTACH_ALLOWED[category] || [];
        if (blankAllowed.indexOf(chosenKind) === -1) {
          setInlineErrorText('create-form-error', 'A "' + chosenKind + '" must have "Attach under" filled in — it is never a top-level root.');
          break;
        }
      }

      const id = idInput ? idInput.value.trim() : '';
      if (id === '') {
        setInlineErrorText('create-id-error', 'Id is required.');
        break;
      }
      // FR-7: id-collision check against the resulting full reference.
      const newReference = attachUnder ? (attachUnder + '.' + id) : id;
      if (AppState.index[category] && AppState.index[category].has(newReference)) {
        setInlineErrorText('create-id-error', 'Another element already uses reference "' + newReference + '".');
        break;
      }

      const name = normalizeOptionalText(nameInput ? nameInput.value : '');
      const description = normalizeOptionalText(descriptionInput ? descriptionInput.value : '');

      const result = commitCreateTopLevelElement({
        category, headerKind: chosenKind, attachUnderReference: attachUnder, id, name, description
      });

      // FR-3: one extra render after commitCreateTopLevelElement's own
      // rebuild render, which still carried the stale (create-form) selection.
      AppState.selection = { kind: 'element', key: result.createdReference, mode: 'edit' };
      render();
      break;
    }
    case 'request-delete-element': {
      // TDD-0010 DEC-4: compute the impact scan and render it inline,
      // overlaid on the already-rendering edition view — no AppState
      // mutation happens here.
      const reference = target.getAttribute('data-ref');
      const category = AppState.index.application.has(reference) ? 'application' : 'technology';
      const deletedRefs = computeDeletedReferenceSet(reference, category);
      const affected = scanDanglingRelationshipsFor(deletedRefs, category);
      pendingDeleteConfirmation = { reference, category, affected };
      render();
      break;
    }
    case 'confirm-delete-element': {
      // TDD-0010 DEC-6: commitDeleteElement itself clears
      // pendingDeleteConfirmation and calls rebuildIndexAndRender.
      if (pendingDeleteConfirmation) {
        commitDeleteElement(pendingDeleteConfirmation.reference, pendingDeleteConfirmation.category, pendingDeleteConfirmation.affected);
      }
      break;
    }
    case 'cancel-delete-element':
      // TDD-0010 DEC-4, AC-11: no AppState mutation — only the transient
      // confirmation overlay is discarded.
      pendingDeleteConfirmation = null;
      render();
      break;
    case 'save-all-changes':
      // TDD-0010 DEC-7/ASM-2: saveAllChanges() is called directly and
      // synchronously from this click handler so its first await
      // (inside ensureWritePermission) is still reached within the
      // triggering user gesture.
      saveAllChanges();
      break;
    default:
      break;
  }
}

/**
 * Drag-to-resize for the shell's panels (layout adapted from
 * archi-edtior.html) — delegated on #app the same way handleAppClick is,
 * rather than attached per-handle at mount time: render() replaces #app's
 * entire innerHTML on every click/edit, which would silently detach a
 * directly-attached listener the next time anything elsewhere is clicked.
 * A drag gesture itself never touches AppState (only the panel's own
 * inline style), so no render() ever fires mid-drag to invalidate the
 * `panel`/`handle` references captured below.
 */
function handleAppPointerDown(e) {
  const handle = e.target.closest('[data-resize]');
  if (!handle) return;
  const panel = document.getElementById(handle.dataset.resize);
  if (!panel) return;

  e.preventDefault();
  const horizontal = handle.dataset.axis === 'x';
  const sign = Number(handle.dataset.sign);
  const property = horizontal ? 'width' : 'height';
  const storageKey = PANEL_SIZE_STORAGE_PREFIX + handle.dataset.resize + ':' + property;

  const start = horizontal ? e.clientX : e.clientY;
  const rect = panel.getBoundingClientRect();
  const startSize = horizontal ? rect.width : rect.height;

  handle.setPointerCapture(e.pointerId);
  handle.dataset.active = '';
  document.body.classList.add('select-none');

  const onMove = (moveEvent) => {
    const delta = (horizontal ? moveEvent.clientX : moveEvent.clientY) - start;
    panel.style[property] = (startSize + sign * delta) + 'px';
  };
  const onUp = () => {
    handle.removeEventListener('pointermove', onMove);
    delete handle.dataset.active;
    document.body.classList.remove('select-none');

    // Store the rendered size, already bounded by the panel's min-/max-*
    // classes, so it reopens within range next time.
    const size = horizontal ? panel.getBoundingClientRect().width : panel.getBoundingClientRect().height;
    panelSizeStorage.set(storageKey, String(Math.round(size)));
  };

  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp, { once: true });
  handle.addEventListener('pointercancel', onUp, { once: true });
}

/** Double-click a resize handle to forget its persisted size and fall back to the panel's default (its min-/max-/base-width Tailwind classes). */
function handleAppDblClick(e) {
  const handle = e.target.closest('[data-resize]');
  if (!handle) return;
  const horizontal = handle.dataset.axis === 'x';
  const property = horizontal ? 'width' : 'height';
  panelSizeStorage.remove(PANEL_SIZE_STORAGE_PREFIX + handle.dataset.resize + ':' + property);
  render();
}

// =====================================================================
// Landing screen — everything shown before a workspace is open
// =====================================================================

const LANDING_ICON_BRAND = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="2"/><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/><rect x="10" y="10" width="4" height="4" rx="1"/></svg>';
const LANDING_ICON_FOLDER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l2 2.5h8.8A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>';
const LANDING_SAVE_NOTE = 'Nothing is written to disk until you click “Save all changes”.';

/**
 * Which landing card (if any) the current state calls for; null once a
 * workspace is open. Pure function of AppState/landingBusy so every state can
 * be rendered and checked without a browser.
 */
function landingScreenConfig() {
  if (!isFileSystemAccessSupported()) {
    return {
      kind: 'unsupported',
      title: 'This browser isn’t supported',
      text: 'The editor reads and writes your workspace files directly, which needs the File System Access API. ' +
        'Use a recent Chrome, Edge, Brave or Opera. Firefox and Safari don’t support it.'
    };
  }
  if (AppState.workspace) return null;
  if (landingBusy) return { kind: 'busy', busy: landingBusy };
  const folderName = AppState.folder ? AppState.folder.name : null;
  if (AppState.fatalError) {
    const unreadable = /workspace\.yaml/.test(AppState.fatalError);
    return {
      kind: 'error',
      title: 'Can’t open this workspace',
      text: unreadable && folderName ? 'workspace.yaml could not be read in “' + folderName + '”.' : AppState.fatalError,
      error: unreadable ? AppState.fatalError : null,
      hint: unreadable ? 'Choose the workspace root — the folder that contains workspace.yaml — and make sure the file is valid YAML.' : null,
      actions: [
        { label: 'Choose another folder', action: 'open-folder', primary: true, icon: LANDING_ICON_FOLDER }
      ].concat(folderName ? [{ label: 'Try again', action: 'retry-folder' }] : [])
    };
  }
  if (!AppState.folder) {
    return {
      kind: 'first-launch',
      title: 'Open a workspace',
      text: 'Edit the elements, relationships, views and settings of an ArchiCode workspace, straight from its folder.',
      actions: [{ label: 'Open workspace folder', action: 'open-folder', primary: true, icon: LANDING_ICON_FOLDER }],
      note: 'Choose the folder that contains workspace.yaml. ' + LANDING_SAVE_NOTE
    };
  }
  if (AppState.permissionState === 'needs-click') {
    return {
      kind: 'reopen',
      title: 'Welcome back',
      text: 'Your browser needs your permission to read “' + folderName + '” again.',
      actions: [
        { label: 'Reopen “' + folderName + '”', action: 'reopen-folder', primary: true, icon: LANDING_ICON_FOLDER },
        { label: 'Choose another folder', action: 'open-folder' }
      ],
      note: LANDING_SAVE_NOTE
    };
  }
  return null;
}

function renderLandingHtml(cfg) {
  const brand = '<div class="landing-brand">' + LANDING_ICON_BRAND + '<span>ArchiCode</span></div>';
  let body;
  if (cfg.kind === 'busy') {
    body = '<p class="landing-busy" role="status"><span class="landing-spinner" aria-hidden="true"></span>' + escapeHtml(cfg.busy) + '</p>';
  } else {
    body = '<h1>' + escapeHtml(cfg.title) + '</h1>' +
      '<p class="landing-text">' + escapeHtml(cfg.text) + '</p>';
    if (cfg.error) body += '<div class="error-panel" role="alert"><code>' + escapeHtml(cfg.error) + '</code></div>';
    if (cfg.hint) body += '<p class="landing-hint">' + escapeHtml(cfg.hint) + '</p>';
    if (cfg.actions && cfg.actions.length > 0) {
      body += '<div class="landing-actions">' + cfg.actions.map((a) =>
        '<button type="button"' + (a.primary ? ' class="btn-primary" id="landing-primary"' : '') +
        ' data-action="' + a.action + '">' + (a.icon || '') + '<span>' + escapeHtml(a.label) + '</span></button>'
      ).join('') + '</div>';
    }
    if (cfg.note) body += '<p class="landing-note">' + escapeHtml(cfg.note) + '</p>';
  }
  return '<main class="landing"><section class="landing-card" data-landing="' + cfg.kind + '">' + brand + body + '</section></main>';
}

function render() {
  const app = document.getElementById('app');

  // Every branch below replaces #app's innerHTML wholesale, which already
  // discards whatever DOM node a mounted CodeMirror instance lived on — but
  // not its own internal listeners/timers until .destroy() runs. Doing it
  // once here, unconditionally, covers every early-return branch below in
  // one place rather than repeating it in each.
  if (activeFileEditorView) {
    activeFileEditorView.destroy();
    activeFileEditorView = null;
  }
  for (const view of Object.values(activeJsonEditorViews)) view.destroy();
  activeJsonEditorViews = {};

  const landing = landingScreenConfig();
  if (landing) {
    app.innerHTML = renderLandingHtml(landing);
    app.addEventListener('click', handleAppClick);
    const primary = document.getElementById('landing-primary');
    if (primary) primary.focus();
    return;
  }

  // innerHTML replacement resets every scroll position to 0 — so expanding a
  // tree node, adding a qualifier, etc. would throw the user back to the top
  // of whichever panel they were scrolled in. Side panels always keep theirs;
  // the center keeps its own only while it still shows the same view (a
  // different element/file/perspective should open at the top).
  const scrollBefore = {};
  for (const id of ['panel-left', 'panel-right', 'panel-bottom', 'panel-center']) {
    const el = document.getElementById(id);
    if (el) scrollBefore[id] = { top: el.scrollTop, left: el.scrollLeft };
  }
  const viewKey = currentPerspective + '|' + AppState.selection.kind + '|' + AppState.selection.key + '|' + AppState.selection.mode;
  const sameView = viewKey === lastRenderedViewKey;
  lastRenderedViewKey = viewKey;

  app.innerHTML = renderShellHtml();
  app.addEventListener('click', handleAppClick);
  app.addEventListener('pointerdown', handleAppPointerDown);
  app.addEventListener('dblclick', handleAppDblClick);
  app.addEventListener('input', handleAppInput);
  autosizeAllTextareas();
  mountFileEditorIfNeeded();
  mountJsonEditorsIfNeeded();
  for (const id of Object.keys(scrollBefore)) {
    if (id === 'panel-center' && !sameView) continue;
    const el = document.getElementById(id);
    if (el) { el.scrollTop = scrollBefore[id].top; el.scrollLeft = scrollBefore[id].left; }
  }
  syncHashFromState();
}

// =====================================================================
// Bootstrap
// =====================================================================

document.addEventListener('DOMContentLoaded', () => {
  syncPerspectiveFromHash(); // a bookmarked/shared "#/settings" etc. lands directly there
  if (!isFileSystemAccessSupported()) {
    render();
    return;
  }
  landingBusy = 'Looking for your last workspace…';
  render(); // no blank page while IndexedDB / the folder permission are checked
  tryAutoReopen();
});

// Covers back/forward and a hand-edited URL — setPerspective() (the
// in-app tab click) already renders directly, so this mostly re-confirms
// what's already true, except for navigation setPerspective never sees.
// CodeMirror usually finishes loading after a refresh's first render, which
// therefore showed the plain-textarea fallbacks. Swap them for the real
// editors now — but only if still untouched, so a first keystroke typed in
// the meantime is never thrown away by the re-render.
window.addEventListener('codemirror-ready', () => {
  const fallbacks = document.querySelectorAll('#file-edit-textarea, .json-editor-fallback');
  if (fallbacks.length === 0) return;
  if (Array.from(fallbacks).every((el) => el.value === el.defaultValue)) render();
});

window.addEventListener('hashchange', () => {
  syncPerspectiveFromHash();
  render();
});

// A tab/window close or reload otherwise discards any edit not yet
// written to disk with no warning at all (UX review follow-up).
window.addEventListener('beforeunload', (e) => {
  if (hasUnsavedChanges()) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
</body>
</html>
