<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ArchiCode Manifest Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --color-bg: #f5f6f8;
    --color-panel: #ffffff;
    --color-border: #d7dce2;
    --color-text: #1d2430;
    --color-muted: #5b6472;
    --color-accent: #2f6fed;
    --color-accent-dark: #1d4fb8;
    --color-warning: #b35900;
    --color-warning-bg: #fff3e0;
    --color-error: #9a1c1c;
    --color-error-bg: #fdecec;
    --color-success: #1a7a3c;
    --color-success-bg: #e8f7ee;
    --color-app-layer: #2f6fed;
    --color-tech-layer: #c0392b;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-bg);
    color: var(--color-text);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: var(--color-panel);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    color: var(--color-text);
  }

  nav#tabs {
    display: flex;
    gap: 6px;
  }

  nav#tabs button {
    border: 1px solid var(--color-border);
    background: var(--color-bg);
    color: var(--color-text);
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }

  nav#tabs button.active {
    background: var(--color-accent);
    border-color: var(--color-accent);
    color: #fff;
  }

  #layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  aside#sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--color-panel);
    border-right: 1px solid var(--color-border);
    overflow-y: auto;
    padding: 14px 12px;
  }

  aside#sidebar h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-muted);
    margin: 0 0 10px 2px;
  }

  .tree-dir {
    margin-bottom: 10px;
  }

  .tree-dir-title {
    font-size: 11px;
    color: var(--color-muted);
    font-family: monospace;
    padding: 2px 6px;
    word-break: break-all;
  }

  .tree-item {
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-family: monospace;
    word-break: break-all;
  }

  .tree-item:hover {
    background: var(--color-bg);
  }

  .tree-item.tree-item-error {
    color: var(--color-warning);
    background: var(--color-warning-bg);
  }

  .tree-item.selected {
    background: var(--color-accent);
    color: #fff;
  }

  main#content {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
    min-width: 0;
  }

  .view {
    display: none;
  }

  .view.active {
    display: block;
  }

  .error-box {
    background: var(--color-error-bg);
    color: var(--color-error);
    border: 1px solid var(--color-error);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .success-indicator {
    background: var(--color-success-bg);
    color: var(--color-success);
    border: 1px solid var(--color-success);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
  }

  .hidden {
    display: none !important;
  }

  #graph-view h2, #editor-view h2 {
    font-size: 15px;
    margin: 0 0 12px 0;
  }

  #graph-svg {
    width: 100%;
    height: 560px;
    background: var(--color-panel);
    border: 1px solid var(--color-border);
    border-radius: 8px;
  }

  .graph-node circle {
    fill: var(--color-panel);
    stroke: var(--color-accent);
    stroke-width: 2px;
  }

  .graph-node.clickable {
    cursor: pointer;
  }

  .graph-node.clickable circle {
    stroke: var(--color-accent-dark);
  }

  .graph-node.clickable:hover circle {
    fill: var(--color-accent);
  }

  .graph-node text {
    font-size: 11px;
    fill: var(--color-text);
    font-family: monospace;
    pointer-events: none;
  }

  .rel-line {
    stroke: #8a93a3;
    stroke-width: 1.5px;
    fill: none;
  }

  .legend {
    display: flex;
    gap: 18px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--color-muted);
  }

  .legend-swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  .editor-toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }

  #editor-path {
    font-family: monospace;
    font-size: 13px;
    color: var(--color-muted);
    flex: 1;
    word-break: break-all;
  }

  #save-btn {
    background: var(--color-accent);
    border: none;
    color: #fff;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }

  #save-btn:hover {
    background: var(--color-accent-dark);
  }

  #editor-textarea {
    width: 100%;
    height: 560px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.5;
    padding: 12px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    resize: vertical;
    background: var(--color-panel);
    color: var(--color-text);
  }

  #editor-empty {
    color: var(--color-muted);
    font-size: 13px;
    padding: 20px 4px;
  }

  #schema-panel {
    margin-top: 16px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: var(--color-panel);
  }

  #schema-toggle {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--color-text);
  }

  #schema-content {
    padding: 4px 16px 14px 16px;
    font-size: 13px;
  }

  #schema-content ul {
    margin: 0 0 10px 0;
    padding-left: 18px;
  }

  #schema-content li {
    margin-bottom: 4px;
    font-family: monospace;
  }

  .schema-note {
    color: var(--color-muted);
    font-style: italic;
    margin: 0;
  }
</style>
</head>
<body>
  <header>
    <h1>ArchiCode Manifest Editor</h1>
    <nav id="tabs">
      <button type="button" class="tab active" data-tab="graph">Graph</button>
      <button type="button" class="tab" data-tab="editor">Editor</button>
    </nav>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <h2>Manifests</h2>
      <div id="tree"><div id="tree-loading" class="tree-dir-title">Loading…</div></div>
    </aside>

    <main id="content">
      <section id="graph-view" class="view active">
        <h2>Dependency graph</h2>
        <div class="legend">
          <span><span class="legend-swatch" style="background: var(--color-accent);"></span>node (click to open its manifest)</span>
        </div>
        <div id="graph-error" class="error-box hidden"></div>
        <svg id="graph-svg" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg"></svg>
      </section>

      <section id="editor-view" class="view">
        <h2>Editor</h2>
        <div id="editor-empty">Select a manifest from the tree or the graph to begin editing.</div>
        <div id="editor-main" class="hidden">
          <div class="editor-toolbar">
            <span id="editor-path"></span>
            <button type="button" id="save-btn">Save</button>
            <span id="save-success" class="success-indicator hidden">Saved</span>
          </div>
          <div id="save-error" class="error-box hidden"></div>
          <textarea id="editor-textarea" spellcheck="false" wrap="off"></textarea>

          <div id="schema-panel">
            <button type="button" id="schema-toggle">Show manifest schema reference &#9656;</button>
            <div id="schema-content" class="hidden">Loading schema…</div>
          </div>
        </div>
      </section>
    </main>
  </div>

<script>
(function () {
  "use strict";

  var state = {
    manifests: [],
    referenceToPath: new Map(),
    schema: null,
    schemaLoaded: false,
    currentPath: null
  };

  function qs(id) { return document.getElementById(id); }

  function escapeForText(value) {
    // textContent already escapes; this helper just normalizes null/undefined.
    return value === null || value === undefined ? "" : String(value);
  }

  // ---------- Tabs ----------

  function switchTab(tab) {
    document.querySelectorAll("#tabs .tab").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-tab") === tab);
    });
    qs("graph-view").classList.toggle("active", tab === "graph");
    qs("editor-view").classList.toggle("active", tab === "editor");
  }

  document.querySelectorAll("#tabs .tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      switchTab(btn.getAttribute("data-tab"));
    });
  });

  // ---------- Tree (GET /api/manifests) ----------

  function loadManifests() {
    fetch("/api/manifests")
      .then(function (res) {
        if (!res.ok) {
          return res.text().then(function (body) {
            throw new Error(body || ("HTTP " + res.status));
          });
        }
        return res.json();
      })
      .then(function (data) {
        state.manifests = data.manifests || [];
        state.referenceToPath.clear();
        state.manifests.forEach(function (entry) {
          if (entry.reference) {
            state.referenceToPath.set(entry.reference, entry.path);
          }
        });
        renderTree();
      })
      .catch(function (err) {
        qs("tree").innerHTML = "";
        var box = document.createElement("div");
        box.className = "error-box";
        box.textContent = "Failed to load manifest list: " + escapeForText(err.message);
        qs("tree").appendChild(box);
      });
  }

  function splitDirAndFile(path) {
    var parts = String(path).split("/");
    var file = parts.pop();
    var dir = parts.length > 0 ? parts.join("/") : "(root)";
    return { dir: dir, file: file };
  }

  function renderTree() {
    var container = qs("tree");
    container.innerHTML = "";

    if (state.manifests.length === 0) {
      var empty = document.createElement("div");
      empty.className = "tree-dir-title";
      empty.textContent = "No manifests found.";
      container.appendChild(empty);
      return;
    }

    var groups = new Map();
    state.manifests.forEach(function (entry) {
      var split = splitDirAndFile(entry.path);
      if (!groups.has(split.dir)) {
        groups.set(split.dir, []);
      }
      groups.get(split.dir).push({ entry: entry, file: split.file });
    });

    var dirNames = Array.from(groups.keys()).sort();
    dirNames.forEach(function (dir) {
      var dirEl = document.createElement("div");
      dirEl.className = "tree-dir";

      var title = document.createElement("div");
      title.className = "tree-dir-title";
      title.textContent = dir + "/";
      dirEl.appendChild(title);

      var items = groups.get(dir).slice().sort(function (a, b) {
        return a.file.localeCompare(b.file);
      });

      items.forEach(function (item) {
        var el = document.createElement("div");
        el.className = "tree-item" + (item.entry.parseError ? " tree-item-error" : "");
        el.dataset.path = item.entry.path;
        var label = (item.entry.parseError ? "⚠ " : "") + item.file;
        el.textContent = label;
        el.title = item.entry.parseError
          ? ("Parse error: " + item.entry.parseError)
          : item.entry.path + (item.entry.reference ? (" (" + item.entry.reference + ")") : "");
        el.addEventListener("click", function () {
          openManifest(item.entry.path);
        });
        dirEl.appendChild(el);
      });

      container.appendChild(dirEl);
    });
  }

  function markTreeSelection(path) {
    document.querySelectorAll(".tree-item").forEach(function (el) {
      el.classList.toggle("selected", el.dataset.path === path);
    });
  }

  // ---------- Graph (GET /api/graph) ----------

  var SVG_NS = "http://www.w3.org/2000/svg";

  function svgEl(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        el.setAttribute(key, attrs[key]);
      });
    }
    return el;
  }

  function loadGraph() {
    var errBox = qs("graph-error");
    errBox.classList.add("hidden");
    errBox.textContent = "";

    fetch("/api/graph")
      .then(function (res) {
        return res.text().then(function (body) {
          if (!res.ok) {
            throw new Error(body || ("HTTP " + res.status));
          }
          return JSON.parse(body);
        });
      })
      .then(function (data) {
        renderGraph(data);
      })
      .catch(function (err) {
        qs("graph-svg").innerHTML = "";
        errBox.textContent = "Failed to load graph: " + escapeForText(err.message);
        errBox.classList.remove("hidden");
      });
  }

  function renderGraph(data) {
    var elements = data.elements || [];
    var relationships = data.relationships || [];

    var svg = qs("graph-svg");
    svg.innerHTML = "";

    var width = 1000;
    var rowHeight = 220;
    var topPad = 60;
    var sidePad = 80;

    var layerBuckets = new Map(); // lowercased layer -> elements
    elements.forEach(function (el) {
      var layer = (el.layer || "").toLowerCase();
      if (!layerBuckets.has(layer)) {
        layerBuckets.set(layer, []);
      }
      layerBuckets.get(layer).push(el);
    });

    var layerNames = Array.from(layerBuckets.keys()).sort();
    var height = Math.max(300, topPad * 2 + Math.max(1, layerNames.length) * rowHeight);
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);

    var positions = new Map(); // reference -> {x, y, label}

    layerNames.forEach(function (layerName, rowIndex) {
      var nodes = layerBuckets.get(layerName).slice().sort(function (a, b) {
        return String(a.reference || "").localeCompare(String(b.reference || ""));
      });
      var y = topPad + rowIndex * rowHeight + 40;
      var n = nodes.length;
      nodes.forEach(function (node, i) {
        var x = n <= 1 ? width / 2 : sidePad + i * ((width - 2 * sidePad) / (n - 1));
        var el = node.element || {};
        var label = el.name || el.id || node.reference || "?";
        positions.set(node.reference, { x: x, y: y, label: label, reference: node.reference, layer: layerName });
      });
    });

    if (positions.size === 0) {
      var msg = svgEl("text", { x: "20", y: "30" });
      msg.textContent = "No elements in graph.";
      svg.appendChild(msg);
      return;
    }

    var defs = svgEl("defs");
    var marker = svgEl("marker", {
      id: "arrowhead",
      viewBox: "0 0 10 10",
      refX: "9",
      refY: "5",
      markerWidth: "7",
      markerHeight: "7",
      orient: "auto-start-reverse"
    });
    marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#8a93a3" }));
    defs.appendChild(marker);
    svg.appendChild(defs);

    var edgeLayer = svgEl("g", { class: "edges" });
    relationships.forEach(function (rel) {
      var src = positions.get(rel.source);
      var destRef = rel.relationship && rel.relationship.destination;
      var dst = destRef ? positions.get(destRef) : null;
      if (!src || !dst) {
        return;
      }
      var line = svgEl("line", {
        class: "rel-line",
        x1: String(src.x),
        y1: String(src.y),
        x2: String(dst.x),
        y2: String(dst.y),
        "marker-end": "url(#arrowhead)"
      });
      var label = rel.relationship && rel.relationship.label;
      if (label) {
        var titleEl = svgEl("title");
        titleEl.textContent = label;
        line.appendChild(titleEl);
      }
      edgeLayer.appendChild(line);
    });
    svg.appendChild(edgeLayer);

    var nodeLayer = svgEl("g", { class: "nodes" });
    positions.forEach(function (pos, reference) {
      var clickable = state.referenceToPath.has(reference);
      var g = svgEl("g", {
        class: "graph-node" + (clickable ? " clickable" : ""),
        transform: "translate(" + pos.x + "," + pos.y + ")"
      });

      var titleEl = svgEl("title");
      titleEl.textContent = reference;
      g.appendChild(titleEl);

      g.appendChild(svgEl("circle", { r: "20" }));

      var text = svgEl("text", { y: "36", "text-anchor": "middle" });
      text.textContent = pos.label;
      g.appendChild(text);

      if (clickable) {
        g.addEventListener("click", function () {
          openManifest(state.referenceToPath.get(reference));
        });
      }

      nodeLayer.appendChild(g);
    });
    svg.appendChild(nodeLayer);
  }

  // ---------- Schema reference panel (GET /api/schemas/manifest) ----------

  function loadSchemaOnce() {
    if (state.schemaLoaded) {
      return;
    }
    state.schemaLoaded = true;

    fetch("/api/schemas/manifest")
      .then(function (res) {
        return res.text().then(function (body) {
          if (!res.ok) {
            throw new Error(body || ("HTTP " + res.status));
          }
          return JSON.parse(body);
        });
      })
      .then(function (schema) {
        state.schema = schema;
        renderSchemaPanel();
      })
      .catch(function (err) {
        qs("schema-content").textContent = "Failed to load schema: " + escapeForText(err.message);
      });
  }

  function renderSchemaPanel() {
    var container = qs("schema-content");
    container.innerHTML = "";

    if (!state.schema) {
      container.textContent = "No schema available.";
      return;
    }

    var headerSchema = (state.schema.properties && state.schema.properties.header) || {};
    var headerProps = headerSchema.properties || {};

    var ul = document.createElement("ul");
    ["kind", "version", "parent"].forEach(function (key) {
      var prop = headerProps[key];
      if (!prop) {
        return;
      }
      var li = document.createElement("li");
      var required = prop.required === true;
      var typeLabel = prop.type ? (" (" + prop.type + ")") : "";
      li.textContent = "header." + key + " — " + (required ? "required" : "optional") + typeLabel;
      ul.appendChild(li);
    });
    container.appendChild(ul);

    var note = document.createElement("p");
    note.className = "schema-note";
    note.textContent = "content's shape depends on header.kind and is not validated client-side " +
      "(the schema reports it as {\"type\":\"any\"}).";
    container.appendChild(note);
  }

  qs("schema-toggle").addEventListener("click", function () {
    var content = qs("schema-content");
    var collapsed = content.classList.contains("hidden");
    content.classList.toggle("hidden");
    qs("schema-toggle").innerHTML = collapsed
      ? "Hide manifest schema reference &#9662;"
      : "Show manifest schema reference &#9656;";
  });

  // ---------- Editor (GET/PUT /api/manifests/{path}) ----------

  function openManifest(path) {
    state.currentPath = path;
    markTreeSelection(path);

    var textarea = qs("editor-textarea");
    var emptyMsg = qs("editor-empty");
    var mainBox = qs("editor-main");
    var pathLabel = qs("editor-path");
    var saveError = qs("save-error");
    var saveSuccess = qs("save-success");

    saveError.classList.add("hidden");
    saveError.textContent = "";
    saveSuccess.classList.add("hidden");

    fetch("/api/manifests/" + path)
      .then(function (res) {
        return res.text().then(function (body) {
          if (!res.ok) {
            throw new Error(body || ("HTTP " + res.status));
          }
          return body;
        });
      })
      .then(function (body) {
        textarea.value = body;
        pathLabel.textContent = path;
        emptyMsg.classList.add("hidden");
        mainBox.classList.remove("hidden");
      })
      .catch(function (err) {
        mainBox.classList.add("hidden");
        emptyMsg.classList.remove("hidden");
        emptyMsg.textContent = "Failed to load \"" + path + "\": " + escapeForText(err.message);
      });

    switchTab("editor");
  }

  qs("save-btn").addEventListener("click", function () {
    if (!state.currentPath) {
      return;
    }

    var textarea = qs("editor-textarea");
    var saveError = qs("save-error");
    var saveSuccess = qs("save-success");
    var path = state.currentPath;
    var body = textarea.value;

    saveError.classList.add("hidden");
    saveError.textContent = "";
    saveSuccess.classList.add("hidden");

    fetch("/api/manifests/" + path, { method: "PUT", body: body })
      .then(function (res) {
        return res.text().then(function (respBody) {
          return { ok: res.ok, status: res.status, body: respBody };
        });
      })
      .then(function (result) {
        if (result.ok) {
          saveSuccess.classList.remove("hidden");
          // Re-fetch to refresh the on-disk baseline (never trust the client's own copy).
          return fetch("/api/manifests/" + path)
            .then(function (res) {
              if (res.ok) {
                return res.text().then(function (freshBody) {
                  textarea.value = freshBody;
                });
              }
            })
            .catch(function () {
              // Refresh failure does not undo the already-shown success indicator;
              // the save itself already succeeded against the server.
            });
        }
        saveError.textContent = result.body || ("HTTP " + result.status);
        saveError.classList.remove("hidden");
        // Textarea content is deliberately left untouched on failure.
      })
      .catch(function (err) {
        saveError.textContent = "Request failed: " + escapeForText(err.message);
        saveError.classList.remove("hidden");
      });
  });

  // ---------- Init ----------

  function init() {
    loadManifests();
    loadGraph();
    loadSchemaOnce();
  }

  init();
})();
</script>
</body>
</html>
