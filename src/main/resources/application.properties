quarkus.application.name=ArchiCode
quarkus.banner.enabled=false
quarkus.log.level=ERROR

# the viewpoints and the renderers are found through the ServiceLoader: its registry files must reach the native image
quarkus.native.resources.includes=META-INF/services/io.morin.archicode.*

quarkus.container-image.group=tmorin
quarkus.container-image.name=archicode
quarkus.container-image.registry=ghcr.io

quarkus.jib.jvm-entrypoint=java,-jar,/home/jboss/quarkus-run.jar
