name: Continuous Integration - Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: "Install apt dependencies"
        run: "sudo apt-get install -y graphviz wget curl"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: "Set up JDK 25"
        uses: "actions/setup-java@v6"
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: "Set up Node.js"
        uses: "actions/setup-node@v4"
        with:
          node-version: "22"
      - name: "Test the viewpoint kernel"
        run: |
          (cd src/main/rust/viewpoint-kernel && cargo test)
          node --test "src/test/javascript/**/*.test.js"
      - name: "Check the committed WebAssembly is the one the Rust builds"
        # the same build as embed.sh, into a scratch directory, with the compiler of rust-toolchain.toml: a change to the
        # Rust whose .wasm was not re-embedded (in src/main/wasm and in standalone.html) fails
        run: src/main/rust/viewpoint-kernel/embed.sh --check
      - name: "Build artifacts"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw verify \
            --batch-mode \
            --update-snapshots
      - name: "Publish snapshot artifacts"
        if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.tag=latest
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Publish release artifacts"
        if: ${{ startsWith(github.ref, 'refs/tags/') && startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Assemble website"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        # The presentation page at the root, the manual at /docs/ and the editor at /editor/. The presentation page and
        # the editor are those of the tag, stamped with its release (copies: the files of the repository keep "dev").
        # Only the latest release is published, as the manual is.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#archicode-}"
          stamp="s|<meta name=\"archicode-version\" content=\"dev\">|<meta name=\"archicode-version\" content=\"${version}\">|"
          mkdir -p target/site/docs target/site/editor
          cp -r target/generated-docs/. target/site/docs/
          sed "${stamp}" src/site/index.html > target/site/index.html
          sed "${stamp}" src/main/resources/editor-webapp/standalone.html > target/site/editor/index.html
          grep -q "content=\"${version}\"" target/site/index.html
          grep -q "content=\"${version}\"" target/site/editor/index.html
          test -f target/site/docs/index.html
      - name: "Publish website"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: "peaceiris/actions-gh-pages@v4"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "target/site"

  Native:
    # Builds the native image on every pull request and push, in parallel with Build, so that a missing reflection
    # registration or resource (src/main/resources/META-INF/native-image, quarkus.native.resources.includes in
    # application.properties) is seen on the pull request that causes it, not after a release. To run it less often, add
    # an `if:` here (for example `if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}`).
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    env:
      # the target the binary is built for, the last two words of the name of the file: archicode-<version>-<TARGET>. The
      # release job (wave 021, W-5) turns this job into a matrix over the targets, with `matrix.target` in place of this
      # variable, and downloads the artifacts `archicode-<version>-<target>`; `outputs` below is what a job that `needs`
      # this one can read for the single target.
      TARGET: "linux-amd64"
    outputs:
      version: ${{ steps.collect.outputs.version }}
      artifact: ${{ steps.collect.outputs.artifact }}
    steps:
      - uses: "actions/checkout@v7"
      - name: "Set up Mandrel for JDK 25"
        # Mandrel is what Quarkus builds native images with by default; with java-version 25 the action takes the latest
        # Mandrel release of JDK 25, the Java of the project (.sdkmanrc, maven.compiler.release). The image is built with
        # this local Mandrel (JAVA_HOME / GRAALVM_HOME), not in a builder container.
        uses: "graalvm/setup-graalvm@v1.6.7"
        with:
          java-version: "25"
          distribution: "mandrel"
          cache: maven
      - name: "Build the native image and run the integration tests against it"
        # `-Dnative` (the `native` profile of pom.xml) builds the image, skips the unit tests (Build runs them) and runs
        # Failsafe, whose `*IT` classes (src/test/java/io/morin/archicode/it) start the native runner as a process on the
        # examples of the manual and on the fixtures, and check what it prints, its exit codes and the files it writes.
        # The same classes run against the JVM jar with `./mvnw verify -DskipITs=false`. Failsafe names the class
        # and the test that failed; no manual (`plugin.asciidoctor.skip`): the examples are read from src/doc/examples.
        run: |
          ./mvnw verify \
            --batch-mode \
            --update-snapshots \
            -Dnative \
            -Dplugin.asciidoctor.skip=true
      - name: "Collect the native binary and its checksum"
        id: collect
        # Runs only when the build and the integration tests above passed (the default `success()`): a failed build keeps
        # nothing. The runner is `target/archicode-<version>-runner`; the name is looked for rather than built, in `target`
        # and one folder below it (the folder `archicode-<version>-native-image-source-jar` holds the `-runner.jar` the image
        # is made from, which the pattern does not match), and there must be exactly one executable. The version is the
        # one of the pom, and the binary must tell the same (`archicode --version`: a first smoke test of the file as it is
        # uploaded). `native-dist` holds what is uploaded: the binary and `<binary>.sha256`, in the format of `sha256sum -c`.
        run: |
          set -euo pipefail
          version="$(./mvnw --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          mapfile -t runners < <(find target -maxdepth 2 -type f -name 'archicode-*-runner' -perm -u+x | sort)
          if [ "${#runners[@]}" -ne 1 ]; then
            echo "::error::expected exactly one native runner (target/archicode-*-runner), found ${#runners[@]}: ${runners[*]:-none}"
            find target -maxdepth 2 -name 'archicode-*' | sort
            exit 1
          fi
          runner="${runners[0]}"
          told="$("${runner}" --version)"
          if [ "${told}" != "archicode ${version}" ]; then
            echo "::error::${runner} --version prints '${told}', expected 'archicode ${version}'"
            exit 1
          fi
          name="archicode-${version}-${TARGET}"
          mkdir -p native-dist
          cp "${runner}" "native-dist/${name}"
          (cd native-dist && sha256sum "${name}" > "${name}.sha256" && sha256sum --check "${name}.sha256")
          ls -l native-dist
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "artifact=${name}" >> "${GITHUB_OUTPUT}"
      - name: "Keep the native binary as an artifact of the workflow"
        # Also on pull requests and on main, so that anyone can download the binary of a change from the run (Actions, the
        # run, Artifacts: a zip with the binary and its .sha256, the executable bit is lost in the zip: `chmod +x`). 7 days:
        # these are for trying a change, a release keeps its binaries on the release page (W-5).
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: native-dist/*
          if-no-files-found: error
          retention-days: 7
