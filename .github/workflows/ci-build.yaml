name: Continuous Integration - Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: "Install apt dependencies"
        run: "sudo apt-get install -y graphviz wget curl"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: "Set up JDK 25"
        uses: "actions/setup-java@v6"
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: "Set up Node.js"
        uses: "actions/setup-node@v4"
        with:
          node-version: "22"
      - name: "Test the viewpoint kernel"
        run: |
          (cd src/main/rust/viewpoint-kernel && cargo test)
          node --test "src/test/javascript/**/*.test.js"
      - name: "Check the committed WebAssembly is the one the Rust builds"
        # the same build as embed.sh, into a scratch directory, with the compiler of rust-toolchain.toml: a change to the
        # Rust whose .wasm was not re-embedded (in src/main/wasm and in standalone.html) fails
        run: src/main/rust/viewpoint-kernel/embed.sh --check
      - name: "Build artifacts"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw verify \
            --batch-mode \
            --update-snapshots
      - name: "Publish snapshot artifacts"
        if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.tag=latest
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Publish release artifacts"
        if: ${{ startsWith(github.ref, 'refs/tags/') && startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Assemble website"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        # The presentation page at the root, the manual at /docs/ and the editor at /editor/. The presentation page and
        # the editor are those of the tag, stamped with its release (copies: the files of the repository keep "dev").
        # Only the latest release is published, as the manual is.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#archicode-}"
          stamp="s|<meta name=\"archicode-version\" content=\"dev\">|<meta name=\"archicode-version\" content=\"${version}\">|"
          mkdir -p target/site/docs target/site/editor
          cp -r target/generated-docs/. target/site/docs/
          sed "${stamp}" src/site/index.html > target/site/index.html
          sed "${stamp}" src/main/resources/editor-webapp/standalone.html > target/site/editor/index.html
          grep -q "content=\"${version}\"" target/site/index.html
          grep -q "content=\"${version}\"" target/site/editor/index.html
          test -f target/site/docs/index.html
      - name: "Publish website"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: "peaceiris/actions-gh-pages@v4"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "target/site"
