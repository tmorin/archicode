name: Continuous Integration - Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: "Install apt dependencies"
        run: "sudo apt-get install -y graphviz wget curl"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: "Set up JDK 25"
        uses: "actions/setup-java@v6"
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: "Build artifacts"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw verify \
            --batch-mode \
            --update-snapshots
      - name: "Publish snapshot artifacts"
        if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.tag=latest
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Publish release artifacts"
        if: ${{ startsWith(github.ref, 'refs/tags/') && startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Publish website"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: "peaceiris/actions-gh-pages@v4"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "target/generated-docs"
