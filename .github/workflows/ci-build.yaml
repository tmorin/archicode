name: Continuous Integration - Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: "Install apt dependencies"
        run: "sudo apt-get install -y graphviz wget curl"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: "Set up JDK 25"
        uses: "actions/setup-java@v6"
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: "Set up Node.js"
        uses: "actions/setup-node@v4"
        with:
          node-version: "22"
      - name: "Test the viewpoint kernel"
        run: |
          (cd src/main/rust/viewpoint-kernel && cargo test)
          node --test "src/test/javascript/**/*.test.js"
      - name: "Check the committed WebAssembly is the one the Rust builds"
        # the same build as embed.sh, into a scratch directory, with the compiler of rust-toolchain.toml: a change to the
        # Rust whose .wasm was not re-embedded (in src/main/wasm and in standalone.html) fails
        run: src/main/rust/viewpoint-kernel/embed.sh --check
      - name: "Build artifacts"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw verify \
            --batch-mode \
            --update-snapshots
      - name: "Publish snapshot artifacts"
        if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.tag=latest
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Publish release artifacts"
        if: ${{ startsWith(github.ref, 'refs/tags/') && startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Assemble website"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        # The presentation page at the root, the manual at /docs/ and the editor at /editor/. The presentation page and
        # the editor are those of the tag, stamped with its release (copies: the files of the repository keep "dev").
        # Only the latest release is published, as the manual is.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#archicode-}"
          stamp="s|<meta name=\"archicode-version\" content=\"dev\">|<meta name=\"archicode-version\" content=\"${version}\">|"
          mkdir -p target/site/docs target/site/editor
          cp -r target/generated-docs/. target/site/docs/
          sed "${stamp}" src/site/index.html > target/site/index.html
          sed "${stamp}" src/main/resources/editor-webapp/standalone.html > target/site/editor/index.html
          grep -q "content=\"${version}\"" target/site/index.html
          grep -q "content=\"${version}\"" target/site/editor/index.html
          test -f target/site/docs/index.html
      - name: "Publish website"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: "peaceiris/actions-gh-pages@v4"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "target/site"

  Native:
    # Builds the native image on every pull request and push, in parallel with Build, so that a missing reflection
    # registration or resource (src/main/resources/META-INF/native-image, quarkus.native.resources.includes in
    # application.properties) is seen on the pull request that causes it, not after a release. To run it less often, add
    # an `if:` here (for example `if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}`).
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    steps:
      - uses: "actions/checkout@v7"
      - name: "Set up Mandrel for JDK 25"
        # Mandrel is what Quarkus builds native images with by default; with java-version 25 the action takes the latest
        # Mandrel release of JDK 25, the Java of the project (.sdkmanrc, maven.compiler.release). The image is built with
        # this local Mandrel (JAVA_HOME / GRAALVM_HOME), not in a builder container.
        uses: "graalvm/setup-graalvm@v1.6.7"
        with:
          java-version: "25"
          distribution: "mandrel"
          cache: maven
      - name: "Build the native image"
        # No unit tests here (Build runs them) and no manual: the project has no integration test to run against the
        # image, the next step is what runs the image.
        run: |
          ./mvnw verify \
            --batch-mode \
            --update-snapshots \
            -Dnative \
            -DskipTests \
            -Dplugin.asciidoctor.skip=true
      - name: "Run the native image on the examples of the manual"
        # Every check runs, and the step lists the ones that failed at the end: a gap is found with the next one, not one build later.
        run: |
          set -u -o pipefail
          runner="$(realpath target/*-runner)"
          work="$(mktemp -d)"
          cp -r src/doc/examples/domain_workspace "$work/workspace"
          cp -r src/doc/examples/domain_plateaus "$work/plateaus"
          cp -r src/test/resources/brightcart/layered "$work/brightcart"
          workspace="$work/workspace/workspace.yaml"
          plateaus="$work/plateaus/workspace.yaml"
          brightcart="$work/brightcart/workspace.yaml"
          failed=()

          # expect <label> <pattern> <command...>: the command succeeds and what it prints has the pattern
          expect() {
            local label="$1" pattern="$2" out
            shift 2
            if out="$("$@" 2>&1)" && grep -q -- "$pattern" <<< "$out"; then
              echo "ok: $label"
            else
              echo "::error::native image: $label"
              head -n 20 <<< "$out"
              failed+=("$label")
            fi
          }

          expect "help" "" "$runner" --help

          # the kernel (WebAssembly translated to bytecode) assembles the views; the renderer writes PlantUML
          expect "views generate" "" "$runner" -w "$workspace" views generate -o views
          expect "views generate writes the views" "" test -s "$work/workspace/views/plantuml/application/ArchiCode-overview.puml"

          # Jackson reaches the model and the results by reflection
          expect "query views" "ArchiCode-deep" "$runner" -w "$workspace" query views
          expect "query schemas" "urn:jsonschema" "$runner" -w "$workspace" query schemas
          expect "query graph" '"reference":"ArchiCode"' "$runner" -w "$workspace" query graph

          # plateaus (layers: the manifests of `as-is` are the root, `to-be` overrides it): the comparison goes through the kernel as well
          expect "diff" "^comparing " "$runner" -w "$plateaus" diff
          expect "views generate --against" "" "$runner" -w "$plateaus" views generate -o views --against as-is
          expect "views generate --against writes the table" "" test -s "$work/plateaus/views-to-be-vs-as-is/gap.md"

          # Brightcart (src/test/resources/brightcart/layered, a copy: the views are written next to workspace.yaml): four plateaus as layers, a `plateau:` header on
          # each manifest and the patches of a plateau in its `Kind: Plateau`, whose elements replace others. The tree forks, so the plateau is always named; the comparison
          # is made with the plateau it overrides unless `--against` names another. `replacing` is the line of the moved, split and merged elements; `saas` generates with
          # its comparison and its facets (`inhouse` and `marketplace` are left to the unit tests)
          expect "plateau list on Brightcart" "^marketplace  *inhouse" "$runner" -w "$brightcart" plateau list
          expect "diff on Brightcart" "^replacing " "$runner" -w "$brightcart" diff --plateau inhouse
          expect "diff on Brightcart, against a sibling" "^comparing inhouse .* with saas" "$runner" -w "$brightcart" diff --plateau inhouse --against saas
          expect "views generate on Brightcart" "" "$runner" -w "$brightcart" views generate --plateau saas
          expect "views generate on Brightcart writes the plateau" "" test -s "$work/brightcart/views-saas/plantuml/application/shop-overview.puml"
          expect "views generate on Brightcart writes the comparison" "" test -s "$work/brightcart/views-saas-vs-baseline/gap.json"
          expect "views generate on Brightcart lists the cascade of a REMOVE" '"cascade"' cat "$work/brightcart/views-saas-vs-baseline/gap.json"
          expect "views generate on Brightcart writes a facet" "" test -s "$work/brightcart/views-saas-journey/plantuml/application/shop-overview.puml"

          # the editor page is a resource of the image
          "$runner" -w "$workspace" editor serve --port 0 > "$work/editor.log" 2>&1 &
          editor=$!
          trap 'kill "$editor" 2>/dev/null || true' EXIT
          url=""
          for _ in $(seq 1 30); do
            url="$(grep -o 'http://127.0.0.1:[0-9]*/?token=[0-9a-zA-Z_-]*' "$work/editor.log" | head -1 || true)"
            [ -n "$url" ] && break
            sleep 1
          done
          if [ -n "$url" ]; then
            expect "editor serve" "<html" curl --fail --silent "$url"
          else
            echo "::error::native image: editor serve did not print its address"
            cat "$work/editor.log"
            failed+=("editor serve")
          fi

          if [ "${#failed[@]}" -ne 0 ]; then
            echo "failed: ${failed[*]}"
            exit 1
          fi
