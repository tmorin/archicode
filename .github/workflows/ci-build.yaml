name: Continuous Integration - Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  # The release by hand (jobs Targets to Publish below): builds the native binaries of the three targets, puts them with
  # SHA256SUMS on a DRAFT release and smoke-tests each file as it is there. Only those jobs run: Build is skipped, so a
  # dispatch publishes no Maven artifact, no image and no website. From the Actions tab or
  # `gh workflow run ci-build.yaml --ref <branch> [-f tag=archicode-X.Y.Z] [-f draft=false]`.
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag (archicode-X.Y.Z): build it again and attach its files to its release (a new draft, or the draft that is there). Empty: a rehearsal, a draft named for the version of the pom of the branch, never published."
        type: string
        required: false
        default: ""
      draft:
        description: "With a tag: leave the release a draft after the smoke tests (true), or publish it (false). A rehearsal is never published."
        type: boolean
        required: false
        default: true

concurrency:
  # A dispatch never cancels nor is cancelled by a push to the same branch; a dispatch waits for the one running (only
  # the latest dispatch waiting is kept: GitHub cancels an older pending run of the group).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # The checks of a change run as four parallel jobs, Java, Page, Kernel and E2E, and a last job named Build waits for
  # the four, checks that each one passed and carries what is published (the Maven artifacts, the image, the website).
  # The wall-clock time of the pipeline is the slowest part and not the sum of the parts; each part has the steps and the
  # commands it had as one job. Not on a dispatch (see the comment of the trigger above): Build would publish.
  # A part reads the repository only: `contents: read`, the token it gets on a pull request from a fork too.

  Java:
    # `./mvnw verify`: the Java tests, the integration tests of the jar are not in it (skipITs), the coverage floors and the
    # manual (asciidoctor, which draws with graphviz)
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      # no `fetch-depth: 0`: nothing in the Java build or its tests reads the history or a tag
      - uses: "actions/checkout@v7"
      - name: "Install apt dependencies"
        run: "sudo apt-get install -y graphviz wget curl"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: "Set up JDK 25"
        uses: "actions/setup-java@v6"
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: "Build artifacts"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw verify \
            --batch-mode \
            --update-snapshots
      - name: "Keep the Java coverage report"
        # the report `./mvnw verify` writes (and checks: the floors are in the pom), HTML, jacoco.csv and jacoco.xml; kept
        # when a floor fails too, which is when it is read. Actions, the run, Artifacts. 7 days.
        if: ${{ !cancelled() }}
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: java-coverage-report
          path: target/jacoco-report
          if-no-files-found: warn
          retention-days: 7
      - name: "Keep the manual for the website"
        # `./mvnw verify` writes the manual (target/generated-docs); the publishing steps of Build skip the manual
        # (`-Dplugin.asciidoctor.skip`), so the website takes this one, the one that passed. Tags only, as the website.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: manual
          path: target/generated-docs
          # .asciidoctor/diagram is in the folder, and the website copied it
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  Page:
    # The editor page and the scripts: Prettier, ESLint, the node unit suite with the coverage of the editor script, and the
    # time budget of the kernel. Needs Node.js only (the kernel is the committed .wasm).
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0`: tests read the page of a released tag with `git show archicode-0.17.0:...` (also 0.18.0, 0.19.0)
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: "Set up Node.js"
        uses: "actions/setup-node@v4"
        with:
          node-version: "22"
          cache: "npm"
      - name: "Install the Node.js dependencies"
        # package-lock.json is committed: the same Prettier on every run
        run: npm ci
      - name: "Check the format"
        # Prettier of .prettierrc.yaml; run `npm run format` to fix
        run: npm run format:check
      - name: "Lint the JavaScript"
        # ESLint of eslint.config.mjs on the tests, the generators and the inline scripts of the editor page (extracted
        # to target/eslint-editor); no baseline, a finding fails the build; run `npm run lint` to see them
        run: npm run lint
      - name: "Cover the editor script"
        # THE run of the node unit suite (`npm run test:unit`, same tests, same output) with V8 coverage on: it fails on a
        # test, and below the floor of scripts/editor-coverage-floor.json for the share of the editor page's script the
        # tests run (by area); the report is in target/editor-coverage. Run `npm run test:coverage` to see it
        run: npm run test:coverage
      - name: "Keep the editor coverage report"
        # report.json, report.txt (the figure by area), uncovered-functions.txt and uncovered-lines.txt (the HTML line
        # numbers of what no test runs); kept when the floor fails too, which is when it is read. 7 days.
        if: ${{ !cancelled() }}
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: editor-coverage-report
          path: |
            target/editor-coverage/report.json
            target/editor-coverage/report.txt
            target/editor-coverage/uncovered-functions.txt
            target/editor-coverage/uncovered-lines.txt
          if-no-files-found: warn
          retention-days: 7
      - name: "Check the time budget of the kernel"
        # the one test of the node suite that judges a time (the first `quiet` and `apply_patches` at 591 elements against
        # 82, as a ratio), skipped in the suite because a ratio is only the kernel's on a quiet machine: it runs here
        # alone, about 5 seconds; see performance-budget.test.js
        run: npm run test:timing

  Kernel:
    # The viewpoint kernel (Rust compiled to WebAssembly): tests, format, lint, line coverage, and the check that the
    # committed .wasm is the one the sources build. Needs rustup (on the runner) and python3, nothing else: rustup installs
    # the toolchain, the components and the wasm target of rust-toolchain.toml at the first cargo command.
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - uses: "actions/checkout@v7"
      - name: "Test the viewpoint kernel"
        run: (cd src/main/rust/viewpoint-kernel && cargo test)
      - name: "Check the format of the viewpoint kernel"
        # rustfmt of rust-toolchain.toml; run `cargo fmt` in src/main/rust/viewpoint-kernel to fix
        run: (cd src/main/rust/viewpoint-kernel && cargo fmt --check)
      - name: "Lint the viewpoint kernel"
        # every clippy finding is fixed; a lint that would change what the kernel computes is allowed on its item with the reason
        run: (cd src/main/rust/viewpoint-kernel && cargo clippy --all-targets -- -D warnings)
      - name: "Install cargo-llvm-cov"
        # the prebuilt binary of this version, its checksum checked by the action (a few seconds; no compilation, no server of ours, no secret)
        uses: "taiki-e/install-action@v2.87.26"
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: "Cover the viewpoint kernel"
        # line coverage of the kernel by all its tests (llvm-tools-preview of rust-toolchain.toml); the step fails below 90 %. The unit tests are in
        # src/*_tests.rs, which are not counted (the coverage is of production code); run the same command to see the table by file
        run: |
          cd src/main/rust/viewpoint-kernel
          cargo llvm-cov --ignore-filename-regex '_tests\.rs$' --fail-under-lines 90 \
            || { echo "::error::the line coverage of the viewpoint kernel is below 90 % (the table above says where)"; exit 1; }
      - name: "Check the committed WebAssembly is the one the Rust builds"
        # the same build as embed.sh, into a scratch directory, with the compiler of rust-toolchain.toml: a change to the
        # Rust whose .wasm was not re-embedded (in src/main/wasm and in standalone.html) fails
        run: src/main/rust/viewpoint-kernel/embed.sh --check

  E2E:
    # The end-to-end suite: a real browser against `archicode editor serve` on the packaged application. It builds its own
    # jar (`./mvnw package` without the tests and the manual: about a minute) instead of waiting for the one `Java` builds,
    # which would put this job after Java's five minutes; its own Maven cache, apart from Java's (a cache of what a build
    # without tests needs must not take the place of the one `verify` needs).
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - uses: "actions/checkout@v7"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-e2e-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-e2e-m2
      - name: "Set up JDK 25"
        # JAVA_HOME of this step is the java that runs the jar (src/test/e2e/harness.js)
        uses: "actions/setup-java@v6"
        with:
          java-version: "25"
          distribution: "temurin"
      - name: "Set up Node.js"
        uses: "actions/setup-node@v4"
        with:
          node-version: "22"
          cache: "npm"
      - name: "Install the Node.js dependencies"
        # package-lock.json is committed: the same Playwright on every run
        run: npm ci
      - name: "Build the packaged application"
        # target/quarkus-app/quarkus-run.jar, what `editor serve` runs: the tests are not run (Java runs them), the manual is
        # not drawn (it is not in the jar), the same jar as `./mvnw verify` makes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw package \
            --batch-mode \
            --update-snapshots \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true
      - name: "Find the Playwright version"
        # the version `npm ci` installed (package-lock.json pins it): the key of the browser cache below
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: "Cache the Playwright browsers"
        # the browsers of one Playwright version are fixed builds (Chromium, Firefox: about 1 GB); a new version of the
        # library is a new key
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium-firefox
      - name: "Install the browsers of the end-to-end tests"
        # the browsers of the pinned version (nothing is downloaded when the cache hit) and the system libraries they
        # need (apt, always); no server of ours, no token
        run: npx playwright install --with-deps chromium firefox
      - name: "Run the end-to-end tests"
        # `npm run test:e2e`: a real browser (Chromium, then Firefox) against `archicode editor serve` on the jar built
        # above (target/quarkus-app), on a copy of a shipped example per test; one worker and no retry
        # (playwright.config.js). Run the same command to see them; src/test/e2e
        id: e2e
        run: npm run test:e2e
      - name: "Keep the end-to-end results"
        # the HTML report and, for a test that failed, its trace, screenshot, video and page snapshot
        # (target/e2e/test-results/<test>/): only when the tests failed. 7 days.
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: e2e-results
          path: target/e2e
          if-no-files-found: warn
          retention-days: 7

  Build:
    # The name other things rely on (the check a pull request may require, the `needs` of Release): green when the four
    # parts are, and it publishes. `!cancelled()` so that the job RUNS when a part failed and says so, red: a job that
    # needs a failed one is skipped by default, and a skipped job is a passing check, for a branch protection and for
    # Release (which accepts a skipped Build, a dispatch). The first step is the check; the steps after it do not run
    # when it fails. Not on a dispatch: its publishing steps test the ref, not the event, and a dispatch from main would
    # publish a snapshot (a dispatch from a tag, the website).
    needs: [Java, Page, Kernel, E2E]
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
    runs-on: "ubuntu-latest"
    # What the steps below write, and nothing else, and on this job only: the website goes to the gh-pages branch
    # (contents), the Maven artifacts to GitHub Packages and the image to ghcr.io (packages). Without this block the
    # token has all the scopes the repository default gives (write-all). Pull requests from forks get a read-only token
    # whatever is asked here.
    permissions:
      contents: write
      packages: write
    env:
      # the refs that publish something (the conditions of the three publishing steps are inside these two); on a pull
      # request nothing below the check runs, not even the checkout
      PUBLISHES: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: "Check that the four parts passed"
        env:
          JAVA: ${{ needs.Java.result }}
          PAGE: ${{ needs.Page.result }}
          KERNEL: ${{ needs.Kernel.result }}
          E2E: ${{ needs.E2E.result }}
        run: |
          status=0
          for part in "Java=${JAVA}" "Page=${PAGE}" "Kernel=${KERNEL}" "E2E=${E2E}"; do
            if [ "${part#*=}" != "success" ]; then
              echo "::error::the job ${part%%=*} did not succeed (${part#*=}): nothing is published"
              status=1
            fi
          done
          exit "${status}"
      # `fetch-depth: 0` as the job had it: the publishing steps are the only ones that could read the history
      - uses: "actions/checkout@v7"
        if: ${{ env.PUBLISHES == 'true' }}
        with:
          fetch-depth: 0
      - name: "Install apt dependencies"
        if: ${{ env.PUBLISHES == 'true' }}
        run: "sudo apt-get install -y graphviz wget curl"
      - name: Cache Maven packages
        if: ${{ env.PUBLISHES == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: "Set up JDK 25"
        if: ${{ env.PUBLISHES == 'true' }}
        uses: "actions/setup-java@v6"
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: "Publish snapshot artifacts"
        # `-Dmaven.test.skip` leaves no test classes, and PMD reads the tests with the classes of the build to resolve their types: without
        # them it reports a finding that `verify` (job Java) does not, so the two publishing builds skip it; Java has run it on the same sources
        if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dpmd.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.tag=latest
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Publish release artifacts"
        if: ${{ startsWith(github.ref, 'refs/tags/') && startsWith(github.event.head_commit.message, 'chore(release)') }}
        run: |
          ./mvnw deploy \
            --batch-mode \
            -Dmaven.test.skip \
            -Dplugin.asciidoctor.skip=true \
            -Dpmd.skip=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Download the manual"
        # the one Java drew and checked; it lands where `./mvnw verify` wrote it in the job that had everything
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: "actions/download-artifact@v8.0.2"
        with:
          name: manual
          path: target/generated-docs
      - name: "Assemble website"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        # The presentation page at the root, the manual at /docs/ and the editor at /editor/. The presentation page and
        # the editor are those of the tag, stamped with its release (copies: the files of the repository keep "dev").
        # Only the latest release is published, as the manual is.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#archicode-}"
          stamp="s|<meta name=\"archicode-version\" content=\"dev\">|<meta name=\"archicode-version\" content=\"${version}\">|"
          mkdir -p target/site/docs target/site/editor
          cp -r target/generated-docs/. target/site/docs/
          sed "${stamp}" src/site/index.html > target/site/index.html
          sed "${stamp}" src/main/resources/editor-webapp/standalone.html > target/site/editor/index.html
          grep -q "content=\"${version}\"" target/site/index.html
          grep -q "content=\"${version}\"" target/site/editor/index.html
          test -f target/site/docs/index.html
      - name: "Publish website"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: "peaceiris/actions-gh-pages@v4"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "target/site"

  Targets:
    # What this run builds and releases, decided once by .github/scripts/release-plan.sh, whose header lists the cases
    # (a release: a tag whose head commit message begins `chore(release)`, the condition of "Publish release artifacts"
    # above, or a dispatch). The scripts of the release are tested first, with fakes, so that a change that breaks them
    # fails on its pull request rather than on the day of a release (Native waits for this job).
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
      rehearsal: ${{ steps.plan.outputs.rehearsal }}
      latest: ${{ steps.plan.outputs.latest }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      title: ${{ steps.plan.outputs.title }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false
      - name: "Test the scripts of the release"
        run: .github/scripts/test-release-scripts.sh
      - name: "Decide the targets and the release"
        id: plan
        # the contexts go through the environment, never into the script
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          RUN_ID: ${{ github.run_id }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: .github/scripts/release-plan.sh

  Native:
    # Builds the native image, in parallel with the jobs Java, Page, Kernel and E2E (and Build, which waits for them), so that a missing reflection registration or resource
    # (src/main/resources/META-INF/native-image, quarkus.native.resources.includes in application.properties) is seen on
    # the pull request that causes it, not after a release: on linux-amd64 for a pull request and a push to main (the
    # job is then named `Native`), on each target of .github/scripts/release-lib.sh for a release (`Native (<target>)`).
    # The integration tests run against the binary on each target, and the binary is kept as an artifact of the
    # workflow, `archicode-<version>-<target>` with its `.sha256`, which the job Release downloads.
    name: ${{ needs.Targets.outputs.release == 'true' && format('Native ({0})', matrix.target) || 'Native' }}
    needs: Targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.Targets.outputs.matrix) }}
    env:
      # the target the binary is built for, the last two words of the name of the file: archicode-<version>-<TARGET>
      TARGET: ${{ matrix.target }}
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          # the tag for a dispatch with a tag, else the commit of the event
          ref: ${{ needs.Targets.outputs.source }}
          persist-credentials: false
      - name: "Check out the scripts of the release"
        # those of the commit that runs the workflow, which may be newer than the tag it builds
        uses: "actions/checkout@v7.0.1"
        with:
          path: ".release-scripts"
          sparse-checkout: ".github/scripts"
          persist-credentials: false
      - name: "Set up Mandrel for JDK 25"
        # Mandrel is what Quarkus builds native images with by default; with java-version 25 the action takes the latest
        # Mandrel release of JDK 25, the Java of the project (.sdkmanrc, maven.compiler.release), for the OS and the
        # architecture of the runner (Mandrel publishes linux-amd64, linux-aarch64 and macos-aarch64). The image is built
        # with this local Mandrel (JAVA_HOME / GRAALVM_HOME), not in a builder container.
        uses: "graalvm/setup-graalvm@v1.6.7"
        with:
          java-version: "25"
          distribution: "mandrel"
          cache: maven
      - name: "Build the native image and run the integration tests against it"
        # `-Dnative` (the `native` profile of pom.xml) builds the image, skips the unit tests (Java runs them) and runs
        # Failsafe, whose `*IT` classes (src/test/java/io/morin/archicode/it) start the native runner as a process on the
        # examples of the manual and on the fixtures, and check what it prints, its exit codes and the files it writes.
        # The same classes run against the JVM jar with `./mvnw verify -DskipITs=false`. Failsafe names the class
        # and the test that failed; no manual (`plugin.asciidoctor.skip`): the examples are read from src/doc/examples.
        run: |
          ./mvnw verify \
            --batch-mode \
            --update-snapshots \
            -Dnative \
            -Dplugin.asciidoctor.skip=true
      - name: "Collect the native binary and its checksum"
        id: collect
        # Only when the build and the integration tests passed: a failed build keeps nothing. The binary must tell the
        # version of the pom, which must be the version of the release (EXPECTED_VERSION, empty on a pull request).
        env:
          EXPECTED_VERSION: ${{ needs.Targets.outputs.version }}
        run: .release-scripts/.github/scripts/native-collect.sh
      - name: "Keep the native binary as an artifact of the workflow"
        # Also on pull requests and on main, so that anyone can download the binary of a change from the run (Actions, the
        # run, Artifacts: a zip with the binary and its .sha256, the executable bit is lost in the zip: `chmod +x`). 7 days:
        # these are for trying a change, a release keeps its binaries on the release page.
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: native-dist/*
          if-no-files-found: error
          retention-days: 7

  Release:
    # Puts the binaries of every target and SHA256SUMS on a DRAFT release (.github/scripts/release-draft.sh: a new
    # draft with the notes GitHub generates, or the files replaced on the draft that is there; a published release is
    # refused). Skipped, not failed, when the run makes no release. Build must have passed on a tag (it is skipped on a
    # dispatch); `!cancelled()` because a job that needs a skipped one is skipped otherwise.
    needs: [Targets, Build, Native]
    if: ${{ !cancelled() && needs.Targets.outputs.release == 'true' && needs.Native.result == 'success' && (needs.Build.result == 'success' || needs.Build.result == 'skipped') }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          sparse-checkout: ".github/scripts"
          persist-credentials: false
      - name: "Download the binaries of the targets"
        uses: "actions/download-artifact@v8.0.2"
        with:
          pattern: archicode-${{ needs.Targets.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: "Check the binaries and write SHA256SUMS"
        env:
          VERSION: ${{ needs.Targets.outputs.version }}
        run: .github/scripts/release-assemble.sh dist "${VERSION}" upload
      - name: "Put them on a draft release"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.Targets.outputs.tag }}
          TITLE: ${{ needs.Targets.outputs.title }}
          VERSION: ${{ needs.Targets.outputs.version }}
          REHEARSAL: ${{ needs.Targets.outputs.rehearsal }}
          TARGET_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/release-draft.sh upload

  Smoke:
    # Each file as it is on the draft release, on a runner of its target: downloaded from the release, checked against
    # SHA256SUMS, then `--version`, `views generate` on a copy of an example of the manual and `editor serve` answering
    # one request (.github/scripts/release-smoke.sh). `contents: write` only because a draft release is visible to a
    # token that can push, no other way; the token is given to the download step alone.
    name: Smoke (${{ matrix.target }})
    needs: [Targets, Release]
    if: ${{ !cancelled() && needs.Release.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.Targets.outputs.matrix) }}
    steps:
      - name: "Check out the example"
        uses: "actions/checkout@v7.0.1"
        with:
          ref: ${{ needs.Targets.outputs.source }}
          sparse-checkout: "src/doc/examples/domain_plateaus"
          persist-credentials: false
      - name: "Check out the scripts of the release"
        uses: "actions/checkout@v7.0.1"
        with:
          path: ".release-scripts"
          sparse-checkout: ".github/scripts"
          persist-credentials: false
      - name: "Download the file of this target and SHA256SUMS from the release"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.Targets.outputs.tag }}
          VERSION: ${{ needs.Targets.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release download "${TAG}" --dir published --pattern "archicode-${VERSION}-${TARGET}" --pattern SHA256SUMS
          ls -l published
      - name: "Smoke-test the file"
        env:
          VERSION: ${{ needs.Targets.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: .release-scripts/.github/scripts/release-smoke.sh published "${TARGET}" "${VERSION}" src/doc/examples/domain_plateaus to-be

  Publish:
    # Publishes the draft once every smoke test passed: a release tag, or a dispatch with a tag and draft=false. A
    # rehearsal is never published (release-plan.sh sets no `publish`, and the step refuses any tag that is not a
    # release tag).
    needs: [Targets, Smoke]
    if: ${{ !cancelled() && needs.Targets.outputs.publish == 'true' && needs.Smoke.result == 'success' }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: "Publish the release"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.Targets.outputs.tag }}
          # "Latest" only when no release tag is newer (release-plan.sh): an older release published again keeps it off
          LATEST: ${{ needs.Targets.outputs.latest }}
        run: |
          set -euo pipefail
          case "${TAG}" in
            archicode-[0-9]*) ;;
            *) echo "::error::${TAG} is not a release tag: not published"; exit 1 ;;
          esac
          gh release edit "${TAG}" --draft=false --latest="${LATEST}"
          state="$(gh release view "${TAG}" --json isDraft,url --jq '"\(.isDraft) \(.url)"')"
          echo "${state}"
          case "${state}" in
            "false "*) ;;
            *) echo "::error::the release ${TAG} is still a draft"; exit 1 ;;
          esac
